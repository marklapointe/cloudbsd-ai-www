<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Inter, system-ui, sans-serif">
  <title>Theme Customizer — Preview Tab — Customizer Panel at 1280x800</title>
  <desc>Full-screen live preview of the theme applied to a sample dashboard. Device size toggles and zoom controls. WCAG AA contrast verified.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-100 text-slate-900" style="font-family: Inter, system-ui, sans-serif;">
      <g id="customizer-header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4 shadow-sm">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 text-sm text-slate-500">/</span>
            <span class="ml-2 text-sm text-slate-700">Theme Customizer</span>
          </div>
          <div class="ml-auto flex items-center gap-2">
            <button class="text-sm px-3 py-1.5 rounded border border-slate-300 text-slate-700 hover:bg-slate-50">Reset</button>
            <button class="text-sm px-3 py-1.5 rounded border border-slate-300 text-slate-700 hover:bg-slate-50">Save Draft</button>
            <button class="text-sm px-3 py-1.5 rounded bg-blue-600 text-white hover:bg-blue-700">Apply Theme</button>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="customizer-sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto">
            <nav class="space-y-1 text-sm">
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Colors</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Typography</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Layout</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Branding</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Import / Export</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded font-medium bg-blue-50 text-blue-700 border-l-2 border-blue-600">Preview</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Library</div>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Theme Gallery</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">My Themes</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 overflow-auto p-6">
          <g id="customizer-content" class="contents">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h1 class="text-2xl font-bold text-slate-900">Preview</h1>
                <p class="text-sm text-slate-500 mt-1">Live preview of your theme in a real dashboard context.</p>
              </div>
              <div class="flex items-center gap-2">
                <div class="flex items-center bg-white border border-slate-300 rounded p-1">
                  <button class="px-2 py-1 text-xs font-medium bg-slate-100 rounded">Desktop</button>
                  <button class="px-2 py-1 text-xs text-slate-600">Tablet</button>
                  <button class="px-2 py-1 text-xs text-slate-600">Mobile</button>
                </div>
                <div class="flex items-center bg-white border border-slate-300 rounded">
                  <button class="px-2 py-1 text-sm text-slate-600 border-r border-slate-300">−</button>
                  <span class="px-3 py-1 text-xs font-mono">100%</span>
                  <button class="px-2 py-1 text-sm text-slate-600 border-l border-slate-300">+</button>
                </div>
              </div>
            </div>
            <div class="bg-slate-200 rounded-lg p-4">
              <div class="bg-slate-50 mx-auto" style="width: 100%; max-width: 1100px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); border-radius: 8px; overflow: hidden;">
                <div class="h-12 bg-white border-b border-slate-200 flex items-center px-4">
                  <div class="flex items-center gap-2">
                    <div class="w-7 h-7 rounded bg-blue-600 text-white flex items-center justify-center font-bold text-sm">C</div>
                    <span class="font-bold text-sm text-slate-900">CloudBSD Admin</span>
                    <span class="ml-2 px-2 py-0.5 text-xs rounded bg-blue-50 text-blue-700 border border-blue-200">live preview</span>
                  </div>
                  <div class="ml-auto flex items-center gap-3">
                    <span class="text-xs text-slate-500">freenas-mock.local</span>
                    <button class="text-xs px-2 py-1 rounded bg-blue-600 text-white">Refresh</button>
                    <div class="w-6 h-6 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-medium">M</div>
                  </div>
                </div>
                <div class="flex" style="height: 460px;">
                  <aside class="w-44 bg-white border-r border-slate-200 p-2">
                    <nav class="space-y-0.5 text-xs">
                      <a class="block px-2 py-1.5 rounded bg-blue-50 text-blue-700 font-medium">Dashboard</a>
                      <a class="block px-2 py-1.5 rounded text-slate-700">Virtual Machines</a>
                      <a class="block px-2 py-1.5 rounded text-slate-700">Containers</a>
                      <a class="block px-2 py-1.5 rounded text-slate-700">Jails</a>
                      <a class="block px-2 py-1.5 rounded text-slate-700">Volumes</a>
                      <a class="block px-2 py-1.5 rounded text-slate-700">Network Map</a>
                      <a class="block px-2 py-1.5 rounded text-slate-700">Cluster</a>
                      <div class="pt-2 pb-1 text-[10px] uppercase tracking-wide text-slate-400 px-2">Admin</div>
                      <a class="block px-2 py-1.5 rounded text-slate-700">Users</a>
                      <a class="block px-2 py-1.5 rounded text-slate-700">Logs</a>
                      <a class="block px-2 py-1.5 rounded text-slate-700">Settings</a>
                    </nav>
                  </aside>
                  <main class="flex-1 p-4 overflow-auto">
                    <div class="mb-3">
                      <h1 class="text-lg font-bold text-slate-900">Dashboard</h1>
                      <p class="text-xs text-slate-500">Host: freenas-mock.local · middleware connected</p>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                      <div class="p-3 bg-white rounded-lg border border-slate-200">
                        <div class="flex items-center justify-between">
                          <div class="text-[10px] font-medium text-slate-500">CPU Usage</div>
                          <div class="text-[10px] px-1.5 py-0.5 rounded text-emerald-700 bg-emerald-50">healthy</div>
                        </div>
                        <div class="text-xl font-bold mt-1 text-slate-900">42%</div>
                        <div class="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                          <div class="h-full bg-blue-600" style="width: 42%;"></div>
                        </div>
                      </div>
                      <div class="p-3 bg-white rounded-lg border border-slate-200">
                        <div class="flex items-center justify-between">
                          <div class="text-[10px] font-medium text-slate-500">Memory</div>
                          <div class="text-[10px] px-1.5 py-0.5 rounded text-amber-700 bg-amber-50">watch</div>
                        </div>
                        <div class="text-xl font-bold mt-1 text-slate-900">8.2/16 GB</div>
                        <div class="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                          <div class="h-full bg-amber-500" style="width: 51%;"></div>
                        </div>
                      </div>
                      <div class="p-3 bg-white rounded-lg border border-slate-200">
                        <div class="flex items-center justify-between">
                          <div class="text-[10px] font-medium text-slate-500">Disk</div>
                          <div class="text-[10px] px-1.5 py-0.5 rounded text-emerald-700 bg-emerald-50">healthy</div>
                        </div>
                        <div class="text-xl font-bold mt-1 text-slate-900">245/920 GB</div>
                        <div class="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                          <div class="h-full bg-blue-600" style="width: 27%;"></div>
                        </div>
                      </div>
                      <div class="p-3 bg-white rounded-lg border border-slate-200">
                        <div class="flex items-center justify-between">
                          <div class="text-[10px] font-medium text-slate-500">Network</div>
                          <div class="text-[10px] px-1.5 py-0.5 rounded text-emerald-700 bg-emerald-50">healthy</div>
                        </div>
                        <div class="text-xl font-bold mt-1 text-slate-900">↑ 12.4 MB/s</div>
                        <div class="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                          <div class="h-full bg-blue-600" style="width: 18%;"></div>
                        </div>
                      </div>
                      <div class="p-3 bg-white rounded-lg border border-slate-200">
                        <div class="flex items-center justify-between">
                          <div class="text-[10px] font-medium text-slate-500">Notifications</div>
                          <div class="text-[10px] px-1.5 py-0.5 rounded text-rose-700 bg-rose-50">3 critical</div>
                        </div>
                        <div class="text-xl font-bold mt-1 text-slate-900">17</div>
                        <div class="mt-2 grid grid-cols-3 gap-1 text-[10px]">
                          <div class="rounded bg-rose-50 text-rose-700 px-1.5 py-0.5 text-center">3 crit</div>
                          <div class="rounded bg-amber-50 text-amber-700 px-1.5 py-0.5 text-center">6 warn</div>
                          <div class="rounded bg-blue-50 text-blue-700 px-1.5 py-0.5 text-center">8 info</div>
                        </div>
                      </div>
                      <div class="p-3 bg-white rounded-lg border border-slate-200">
                        <div class="flex items-center justify-between">
                          <div class="text-[10px] font-medium text-slate-500">Workloads</div>
                          <div class="text-[10px] text-slate-500">R/O</div>
                        </div>
                        <div class="text-xl font-bold mt-1 text-slate-900">12</div>
                        <div class="mt-2 grid grid-cols-3 gap-1 text-[10px] text-center">
                          <div class="rounded bg-slate-50 px-1.5 py-0.5">5 VMs</div>
                          <div class="rounded bg-slate-50 px-1.5 py-0.5">4 CT</div>
                          <div class="rounded bg-slate-50 px-1.5 py-0.5">3 Jails</div>
                        </div>
                      </div>
                    </div>
                    <div class="mt-3 p-3 bg-white rounded-lg border border-slate-200">
                      <div class="text-xs font-semibold text-slate-900 mb-2">Recent Activity</div>
                      <ul class="text-[11px] text-slate-600 space-y-0.5">
                        <li>· 12:42:01 — snapshot daily created on tank/data</li>
                        <li>· 12:31:18 — jail `transmission` entered STATE: STARTED</li>
                        <li>· 12:18:44 — vm `nextcloud` reported guest-agent heartbeat</li>
                      </ul>
                    </div>
                  </main>
                </div>
              </div>
            </div>
            <div class="mt-4 flex items-center justify-center gap-2 text-xs text-slate-500">
              <span>Contrast verified: <span class="text-emerald-700 font-medium">WCAG AA pass</span></span>
              <span>·</span>
              <span>Last applied: 2 minutes ago</span>
            </div>
          </g>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>
