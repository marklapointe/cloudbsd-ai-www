<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Inter, system-ui, sans-serif">
  <title>Theme Customizer — Typography Tab — Customizer Panel at 1280x800</title>
  <desc>Typography tab with font family, base size, weight, and line height selectors. Live preview pane shows sample text in chosen font. WCAG AA contrast on all text.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900" style="font-family: Inter, system-ui, sans-serif;">
      <g id="customizer-header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4 shadow-sm">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 text-sm text-slate-500">/</span>
            <span class="ml-2 text-sm text-slate-700">Theme Customizer</span>
          </div>
          <div class="ml-auto flex items-center gap-2">
            <button class="text-sm px-3 py-1.5 rounded border border-slate-300 text-slate-700 hover:bg-slate-50">Reset</button>
            <button class="text-sm px-3 py-1.5 rounded border border-slate-300 text-slate-700 hover:bg-slate-50">Save Draft</button>
            <button class="text-sm px-3 py-1.5 rounded bg-blue-600 text-white hover:bg-blue-700">Apply Theme</button>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="customizer-sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto">
            <nav class="space-y-1 text-sm">
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Colors</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded font-medium bg-blue-50 text-blue-700 border-l-2 border-blue-600">Typography</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Layout</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Branding</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Import / Export</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Preview</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Library</div>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Theme Gallery</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">My Themes</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 overflow-auto p-6">
          <g id="customizer-content" class="contents">
            <div class="mb-6">
              <h1 class="text-2xl font-bold text-slate-900">Typography</h1>
              <p class="text-sm text-slate-500 mt-1">Choose the typeface family, size, weight, and spacing used across the app.</p>
            </div>
            <div class="grid grid-cols-3 gap-6">
              <div class="col-span-1 space-y-4">
                <div class="bg-white rounded-lg border border-slate-200 p-5">
                  <div class="text-sm font-semibold text-slate-900 mb-3">Font Family</div>
                  <div class="space-y-2">
                    <label class="flex items-center gap-2 p-2 rounded border-2 border-blue-500 bg-blue-50 cursor-pointer">
                      <input type="radio" name="font" checked="checked" class="text-blue-600"/>
                      <div>
                        <div class="text-sm font-medium" style="font-family: Inter, system-ui, sans-serif;">Inter</div>
                        <div class="text-xs text-slate-500">Sans-serif · 400-900</div>
                      </div>
                    </label>
                    <label class="flex items-center gap-2 p-2 rounded border border-slate-200 cursor-pointer hover:bg-slate-50">
                      <input type="radio" name="font" class="text-blue-600"/>
                      <div>
                        <div class="text-sm font-medium" style="font-family: system-ui, sans-serif;">System UI</div>
                        <div class="text-xs text-slate-500">Native sans-serif</div>
                      </div>
                    </label>
                    <label class="flex items-center gap-2 p-2 rounded border border-slate-200 cursor-pointer hover:bg-slate-50">
                      <input type="radio" name="font" class="text-blue-600"/>
                      <div>
                        <div class="text-sm font-medium" style="font-family: Georgia, serif;">Georgia</div>
                        <div class="text-xs text-slate-500">Serif · 400-700</div>
                      </div>
                    </label>
                    <label class="flex items-center gap-2 p-2 rounded border border-slate-200 cursor-pointer hover:bg-slate-50">
                      <input type="radio" name="font" class="text-blue-600"/>
                      <div>
                        <div class="text-sm font-medium" style="font-family: Menlo, Consolas, monospace;">Menlo</div>
                        <div class="text-xs text-slate-500">Monospace · 400-700</div>
                      </div>
                    </label>
                    <label class="flex items-center gap-2 p-2 rounded border border-slate-200 cursor-pointer hover:bg-slate-50">
                      <input type="radio" name="font" class="text-blue-600"/>
                      <div>
                        <div class="text-sm font-medium" style="font-family: Helvetica, sans-serif;">Helvetica</div>
                        <div class="text-xs text-slate-500">Sans-serif · 400-700</div>
                      </div>
                    </label>
                  </div>
                </div>
                <div class="bg-white rounded-lg border border-slate-200 p-5">
                  <div class="flex items-center justify-between mb-2">
                    <div class="text-sm font-semibold text-slate-900">Base Size</div>
                    <span class="text-sm font-mono text-slate-700">14px</span>
                  </div>
                  <input type="range" min="12" max="18" value="14" class="w-full"/>
                  <div class="flex justify-between text-xs text-slate-500 mt-1">
                    <span>12px</span>
                    <span>18px</span>
                  </div>
                </div>
                <div class="bg-white rounded-lg border border-slate-200 p-5">
                  <div class="text-sm font-semibold text-slate-900 mb-3">Heading Weight</div>
                  <select class="w-full text-sm px-2 py-1.5 border border-slate-300 rounded">
                    <option>600 (Semibold)</option>
                    <option>700 (Bold)</option>
                    <option>800 (Extra Bold)</option>
                  </select>
                </div>
                <div class="bg-white rounded-lg border border-slate-200 p-5">
                  <div class="flex items-center justify-between mb-2">
                    <div class="text-sm font-semibold text-slate-900">Line Height</div>
                    <span class="text-sm font-mono text-slate-700">1.5</span>
                  </div>
                  <input type="range" min="1.2" max="2.0" step="0.1" value="1.5" class="w-full"/>
                </div>
              </div>
              <div class="col-span-2 bg-white rounded-lg border border-slate-200 p-6">
                <div class="text-xs uppercase tracking-wide text-slate-500 font-semibold mb-4">Live Preview</div>
                <div style="font-family: Inter, system-ui, sans-serif; line-height: 1.5;">
                  <h1 class="text-4xl font-bold text-slate-900 mb-2">CloudBSD Admin</h1>
                  <h2 class="text-2xl font-semibold text-slate-800 mb-2">Dashboard Overview</h2>
                  <h3 class="text-lg font-semibold text-slate-700 mb-3">System Status: Healthy</h3>
                  <p class="text-sm text-slate-600 mb-3">The quick brown fox jumps over the lazy dog. Pack my box with five dozen liquor jugs. How vexingly quick daft zebras jump.</p>
                  <p class="text-xs text-slate-500">Body text in 14px. The base font is set to Inter at 14 pixels with line height 1.5. Weights available: 400, 500, 600, 700, 900.</p>
                </div>
                <div class="mt-6 pt-4 border-t border-slate-200 grid grid-cols-3 gap-3 text-xs text-slate-600">
                  <div><span class="font-mono">--font-family</span><br/>Inter, system-ui</div>
                  <div><span class="font-mono">--font-size-base</span><br/>14px</div>
                  <div><span class="font-mono">--font-line-height</span><br/>1.5</div>
                </div>
              </div>
            </div>
          </g>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>
