<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Inter, system-ui, sans-serif">
  <title>Theme Customizer — My Themes — Customizer Panel at 1280x800</title>
  <desc>User's saved custom themes as a list with edit, duplicate, export, and delete actions. Each row shows thumbnail, name, modification date, and badges. WCAG AA contrast.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1995/xhtml" class="h-full bg-slate-50 text-slate-900" style="font-family: Inter, system-ui, sans-serif;">
      <g id="customizer-header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4 shadow-sm">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 text-sm text-slate-500">/</span>
            <span class="ml-2 text-sm text-slate-700">Theme Customizer</span>
          </div>
          <div class="ml-auto flex items-center gap-2">
            <button class="text-sm px-3 py-1.5 rounded border border-slate-300 text-slate-700 hover:bg-slate-50">Reset</button>
            <button class="text-sm px-3 py-1.5 rounded border border-slate-300 text-slate-700 hover:bg-slate-50">Save Draft</button>
            <button class="text-sm px-3 py-1.5 rounded bg-blue-600 text-white hover:bg-blue-700">Apply Theme</button>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="customizer-sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto">
            <nav class="space-y-1 text-sm">
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Colors</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Typography</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Layout</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Branding</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Import / Export</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Preview</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Library</div>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Theme Gallery</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded font-medium bg-blue-50 text-blue-700 border-l-2 border-blue-600">My Themes</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 overflow-auto p-6">
          <g id="customizer-content" class="contents">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h1 class="text-2xl font-bold text-slate-900">My Themes</h1>
                <p class="text-sm text-slate-500 mt-1">Your saved custom themes. Edit, duplicate, export, or delete.</p>
              </div>
              <div class="flex items-center gap-2">
                <input type="text" placeholder="Search my themes…" class="text-sm px-3 py-1.5 border border-slate-300 rounded w-48"/>
                <button class="text-sm px-3 py-1.5 rounded border border-slate-300 text-slate-700 hover:bg-slate-50">Sort: Modified</button>
                <button class="text-sm px-3 py-1.5 rounded bg-blue-600 text-white hover:bg-blue-700 font-medium">+ New Theme</button>
              </div>
            </div>
            <div class="bg-white rounded-lg border border-slate-200 overflow-hidden">
              <table class="w-full text-sm">
                <thead style="background: #f8fafc; border-bottom: 1px solid #e2e8f0;">
                  <tr>
                    <th class="text-left px-4 py-3 font-semibold text-slate-700 w-20"></th>
                    <th class="text-left px-4 py-3 font-semibold text-slate-700">Name</th>
                    <th class="text-left px-4 py-3 font-semibold text-slate-700">Base</th>
                    <th class="text-left px-4 py-3 font-semibold text-slate-700">Modified</th>
                    <th class="text-left px-4 py-3 font-semibold text-slate-700">Visibility</th>
                    <th class="text-left px-4 py-3 font-semibold text-slate-700 w-40">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr style="border-top: 1px solid #e2e8f0;">
                    <td class="px-4 py-3">
                      <div class="w-12 h-8 rounded border border-slate-200" style="background: linear-gradient(180deg, #2563eb 0%, #1e40af 100%);"></div>
                    </td>
                    <td class="px-4 py-3">
                      <div class="font-medium text-slate-900">CloudBSD Revytech</div>
                      <div class="text-xs text-slate-500">Default theme for the project</div>
                    </td>
                    <td class="px-4 py-3 text-slate-600">—</td>
                    <td class="px-4 py-3 text-slate-600">2026-07-06 09:14</td>
                    <td class="px-4 py-3"><span class="text-xs font-medium px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">Default</span></td>
                    <td class="px-4 py-3">
                      <div class="flex items-center gap-2 text-xs">
                        <button class="text-blue-600 hover:underline font-medium">Edit</button>
                        <span class="text-slate-300">·</span>
                        <button class="text-slate-600 hover:underline">Export</button>
                      </div>
                    </td>
                  </tr>
                  <tr style="border-top: 1px solid #e2e8f0;">
                    <td class="px-4 py-3">
                      <div class="w-12 h-8 rounded border border-slate-200" style="background: linear-gradient(180deg, #0f172a 0%, #1e1b4b 100%);"></div>
                    </td>
                    <td class="px-4 py-3">
                      <div class="font-medium text-slate-900">Data Center Dark</div>
                      <div class="text-xs text-slate-500">Custom dark theme for night ops</div>
                    </td>
                    <td class="px-4 py-3 text-slate-600">Glass Dark</td>
                    <td class="px-4 py-3 text-slate-600">2026-07-04 18:22</td>
                    <td class="px-4 py-3"><span class="text-xs font-medium px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">Private</span></td>
                    <td class="px-4 py-3">
                      <div class="flex items-center gap-2 text-xs">
                        <button class="text-blue-600 hover:underline font-medium">Edit</button>
                        <span class="text-slate-300">·</span>
                        <button class="text-slate-600 hover:underline">Duplicate</button>
                        <span class="text-slate-300">·</span>
                        <button class="text-slate-600 hover:underline">Export</button>
                        <span class="text-slate-300">·</span>
                        <button class="text-red-600 hover:underline">Delete</button>
                      </div>
                    </td>
                  </tr>
                  <tr style="border-top: 1px solid #e2e8f0;">
                    <td class="px-4 py-3">
                      <div class="w-12 h-8 rounded border border-slate-200" style="background: linear-gradient(135deg, #f0f4ff 0%, #fdf2f8 100%);"></div>
                    </td>
                    <td class="px-4 py-3">
                      <div class="font-medium text-slate-900">Pastel Sunrise</div>
                      <div class="text-xs text-slate-500">Soft light theme for presentations</div>
                    </td>
                    <td class="px-4 py-3 text-slate-600">Pearl Luna</td>
                    <td class="px-4 py-3 text-slate-600">2026-06-28 11:05</td>
                    <td class="px-4 py-3"><span class="text-xs font-medium px-2 py-0.5 rounded-full bg-purple-100 text-purple-700">Team</span></td>
                    <td class="px-4 py-3">
                      <div class="flex items-center gap-2 text-xs">
                        <button class="text-blue-600 hover:underline font-medium">Edit</button>
                        <span class="text-slate-300">·</span>
                        <button class="text-slate-600 hover:underline">Duplicate</button>
                        <span class="text-slate-300">·</span>
                        <button class="text-slate-600 hover:underline">Export</button>
                        <span class="text-slate-300">·</span>
                        <button class="text-red-600 hover:underline">Delete</button>
                      </div>
                    </td>
                  </tr>
                  <tr style="border-top: 1px solid #e2e8f0;">
                    <td class="px-4 py-3">
                      <div class="w-12 h-8 rounded border border-slate-200" style="background: #050805;"></div>
                    </td>
                    <td class="px-4 py-3">
                      <div class="font-medium text-slate-900">Terminal Classic</div>
                      <div class="text-xs text-slate-500">High-contrast monospace for log review</div>
                    </td>
                    <td class="px-4 py-3 text-slate-600">Phosphor CRT</td>
                    <td class="px-4 py-3 text-slate-600">2026-06-15 22:48</td>
                    <td class="px-4 py-3"><span class="text-xs font-medium px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">Private</span></td>
                    <td class="px-4 py-3">
                      <div class="flex items-center gap-2 text-xs">
                        <button class="text-blue-600 hover:underline font-medium">Edit</button>
                        <span class="text-slate-300">·</span>
                        <button class="text-slate-600 hover:underline">Duplicate</button>
                        <span class="text-slate-300">·</span>
                        <button class="text-slate-600 hover:underline">Export</button>
                        <span class="text-slate-300">·</span>
                        <button class="text-red-600 hover:underline">Delete</button>
                      </div>
                    </td>
                  </tr>
                  <tr style="border-top: 1px solid #e2e8f0;">
                    <td class="px-4 py-3">
                      <div class="w-12 h-8 rounded border border-slate-200" style="background: linear-gradient(180deg, #ff7a3d 0%, #c84515 100%);"></div>
                    </td>
                    <td class="px-4 py-3">
                      <div class="font-medium text-slate-900">Brand Orange</div>
                      <div class="text-xs text-slate-500">Custom branded version for marketing site</div>
                    </td>
                    <td class="px-4 py-3 text-slate-600">Workbench</td>
                    <td class="px-4 py-3 text-slate-600">2026-06-02 16:33</td>
                    <td class="px-4 py-3"><span class="text-xs font-medium px-2 py-0.5 rounded-full bg-purple-100 text-purple-700">Team</span></td>
                    <td class="px-4 py-3">
                      <div class="flex items-center gap-2 text-xs">
                        <button class="text-blue-600 hover:underline font-medium">Edit</button>
                        <span class="text-slate-300">·</span>
                        <button class="text-slate-600 hover:underline">Duplicate</button>
                        <span class="text-slate-300">·</span>
                        <button class="text-slate-600 hover:underline">Export</button>
                        <span class="text-slate-300">·</span>
                        <button class="text-red-600 hover:underline">Delete</button>
                      </div>
                    </td>
                  </tr>
                  <tr style="border-top: 1px solid #e2e8f0;">
                    <td class="px-4 py-3">
                      <div class="w-12 h-8 rounded border border-slate-200" style="background: #000000;"></div>
                    </td>
                    <td class="px-4 py-3">
                      <div class="font-medium text-slate-900">Lab Monitor</div>
                      <div class="text-xs text-slate-600">Draft · unsaved changes</div>
                    </td>
                    <td class="px-4 py-3 text-slate-600">Cube Lab</td>
                    <td class="px-4 py-3 text-slate-600">2026-07-06 21:09</td>
                    <td class="px-4 py-3"><span class="text-xs font-medium px-2 py-0.5 rounded-full bg-amber-100 text-amber-700">Draft</span></td>
                    <td class="px-4 py-3">
                      <div class="flex items-center gap-2 text-xs">
                        <button class="text-blue-600 hover:underline font-medium">Continue</button>
                        <span class="text-slate-300">·</span>
                        <button class="text-red-600 hover:underline">Discard</button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="mt-4 flex items-center justify-between text-xs text-slate-500">
              <div>Showing 6 themes · 4 private, 1 team, 1 default</div>
              <div class="flex items-center gap-2">
                <button class="px-2 py-1 border border-slate-300 rounded text-slate-600">Prev</button>
                <span>1 of 1</span>
                <button class="px-2 py-1 border border-slate-300 rounded text-slate-600">Next</button>
              </div>
            </div>
          </g>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>
