<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Inter, system-ui, sans-serif">
  <title>Theme Customizer — Layout Tab — Customizer Panel at 1280x800</title>
  <desc>Layout tab with controls for spacing scale, border radius, shadow intensity, and density. Live preview shows sample card with current settings. WCAG AA contrast.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900" style="font-family: Inter, system-ui, sans-serif;">
      <g id="customizer-header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4 shadow-sm">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 text-sm text-slate-500">/</span>
            <span class="ml-2 text-sm text-slate-700">Theme Customizer</span>
          </div>
          <div class="ml-auto flex items-center gap-2">
            <button class="text-sm px-3 py-1.5 rounded border border-slate-300 text-slate-700 hover:bg-slate-50">Reset</button>
            <button class="text-sm px-3 py-1.5 rounded border border-slate-300 text-slate-700 hover:bg-slate-50">Save Draft</button>
            <button class="text-sm px-3 py-1.5 rounded bg-blue-600 text-white hover:bg-blue-700">Apply Theme</button>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="customizer-sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto">
            <nav class="space-y-1 text-sm">
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Colors</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Typography</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded font-medium bg-blue-50 text-blue-700 border-l-2 border-blue-600">Layout</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Branding</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Import / Export</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Preview</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Library</div>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Theme Gallery</a>
              <a class="flex items-center gap-2 px-3 py-2 rounded text-slate-700 hover:bg-slate-50">My Themes</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 overflow-auto p-6">
          <g id="customizer-content" class="contents">
            <div class="mb-6">
              <h1 class="text-2xl font-bold text-slate-900">Layout</h1>
              <p class="text-sm text-slate-500 mt-1">Adjust spacing, corner radius, shadow intensity, and component density.</p>
            </div>
            <div class="grid grid-cols-3 gap-6">
              <div class="col-span-1 space-y-4">
                <div class="bg-white rounded-lg border border-slate-200 p-5">
                  <div class="flex items-center justify-between mb-2">
                    <div class="text-sm font-semibold text-slate-900">Spacing Scale</div>
                    <span class="text-sm font-mono text-slate-700">1.0×</span>
                  </div>
                  <input type="range" min="0.5" max="2.0" step="0.1" value="1.0" class="w-full"/>
                  <div class="flex justify-between text-xs text-slate-500 mt-1">
                    <span>Compact</span>
                    <span>Roomy</span>
                  </div>
                  <div class="grid grid-cols-6 gap-1 mt-3">
                    <div class="h-3 bg-slate-200 rounded" style="width: 4px;"></div>
                    <div class="h-3 bg-slate-200 rounded" style="width: 8px;"></div>
                    <div class="h-3 bg-slate-200 rounded" style="width: 12px;"></div>
                    <div class="h-3 bg-slate-300 rounded" style="width: 16px;"></div>
                    <div class="h-3 bg-slate-300 rounded" style="width: 24px;"></div>
                    <div class="h-3 bg-slate-400 rounded" style="width: 32px;"></div>
                  </div>
                </div>
                <div class="bg-white rounded-lg border border-slate-200 p-5">
                  <div class="text-sm font-semibold text-slate-900 mb-3">Border Radius Preset</div>
                  <div class="grid grid-cols-4 gap-2">
                    <button class="p-3 border-2 border-slate-200 hover:border-blue-400 rounded-none bg-slate-50" title="None">
                      <div class="w-full h-6 bg-slate-300" style="border-radius: 0;"></div>
                    </button>
                    <button class="p-3 border-2 border-slate-200 hover:border-blue-400 bg-slate-50" style="border-radius: 4px;" title="Small">
                      <div class="w-full h-6 bg-slate-300" style="border-radius: 4px;"></div>
                    </button>
                    <button class="p-3 border-2 border-blue-600 bg-blue-50" style="border-radius: 8px;" title="Medium">
                      <div class="w-full h-6 bg-blue-500" style="border-radius: 8px;"></div>
                    </button>
                    <button class="p-3 border-2 border-slate-200 hover:border-blue-400 bg-slate-50" title="Large">
                      <div class="w-full h-6 bg-slate-300" style="border-radius: 16px;"></div>
                    </button>
                  </div>
                  <div class="flex justify-between text-xs text-slate-500 mt-2">
                    <span>0</span>
                    <span>4</span>
                    <span class="font-semibold text-blue-600">8</span>
                    <span>16</span>
                  </div>
                </div>
                <div class="bg-white rounded-lg border border-slate-200 p-5">
                  <div class="text-sm font-semibold text-slate-900 mb-3">Shadow Intensity</div>
                  <div class="grid grid-cols-4 gap-2">
                    <div class="h-10 bg-white border border-slate-200"></div>
                    <div class="h-10 bg-white border border-slate-200" style="box-shadow: 0 1px 2px rgba(0,0,0,0.05);"></div>
                    <div class="h-10 bg-white border border-slate-200" style="box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></div>
                    <div class="h-10 bg-white border border-slate-200" style="box-shadow: 0 10px 15px rgba(0,0,0,0.15);"></div>
                  </div>
                  <div class="flex justify-between text-xs text-slate-500 mt-2">
                    <span>None</span>
                    <span>Subtle</span>
                    <span class="font-semibold text-blue-600">Medium</span>
                    <span>Strong</span>
                  </div>
                </div>
                <div class="bg-white rounded-lg border border-slate-200 p-5">
                  <div class="text-sm font-semibold text-slate-900 mb-3">Density</div>
                  <div class="flex gap-2">
                    <button class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded text-slate-700 hover:bg-slate-50">Compact</button>
                    <button class="flex-1 px-3 py-2 text-sm border-2 border-blue-600 bg-blue-50 text-blue-700 font-medium rounded">Default</button>
                    <button class="flex-1 px-3 py-2 text-sm border border-slate-300 rounded text-slate-700 hover:bg-slate-50">Roomy</button>
                  </div>
                </div>
                <div class="bg-white rounded-lg border border-slate-200 p-5">
                  <label class="flex items-center justify-between cursor-pointer">
                    <div>
                      <div class="text-sm font-semibold text-slate-900">Sidebar Collapsed by Default</div>
                      <div class="text-xs text-slate-500">Start with icons only</div>
                    </div>
                    <div class="w-10 h-6 rounded-full bg-slate-300 relative">
                      <div class="w-4 h-4 rounded-full bg-white absolute top-1 left-1 shadow"></div>
                    </div>
                  </label>
                </div>
              </div>
              <div class="col-span-2 space-y-4">
                <div class="bg-white rounded-lg border border-slate-200 p-6">
                  <div class="text-xs uppercase tracking-wide text-slate-500 font-semibold mb-4">Live Preview · Sample Card</div>
                  <div class="p-5 bg-white rounded-lg" style="border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                    <div class="flex items-center justify-between mb-3">
                      <div class="font-semibold text-slate-900">Sample Card</div>
                      <div class="text-xs text-slate-500">live preview</div>
                    </div>
                    <p class="text-sm text-slate-600">This card demonstrates your current border radius, shadow, and spacing settings in real time.</p>
                    <div class="mt-4 flex gap-2">
                      <button class="text-sm px-3 py-1.5 bg-blue-600 text-white rounded font-medium">Action</button>
                      <button class="text-sm px-3 py-1.5 border border-slate-300 text-slate-700 rounded">Cancel</button>
                    </div>
                  </div>
                </div>
                <div class="bg-white rounded-lg border border-slate-200 p-5">
                  <div class="text-xs uppercase tracking-wide text-slate-500 font-semibold mb-3">CSS Variables</div>
                  <div class="grid grid-cols-2 gap-3 text-xs font-mono text-slate-700">
                    <div><span class="text-slate-500">--space-1</span> · 4px</div>
                    <div><span class="text-slate-500">--space-2</span> · 8px</div>
                    <div><span class="text-slate-500">--space-4</span> · 16px</div>
                    <div><span class="text-slate-500">--space-6</span> · 24px</div>
                    <div><span class="text-slate-500">--radius</span> · 8px</div>
                    <div><span class="text-slate-500">--shadow</span> · medium</div>
                  </div>
                </div>
              </div>
            </div>
          </g>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>
