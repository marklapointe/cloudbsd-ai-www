<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Onboarding Welcome</title>
  <foreignObject x="0" y="0" width="1280" height="720">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:720px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">
      
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:60px;text-align:center;">
  <div style="display:inline-block;padding:10px 18px;background:linear-gradient(135deg,#0ea5e9,#1e40af);border-radius:10px;color:#ffffff;font-weight:700;font-size:16px;letter-spacing:0.04em;margin-bottom:24px;">◈ CloudBSD</div>
  <h1 style="margin:0 0 10px;font-size:34px;font-weight:800;color:#0f172a;">Welcome to your cluster</h1>
  <p style="margin:0 0 36px;font-size:15px;color:#64748b;max-width:540px;line-height:1.5;">Let's get you set up. This 4-step wizard will configure authentication, join your first node, and verify the cluster is healthy.</p>
  <div style="display:flex;gap:0;align-items:center;margin-bottom:36px;">
    <div style="display:flex;flex-direction:column;align-items:center;width:120px;">
      <div style="width:36px;height:36px;border-radius:50%;background:#1d4ed8;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;">1</div>
      <div style="margin-top:8px;font-size:11px;color:#0f172a;font-weight:600;">Welcome</div>
      <div style="margin-top:2px;font-size:10px;color:#1d4ed8;">You are here</div>
    </div>
    <div style="width:60px;height:2px;background:#e2e8f0;margin-bottom:24px;"></div>
    <div style="display:flex;flex-direction:column;align-items:center;width:120px;">
      <div style="width:36px;height:36px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;">2</div>
      <div style="margin-top:8px;font-size:11px;color:#64748b;">Auth</div>
    </div>
    <div style="width:60px;height:2px;background:#e2e8f0;margin-bottom:24px;"></div>
    <div style="display:flex;flex-direction:column;align-items:center;width:120px;">
      <div style="width:36px;height:36px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;">3</div>
      <div style="margin-top:8px;font-size:11px;color:#64748b;">Join node</div>
    </div>
    <div style="width:60px;height:2px;background:#e2e8f0;margin-bottom:24px;"></div>
    <div style="display:flex;flex-direction:column;align-items:center;width:120px;">
      <div style="width:36px;height:36px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;">4</div>
      <div style="margin-top:8px;font-size:11px;color:#64748b;">Verify</div>
    </div>
  </div>
  <div style="display:flex;gap:10px;justify-content:center;margin-bottom:24px;">
    <div style="padding:18px 22px;background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;width:180px;">
      <div style="font-size:22px;margin-bottom:6px;">❖</div>
      <div style="font-size:12px;font-weight:600;color:#0f172a;margin-bottom:2px;">PAM authentication</div>
      <div style="font-size:11px;color:#64748b;">Per-user with 2FA optional</div>
    </div>
    <div style="padding:18px 22px;background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;width:180px;">
      <div style="font-size:22px;margin-bottom:6px;">⚡</div>
      <div style="font-size:12px;font-weight:600;color:#0f172a;margin-bottom:2px;">bhyve + ZFS</div>
      <div style="font-size:11px;color:#64748b;">Native FreeBSD hypervisor</div>
    </div>
    <div style="padding:18px 22px;background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;width:180px;">
      <div style="font-size:22px;margin-bottom:6px;">⦿</div>
      <div style="font-size:12px;font-weight:600;color:#0f172a;margin-bottom:2px;">Cluster-aware</div>
      <div style="font-size:11px;color:#64748b;">CARP failover, ZFS replication</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;">
    <button style="padding:11px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:#1d4ed8;color:#ffffff;cursor:pointer;">Get started →</button>
    <button style="padding:11px 22px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;cursor:pointer;">Skip wizard</button>
  </div>
</div>

    </div>
  </foreignObject>
</svg>
