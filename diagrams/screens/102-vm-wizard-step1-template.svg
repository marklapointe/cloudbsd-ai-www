<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD VM Create Wizard — Step 1 of 5 — Choose template</title>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">

      <!-- Top bar -->
      <div style="display:flex;flex-direction:column;height:100%;background:#f1f5f9;">
        <div style="padding:18px 32px;background:#ffffff;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:14px;">
            <span style="display:inline-block;padding:5px 10px;background:linear-gradient(135deg,#0ea5e9,#1e40af);border-radius:5px;color:#ffffff;font-weight:700;font-size:11px;">CloudBSD</span>
            <h2 style="margin:0;font-size:15px;font-weight:600;">Create virtual machine</h2>
            <span style="color:#94a3b8;">/</span>
            <span style="font-size:12px;color:#475569;">Step 1 — Template</span>
          </div>
          <div style="display:flex;align-items:center;gap:14px;font-size:11px;color:#64748b;">
            Step 1 of 5 · ~4 min remaining
            <button style="padding:6px 12px;font-size:11px;border:none;border-radius:4px;background:transparent;color:#64748b;">✕ Cancel</button>
          </div>
        </div>

        <!-- Step indicator -->
        <div style="padding:0 32px 14px;background:#ffffff;border-bottom:1px solid #e2e8f0;">
          <div style="display:flex;gap:0;align-items:center;">
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid #1d4ed8;background:#1d4ed810;">
              <div style="width:20px;height:20px;border-radius:50%;background:#1d4ed8;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">1</div>
              <span style="font-size:11px;font-weight:600;color:#1d4ed8;">Template</span>
            </div>
            <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;">
              <div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">2</div>
              <span style="font-size:11px;font-weight:500;color:#475569;">Identity</span>
            </div>
            <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;">
              <div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">3</div>
              <span style="font-size:11px;font-weight:500;color:#475569;">Resources</span>
            </div>
            <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;">
              <div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">4</div>
              <span style="font-size:11px;font-weight:500;color:#475569;">Storage + Network</span>
            </div>
            <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;">
              <div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">5</div>
              <span style="font-size:11px;font-weight:500;color:#475569;">Review</span>
            </div>
            <div style="flex:1;"></div>
            <span style="font-size:10px;color:#94a3b8;">0 of 5 complete</span>
          </div>
        </div>

        <!-- Body -->
        <div style="flex:1;display:flex;background:#f1f5f9;overflow:hidden;">
          <!-- Main content -->
          <div style="flex:1;padding:28px 40px;overflow-y:auto;">
            <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;color:#0f172a;">Choose an OS template</h1>
            <p style="margin:0 0 24px;font-size:13px;color:#64748b;max-width:680px;line-height:1.55;">Pick a baseline image. We'll boot the VM from this ISO and run cloud-init on first boot. You can install additional software later.</p>

            <!-- Selected indicator -->
            <div style="display:inline-flex;align-items:center;gap:10px;padding:10px 16px;background:#ffffff;border:1px solid #cbd5e1;border-radius:8px;margin-bottom:22px;">
              <span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:#1d4ed8;border:3px solid #ffffff;outline:1px solid #1d4ed8;"></span>
              <span style="font-size:12px;color:#475569;">Selected:</span>
              <span style="font-family:monospace;font-size:12px;color:#0f172a;font-weight:600;">debian-12.6.0-amd64-netinst.iso</span>
              <span style="font-size:11px;color:#94a3b8;">(414 MB)</span>
            </div>

            <!-- Template grid -->
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;">

              <!-- Card: Debian (selected) -->
              <div style="padding:14px;background:#ffffff;border:2px solid #1d4ed8;border-radius:8px;cursor:pointer;position:relative;">
                <div style="position:absolute;top:8px;right:8px;display:flex;gap:4px;">
                  <span style="padding:2px 7px;background:#1d4ed8;color:#ffffff;border-radius:9999px;font-size:9px;font-weight:700;letter-spacing:0.06em;">SELECTED</span>
                  <span style="padding:2px 7px;background:#0d9488;color:#ffffff;border-radius:9999px;font-size:9px;font-weight:700;letter-spacing:0.06em;">RECOMMENDED</span>
                </div>
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
                  <div style="width:36px;height:36px;border-radius:6px;background:#dc2626;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;">D</div>
                  <div>
                    <div style="font-size:13px;font-weight:700;color:#0f172a;">Debian</div>
                    <div style="font-size:10px;color:#64748b;">12.6.0 Bookworm</div>
                  </div>
                </div>
                <div style="font-size:11px;color:#475569;line-height:1.5;margin-bottom:8px;">Stable, minimal netinst. Includes cloud-init. LTS until 2028.</div>
                <div style="display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;">
                  <span>414 MB</span>
                  <span>amd64</span>
                </div>
              </div>

              <!-- Card: Ubuntu -->
              <div style="padding:14px;background:#ffffff;border:1px solid #cbd5e1;border-radius:8px;cursor:pointer;">
                <div style="position:absolute;top:8px;right:8px;"></div>
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
                  <div style="width:36px;height:36px;border-radius:6px;background:#ea580c;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;">U</div>
                  <div>
                    <div style="font-size:13px;font-weight:700;color:#0f172a;">Ubuntu</div>
                    <div style="font-size:10px;color:#64748b;">24.04 LTS Noble</div>
                  </div>
                </div>
                <div style="font-size:11px;color:#475569;line-height:1.5;margin-bottom:8px;">Long-term support. Live server ISO. Includes cloud-init.</div>
                <div style="display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;">
                  <span>1.4 GB</span>
                  <span>amd64</span>
                </div>
              </div>

              <!-- Card: Rocky -->
              <div style="padding:14px;background:#ffffff;border:1px solid #cbd5e1;border-radius:8px;cursor:pointer;">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
                  <div style="width:36px;height:36px;border-radius:6px;background:#15803d;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;">R</div>
                  <div>
                    <div style="font-size:13px;font-weight:700;color:#0f172a;">Rocky</div>
                    <div style="font-size:10px;color:#64748b;">9.4 Blue Onyx</div>
                  </div>
                </div>
                <div style="font-size:11px;color:#475569;line-height:1.5;margin-bottom:8px;">RHEL-compatible. CentOS replacement. Enterprise-ready.</div>
                <div style="display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;">
                  <span>1.8 GB</span>
                  <span>amd64</span>
                </div>
              </div>

              <!-- Card: FreeBSD -->
              <div style="padding:14px;background:#ffffff;border:1px solid #cbd5e1;border-radius:8px;cursor:pointer;">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
                  <div style="width:36px;height:36px;border-radius:6px;background:#7c2d12;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;">F</div>
                  <div>
                    <div style="font-size:13px;font-weight:700;color:#0f172a;">FreeBSD</div>
                    <div style="font-size:10px;color:#64748b;">14.2 RELEASE</div>
                  </div>
                </div>
                <div style="font-size:11px;color:#475569;line-height:1.5;margin-bottom:8px;">Native. ZFS root. Jails-friendly. Disc1 includes pkg.</div>
                <div style="display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;">
                  <span>920 MB</span>
                  <span>amd64</span>
                </div>
              </div>

              <!-- Card: AlmaLinux -->
              <div style="padding:14px;background:#ffffff;border:1px solid #cbd5e1;border-radius:8px;cursor:pointer;">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
                  <div style="width:36px;height:36px;border-radius:6px;background:#0c4a6e;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;">A</div>
                  <div>
                    <div style="font-size:13px;font-weight:700;color:#0f172a;">AlmaLinux</div>
                    <div style="font-size:10px;color:#64748b;">9.4 Sea Lion</div>
                  </div>
                </div>
                <div style="font-size:11px;color:#475569;line-height:1.5;margin-bottom:8px;">RHEL fork, 1:1 binary compatible. Free + open.</div>
                <div style="display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;">
                  <span>1.7 GB</span>
                  <span>amd64</span>
                </div>
              </div>

              <!-- Card: Fedora -->
              <div style="padding:14px;background:#ffffff;border:1px solid #cbd5e1;border-radius:8px;cursor:pointer;">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
                  <div style="width:36px;height:36px;border-radius:6px;background:#1e3a8a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;">F</div>
                  <div>
                    <div style="font-size:13px;font-weight:700;color:#0f172a;">Fedora</div>
                    <div style="font-size:10px;color:#64748b;">40 Server</div>
                  </div>
                </div>
                <div style="font-size:11px;color:#475569;line-height:1.5;margin-bottom:8px;">Bleeding-edge RHEL. 13-month support. Great for dev.</div>
                <div style="display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;">
                  <span>1.9 GB</span>
                  <span>x86_64</span>
                </div>
              </div>

              <!-- Card: openSUSE -->
              <div style="padding:14px;background:#ffffff;border:1px solid #cbd5e1;border-radius:8px;cursor:pointer;">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
                  <div style="width:36px;height:36px;border-radius:6px;background:#16a34a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;">S</div>
                  <div>
                    <div style="font-size:13px;font-weight:700;color:#0f172a;">openSUSE</div>
                    <div style="font-size:10px;color:#64748b;">Leap 15.6</div>
                  </div>
                </div>
                <div style="font-size:11px;color:#475569;line-height:1.5;margin-bottom:8px;">Stable SUSE. Btrfs default. YaST administration.</div>
                <div style="display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;">
                  <span>1.1 GB</span>
                  <span>x86_64</span>
                </div>
              </div>

              <!-- Card: Oracle Linux -->
              <div style="padding:14px;background:#ffffff;border:1px solid #cbd5e1;border-radius:8px;cursor:pointer;">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
                  <div style="width:36px;height:36px;border-radius:6px;background:#c2410c;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;">O</div>
                  <div>
                    <div style="font-size:13px;font-weight:700;color:#0f172a;">Oracle Linux</div>
                    <div style="font-size:10px;color:#64748b;">8.9 UEK</div>
                  </div>
                </div>
                <div style="font-size:11px;color:#475569;line-height:1.5;margin-bottom:8px;">Unbreakable Enterprise Kernel. RHEL-compatible.</div>
                <div style="display:flex;justify-content:space-between;font-size:10px;color:#94a3b8;">
                  <span>2.0 GB</span>
                  <span>x86_64</span>
                </div>
              </div>

            </div>

            <!-- Upload custom ISO row -->
            <div style="display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:14px;">
              <div style="padding:18px;background:#ffffff;border:2px dashed #cbd5e1;border-radius:8px;display:flex;align-items:center;gap:14px;cursor:pointer;color:#64748b;">
                <div style="width:42px;height:42px;border-radius:8px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-size:24px;color:#94a3b8;">+</div>
                <div>
                  <div style="font-size:13px;font-weight:600;color:#0f172a;">Upload custom ISO</div>
                  <div style="font-size:11px;color:#64748b;margin-top:2px;">Drag a .iso file here, or browse. Max 8 GB. Goes to /tank/iso/ after scanning.</div>
                </div>
                <div style="margin-left:auto;">
                  <button style="padding:7px 14px;font-size:11px;font-weight:600;border:1px solid #cbd5e1;border-radius:5px;background:#ffffff;color:#475569;">Browse…</button>
                </div>
              </div>
            </div>

          </div>

          <!-- Right rail: tip card -->
          <div style="width:280px;padding:28px 24px;border-left:1px solid #e2e8f0;background:#ffffff;overflow-y:auto;">
            <div style="padding:14px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:8px;margin-bottom:16px;">
              <div style="font-size:11px;font-weight:700;color:#4338ca;letter-spacing:0.06em;margin-bottom:6px;">TIP</div>
              <div style="font-size:12px;color:#312e81;line-height:1.5;font-weight:500;">Picking the right template</div>
              <div style="font-size:11px;color:#4338ca;line-height:1.55;margin-top:6px;">Netinst ISOs are smaller but require network access during install. Live server ISOs include a recovery environment.</div>
              <a style="font-size:11px;color:#1d4ed8;cursor:pointer;text-decoration:underline;display:block;margin-top:8px;">Choosing the right template →</a>
            </div>

            <div style="padding:14px;background:#fef3c7;border:1px solid #fde68a;border-radius:8px;margin-bottom:16px;">
              <div style="font-size:11px;font-weight:700;color:#92400e;letter-spacing:0.06em;margin-bottom:6px;">FIRST BOOT</div>
              <div style="font-size:11px;color:#78350f;line-height:1.5;">cloud-init will run on first boot. Inject SSH keys + hostname via Step 2 (Identity).</div>
            </div>

            <div style="font-size:11px;color:#94a3b8;line-height:1.5;padding:8px 0;border-top:1px solid #e2e8f0;">
              <span style="display:block;font-weight:600;color:#475569;margin-bottom:6px;">Recent templates</span>
              Debian 12.6 · Ubuntu 24.04 · FreeBSD 14.2
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div style="padding:14px 32px;background:#ffffff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:10px;">
            <button style="padding:9px 16px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">← Back</button>
            <span style="font-size:11px;color:#94a3b8;">Step 1 — pick a template</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="font-size:11px;color:#94a3b8;">Press <kbd style="padding:2px 6px;border:1px solid #cbd5e1;border-radius:3px;background:#f8fafc;font-family:monospace;font-size:10px;">Enter ↵</kbd> to continue</span>
            <button style="padding:10px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:#1d4ed8;color:#ffffff;">Next → Identity</button>
          </div>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
