<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Status</title>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900">
      <g id="header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 px-2 py-0.5 text-xs rounded bg-slate-100 text-slate-600">freenas-mock.local</span>
          </div>
          <div class="ml-auto flex items-center gap-4">
            <span class="text-sm text-slate-500 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>backend OK · 18ms</span>
            <button class="text-sm text-slate-600">Refresh</button>
            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-medium">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(800px - 56px)">
        <g id="sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded text-slate-700">Dashboard</a>
              <a class="block px-3 py-2 rounded text-slate-700">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-slate-700">Containers</a>
              <a class="block px-3 py-2 rounded text-slate-700">Jails</a>
              <a class="block px-3 py-2 rounded text-slate-700">Volumes</a>
              <a class="block px-3 py-2 rounded text-slate-700">Network Map</a>
              <a class="block px-3 py-2 rounded text-slate-700">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Admin</div>
              <a class="block px-3 py-2 rounded text-slate-700">Users</a>
              <a class="block px-3 py-2 rounded text-slate-700">Logs</a>
              <a class="block px-3 py-2 rounded text-slate-700">Notifications</a>
              <a class="block px-3 py-2 rounded text-slate-700">Settings</a>
              <a class="block px-3 py-2 rounded bg-blue-50 text-blue-700 font-medium">Status</a>
              <a class="block px-3 py-2 rounded text-slate-700">About</a>
            </nav>
          </aside>
        </g>
        <g id="content" class="contents">
          <main class="flex-1 p-6 overflow-auto">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h1 class="text-2xl font-bold">Status</h1>
                <p class="text-sm text-slate-500">Backend health · Plugin status · Build info</p>
              </div>
              <div class="flex items-center gap-2">
                <span class="px-2 py-1 rounded text-xs bg-amber-50 text-amber-700 border border-amber-200">View-only</span>
                <button class="px-3 py-1.5 text-sm border rounded bg-white">Refresh</button>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-3 mb-4">
              <div class="bg-white rounded-lg border-l-4 border-emerald-500 p-3">
                <div class="flex items-center justify-between"><div class="text-xs text-slate-500 uppercase">Backend</div><span class="px-1.5 py-0.5 rounded-full text-[10px] bg-emerald-50 text-emerald-700">UP</span></div>
                <div class="text-2xl font-semibold mt-1">18<span class="text-sm text-slate-500">ms</span></div>
                <div class="text-xs text-slate-500 mt-1">uptime: 14d 02:11</div>
              </div>
              <div class="bg-white rounded-lg border-l-4 border-emerald-500 p-3">
                <div class="flex items-center justify-between"><div class="text-xs text-slate-500 uppercase">Database (SQLite)</div><span class="px-1.5 py-0.5 rounded-full text-[10px] bg-emerald-50 text-emerald-700">HEALTHY</span></div>
                <div class="text-2xl font-semibold mt-1">412<span class="text-sm text-slate-500"> MB / 1 GB</span></div>
                <div class="text-xs text-slate-500 mt-1">last vacuum: 2h ago</div>
              </div>
              <div class="bg-white rounded-lg border-l-4 border-emerald-500 p-3">
                <div class="flex items-center justify-between"><div class="text-xs text-slate-500 uppercase">Plugins</div><span class="px-1.5 py-0.5 rounded-full text-[10px] bg-emerald-50 text-emerald-700">5/5</span></div>
                <div class="text-2xl font-semibold mt-1">all healthy</div>
                <div class="text-xs text-slate-500 mt-1">last check: 4s ago</div>
              </div>
            </div>
            <div class="bg-white rounded-lg border p-4 shadow-sm mb-4">
              <h3 class="text-sm font-semibold mb-3">Plugin health</h3>
              <div class="grid grid-cols-5 gap-3">
                <div class="border rounded p-2.5"><div class="flex items-center justify-between mb-1"><span class="font-semibold text-xs">bhyve-monitor</span><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span></div><div class="text-[10px] text-slate-500">errors: 0</div><div class="text-[10px] text-slate-500">uptime: 14d 02:11</div><div class="text-[10px] text-slate-500">last event: 4s ago</div></div>
                <div class="border rounded p-2.5"><div class="flex items-center justify-between mb-1"><span class="font-semibold text-xs">jail-monitor</span><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span></div><div class="text-[10px] text-slate-500">errors: 0</div><div class="text-[10px] text-slate-500">uptime: 14d 02:11</div><div class="text-[10px] text-slate-500">last event: 2s ago</div></div>
                <div class="border rounded p-2.5"><div class="flex items-center justify-between mb-1"><span class="font-semibold text-xs">zfs-monitor</span><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span></div><div class="text-[10px] text-slate-500">errors: 1 (1 warning)</div><div class="text-[10px] text-slate-500">uptime: 14d 02:11</div><div class="text-[10px] text-slate-500">last event: 12s ago</div></div>
                <div class="border rounded p-2.5"><div class="flex items-center justify-between mb-1"><span class="font-semibold text-xs">network-monitor</span><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span></div><div class="text-[10px] text-slate-500">errors: 0</div><div class="text-[10px] text-slate-500">uptime: 14d 02:11</div><div class="text-[10px] text-slate-500">last event: 1s ago</div></div>
                <div class="border rounded p-2.5"><div class="flex items-center justify-between mb-1"><span class="font-semibold text-xs">alert-engine</span><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span></div><div class="text-[10px] text-slate-500">errors: 0</div><div class="text-[10px] text-slate-500">uptime: 14d 02:11</div><div class="text-[10px] text-slate-500">last event: 7s ago</div></div>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div class="bg-white rounded-lg border p-4 shadow-sm">
                <h3 class="text-sm font-semibold mb-3">System resources</h3>
                <div class="space-y-3">
                  <div>
                    <div class="flex justify-between text-xs mb-1"><span>CPU</span><span class="font-mono">18%</span></div>
                    <div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-blue-500" style="width:18%"></div></div>
                    <svg viewBox="0 0 120 20" class="w-full h-3 mt-1"><polyline fill="none" stroke="#3b82f6" stroke-width="1" points="0,14 10,12 20,13 30,10 40,11 50,8 60,9 70,7 80,8 90,6 100,5 110,7 120,4"/></svg>
                  </div>
                  <div>
                    <div class="flex justify-between text-xs mb-1"><span>Memory</span><span class="font-mono">51%</span></div>
                    <div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-purple-500" style="width:51%"></div></div>
                    <svg viewBox="0 0 120 20" class="w-full h-3 mt-1"><polyline fill="none" stroke="#a855f7" stroke-width="1" points="0,12 10,11 20,12 30,10 40,11 50,9 60,10 70,8 80,9 90,7 100,8 110,6 120,7"/></svg>
                  </div>
                  <div>
                    <div class="flex justify-between text-xs mb-1"><span>Disk</span><span class="font-mono">27%</span></div>
                    <div class="h-2 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-amber-500" style="width:27%"></div></div>
                  </div>
                </div>
              </div>
              <div class="bg-white rounded-lg border p-4 shadow-sm">
                <h3 class="text-sm font-semibold mb-3">Configuration</h3>
                <div class="grid grid-cols-2 gap-x-3 gap-y-1 text-xs font-mono">
                  <div><span class="text-slate-500">port</span> <span class="text-slate-900">= 3001</span></div>
                  <div><span class="text-slate-500">demoMode</span> <span class="text-slate-900">= false</span></div>
                  <div><span class="text-slate-500">logLevel</span> <span class="text-slate-900">= info</span></div>
                  <div><span class="text-slate-500">retention</span> <span class="text-slate-900">= 14d</span></div>
                  <div><span class="text-slate-500">refreshInterval</span> <span class="text-slate-900">= 15s</span></div>
                  <div><span class="text-slate-500">theme</span> <span class="text-slate-900">= cloudbsd</span></div>
                  <div><span class="text-slate-500">locale</span> <span class="text-slate-900">= en_US</span></div>
                  <div><span class="text-slate-500">tz</span> <span class="text-slate-900">= America/Montreal</span></div>
                  <div><span class="text-slate-500">plugins</span> <span class="text-slate-900">= 5</span></div>
                  <div><span class="text-slate-500">mfa</span> <span class="text-slate-900">= required</span></div>
                  <div><span class="text-slate-500">sshdPort</span> <span class="text-slate-900">= 22</span></div>
                  <div><span class="text-slate-500">ipv6</span> <span class="text-slate-900">= true</span></div>
                </div>
              </div>
            </div>
            <div class="bg-white rounded-lg border p-4 shadow-sm mt-4">
              <h3 class="text-sm font-semibold mb-3">Log file locations</h3>
              <table class="w-full text-xs">
                <thead class="text-slate-500 text-[10px] uppercase"><tr class="border-b"><th class="text-left py-1 font-medium">File</th><th class="text-right py-1 font-medium">Size</th><th class="text-right py-1 font-medium">Last rotated</th></tr></thead>
                <tbody class="divide-y divide-slate-100 font-mono">
                  <tr><td class="py-1">/var/log/cloudbsd/admin.log</td><td class="text-right">124 MB</td><td class="text-right text-slate-500">6h ago</td></tr>
                  <tr><td class="py-1">/var/log/cloudbsd/access.log</td><td class="text-right">88 MB</td><td class="text-right text-slate-500">6h ago</td></tr>
                  <tr><td class="py-1">/var/log/cloudbsd/error.log</td><td class="text-right">4.2 MB</td><td class="text-right text-slate-500">6h ago</td></tr>
                  <tr><td class="py-1">/var/log/cloudbsd/auth.log</td><td class="text-right">12 MB</td><td class="text-right text-slate-500">6h ago</td></tr>
                </tbody>
              </table>
            </div>
          </main>
        </g>
      </div>
    </div>
  </foreignObject>
</svg>
