                <table style="width:100%;font-size:11px;">
                  <tr><td style="padding:2px 0;color:#64748b;width:30%;">Mode</td><td>VNET · epair0b · vmbr0</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">IPv4</td><td style="font-family:monospace;">10.0.5.21/24 · gw 10.0.5.1</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">IPv6</td><td style="font-family:monospace;">fd00:5::21/64 · gw fd00:5::1</td></tr>
                </table>
              </div>

              <div style="padding:16px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><h3 style="font-size:12px;font-weight:700;color:#64748b;letter-spacing:0.06em;margin:0;">STORAGE &amp; LIMITS</h3><button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;">edit</button></div>
                <table style="width:100%;font-size:11px;">
                  <tr><td style="padding:2px 0;color:#64748b;width:30%;">Dataset</td><td style="font-family:monospace;font-size:10px;">tank/jails/dns-resolver-01</td></tr>
