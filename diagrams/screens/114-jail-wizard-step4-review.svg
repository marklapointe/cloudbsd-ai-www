                <div style="font-size:13px;font-family:monospace;font-weight:600;">FreeBSD 14.2 RELEASE · thick</div>
                <div style="font-size:11px;color:#64748b;margin-top:4px;">~600 MB base. Auto-updates enabled.</div>
              </div>

