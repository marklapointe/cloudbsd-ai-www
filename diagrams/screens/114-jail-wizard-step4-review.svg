                <div style="margin-top:8px;font-size:11px;color:#475569;line-height:1.5;">Most restrictive profile. Only <code style="font-family:monospace;background:#f1f5f9;padding:1px 5px;border-radius:3px;">set_hostname</code> enabled. Use this for untrusted code.</div>
