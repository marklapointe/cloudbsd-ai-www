              <code style="font-family:monospace;background:#f1f5f9;padding:2px 6px;border-radius:3px;display:block;margin-bottom:4px;">jexec dns-resolver-01 /bin/sh</code>
              <code style="font-family:monospace;background:#f1f5f9;padding:2px 6px;border-radius:3px;display:block;">jail -r dns-resolver-01</code>
