<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Network/IP Pool Create Wizard — Step 2 of 3 — DHCP + DNS</title>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">

      <div style="display:flex;flex-direction:column;height:100%;background:#f1f5f9;">
        <div style="padding:18px 32px;background:#ffffff;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:14px;">
            <span style="display:inline-block;padding:5px 10px;background:linear-gradient(135deg,#0ea5e9,#1e40af);border-radius:5px;color:#ffffff;font-weight:700;font-size:11px;">CloudBSD</span>
            <h2 style="margin:0;font-size:15px;font-weight:600;">Create IP pool</h2>
            <span style="color:#94a3b8;">/</span>
            <span style="font-size:12px;color:#475569;">Step 2 — DHCP + DNS</span>
          </div>
          <div style="display:flex;align-items:center;gap:14px;font-size:11px;color:#64748b;">
            Step 2 of 3 · ~1 min remaining
            <button style="padding:6px 12px;font-size:11px;border:none;border-radius:4px;background:transparent;color:#64748b;">✕ Cancel</button>
          </div>
        </div>

        <div style="padding:0 32px 14px;background:#ffffff;border-bottom:1px solid #e2e8f0;">
          <div style="display:flex;gap:0;align-items:center;">
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;"><div style="width:20px;height:20px;border-radius:50%;background:#16a34a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">✓</div><span style="font-size:11px;color:#475569;">1. Subnet <button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;margin-left:4px;">edit</button></span></div>
            <div style="display:flex;align-items:center;color:#16a34a;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid #1d4ed8;background:#1d4ed810;"><div style="width:20px;height:20px;border-radius:50%;background:#1d4ed8;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">2</div><span style="font-size:11px;font-weight:600;color:#1d4ed8;">DHCP + DNS</span></div>
            <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;"><div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">3</div><span style="font-size:11px;color:#475569;">Review</span></div>
            <div style="flex:1;"></div>
            <span style="font-size:10px;color:#16a34a;">1 of 3 complete</span>
          </div>
        </div>

        <div style="flex:1;display:flex;background:#f1f5f9;overflow:hidden;">
          <div style="flex:1;padding:28px 40px;overflow-y:auto;">

            <!-- DHCP -->
            <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;color:#0f172a;">DHCP range + options</h1>
            <p style="margin:0 0 20px;font-size:13px;color:#64748b;max-width:680px;line-height:1.55;">Pick which addresses are dynamic. Anything outside the range must be assigned manually via the IPs editor.</p>

            <div style="padding:14px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:18px;">
              <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;">
                <div>
                  <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">DHCP range start</div>
                  <input value="10.0.10.100" style="width:100%;height:34px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-family:monospace;font-size:13px;"/>
                </div>
                <div>
                  <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">DHCP range end</div>
                  <input value="10.0.10.200" style="width:100%;height:34px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-family:monospace;font-size:13px;"/>
                </div>
                <div>
                  <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Lease time</div>
                  <div style="display:flex;gap:4px;"><input value="12" style="width:60%;height:34px;border:1px solid #cbd5e1;border-radius:5px;padding:0 10px;font-family:monospace;font-size:13px;"/><select style="flex:1;height:34px;border:1px solid #cbd5e1;border-radius:5px;padding:0 8px;font-size:11px;background:#ffffff;"><option selected="selected">hours</option><option>minutes</option><option>days</option></select></div>
                </div>
              </div>
              <div style="display:flex;gap:14px;font-size:12px;">
                <label style="display:flex;align-items:center;gap:6px;color:#475569;cursor:pointer;"><input type="checkbox" checked="checked" style="accent-color:#1d4ed8;"/> Enable DHCP for this pool</label>
                <label style="display:flex;align-items:center;gap:6px;color:#475569;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> Enable SLAAC (IPv6)</label>
                <label style="display:flex;align-items:center;gap:6px;color:#475569;cursor:pointer;"><input type="checkbox" checked="checked" style="accent-color:#1d4ed8;"/> Authoritative</label>
                <label style="display:flex;align-items:center;gap:6px;color:#475569;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> Log DHCP requests</label>
              </div>
            </div>

            <!-- DNS -->
            <h2 style="margin:8px 0 12px;font-size:15px;font-weight:700;color:#0f172a;">DNS servers</h2>
            <div style="padding:14px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:18px;">
              <table style="width:100%;font-size:11px;border-collapse:collapse;margin-bottom:10px;">
                <thead><tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;"><th style="padding:6px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;width:30%;">ROLE</th><th style="padding:6px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">SERVER</th><th style="width:30px;"></th></tr></thead>
                <tbody>
                  <tr><td style="padding:6px;"><select style="width:100%;height:28px;border:1px solid #cbd5e1;border-radius:4px;padding:0 6px;font-size:11px;background:#ffffff;"><option selected="selected">primary</option><option>secondary</option><option>conditional forwarder</option></select></td><td style="padding:6px;"><input value="10.0.0.53" style="width:100%;height:28px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px;font-family:monospace;font-size:12px;"/></td><td style="padding:6px;"><button style="background:transparent;border:none;color:#dc2626;cursor:pointer;">✕</button></td></tr>
                  <tr><td style="padding:6px;"><select style="width:100%;height:28px;border:1px solid #cbd5e1;border-radius:4px;padding:0 6px;font-size:11px;background:#ffffff;"><option>primary</option><option selected="selected">secondary</option><option>conditional forwarder</option></select></td><td style="padding:6px;"><input value="1.1.1.1" style="width:100%;height:28px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px;font-family:monospace;font-size:12px;"/></td><td style="padding:6px;"><button style="background:transparent;border:none;color:#dc2626;cursor:pointer;">✕</button></td></tr>
                  <tr><td style="padding:6px;"><select style="width:100%;height:28px;border:1px solid #cbd5e1;border-radius:4px;padding:0 6px;font-size:11px;background:#ffffff;"><option>primary</option><option>secondary</option><option selected="selected">conditional forwarder</option></select></td><td style="padding:6px;"><input value="9.9.9.9" style="width:100%;height:28px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px;font-family:monospace;font-size:12px;"/></td><td style="padding:6px;"><button style="background:transparent;border:none;color:#dc2626;cursor:pointer;">✕</button></td></tr>
                </tbody>
              </table>
              <button style="padding:5px 12px;font-size:11px;border:1px dashed #cbd5e1;border-radius:4px;background:#f8fafc;color:#475569;cursor:pointer;">+ Add DNS server</button>
            </div>

            <!-- Static reservations -->
            <h2 style="margin:8px 0 12px;font-size:15px;font-weight:700;color:#0f172a;">Static reservations</h2>
            <div style="padding:14px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;">
              <table style="width:100%;font-size:11px;border-collapse:collapse;margin-bottom:10px;">
                <thead><tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;"><th style="padding:6px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;width:25%;">HOSTNAME</th><th style="padding:6px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;width:25%;">MAC</th><th style="padding:6px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;width:20%;">IP</th><th style="padding:6px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">DESCRIPTION</th><th style="width:30px;"></th></tr></thead>
                <tbody>
                  <tr><td style="padding:6px;"><input value="apc-pdu-01" style="width:100%;height:28px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px;font-family:monospace;font-size:12px;"/></td><td style="padding:6px;"><input value="00:c0:bf:01:de:ad" style="width:100%;height:28px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px;font-family:monospace;font-size:11px;"/></td><td style="padding:6px;"><input value="10.0.10.50" style="width:100%;height:28px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px;font-family:monospace;font-size:12px;"/></td><td style="padding:6px;font-size:11px;color:#475569;">Rack 3 PDU</td><td style="padding:6px;"><button style="background:transparent;border:none;color:#dc2626;cursor:pointer;">✕</button></td></tr>
                  <tr><td style="padding:6px;"><input value="ipmi-node-3" style="width:100%;height:28px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px;font-family:monospace;font-size:12px;"/></td><td style="padding:6px;"><input value="aa:bb:cc:11:22:33" style="width:100%;height:28px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px;font-family:monospace;font-size:11px;"/></td><td style="padding:6px;"><input value="10.0.10.51" style="width:100%;height:28px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px;font-family:monospace;font-size:12px;"/></td><td style="padding:6px;font-size:11px;color:#475569;">Out-of-band mgmt</td><td style="padding:6px;"><button style="background:transparent;border:none;color:#dc2626;cursor:pointer;">✕</button></td></tr>
                </tbody>
              </table>
              <button style="padding:5px 12px;font-size:11px;border:1px dashed #cbd5e1;border-radius:4px;background:#f8fafc;color:#475569;cursor:pointer;">+ Add reservation</button>
            </div>

          </div>

          <div style="width:280px;padding:28px 24px;border-left:1px solid #e2e8f0;background:#ffffff;overflow-y:auto;">
            <div style="padding:14px;background:#1d4ed810;border:1px solid #bfdbfe;border-radius:8px;margin-bottom:16px;">
              <div style="font-size:11px;font-weight:700;color:#1d4ed8;letter-spacing:0.06em;margin-bottom:6px;">POOL CAPACITY</div>
              <table style="width:100%;font-size:11px;color:#1e3a8a;">
                <tr><td style="padding:3px 0;color:#64748b;">Total v4</td><td style="text-align:right;font-weight:600;">254</td></tr>
                <tr><td style="padding:3px 0;color:#64748b;">DHCP range</td><td style="text-align:right;font-weight:600;">101</td></tr>
                <tr><td style="padding:3px 0;color:#64748b;">Static</td><td style="text-align:right;font-weight:600;">2</td></tr>
                <tr><td style="padding:3px 0;color:#64748b;">Gateway</td><td style="padding:3px 0;color:#64748b;text-align:right;font-weight:600;">1</td></tr>
                <tr><td style="padding:8px 0 0;color:#64748b;border-top:1px solid #bfdbfe;font-weight:700;">Free</td><td style="padding:8px 0 0;text-align:right;font-weight:700;border-top:1px solid #bfdbfe;">150</td></tr>
              </table>
            </div>
          </div>
        </div>

        <div style="padding:14px 32px;background:#ffffff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <button style="padding:9px 16px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">← Back to Subnet</button>
          <button style="padding:10px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:#1d4ed8;color:#ffffff;">Next → Review</button>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
