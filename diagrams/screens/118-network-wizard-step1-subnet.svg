<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Network/IP Pool Create Wizard — Step 1 of 3 — Subnet</title>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">

      <div style="display:flex;flex-direction:column;height:100%;background:#f1f5f9;">
        <div style="padding:18px 32px;background:#ffffff;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:14px;">
            <span style="display:inline-block;padding:5px 10px;background:linear-gradient(135deg,#0ea5e9,#1e40af);border-radius:5px;color:#ffffff;font-weight:700;font-size:11px;">CloudBSD</span>
            <h2 style="margin:0;font-size:15px;font-weight:600;">Create IP pool</h2>
            <span style="color:#94a3b8;">/</span>
            <span style="font-size:12px;color:#475569;">Step 1 — Subnet</span>
          </div>
          <div style="display:flex;align-items:center;gap:14px;font-size:11px;color:#64748b;">
            Step 1 of 3 · ~1 min remaining
            <button style="padding:6px 12px;font-size:11px;border:none;border-radius:4px;background:transparent;color:#64748b;">✕ Cancel</button>
          </div>
        </div>

        <div style="padding:0 32px 14px;background:#ffffff;border-bottom:1px solid #e2e8f0;">
          <div style="display:flex;gap:0;align-items:center;">
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid #1d4ed8;background:#1d4ed810;"><div style="width:20px;height:20px;border-radius:50%;background:#1d4ed8;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">1</div><span style="font-size:11px;font-weight:600;color:#1d4ed8;">Subnet</span></div>
            <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;"><div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">2</div><span style="font-size:11px;color:#475569;">DHCP + DNS</span></div>
            <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;"><div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">3</div><span style="font-size:11px;color:#475569;">Review</span></div>
            <div style="flex:1;"></div>
            <span style="font-size:10px;color:#94a3b8;">0 of 3 complete</span>
          </div>
        </div>

        <div style="flex:1;display:flex;background:#f1f5f9;overflow:hidden;">
          <div style="flex:1;padding:28px 40px;overflow-y:auto;">
            <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;color:#0f172a;">Define the subnet</h1>
            <p style="margin:0 0 24px;font-size:13px;color:#64748b;max-width:680px;line-height:1.55;">An IP pool is an IPv4 + IPv6 subnet that gets handed out to VMs, jails, and containers. The gateway routes traffic to the host.</p>

            <!-- Name + family -->
            <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin-bottom:18px;">
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Pool name <span style="color:#dc2626;">*</span></div>
                <input value="prod-vlan-10" style="width:100%;height:36px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-family:monospace;font-size:13px;"/>
                <div style="font-size:10px;color:#94a3b8;margin-top:4px;">[a-z0-9_-]+. Used in DNS.</div>
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Family</div>
                <select style="width:100%;height:36px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-size:12px;background:#ffffff;">
                  <option>IPv4 only</option>
                  <option selected="selected">IPv4 + IPv6 (dual-stack)</option>
                  <option>IPv6 only</option>
                </select>
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">VLAN</div>
                <select style="width:100%;height:36px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-size:12px;background:#ffffff;font-family:monospace;">
                  <option selected="selected">10 · Production</option>
                  <option>20 · Staging</option>
                  <option>30 · Development</option>
                  <option>40 · IoT</option>
                  <option>— untagged</option>
                </select>
              </div>
            </div>

            <!-- IPv4 -->
            <h2 style="margin:8px 0 12px;font-size:15px;font-weight:700;color:#0f172a;">IPv4</h2>
            <div style="padding:14px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:14px;">
              <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin-bottom:10px;">
                <div>
                  <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Network (CIDR) <span style="color:#dc2626;">*</span></div>
                  <input value="10.0.10.0/24" style="width:100%;height:34px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-family:monospace;font-size:13px;font-weight:600;"/>
                </div>
                <div>
                  <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Gateway</div>
                  <input value="10.0.10.1" style="width:100%;height:34px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-family:monospace;font-size:13px;"/>
                </div>
                <div>
                  <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Netmask form</div>
                  <select style="width:100%;height:34px;border:1px solid #cbd5e1;border-radius:5px;padding:0 10px;font-size:12px;background:#ffffff;"><option>/24 (255.255.255.0)</option><option>/16</option><option>/22</option></select>
                </div>
              </div>
              <div style="padding:10px 14px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:6px;font-size:11px;color:#312e81;">
                <strong>254 usable addresses.</strong> Reserve: <code style="font-family:monospace;background:#fff;padding:1px 5px;border-radius:3px;">.0</code> network, <code style="font-family:monospace;background:#fff;padding:1px 5px;border-radius:3px;">.1</code> gateway, <code style="font-family:monospace;background:#fff;padding:1px 5px;border-radius:3px;">.255</code> broadcast. Configure DHCP range on next step.
              </div>
            </div>

            <!-- IPv6 -->
            <h2 style="margin:8px 0 12px;font-size:15px;font-weight:700;color:#0f172a;">IPv6</h2>
            <div style="padding:14px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:18px;">
              <div style="display:grid;grid-template-columns:2fr 1fr;gap:14px;">
                <div>
                  <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Prefix (CIDR) <span style="color:#dc2626;">*</span></div>
                  <input value="fd00:10::/64" style="width:100%;height:34px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-family:monospace;font-size:13px;font-weight:600;"/>
                </div>
                <div>
                  <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Gateway</div>
                  <input value="fd00:10::1" style="width:100%;height:34px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-family:monospace;font-size:13px;"/>
                </div>
              </div>
              <div style="padding:10px 14px;background:#ecfdf5;border:1px solid #bbf7d0;border-radius:6px;font-size:11px;color:#166534;margin-top:10px;">
                <strong>ULA range.</strong> Use <code style="font-family:monospace;background:#fff;padding:1px 5px;border-radius:3px;">fd00::/8</code> for site-local. NAT66 to global if outbound required.
              </div>
            </div>

            <h2 style="margin:8px 0 12px;font-size:15px;font-weight:700;color:#0f172a;">Domain + search list</h2>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Domain</div>
                <input value="corp.lan" style="width:100%;height:34px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-family:monospace;font-size:13px;"/>
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Search domains</div>
                <input value="corp.lan, prod.corp.lan" style="width:100%;height:34px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-family:monospace;font-size:13px;"/>
              </div>
            </div>

          </div>

          <div style="width:280px;padding:28px 24px;border-left:1px solid #e2e8f0;background:#ffffff;overflow-y:auto;">
            <div style="padding:14px;background:#1d4ed810;border:1px solid #bfdbfe;border-radius:8px;margin-bottom:16px;">
              <div style="font-size:11px;font-weight:700;color:#1d4ed8;letter-spacing:0.06em;margin-bottom:6px;">POOL SUMMARY</div>
              <table style="width:100%;font-size:11px;color:#1e3a8a;">
                <tr><td style="padding:3px 0;color:#64748b;">Name</td><td style="text-align:right;font-weight:600;">prod-vlan-10</td></tr>
                <tr><td style="padding:3px 0;color:#64748b;">VLAN</td><td style="text-align:right;font-weight:600;">10</td></tr>
                <tr><td style="padding:3px 0;color:#64748b;">IPv4</td><td style="text-align:right;font-weight:600;font-family:monospace;">10.0.10.0/24</td></tr>
                <tr><td style="padding:3px 0;color:#64748b;">IPv6</td><td style="text-align:right;font-weight:600;font-family:monospace;">fd00:10::/64</td></tr>
                <tr><td style="padding:3px 0;color:#64748b;">Usable v4</td><td style="text-align:right;font-weight:600;">254</td></tr>
              </table>
            </div>
            <div style="padding:14px;background:#fef3c7;border:1px solid #fde68a;border-radius:8px;">
              <div style="font-size:11px;font-weight:700;color:#92400e;letter-spacing:0.06em;margin-bottom:6px;">PROBE</div>
              <div style="font-size:11px;color:#78350f;line-height:1.5;margin-bottom:8px;">No conflicts found:</div>
              <div style="font-size:10px;font-family:monospace;color:#166534;background:#dcfce7;padding:8px;border-radius:4px;border:1px solid #bbf7d0;">
                ✓ No overlap with existing pools<br/>
                ✓ Gateway free<br/>
                ✓ No active DHCP clients in range
              </div>
            </div>
          </div>
        </div>

        <div style="padding:14px 32px;background:#ffffff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <button style="padding:9px 16px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;" disabled="disabled">← Back</button>
          <button style="padding:10px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:#1d4ed8;color:#ffffff;">Next → DHCP + DNS</button>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
