<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD VM Create Wizard — Step 4 of 5 — Storage + Network</title>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">

      <div style="display:flex;flex-direction:column;height:100%;background:#f1f5f9;">
        <!-- Top bar -->
        <div style="padding:18px 32px;background:#ffffff;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:14px;">
            <span style="display:inline-block;padding:5px 10px;background:linear-gradient(135deg,#0ea5e9,#1e40af);border-radius:5px;color:#ffffff;font-weight:700;font-size:11px;">CloudBSD</span>
            <h2 style="margin:0;font-size:15px;font-weight:600;">Create virtual machine</h2>
            <span style="color:#94a3b8;">/</span>
            <span style="font-size:12px;color:#475569;">Step 4 — Storage + Network</span>
          </div>
          <div style="display:flex;align-items:center;gap:14px;font-size:11px;color:#64748b;">
            Step 4 of 5 · ~2 min remaining
            <button style="padding:6px 12px;font-size:11px;border:none;border-radius:4px;background:transparent;color:#64748b;">✕ Cancel</button>
          </div>
        </div>

        <!-- Step indicator -->
        <div style="padding:0 32px 14px;background:#ffffff;border-bottom:1px solid #e2e8f0;">
          <div style="display:flex;gap:0;align-items:center;">
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;">
              <div style="width:20px;height:20px;border-radius:50%;background:#16a34a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">✓</div>
              <span style="font-size:11px;color:#475569;">1. Template <button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;margin-left:4px;">edit</button></span>
            </div>
            <div style="display:flex;align-items:center;color:#16a34a;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;">
              <div style="width:20px;height:20px;border-radius:50%;background:#16a34a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">✓</div>
              <span style="font-size:11px;color:#475569;">2. Identity <button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;margin-left:4px;">edit</button></span>
            </div>
            <div style="display:flex;align-items:center;color:#16a34a;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;">
              <div style="width:20px;height:20px;border-radius:50%;background:#16a34a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">✓</div>
              <span style="font-size:11px;color:#475569;">3. Resources <button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;margin-left:4px;">edit</button></span>
            </div>
            <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid #1d4ed8;background:#1d4ed810;">
              <div style="width:20px;height:20px;border-radius:50%;background:#1d4ed8;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">4</div>
              <span style="font-size:11px;font-weight:600;color:#1d4ed8;">Storage + Network</span>
            </div>
            <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;">
              <div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">5</div>
              <span style="font-size:11px;font-weight:500;color:#475569;">Review</span>
            </div>
            <div style="flex:1;"></div>
            <span style="font-size:10px;color:#16a34a;">3 of 5 complete</span>
          </div>
        </div>

        <!-- Body -->
        <div style="flex:1;display:flex;background:#f1f5f9;overflow:hidden;">
          <div style="flex:1;padding:28px 40px;overflow-y:auto;">

            <!-- Boot disk block -->
            <h2 style="margin:0 0 12px;font-size:16px;font-weight:700;color:#0f172a;">Storage</h2>
            <div style="padding:14px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:18px;">
              <table style="width:100%;border-collapse:collapse;font-size:12px;">
                <thead>
                  <tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;">
                    <th style="padding:8px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">DEVICE</th>
                    <th style="padding:8px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">SIZE</th>
                    <th style="padding:8px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">FORMAT</th>
                    <th style="padding:8px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">BACKEND</th>
                    <th style="padding:8px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">DEDUPE</th>
                    <th style="padding:8px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">LOCATION</th>
                    <th style="padding:8px;text-align:right;"></th>
                  </tr>
                </thead>
                <tbody>
                  <tr style="border-bottom:1px solid #f1f5f9;">
                    <td style="padding:10px 8px;font-family:monospace;font-weight:600;">virtio0</td>
                    <td style="padding:10px 8px;font-family:monospace;">60 GB</td>
                    <td style="padding:10px 8px;"><span style="padding:2px 7px;background:#dbeafe;color:#1d4ed8;border-radius:3px;font-size:10px;font-weight:600;">raw</span></td>
                    <td style="padding:10px 8px;font-size:11px;">VirtIO blk</td>
                    <td style="padding:10px 8px;font-size:11px;color:#16a34a;">off</td>
                    <td style="padding:10px 8px;font-size:11px;color:#64748b;">node-3 / tank/vm-disks</td>
                    <td style="padding:10px 8px;text-align:right;">
                      <button style="padding:3px 8px;font-size:10px;border:1px solid #cbd5e1;border-radius:3px;background:#ffffff;color:#475569;">edit</button>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding:10px 8px;font-family:monospace;color:#94a3b8;font-style:italic;" colspan="7">+ No additional disks. Click "Add disk" below to attach more.</td>
                  </tr>
                </tbody>
              </table>
              <div style="display:flex;gap:10px;margin-top:14px;">
                <button style="padding:8px 14px;font-size:12px;border:1px dashed #cbd5e1;border-radius:5px;background:#f8fafc;color:#475569;cursor:pointer;">+ Add data disk</button>
                <button style="padding:8px 14px;font-size:12px;border:1px dashed #cbd5e1;border-radius:5px;background:#f8fafc;color:#475569;cursor:pointer;">+ Attach existing volume</button>
                <button style="padding:8px 14px;font-size:12px;border:1px dashed #cbd5e1;border-radius:5px;background:#f8fafc;color:#475569;cursor:pointer;">+ Mount iSCSI LUN</button>
              </div>
            </div>

            <!-- Network interfaces -->
            <h2 style="margin:8px 0 12px;font-size:16px;font-weight:700;color:#0f172a;">Network interfaces</h2>
            <div style="padding:14px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:18px;">
              <table style="width:100%;border-collapse:collapse;font-size:12px;">
                <thead>
                  <tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;">
                    <th style="padding:8px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">NIC</th>
                    <th style="padding:8px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">MODEL</th>
                    <th style="padding:8px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">VLAN</th>
                    <th style="padding:8px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">BRIDGE</th>
                    <th style="padding:8px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">IPv4</th>
                    <th style="padding:8px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">IPv6</th>
                    <th style="padding:8px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">RATE LIMIT</th>
                    <th style="padding:8px;text-align:right;"></th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td style="padding:10px 8px;font-family:monospace;font-weight:600;">net0</td>
                    <td style="padding:10px 8px;font-size:11px;">VirtIO</td>
                    <td style="padding:10px 8px;font-family:monospace;">10</td>
                    <td style="padding:10px 8px;font-family:monospace;font-size:11px;">vmbr0</td>
                    <td style="padding:10px 8px;font-family:monospace;font-size:11px;">DHCP</td>
                    <td style="padding:10px 8px;font-family:monospace;font-size:11px;">SLAAC</td>
                    <td style="padding:10px 8px;font-size:11px;">unlimited</td>
                    <td style="padding:10px 8px;text-align:right;">
                      <button style="padding:3px 8px;font-size:10px;border:1px solid #cbd5e1;border-radius:3px;background:#ffffff;color:#475569;">edit</button>
                      <button style="padding:3px 8px;font-size:10px;border:1px solid #fecaca;border-radius:3px;background:#fef2f2;color:#dc2626;">✕</button>
                    </td>
                  </tr>
                </tbody>
              </table>
              <div style="margin-top:14px;display:flex;gap:10px;align-items:center;">
                <button style="padding:8px 14px;font-size:12px;border:1px dashed #cbd5e1;border-radius:5px;background:#f8fafc;color:#475569;cursor:pointer;">+ Add NIC</button>
                <span style="font-size:11px;color:#94a3b8;">IPv4/IPv6 static assignment: use the <a style="color:#1d4ed8;cursor:pointer;text-decoration:underline;">IPs tool</a> before completing the wizard.</span>
              </div>
            </div>

            <!-- Advanced options -->
            <h2 style="margin:8px 0 12px;font-size:16px;font-weight:700;color:#0f172a;">Advanced</h2>
            <div style="padding:14px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 28px;font-size:12px;">
                <label style="display:flex;justify-content:space-between;align-items:center;">
                  <span style="color:#475569;">Start VM after create</span>
                  <input type="checkbox" checked="checked" style="accent-color:#1d4ed8;width:36px;height:20px;"/>
                </label>
                <label style="display:flex;justify-content:space-between;align-items:center;">
                  <span style="color:#475569;">Enable QEMU Guest Agent</span>
                  <input type="checkbox" checked="checked" style="accent-color:#1d4ed8;width:36px;height:20px;"/>
                </label>
                <label style="display:flex;justify-content:space-between;align-items:center;">
                  <span style="color:#475569;">Protect against accidental deletion</span>
                  <input type="checkbox" style="accent-color:#1d4ed8;width:36px;height:20px;"/>
                </label>
                <label style="display:flex;justify-content:space-between;align-items:center;">
                  <span style="color:#475569;">Enable SPICE clipboard sharing</span>
                  <input type="checkbox" style="accent-color:#1d4ed8;width:36px;height:20px;"/>
                </label>
                <label style="display:flex;justify-content:space-between;align-items:center;">
                  <span style="color:#475569;">Tablet pointer (for old OSes)</span>
                  <input type="checkbox" style="accent-color:#1d4ed8;width:36px;height:20px;"/>
                </label>
                <label style="display:flex;justify-content:space-between;align-items:center;">
                  <span style="color:#475569;">Auto-generate snapshot on first boot</span>
                  <input type="checkbox" checked="checked" style="accent-color:#1d4ed8;width:36px;height:20px;"/>
                </label>
              </div>
            </div>

          </div>

          <!-- Right rail -->
          <div style="width:280px;padding:28px 24px;border-left:1px solid #e2e8f0;background:#ffffff;overflow-y:auto;">
            <div style="padding:14px;background:#1d4ed810;border:1px solid #bfdbfe;border-radius:8px;margin-bottom:16px;">
              <div style="font-size:11px;font-weight:700;color:#1d4ed8;letter-spacing:0.06em;margin-bottom:6px;">SELECTION SUMMARY</div>
              <table style="width:100%;font-size:11px;color:#1e3a8a;">
                <tr><td style="padding:3px 0;color:#64748b;">Disks</td><td style="text-align:right;font-weight:600;">1 boot</td></tr>
                <tr><td style="padding:3px 0;color:#64748b;">Boot disk size</td><td style="text-align:right;font-weight:600;">60 GB</td></tr>
                <tr><td style="padding:3px 0;color:#64748b;">NICs</td><td style="text-align:right;font-weight:600;">1</td></tr>
                <tr><td style="padding:3px 0;color:#64748b;">VLAN</td><td style="text-align:right;font-weight:600;">10</td></tr>
                <tr><td style="padding:3px 0;color:#64748b;">Start after</td><td style="text-align:right;font-weight:600;color:#16a34a;">yes</td></tr>
              </table>
            </div>
            <div style="padding:14px;background:#fef3c7;border:1px solid #fde68a;border-radius:8px;margin-bottom:16px;">
              <div style="font-size:11px;font-weight:700;color:#92400e;letter-spacing:0.06em;margin-bottom:6px;">CAPACITY CHECK</div>
              <div style="font-size:11px;color:#78350f;line-height:1.5;">60 GB boot disk uses 14% of <code style="font-family:monospace;background:#fef9c3;padding:1px 5px;border-radius:3px;">tank/vm-disks</code> free space. ✓ OK</div>
            </div>
          </div>
        </div>

        <!-- Footer -->
        <div style="padding:14px 32px;background:#ffffff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <button style="padding:9px 16px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">← Back to Resources</button>
          <button style="padding:10px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:#1d4ed8;color:#ffffff;">Next → Review</button>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
