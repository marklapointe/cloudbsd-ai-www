<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — Add MCP server</title>
  <desc>Register HTTP/SSE/stdio MCP.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:1280px;height:800px;background:#f1f5f9;color:#0f172a;font-size:13px;box-sizing:border-box;overflow:hidden;">
      <div style="height:52px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 16px;"><div style="width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;">C</div><span style="font-weight:700;font-size:16px;margin-left:8px;">CloudBSD Admin</span><span style="margin-left:8px;padding:2px 8px;font-size:11px;border-radius:4px;background:#f1f5f9;color:#475569;">prod-node-01.local</span><div style="margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:#64748b;"><select style="padding:3px 6px;font-size:11px;border:1px solid #cbd5e1;border-radius:5px;"><option selected="selected">UTC</option></select><div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;">M</div></div></div>
      <div style="display:flex;height:748px;">
        <aside style="width:220px;background:#fff;border-right:1px solid #e2e8f0;padding:6px 8px 12px;box-sizing:border-box;overflow-y:auto;display:flex;flex-direction:column;"><div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;padding:10px 10px 4px;">Workload</div><nav style="font-size:12px;"><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>Dashboard</span></a><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>Virtual Machines</span></a><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>Containers</span></a><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>Jails</span></a><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>Storage</span></a><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>Networks</span></a><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>Hosts</span></a><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>Cluster</span></a><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>Tasks</span></a><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>Library</span></a></nav><div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;padding:10px 10px 4px;">Access</div><nav style="font-size:12px;"><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>Users</span></a><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>Roles</span></a></nav><div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;padding:10px 10px 4px;">Observe</div><nav style="font-size:12px;"><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>Logs</span></a><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>Notifications</span></a><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>Audit</span></a></nav><div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;padding:10px 10px 4px;">Configure</div><nav style="font-size:12px;"><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>Settings</span></a><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;background:linear-gradient(90deg,#eff6ff,#dbeafe);color:#1d4ed8;font-weight:600;border-left:3px solid #2563eb;"><span>MCP</span></a></nav><div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;padding:10px 10px 4px;">Operate</div><nav style="font-size:12px;"><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>System</span></a><a style="display:flex;padding:6px 12px;border-radius:6px;margin-bottom:1px;cursor:pointer;color:#334155;"><span>About</span></a></nav><div style="margin-top:auto;padding:12px 10px;border-top:1px solid #f1f5f9;font-size:11px;color:#94a3b8;"><div>Host: prod-node-01</div><div>Uptime: 14d 02:11</div></div></aside>
        <main style="flex:1;overflow-y:auto;padding:14px 18px;box-sizing:border-box;">
<div style="max-width:720px;margin:0 auto;">
  <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;">Add MCP server</h1>
  <p style="margin:0 0 16px;font-size:12px;color:#64748b;">Register an MCP server · this replaces the old plugin install wizard</p>
  <div style="display:flex;gap:8px;margin-bottom:16px;font-size:12px;">
    <span style="padding:6px 12px;background:#dbeafe;color:#1d4ed8;border-radius:9999px;font-weight:600;">1 Transport</span>
    <span style="padding:6px 12px;background:#f1f5f9;color:#64748b;border-radius:9999px;">2 Connection</span>
    <span style="padding:6px 12px;background:#f1f5f9;color:#64748b;border-radius:9999px;">3 Probe &amp; enable</span>
  </div>
  <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:18px;margin-bottom:12px;">
    <div style="font-size:12px;font-weight:600;margin-bottom:10px;">Transport</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">
      <div style="border:2px solid #2563eb;border-radius:8px;padding:12px;background:#eff6ff;"><div style="font-weight:700;">HTTP</div><div style="font-size:11px;color:#64748b;margin-top:4px;">Streamable HTTP</div></div>
      <div style="border:1px solid #e2e8f0;border-radius:8px;padding:12px;"><div style="font-weight:700;">SSE</div><div style="font-size:11px;color:#64748b;margin-top:4px;">Server-Sent Events</div></div>
      <div style="border:1px solid #e2e8f0;border-radius:8px;padding:12px;"><div style="font-weight:700;">stdio</div><div style="font-size:11px;color:#64748b;margin-top:4px;">Local command</div></div>
    </div>
  </div>
  <div style="background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:18px;margin-bottom:12px;">
    <div style="margin-bottom:12px;"><div style="font-size:12px;font-weight:600;margin-bottom:6px;">Name</div>
    <input value="honcho" style="width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box;"/></div>
    <div style="margin-bottom:12px;"><div style="font-size:12px;font-weight:600;margin-bottom:6px;">URL</div>
    <input value="https://mcp.honcho.example.lan/" style="width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box;font-family:monospace;font-size:12px;"/></div>
    <div><div style="font-size:12px;font-weight:600;margin-bottom:6px;">Authorization header</div>
    <input type="password" value="Bearer secret" style="width:100%;padding:8px 10px;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box;"/></div>
  </div>
  <div style="display:flex;justify-content:flex-end;gap:8px;">
    <button style="padding:7px 12px;font-size:12px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;color:#334155;cursor:pointer;">Cancel</button>
    <button style="padding:7px 12px;font-size:12px;border:0;border-radius:6px;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#fff;font-weight:600;cursor:pointer;">Next · Probe</button>
  </div>
</div>
</main>
      </div>
    </div>
  </foreignObject>
</svg>
