<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Settings General</title>
  <foreignObject x="0" y="0" width="1280" height="720">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:720px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">
      
<div style="display:flex;width:1280px;height:720px;">
  <div style="width:280px;background:#0f172a;color:#cbd5e1;padding:24px 18px;box-sizing:border-box;border-right:1px solid #1e293b;">
    <div style="display:inline-block;padding:6px 10px;background:linear-gradient(135deg,#0ea5e9,#1e40af);border-radius:5px;color:#ffffff;font-weight:700;font-size:11px;letter-spacing:0.04em;margin-bottom:8px;">CloudBSD</div>
    <h3 style="margin:0 0 2px;font-size:13px;font-weight:600;color:#ffffff;">Settings</h3>
    <div style="font-size:10px;color:#64748b;margin-bottom:24px;">admin@example.lan</div>
    
<div style="padding:9px 12px;border-radius:5px;background:#1e40af;margin-bottom:4px;display:flex;flex-direction:column;gap:2px;">
  <div style="font-size:12px;font-weight:700;color:#ffffff;">General</div>
  <div style="font-size:10px;color:#bfdbfe;line-height:1.3;">Cluster name, locale, NTP, timeouts</div>
</div>
<div style="padding:9px 12px;border-radius:5px;background:transparent;margin-bottom:4px;display:flex;flex-direction:column;gap:2px;">
  <div style="font-size:12px;font-weight:500;color:#cbd5e1;">Account</div>
  <div style="font-size:10px;color:#64748b;line-height:1.3;">Your profile, change password</div>
</div>
<div style="padding:9px 12px;border-radius:5px;background:transparent;margin-bottom:4px;display:flex;flex-direction:column;gap:2px;">
  <div style="font-size:12px;font-weight:500;color:#cbd5e1;">Security</div>
  <div style="font-size:10px;color:#64748b;line-height:1.3;">2FA, recovery codes, sessions</div>
</div>
<div style="padding:9px 12px;border-radius:5px;background:transparent;margin-bottom:4px;display:flex;flex-direction:column;gap:2px;">
  <div style="font-size:12px;font-weight:500;color:#cbd5e1;">Appearance</div>
  <div style="font-size:10px;color:#64748b;line-height:1.3;">Theme, density, font size</div>
</div>
<div style="padding:9px 12px;border-radius:5px;background:transparent;margin-bottom:4px;display:flex;flex-direction:column;gap:2px;">
  <div style="font-size:12px;font-weight:500;color:#cbd5e1;">API Keys</div>
  <div style="font-size:10px;color:#64748b;line-height:1.3;">Personal access tokens</div>
</div>
<div style="padding:9px 12px;border-radius:5px;background:transparent;margin-bottom:4px;display:flex;flex-direction:column;gap:2px;">
  <div style="font-size:12px;font-weight:500;color:#cbd5e1;">Webhooks</div>
  <div style="font-size:10px;color:#64748b;line-height:1.3;">Outbound event notifications</div>
</div>
<div style="padding:9px 12px;border-radius:5px;background:transparent;margin-bottom:4px;display:flex;flex-direction:column;gap:2px;">
  <div style="font-size:12px;font-weight:500;color:#cbd5e1;">Notifications</div>
  <div style="font-size:10px;color:#64748b;line-height:1.3;">Inbox rules, escalation</div>
</div>
<div style="padding:9px 12px;border-radius:5px;background:transparent;margin-bottom:4px;display:flex;flex-direction:column;gap:2px;">
  <div style="font-size:12px;font-weight:500;color:#cbd5e1;">Backup config</div>
  <div style="font-size:10px;color:#64748b;line-height:1.3;">Schedule + retention policies</div>
</div>
<div style="padding:9px 12px;border-radius:5px;background:transparent;margin-bottom:4px;display:flex;flex-direction:column;gap:2px;">
  <div style="font-size:12px;font-weight:500;color:#cbd5e1;">Network</div>
  <div style="font-size:10px;color:#64748b;line-height:1.3;">Cluster IP, DNS, NTP servers</div>
</div>
<div style="padding:9px 12px;border-radius:5px;background:transparent;margin-bottom:4px;display:flex;flex-direction:column;gap:2px;">
  <div style="font-size:12px;font-weight:500;color:#cbd5e1;">About</div>
  <div style="font-size:10px;color:#64748b;line-height:1.3;">Version, license, credits</div>
</div>
  </div>
  <div style="flex:1;overflow:auto;background:#f1f5f9;">
    
<div style="padding:34px 48px;">
  <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:24px;">
    <div>
      <h2 style="margin:0;font-size:20px;font-weight:700;">General settings</h2>
      <p style="margin:4px 0 0;color:#64748b;font-size:13px;">Cluster-wide preferences. Changes apply after save.</p>
    </div>
    <button style="padding:10px 18px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:#1d4ed8;color:#ffffff;">Save changes</button>
  </div>
  <div style="background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;padding:24px;margin-bottom:14px;">
    <h4 style="margin:0 0 18px;font-size:13px;font-weight:700;color:#1d4ed8;text-transform:uppercase;letter-spacing:0.06em;">Cluster identity</h4>
    
<div style="margin-bottom:18px;">
  <div style="font-size:12px;font-weight:600;color:#0f172a;margin-bottom:6px;">Cluster name</div>
  <input type="text" value="prod-cluster" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;" />
  <div style="font-size:10px;color:#94a3b8;margin-top:4px;">Used in CARP advertisements and ZFS dataset names</div>
</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      
<div style="margin-bottom:18px;">
  <div style="font-size:12px;font-weight:600;color:#0f172a;margin-bottom:6px;">Display name</div>
  <input type="text" value="Production Cluster" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;" />
  
</div>

      
<div style="margin-bottom:18px;">
  <div style="font-size:12px;font-weight:600;color:#0f172a;margin-bottom:6px;">Admin email</div>
  <input type="text" value="[email protected]" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;" />
  <div style="font-size:10px;color:#94a3b8;margin-top:4px;">Used for cluster alerts</div>
</div>

    </div>
  </div>
  <div style="background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;padding:24px;margin-bottom:14px;">
    <h4 style="margin:0 0 18px;font-size:13px;font-weight:700;color:#1d4ed8;text-transform:uppercase;letter-spacing:0.06em;">Localization</h4>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">
      
<div style="margin-bottom:18px;">
  <div style="font-size:12px;font-weight:600;color:#0f172a;margin-bottom:6px;">Timezone</div>
  <input type="text" value="America/Montreal" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;" />
  
</div>

      
<div style="margin-bottom:18px;">
  <div style="font-size:12px;font-weight:600;color:#0f172a;margin-bottom:6px;">Date format</div>
  <input type="text" value="YYYY-MM-DD HH:mm:ss" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;" />
  
</div>

      
<div style="margin-bottom:18px;">
  <div style="font-size:12px;font-weight:600;color:#0f172a;margin-bottom:6px;">Language</div>
  <input type="text" value="English (en-US)" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;" />
  
</div>

    </div>
    <div style="font-size:12px;color:#475569;">Number format: <strong>1,234.56</strong> · Currency: <strong>USD ($)</strong> · Week starts Monday</div>
  </div>
  <div style="background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;padding:24px;">
    <h4 style="margin:0 0 18px;font-size:13px;font-weight:700;color:#1d4ed8;text-transform:uppercase;letter-spacing:0.06em;">NTP servers</h4>
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;">
      <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f8fafc;border-radius:5px;">
        <span style="font-family:monospace;font-size:12px;color:#0f172a;flex:1;">0.pool.ntp.org</span>
        <span style="font-size:10px;color:#10b981;">offset +0.012s</span>
        <button style="padding:4px 8px;font-size:10px;border:1px solid #cbd5e1;border-radius:4px;background:#ffffff;color:#475569;">Edit</button>
        <button style="padding:4px 8px;font-size:10px;border:1px solid #cbd5e1;border-radius:4px;background:#ffffff;color:#475569;">Remove</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:#f8fafc;border-radius:5px;">
        <span style="font-family:monospace;font-size:12px;color:#0f172a;flex:1;">1.pool.ntp.org</span>
        <span style="font-size:10px;color:#10b981;">offset +0.022s</span>
        <button style="padding:4px 8px;font-size:10px;border:1px solid #cbd5e1;border-radius:4px;background:#ffffff;color:#475569;">Edit</button>
        <button style="padding:4px 8px;font-size:10px;border:1px solid #cbd5e1;border-radius:4px;background:#ffffff;color:#475569;">Remove</button>
      </div>
    </div>
    <button style="padding:7px 14px;font-size:12px;border:1px dashed #cbd5e1;border-radius:5px;background:#ffffff;color:#475569;">+ Add NTP server</button>
  </div>
</div>

  </div>
</div>

    </div>
  </foreignObject>
</svg>
