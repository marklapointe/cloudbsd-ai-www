<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Container Create Wizard — Step 2 of 4 — Identity</title>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">

      <div style="display:flex;flex-direction:column;height:100%;background:#f1f5f9;">
        <div style="padding:18px 32px;background:#ffffff;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:14px;">
            <span style="display:inline-block;padding:5px 10px;background:linear-gradient(135deg,#0ea5e9,#1e40af);border-radius:5px;color:#ffffff;font-weight:700;font-size:11px;">CloudBSD</span>
            <h2 style="margin:0;font-size:15px;font-weight:600;">Create container</h2>
            <span style="color:#94a3b8;">/</span>
            <span style="font-size:12px;color:#475569;">Step 2 — Identity</span>
          </div>
          <div style="display:flex;align-items:center;gap:14px;font-size:11px;color:#64748b;">
            Step 2 of 4 · ~1 min remaining
            <button style="padding:6px 12px;font-size:11px;border:none;border-radius:4px;background:transparent;color:#64748b;">✕ Cancel</button>
          </div>
        </div>

        <div style="padding:0 32px 14px;background:#ffffff;border-bottom:1px solid #e2e8f0;">
          <div style="display:flex;gap:0;align-items:center;">
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;"><div style="width:20px;height:20px;border-radius:50%;background:#16a34a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">✓</div><span style="font-size:11px;color:#475569;">1. Image <button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;margin-left:4px;">edit</button></span></div>
            <div style="display:flex;align-items:center;color:#16a34a;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid #1d4ed8;background:#1d4ed810;">
              <div style="width:20px;height:20px;border-radius:50%;background:#1d4ed8;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">2</div>
              <span style="font-size:11px;font-weight:600;color:#1d4ed8;">Identity</span>
            </div>
            <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;"><div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">3</div><span style="font-size:11px;color:#475569;">Resources</span></div>
            <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;"><div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">4</div><span style="font-size:11px;color:#475569;">Review</span></div>
            <div style="flex:1;"></div>
            <span style="font-size:10px;color:#16a34a;">1 of 4 complete</span>
          </div>
        </div>

        <div style="flex:1;display:flex;background:#f1f5f9;overflow:hidden;">
          <div style="flex:1;padding:28px 40px;overflow-y:auto;">

            <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;color:#0f172a;">Container identity</h1>
            <p style="margin:0 0 24px;font-size:13px;color:#64748b;max-width:680px;line-height:1.55;">Name, runtime behavior, and environment variables. These are typically baked into the image too — but you can override here.</p>

            <!-- Name + hostname -->
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px;">
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Container name <span style="color:#dc2626;">*</span></div>
                <input value="web-nginx-01" style="width:100%;height:36px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-family:monospace;font-size:13px;"/>
                <div style="font-size:10px;color:#94a3b8;margin-top:4px;">Lowercase, [a-z0-9_-]+. Max 63 chars.</div>
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Hostname</div>
                <input value="web-nginx-01.corp.lan" style="width:100%;height:36px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-family:monospace;font-size:12px;"/>
                <div style="font-size:10px;color:#94a3b8;margin-top:4px;">Defaults to container name</div>
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Owner</div>
                <select style="width:100%;height:36px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-size:12px;background:#ffffff;">
                  <option selected="selected">admin (admin@example.lan)</option>
                  <option>mlapointe</option>
                  <option>sysops-team</option>
                </select>
              </div>
            </div>

            <!-- Runtime -->
            <h2 style="margin:8px 0 12px;font-size:15px;font-weight:700;color:#0f172a;">Runtime behavior</h2>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:14px;margin-bottom:18px;">
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Restart policy</div>
                <select style="width:100%;height:36px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-size:12px;background:#ffffff;">
                  <option>no</option>
                  <option selected="selected">always</option>
                  <option>on-failure (max 5 retries)</option>
                  <option>unless-stopped</option>
                </select>
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">PID namespace</div>
                <select style="width:100%;height:36px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-size:12px;background:#ffffff;">
                  <option selected="selected">private (default)</option>
                  <option>host (sees host processes)</option>
                </select>
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Init process</div>
                <select style="width:100%;height:36px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-size:12px;background:#ffffff;">
                  <option>none</option>
                  <option selected="selected">tini (PID 1, signal forwarding)</option>
                </select>
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">User (UID:GID)</div>
                <input value="101:101" style="width:100%;height:36px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-family:monospace;font-size:12px;"/>
              </div>
            </div>

            <!-- Command + working dir -->
            <h2 style="margin:8px 0 12px;font-size:15px;font-weight:700;color:#0f172a;">Command override</h2>
            <div style="padding:14px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:18px;">
              <div style="display:grid;grid-template-columns:1fr 1fr 2fr;gap:14px;margin-bottom:12px;">
                <div>
                  <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Working directory</div>
                  <input value="/usr/share/nginx/html" style="width:100%;height:32px;border:1px solid #cbd5e1;border-radius:5px;padding:0 10px;font-family:monospace;font-size:12px;"/>
                </div>
                <div>
                  <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Entrypoint</div>
                  <input value="[leave image default]" style="width:100%;height:32px;border:1px solid #cbd5e1;border-radius:5px;padding:0 10px;font-family:monospace;font-size:12px;color:#94a3b8;"/>
                </div>
                <div>
                  <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Command (CMD)</div>
                  <input value="[leave image default]" style="width:100%;height:32px;border:1px solid #cbd5e1;border-radius:5px;padding:0 10px;font-family:monospace;font-size:12px;color:#94a3b8;"/>
                </div>
              </div>
              <label style="display:flex;align-items:center;gap:8px;font-size:11px;color:#475569;cursor:pointer;">
                <input type="checkbox" style="accent-color:#1d4ed8;"/> Run in privileged mode (mounts, capabilities, devices)
              </label>
            </div>

            <!-- Env vars -->
            <h2 style="margin:8px 0 12px;font-size:15px;font-weight:700;color:#0f172a;">Environment variables</h2>
            <div style="padding:14px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:18px;">
              <table style="width:100%;font-size:12px;border-collapse:collapse;margin-bottom:10px;">
                <thead>
                  <tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;">
                    <th style="padding:6px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;width:30%;">KEY</th>
                    <th style="padding:6px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">VALUE</th>
                    <th style="padding:6px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;width:14%;">SOURCE</th>
                    <th style="width:30px;"></th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td style="padding:6px;"><input value="NGINX_HOST" style="width:100%;height:30px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px;font-family:monospace;font-size:12px;"/></td>
                    <td style="padding:6px;"><input value="web-nginx-01.corp.lan" style="width:100%;height:30px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px;font-family:monospace;font-size:12px;"/></td>
                    <td style="padding:6px;font-size:10px;color:#94a3b8;">literal</td>
                    <td style="padding:6px;"><button style="background:transparent;border:none;color:#dc2626;cursor:pointer;">✕</button></td>
                  </tr>
                  <tr>
                    <td style="padding:6px;"><input value="NGINX_PORT" style="width:100%;height:30px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px;font-family:monospace;font-size:12px;"/></td>
                    <td style="padding:6px;"><input value="80" style="width:100%;height:30px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px;font-family:monospace;font-size:12px;"/></td>
                    <td style="padding:6px;font-size:10px;color:#94a3b8;">literal</td>
                    <td style="padding:6px;"><button style="background:transparent;border:none;color:#dc2626;cursor:pointer;">✕</button></td>
                  </tr>
                  <tr>
                    <td style="padding:6px;"><input value="DB_PASSWORD" style="width:100%;height:30px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px;font-family:monospace;font-size:12px;"/></td>
                    <td style="padding:6px;"><input value="${vault:kv/myapp/db#password}" style="width:100%;height:30px;border:1px solid #cbd5e1;border-radius:4px;padding:0 8px;font-family:monospace;font-size:12px;color:#1d4ed8;"/></td>
                    <td style="padding:6px;font-size:10px;color:#1d4ed8;font-weight:600;">vault</td>
                    <td style="padding:6px;"><button style="background:transparent;border:none;color:#dc2626;cursor:pointer;">✕</button></td>
                  </tr>
                </tbody>
              </table>
              <button style="padding:6px 12px;font-size:11px;border:1px dashed #cbd5e1;border-radius:4px;background:#f8fafc;color:#475569;cursor:pointer;">+ Add env var</button>
              <span style="font-size:11px;color:#94a3b8;margin-left:14px;">Secrets use <code style="font-family:monospace;background:#f1f5f9;padding:1px 5px;border-radius:3px;">${vault:path}</code> syntax. Resolved at runtime, never stored in container config.</span>
            </div>

            <!-- Tags + Description -->
            <h2 style="margin:8px 0 12px;font-size:15px;font-weight:700;color:#0f172a;">Metadata</h2>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Tags</div>
                <div style="display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid #cbd5e1;border-radius:5px;min-height:36px;background:#ffffff;">
                  <span style="padding:3px 8px;background:#dbeafe;color:#1d4ed8;border-radius:4px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;">production ✕</span>
                  <span style="padding:3px 8px;background:#dbeafe;color:#1d4ed8;border-radius:4px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;">web ✕</span>
                  <input placeholder="add tag…" style="border:none;outline:none;flex:1;min-width:80px;font-size:12px;"/>
                </div>
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Description (optional)</div>
                <input placeholder="What does this container do?" style="width:100%;height:36px;border:1px solid #cbd5e1;border-radius:5px;padding:0 12px;font-size:12px;"/>
              </div>
            </div>

          </div>

          <div style="width:280px;padding:28px 24px;border-left:1px solid #e2e8f0;background:#ffffff;overflow-y:auto;">
            <div style="padding:14px;background:#1d4ed810;border:1px solid #bfdbfe;border-radius:8px;margin-bottom:16px;">
              <div style="font-size:11px;font-weight:700;color:#1d4ed8;letter-spacing:0.06em;margin-bottom:6px;">CONTAINER ID</div>
              <div style="font-size:13px;color:#1e3a8a;font-weight:700;font-family:monospace;">web-nginx-01</div>
              <div style="font-size:10px;color:#475569;margin-top:4px;font-family:monospace;">ULID: 01J8Y3K9M2N5P7Q4R8S6T1V4W3X</div>
            </div>
            <div style="padding:14px;background:#fef3c7;border:1px solid #fde68a;border-radius:8px;margin-bottom:16px;">
              <div style="font-size:11px;font-weight:700;color:#92400e;letter-spacing:0.06em;margin-bottom:6px;">SAFETY</div>
              <div style="font-size:11px;color:#78350f;line-height:1.5;">Privileged mode grants root-equivalent on the host. Only enable for trusted images. Unprivileged is the default for a reason.</div>
            </div>
          </div>
        </div>

        <div style="padding:14px 32px;background:#ffffff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <button style="padding:9px 16px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">← Back to Image</button>
          <button style="padding:10px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:#1d4ed8;color:#ffffff;">Next → Resources</button>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
