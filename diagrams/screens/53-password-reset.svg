<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Password Reset</title>
  <foreignObject x="0" y="0" width="1280" height="720">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:720px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">
      
<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:40px;"><div style="width:440px;background:#ffffff;border-radius:10px;border:1px solid #e2e8f0;box-shadow:0 10px 30px rgba(15,23,42,0.08);padding:32px;box-sizing:border-box;height:520px;">
<div style="text-align:center;margin-bottom:22px;">
  <div style="width:64px;height:64px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:inline-flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:14px;">❖</div>
  <h1 style="margin:0 0 4px;font-size:20px;font-weight:700;">Reset password</h1>
  <p style="margin:0;font-size:13px;color:#64748b;">We'll email you a recovery code (valid 30 min)</p>
</div>
<div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;letter-spacing:0.03em;">Account email</div>
<input type="text" value="admin@example.lan" placeholder="admin@example.lan" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;" />
<div style="height:14px;"></div>
<div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;letter-spacing:0.03em;">Why are you resetting?</div>
<div style="display:flex;gap:10px;">
  <div style="flex:1;padding:10px;border:1px solid #1d4ed8;border-radius:6px;background:#eff6ff;text-align:center;font-size:12px;color:#1d4ed8;font-weight:600;">✓ Forgot password</div>
  <div style="flex:1;padding:10px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;text-align:center;font-size:12px;color:#475569;">Account locked</div>
  <div style="flex:1;padding:10px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;text-align:center;font-size:12px;color:#475569;">Suspicious access</div>
</div>
<div style="height:18px;"></div>
<button style="width:100%;padding:10px 16px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:#1d4ed8;color:#ffffff;cursor:pointer;">Send recovery code</button>
<div style="margin-top:18px;text-align:center;font-size:11px;color:#64748b;">
  Already have a recovery code? <a style="color:#1d4ed8;text-decoration:none;cursor:pointer;">Sign in with code →</a>
</div>
<div style="margin-top:8px;text-align:center;font-size:11px;color:#64748b;">
  Need help? <a style="color:#1d4ed8;text-decoration:none;cursor:pointer;">Contact admin</a>
</div>
</div>
</div>

    </div>
  </foreignObject>
</svg>
