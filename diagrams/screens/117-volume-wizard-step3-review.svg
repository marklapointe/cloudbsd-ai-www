              <div style="font-size:11px;font-weight:700;color:#16a34a;letter-spacing:0.06em;margin-bottom:6px;">READY</div>
              <table style="width:100%;font-size:11px;color:#166534;">
                <tr><td style="padding:3px 0;color:#64748b;">Cap</td><td style="text-align:right;font-weight:600;">100 GB</td></tr>
                <tr><td style="padding:3px 0;color:#64748b;">Snap</td><td style="text-align:right;font-weight:600;">~5 GB</td></tr>
                <tr><td style="padding:3px 0;color:#64748b;">Compression</td><td style="text-align:right;font-weight:600;">lz4</td></tr>
                <tr><td style="padding:8px 0 0;color:#64748b;border-top:1px solid #bbf7d0;font-weight:700;">Time</td><td style="text-align:right;font-weight:700;border-top:1px solid #bbf7d0;">instant</td></tr>
              </table>
            </div>
