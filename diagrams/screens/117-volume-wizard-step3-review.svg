                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><h3 style="font-size:12px;font-weight:700;color:#64748b;letter-spacing:0.06em;margin:0;">CAPACITY</h3><button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;">edit</button></div>
                <table style="width:100%;font-size:11px;">
                  <tr><td style="padding:2px 0;color:#64748b;width:35%;">Refquota</td><td style="font-family:monospace;font-weight:600;">100 GB</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Quota (total)</td><td style="font-family:monospace;">120 GB</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Reservation</td><td>0</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Snap overhead</td><td style="font-family:monospace;color:#92400e;">~5 GB</td></tr>
                </table>
              </div>

              <div style="padding:16px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><h3 style="font-size:12px;font-weight:700;color:#64748b;letter-spacing:0.06em;margin:0;">PERFORMANCE</h3><button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;">edit</button></div>
                <table style="width:100%;font-size:11px;">
                  <tr><td style="padding:2px 0;color:#64748b;width:35%;">Compression</td><td>lz4</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Recordsize</td><td>128K</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Dedup</td><td>off</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Atime</td><td>off</td></tr>
                </table>
              </div>

              <div style="padding:16px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><h3 style="font-size:12px;font-weight:700;color:#64748b;letter-spacing:0.06em;margin:0;">ACCESS + SNAPSHOTS</h3><button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;">edit</button></div>
                <table style="width:100%;font-size:11px;">
                  <tr><td style="padding:2px 0;color:#64748b;width:35%;">Mode</td><td style="font-family:monospace;">0750</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Owner</td><td style="font-family:monospace;">999:999 (postgres)</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">ACL</td><td>restricted</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Snapshots</td><td>hourly+daily+weekly</td></tr>
                </table>
              </div>
