                <table style="width:100%;font-size:11px;">
                  <tr><td style="padding:2px 0;color:#64748b;width:35%;">Pool</td><td style="font-family:monospace;">tank</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Path</td><td style="font-family:monospace;">tank/volumes/postgres-data-01</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Type</td><td>filesystem</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Mountpoint</td><td style="font-family:monospace;">/tank/volumes/postgres-data-01</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">At boot</td><td style="color:#16a34a;font-weight:600;">yes</td></tr>
                </table>
              </div>

