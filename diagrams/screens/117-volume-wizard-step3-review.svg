              <code style="font-family:monospace;font-size:12px;color:#a5f3fc;line-height:1.6;display:block;">zfs create -o mountpoint=/tank/volumes/postgres-data-01 -o compression=lz4 -o recordsize=128K -o atime=off -o aclmode=restricted -o quota=100G -o refquota=100G -o mode=0750 -o readonly=off tank/volumes/postgres-data-01</code>
            </div>

          </div>

