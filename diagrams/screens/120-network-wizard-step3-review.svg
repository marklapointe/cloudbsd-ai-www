<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Network/IP Pool Create Wizard — Step 3 of 3 — Review</title>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">

      <div style="display:flex;flex-direction:column;height:100%;background:#f1f5f9;">
        <div style="padding:18px 32px;background:#ffffff;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:14px;">
            <span style="display:inline-block;padding:5px 10px;background:linear-gradient(135deg,#0ea5e9,#1e40af);border-radius:5px;color:#ffffff;font-weight:700;font-size:11px;">CloudBSD</span>
            <h2 style="margin:0;font-size:15px;font-weight:600;">Create IP pool</h2>
            <span style="color:#94a3b8;">/</span>
            <span style="font-size:12px;color:#475569;">Step 3 — Review</span>
          </div>
          <div style="display:flex;align-items:center;gap:14px;font-size:11px;color:#64748b;">
            Step 3 of 3 · final review
            <button style="padding:6px 12px;font-size:11px;border:none;border-radius:4px;background:transparent;color:#64748b;">✕ Cancel</button>
          </div>
        </div>

        <div style="padding:0 32px 14px;background:#ffffff;border-bottom:1px solid #e2e8f0;">
          <div style="display:flex;gap:0;align-items:center;">
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;"><div style="width:20px;height:20px;border-radius:50%;background:#16a34a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">✓</div><span style="font-size:11px;color:#475569;">1. Subnet <button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;margin-left:4px;">edit</button></span></div>
            <div style="display:flex;align-items:center;color:#16a34a;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;"><div style="width:20px;height:20px;border-radius:50%;background:#16a34a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">✓</div><span style="font-size:11px;color:#475569;">2. DHCP + DNS <button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;margin-left:4px;">edit</button></span></div>
            <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid #16a34a;background:#16a34a10;"><div style="width:20px;height:20px;border-radius:50%;background:#16a34a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">3</div><span style="font-size:11px;font-weight:600;color:#16a34a;">Review</span></div>
            <div style="flex:1;"></div>
            <span style="font-size:10px;color:#16a34a;">ready to create</span>
          </div>
        </div>

        <div style="flex:1;display:flex;background:#f1f5f9;overflow:hidden;">
          <div style="flex:1;padding:28px 40px;overflow-y:auto;">

            <div style="padding:22px;background:linear-gradient(135deg,#1d4ed810,#0ea5e910);border:1px solid #bfdbfe;border-radius:10px;margin-bottom:20px;display:flex;align-items:center;gap:18px;">
              <div style="width:64px;height:64px;border-radius:12px;background:linear-gradient(135deg,#0ea5e9,#1d4ed8);color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:30px;">🌐</div>
              <div style="flex:1;">
                <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;color:#0f172a;font-family:monospace;">prod-vlan-10</h1>
                <div style="display:flex;align-items:center;gap:14px;font-size:12px;color:#475569;">
                  <span><strong style="color:#1d4ed8;">VLAN 10</strong> · Production</span>
                  <span style="color:#cbd5e1;">·</span>
                  <span style="font-family:monospace;font-size:11px;">10.0.10.0/24 · fd00:10::/64</span>
                </div>
                <div style="display:flex;gap:6px;margin-top:6px;">
                  <span style="padding:2px 8px;background:#dbeafe;color:#1d4ed8;border-radius:4px;font-size:10px;font-weight:600;">DHCP on (12h lease)</span>
                  <span style="padding:2px 8px;background:#dbeafe;color:#1d4ed8;border-radius:4px;font-size:10px;font-weight:600;">cloudbsd.lan</span>
                  <span style="padding:2px 8px;background:#16a34a20;color:#16a34a;border-radius:4px;font-size:10px;font-weight:600;">150 free addresses</span>
                </div>
              </div>
              <div style="text-align:right;">
                <div style="font-size:11px;color:#64748b;">Apply time</div>
                <div style="font-size:18px;font-weight:700;color:#0f172a;">~2 seconds</div>
                <div style="font-size:10px;color:#94a3b8;">DHCP daemon reload</div>
              </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
              <div style="padding:16px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><h3 style="font-size:12px;font-weight:700;color:#64748b;letter-spacing:0.06em;margin:0;">SUBNET</h3><button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;">edit</button></div>
                <table style="width:100%;font-size:11px;">
                  <tr><td style="padding:2px 0;color:#64748b;width:35%;">Pool name</td><td style="font-family:monospace;font-weight:600;">prod-vlan-10</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">VLAN</td><td style="font-family:monospace;">10 (Production)</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Family</td><td>IPv4 + IPv6 (dual-stack)</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Domain</td><td style="font-family:monospace;">cloudbsd.lan</td></tr>
                </table>
              </div>

              <div style="padding:16px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><h3 style="font-size:12px;font-weight:700;color:#64748b;letter-spacing:0.06em;margin:0;">ADDRESS RANGES</h3><button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;">edit</button></div>
                <table style="width:100%;font-size:11px;">
                  <tr><td style="padding:2px 0;color:#64748b;width:35%;">IPv4 network</td><td style="font-family:monospace;font-weight:600;">10.0.10.0/24</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Gateway</td><td style="font-family:monospace;">10.0.10.1</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">DHCP range</td><td style="font-family:monospace;">.100 – .200</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">IPv6 prefix</td><td style="font-family:monospace;">fd00:10::/64</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">IPv6 gw</td><td style="font-family:monospace;">fd00:10::1</td></tr>
                </table>
              </div>

              <div style="padding:16px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><h3 style="font-size:12px;font-weight:700;color:#64748b;letter-spacing:0.06em;margin:0;">DNS + DHCP</h3><button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;">edit</button></div>
                <table style="width:100%;font-size:11px;">
                  <tr><td style="padding:2px 0;color:#64748b;width:35%;">DHCP</td><td style="color:#16a34a;font-weight:600;">enabled · 12h lease</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Authoritative</td><td>yes</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Primary DNS</td><td style="font-family:monospace;">10.0.0.53</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Secondary DNS</td><td style="font-family:monospace;">1.1.1.1</td></tr>
                  <tr><td style="padding:2px 0;color:#64748b;">Forwarder</td><td style="font-family:monospace;">9.9.9.9 (Quad9)</td></tr>
                </table>
              </div>

              <div style="padding:16px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><h3 style="font-size:12px;font-weight:700;color:#64748b;letter-spacing:0.06em;margin:0;">STATIC RESERVATIONS</h3><button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;">edit</button></div>
                <table style="width:100%;font-size:11px;">
                  <tr style="background:#f8fafc;"><td style="padding:4px 8px;font-family:monospace;">apc-pdu-01</td><td style="padding:4px 8px;font-family:monospace;">10.0.10.50</td></tr>
                  <tr><td style="padding:4px 8px;font-family:monospace;">ipmi-node-3</td><td style="padding:4px 8px;font-family:monospace;">10.0.10.51</td></tr>
                </table>
              </div>
            </div>

            <div style="padding:14px 16px;background:#1e293b;border-radius:8px;margin-top:14px;">
              <div style="font-size:11px;font-weight:700;color:#94a3b8;letter-spacing:0.06em;margin-bottom:8px;">kea-dhcp4.conf excerpt (will be generated)</div>
              <code style="font-family:monospace;font-size:11px;color:#a5f3fc;line-height:1.6;display:block;white-space:pre-wrap;">subnet4: ["10.0.10.0/24"] {
  pool4: ["10.0.10.100 - 10.0.10.200"]
  option-data: {
    routers: ["10.0.10.1"]
    domain-name-servers: ["10.0.0.53", "1.1.1.1"]
    domain-search: ["cloudbsd.lan"]
  }
  valid-lifetime: 43200
  reservation: [{ hw-address: "00:c0:bf:01:de:ad", ip-address: "10.0.10.50", hostname: "apc-pdu-01" }]
}</code>
            </div>

          </div>

          <div style="width:280px;padding:28px 24px;border-left:1px solid #e2e8f0;background:#ffffff;overflow-y:auto;">
            <div style="padding:14px;background:#16a34a10;border:1px solid #bbf7d0;border-radius:8px;margin-bottom:16px;">
              <div style="font-size:11px;font-weight:700;color:#16a34a;letter-spacing:0.06em;margin-bottom:6px;">READY</div>
              <table style="width:100%;font-size:11px;color:#166534;">
                <tr><td style="padding:3px 0;color:#64748b;">Total v4</td><td style="text-align:right;font-weight:600;">254</td></tr>
                <tr><td style="padding:3px 0;color:#64748b;">DHCP</td><td style="text-align:right;font-weight:600;">101</td></tr>
                <tr><td style="padding:3px 0;color:#64748b;">Static</td><td style="text-align:right;font-weight:600;">2</td></tr>
                <tr><td style="padding:8px 0 0;color:#64748b;border-top:1px solid #bbf7d0;font-weight:700;">Free for ad-hoc</td><td style="padding:8px 0 0;text-align:right;font-weight:700;border-top:1px solid #bbf7d0;">150</td></tr>
              </table>
            </div>
          </div>
        </div>

        <div style="padding:14px 32px;background:#ffffff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <button style="padding:9px 16px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">← Back to DHCP + DNS</button>
          <div style="display:flex;align-items:center;gap:10px;">
            <button style="padding:9px 16px;font-size:12px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">Save as draft</button>
            <button style="padding:11px 26px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:linear-gradient(135deg,#0ea5e9,#1d4ed8);color:#ffffff;cursor:pointer;box-shadow:0 1px 3px rgba(14,165,233,0.4);">+ Create pool prod-vlan-10</button>
          </div>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
