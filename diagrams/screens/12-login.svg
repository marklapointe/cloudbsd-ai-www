<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Login</title>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-gradient-to-br from-slate-900 to-slate-700 text-slate-900 flex flex-col">
      <div class="h-14 flex items-center px-4 text-white">
        <div class="w-8 h-8 rounded bg-blue-600 flex items-center justify-center font-bold">C</div>
        <span class="font-bold text-lg ml-2">CloudBSD Admin</span>
        <span class="ml-3 px-2 py-0.5 text-xs rounded bg-slate-700">freenas-mock.local · CloudBSD 14.2 · build 2026.07.06</span>
      </div>
      <div class="flex-1 flex">
        <div class="flex-1 flex items-center justify-center p-8">
          <div class="bg-white rounded-lg shadow-2xl w-[480px] p-8">
            <div class="text-center mb-6">
              <div class="w-16 h-16 mx-auto mb-3 rounded-2xl bg-blue-600 text-white flex items-center justify-center text-2xl font-bold">C</div>
              <h1 class="text-2xl font-bold">CloudBSD Admin</h1>
              <p class="text-sm text-slate-500 mt-1">Self-hosted control plane for FreeBSD VMs, containers, and jails</p>
            </div>
            <div class="space-y-3">
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Username</label>
                <input type="text" placeholder="mlapointe" class="w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
              </div>
              <div>
                <label class="block text-xs font-medium text-slate-700 mb-1">Password</label>
                <div class="relative">
                  <input type="password" placeholder="••••••••••••" class="w-full px-3 py-2 border border-slate-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10" />
                  <button class="absolute right-2 top-1.5 text-slate-400 text-sm">▲</button>
                </div>
              </div>
              <div class="flex items-center justify-between text-xs">
                <label class="flex items-center gap-2"><input type="checkbox" /><span>Remember this browser</span></label>
                <span class="text-slate-500">Session: 30 min idle</span>
              </div>
              <button class="w-full py-2.5 bg-blue-600 text-white rounded text-sm font-medium hover:bg-blue-700">Sign in</button>
              <div class="relative"><div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div><div class="relative flex justify-center text-xs"><span class="bg-white px-2 text-slate-500">or</span></div></div>
              <button class="w-full py-2 border border-slate-300 rounded text-sm text-slate-700 bg-slate-50">Sign in with passkey</button>
              <a class="block text-center text-xs text-blue-600 hover:underline">Sign in with SSH key</a>
            </div>
            <div class="mt-5 pt-5 border-t">
              <div class="text-xs font-semibold text-slate-500 uppercase mb-2">Multi-factor authentication</div>
              <div class="text-xs text-slate-600 mb-2">OPIE / TOTP</div>
              <div class="flex gap-1.5 justify-center">
                <input type="text" maxlength="1" class="w-10 h-12 text-center text-lg font-mono border border-slate-300 rounded" value="4" />
                <input type="text" maxlength="1" class="w-10 h-12 text-center text-lg font-mono border border-slate-300 rounded" value="9" />
                <input type="text" maxlength="1" class="w-10 h-12 text-center text-lg font-mono border border-slate-300 rounded" value="2" />
                <input type="text" maxlength="1" class="w-10 h-12 text-center text-lg font-mono border border-slate-300 rounded" value="7" />
                <input type="text" maxlength="1" class="w-10 h-12 text-center text-lg font-mono border border-slate-300 rounded" value="1" />
                <input type="text" maxlength="1" class="w-10 h-12 text-center text-lg font-mono border border-slate-300 rounded" value="5" />
              </div>
            </div>
            <div class="mt-4 pt-4 border-t text-xs text-slate-500 space-y-1">
              <div class="flex flex-wrap gap-x-3 gap-y-1">
                <a class="text-blue-600 hover:underline">Forgot password?</a>
                <a class="text-blue-600 hover:underline">Why PAM?</a>
                <a class="text-blue-600 hover:underline">First time setup</a>
                <a class="text-blue-600 hover:underline">Locked out?</a>
                <a class="text-blue-600 hover:underline">Offline recovery</a>
              </div>
              <div class="mt-2 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Backend reachable · 18ms</div>
            </div>
          </div>
        </div>
        <div class="w-[40%] bg-gradient-to-br from-blue-700 via-blue-800 to-slate-900 text-white p-12 flex flex-col justify-between relative overflow-hidden">
          <div class="absolute inset-0 opacity-20">
            <svg viewBox="0 0 400 800" class="w-full h-full">
              <circle cx="100" cy="100" r="80" stroke="white" stroke-width="1" fill="none"/>
              <circle cx="300" cy="200" r="60" stroke="white" stroke-width="1" fill="none"/>
              <circle cx="150" cy="400" r="100" stroke="white" stroke-width="1" fill="none"/>
              <circle cx="280" cy="600" r="70" stroke="white" stroke-width="1" fill="none"/>
              <line x1="100" y1="100" x2="300" y2="200" stroke="white" stroke-width="0.5"/>
              <line x1="300" y1="200" x2="150" y2="400" stroke="white" stroke-width="0.5"/>
              <line x1="150" y1="400" x2="280" y2="600" stroke="white" stroke-width="0.5"/>
            </svg>
          </div>
          <div class="relative z-10">
            <div class="text-4xl font-bold mb-3">CloudBSD</div>
            <div class="text-blue-200 text-lg">v1.0.0 · Initial release</div>
            <p class="mt-4 text-sm text-blue-100">Self-hosted control plane for FreeBSD VMs, containers, and jails. PAM authentication, plugin system, JSONL logging, and 15 themes.</p>
            <a class="inline-block mt-6 px-4 py-2 bg-white/10 hover:bg-white/20 rounded text-sm">Read the release notes →</a>
          </div>
          <div class="relative z-10 text-xs text-blue-200">v1.0.0 · BSD 3-Clause · 2024-2026 CloudBSD Project</div>
        </div>
      </div>
      <div class="h-10 px-4 flex items-center justify-between text-xs text-slate-300 border-t border-slate-700">
        <div class="flex items-center gap-3">
          <span>v1.0.0</span>
          <span>·</span>
          <span>BSD 3-Clause</span>
          <span>·</span>
          <a class="hover:text-white">Privacy</a>
          <span>·</span>
          <a class="hover:text-white">Source</a>
          <span>·</span>
          <a class="hover:text-white">Docs</a>
          <span>·</span>
          <a class="hover:text-white">Status</a>
        </div>
        <span>© 2024-2026 CloudBSD</span>
      </div>
    </div>
  </foreignObject>
</svg>
