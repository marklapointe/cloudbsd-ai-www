<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title>CloudBSD Admin — Login</title>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:linear-gradient(135deg,#0f172a,#1e293b);color:#ffffff;font-size:13px;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;">
      <div style="height:48px;display:flex;align-items:center;padding:0 24px;border-bottom:1px solid rgba(255,255,255,0.1);">
        <div style="width:28px;height:28px;border-radius:5px;background:linear-gradient(135deg,#0ea5e9,#1e40af);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;">C</div>
        <span style="font-weight:700;font-size:15px;margin-left:8px;">CloudBSD Admin</span>
        <span style="margin-left:12px;padding:2px 8px;font-size:11px;border-radius:4px;background:rgba(255,255,255,0.1);color:#cbd5e1;">prod-node-01.local · 14.2</span>
        
      </div>
      <div style="flex:1;display:flex;">
        <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px;">
          <div style="background:#ffffff;border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,0.4);width:440px;padding:32px;color:#0f172a;">
            <div style="text-align:center;margin-bottom:24px;">
              <div style="width:56px;height:56px;margin:0 auto 12px;border-radius:14px;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;">C</div>
              <div style="font-size:20px;font-weight:700;">CloudBSD Admin</div>
              <div style="font-size:12px;color:#64748b;margin-top:4px;">Self-hosted control plane for FreeBSD VMs, containers, jails</div>
            </div>
            <div style="margin-bottom:14px;">
              <label style="display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:4px;">Username</label>
              <input type="text" placeholder="mlapointe" value="mlapointe" style="width:100%;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;padding:9px 12px;box-sizing:border-box;" />
            </div>
            <div style="margin-bottom:14px;">
              <label style="display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:4px;">Password</label>
              <div style="position:relative;">
                <input type="password" placeholder="password" value="password" style="width:100%;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;padding:9px 12px;box-sizing:border-box;" />
                <button style="position:absolute;right:8px;top:8px;background:none;border:0;color:#94a3b8;cursor:pointer;">show</button>
              </div>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;margin-bottom:14px;">
              <label style="display:flex;align-items:center;gap:5px;"><input type="checkbox" checked="checked" /><span>Remember this browser</span></label>
              <span style="color:#64748b;">Session: 30 min idle</span>
            </div>
            <button style="width:100%;padding:10px;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#ffffff;border:0;border-radius:6px;font-weight:600;font-size:13px;cursor:pointer;margin-bottom:14px;">Sign in</button>
            <div style="text-align:center;font-size:11px;color:#94a3b8;margin-bottom:14px;position:relative;"><span style="background:#ffffff;padding:0 10px;position:relative;z-index:1;">or</span><div style="height:1px;background:#e2e8f0;margin-top:-7px;"></div></div>
            <button style="width:100%;padding:8px;background:#f8fafc;color:#334155;border:1px solid #cbd5e1;border-radius:6px;font-size:12px;margin-bottom:8px;">Sign in with passkey</button>
            <div style="text-align:center;font-size:11px;"><a style="color:#2563eb;text-decoration:none;font-weight:600;">Use Touch ID / security key</a></div>
            <div style="margin-top:18px;padding-top:14px;border-top:1px solid #e2e8f0;">
              <div style="font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;margin-bottom:8px;">Multi-factor authentication · OPIE/TOTP</div>
              <div style="display:flex;gap:4px;justify-content:center;"><input type="text" maxlength="1" value="4" style="width:36px;height:42px;text-align:center;font-size:18px;font-family:monospace;border:1px solid #cbd5e1;border-radius:5px;" /><input type="text" maxlength="1" value="9" style="width:36px;height:42px;text-align:center;font-size:18px;font-family:monospace;border:1px solid #cbd5e1;border-radius:5px;" /><input type="text" maxlength="1" value="2" style="width:36px;height:42px;text-align:center;font-size:18px;font-family:monospace;border:1px solid #cbd5e1;border-radius:5px;" /><input type="text" maxlength="1" value="7" style="width:36px;height:42px;text-align:center;font-size:18px;font-family:monospace;border:1px solid #cbd5e1;border-radius:5px;" /><input type="text" maxlength="1" value="1" style="width:36px;height:42px;text-align:center;font-size:18px;font-family:monospace;border:1px solid #cbd5e1;border-radius:5px;" /><input type="text" maxlength="1" value="5" style="width:36px;height:42px;text-align:center;font-size:18px;font-family:monospace;border:1px solid #cbd5e1;border-radius:5px;" /></div>
            </div>
            <div style="margin-top:14px;padding-top:14px;border-top:1px solid #e2e8f0;font-size:10px;color:#64748b;">
              <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px;">
                <a style="color:#2563eb;text-decoration:none;">Forgot password?</a>
                <a style="color:#2563eb;text-decoration:none;">Why PAM?</a>
                <a style="color:#2563eb;text-decoration:none;">First time setup</a>
                <a style="color:#2563eb;text-decoration:none;">Locked out?</a>
              </div>
              <div style="display:flex;align-items:center;gap:5px;color:#059669;"><span style="width:6px;height:6px;border-radius:50%;background:#10b981;"></span>Backend reachable · 18ms</div>
            </div>
          </div>
        </div>
        <div style="width:480px;background:linear-gradient(135deg,#1e40af 0%,#0f172a 100%);padding:60px 48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;">
          <div style="position:absolute;inset:0;opacity:0.15;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 800" preserveAspectRatio="none" style="width:100%;height:100%;">
              <circle cx="80" cy="100" r="100" fill="none" stroke="#60a5fa" stroke-width="1"/>
              <circle cx="380" cy="250" r="70" fill="none" stroke="#60a5fa" stroke-width="1"/>
              <circle cx="180" cy="500" r="120" fill="none" stroke="#60a5fa" stroke-width="1"/>
              <circle cx="400" cy="700" r="80" fill="none" stroke="#60a5fa" stroke-width="1"/>
              <line x1="80" y1="100" x2="380" y2="250" stroke="#60a5fa" stroke-width="0.5"/>
              <line x1="380" y1="250" x2="180" y2="500" stroke="#60a5fa" stroke-width="0.5"/>
              <line x1="180" y1="500" x2="400" y2="700" stroke="#60a5fa" stroke-width="0.5"/>
            </svg>
          </div>
          <div style="position:relative;z-index:1;">
            <div style="font-size:36px;font-weight:700;margin-bottom:8px;">CloudBSD Admin</div>
            <div style="color:#93c5fd;font-size:18px;">v1.0.0 · Initial release</div>
            <div style="margin-top:16px;font-size:13px;color:#cbd5e1;line-height:1.6;">Self-hosted control plane for FreeBSD VMs, containers, and jails. PAM authentication, plugin system, JSONL logging, and 15 themes.</div>
            <button style="margin-top:24px;padding:10px 18px;background:rgba(255,255,255,0.1);color:#ffffff;border:1px solid rgba(255,255,255,0.2);border-radius:6px;font-size:12px;cursor:pointer;">Read the release notes</button>
          </div>
          <div style="position:relative;z-index:1;font-size:10px;color:#93c5fd;">v1.0.0 · BSD 3-Clause · 2024-2026 CloudBSD Project</div>
        </div>
      </div>
      <div style="height:36px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:#64748b;border-top:1px solid rgba(255,255,255,0.1);">
        <div style="display:flex;gap:14px;"><span>v1.0.0</span><span>·</span><span>BSD 3-Clause</span><span>·</span><a style="color:#94a3b8;text-decoration:none;">Privacy</a><a style="color:#94a3b8;text-decoration:none;">Source</a><a style="color:#94a3b8;text-decoration:none;">Docs</a></div>
        <span>(c) 2024-2026 CloudBSD</span>
      </div>
