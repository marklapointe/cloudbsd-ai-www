<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Account Locked</title>
  <foreignObject x="0" y="0" width="1280" height="720">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:720px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">
      
<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:40px;"><div style="width:480px;background:#ffffff;border-radius:10px;border:1px solid #e2e8f0;box-shadow:0 10px 30px rgba(15,23,42,0.08);padding:32px;box-sizing:border-box;height:580px;">
<div style="text-align:center;margin-bottom:24px;">
  <div style="width:64px;height:64px;border-radius:50%;background:#fee2e2;color:#dc2626;display:inline-flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:14px;">⛔</div>
  <h1 style="margin:0 0 6px;font-size:22px;font-weight:700;color:#0f172a;">Account locked</h1>
  <p style="margin:0;font-size:13px;color:#64748b;">Too many failed sign-in attempts. Try again later or contact an admin.</p>
</div>
<div style="background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:14px 16px;margin-bottom:18px;">
  <div style="display:flex;gap:10px;align-items:start;">
    <div style="font-size:18px;color:#d97706;">⏰</div>
    <div style="flex:1;">
      <div style="font-size:13px;font-weight:600;color:#92400e;">Locked for 14 minutes</div>
      <div style="font-size:11px;color:#92400e;margin-top:2px;">Try again at <strong>17:46 UTC</strong> · Attempt 4 of 5</div>
    </div>
  </div>
</div>
<div style="background:#f8fafc;border-radius:8px;padding:14px 16px;margin-bottom:18px;">
  <div style="font-size:12px;font-weight:600;color:#475569;margin-bottom:6px;">Recent failed attempts</div>
  <div style="font-family:monospace;font-size:11px;color:#64748b;line-height:1.6;">
    <div>17:32:18 · 10.0.99.42 · root · invalid password</div>
    <div>17:32:14 · 10.0.99.42 · root · invalid password</div>
    <div>17:32:08 · 10.0.99.42 · root · invalid password</div>
  </div>
</div>
<div style="display:flex;gap:8px;">
  <button style="width:auto;padding:10px 16px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:#1d4ed8;color:#ffffff;cursor:pointer;">Request unlock email</button>
  <button style="padding:10px 16px;font-size:13px;font-weight:500;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;cursor:pointer;">Contact admin</button>
</div>
<div style="margin-top:18px;text-align:center;font-size:11px;color:#94a3b8;">Failed attempts are automatically reported to the security log</div>
</div>
</div>

    </div>
  </foreignObject>
</svg>
