<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Onboarding Join Cluster</title>
  <foreignObject x="0" y="0" width="1280" height="720">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:720px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">
      
<div style="display:flex;flex-direction:column;height:100%;">
  <div style="padding:18px 32px;background:#ffffff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:14px;">
      <span style="display:inline-block;padding:5px 10px;background:linear-gradient(135deg,#0ea5e9,#1e40af);border-radius:5px;color:#ffffff;font-weight:700;font-size:11px;">CloudBSD</span>
      <h2 style="margin:0;font-size:15px;font-weight:600;">Onboarding &#xB7; Join cluster</h2>
    </div>
    <div style="font-size:11px;color:#64748b;">Step 3 of 4 &#xB7; ~2 min remaining</div>
  </div>
  <div style="flex:1;padding:30px 60px;display:flex;gap:30px;">
    <div style="flex:1;background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;padding:24px;">
      <h3 style="margin:0 0 4px;font-size:16px;font-weight:700;">Configure this node</h3>
      <p style="margin:0 0 18px;font-size:12px;color:#64748b;">Bind to LAN interface &#xB7; join existing cluster "prod-cluster"</p>
      <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;letter-spacing:0.03em;">Node hostname</div>
      <input type="text" value="node-02.cluster.local" placeholder="node-02.cluster.local" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;" />
      <div style="height:12px;"></div>
      <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;letter-spacing:0.03em;">LAN interface</div>
      <select style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;"><option>bge0 &#xB7; 10.0.10.42/24 (current)</option><option>bge1 &#xB7; 10.0.11.42/24</option></select>
      <div style="height:12px;"></div>
      <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;letter-spacing:0.03em;">Cluster token</div>
      <div style="display:flex;gap:6px;">
        <input type="text" value="cbs-clstr-..." readonly="readonly" style="flex:1;padding:9px 12px;font-size:13px;font-family:monospace;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;" />
        <button style="padding:9px 14px;font-size:12px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">Paste</button>
      </div>
      <div style="height:18px;"></div>
      <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;letter-spacing:0.03em;">Role</div>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
        <div style="padding:10px;border:1px solid #1d4ed8;border-radius:6px;background:#eff6ff;text-align:center;font-size:12px;color:#1d4ed8;font-weight:600;">Master</div>
        <div style="padding:10px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;text-align:center;font-size:12px;color:#475569;">Backup</div>
        <div style="padding:10px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;text-align:center;font-size:12px;color:#475569;">Worker</div>
      </div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:14px;">
      <div style="background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;padding:18px;">
        <h4 style="margin:0 0 10px;font-size:13px;font-weight:600;">Pre-flight checks</h4>
        <div style="font-size:12px;color:#475569;line-height:1.7;">
          <div>&#x2713; <strong style="color:#10b981">bhyve</strong> kernel module loaded</div>
          <div>&#x2713; <strong style="color:#10b981">ZFS</strong> pool "tank" available (12 TB)</div>
          <div>&#x2713; <strong style="color:#10b981">CARP</strong> configured on interface</div>
          <div>&#x26A0; <strong style="color:#d97706">2FA</strong> key not yet generated for this node</div>
          <div>&#x2717; <strong style="color:#ef4444">GPU</strong> not supported on bge0 (will skip)</div>
        </div>
      </div>
      <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:14px;font-size:11px;color:#1e40af;">
        <strong>After join</strong>: CARP will demote this node from master to backup, with leader election held by node-01 for 30s. Existing VMs stay up. Estimated downtime: 0ms (rolling).
      </div>
    </div>
  </div>
  <div style="padding:18px 32px;background:#ffffff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;">
    <button style="padding:10px 18px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">&#x2190; Back</button>
    <div>
      <button style="padding:10px 18px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;margin-right:6px;">Run dry-run</button>
      <button style="padding:10px 18px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:#1d4ed8;color:#ffffff;">Join cluster &#x2192;</button>
    </div>
  </div>
</div>

    </div>
  </foreignObject>
</svg>
