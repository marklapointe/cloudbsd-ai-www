<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD First-Login Setup Wizard — Step 2 of 3 — Secure your account</title>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">

      <div style="display:flex;flex-direction:column;height:100%;background:#f1f5f9;">
        <div style="padding:18px 32px;background:#ffffff;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:14px;">
            <span style="display:inline-block;padding:5px 10px;background:linear-gradient(135deg,#0ea5e9,#1e40af);border-radius:5px;color:#ffffff;font-weight:700;font-size:11px;">CloudBSD</span>
            <h2 style="margin:0;font-size:15px;font-weight:600;">First login · Secure your account</h2>
            <span style="color:#94a3b8;">/</span>
            <span style="font-size:12px;color:#475569;">Step 2 of 3</span>
          </div>
        </div>

        <div style="padding:0 32px 14px;background:#ffffff;border-bottom:1px solid #e2e8f0;">
          <div style="display:flex;gap:0;align-items:center;">
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;"><div style="width:20px;height:20px;border-radius:50%;background:#16a34a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">✓</div><span style="font-size:11px;color:#475569;">1. Verify <button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;margin-left:4px;">edit</button></span></div>
            <div style="display:flex;align-items:center;color:#16a34a;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid #1d4ed8;background:#1d4ed810;"><div style="width:20px;height:20px;border-radius:50%;background:#1d4ed8;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">2</div><span style="font-size:11px;font-weight:600;color:#1d4ed8;">Secure</span></div>
            <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;"><div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">3</div><span style="font-size:11px;color:#475569;">Tell us</span></div>
          </div>
        </div>

        <div style="flex:1;display:flex;background:#f1f5f9;overflow:hidden;">
          <div style="flex:1;padding:32px 40px;overflow-y:auto;">

            <!-- Set password -->
            <h2 style="margin:0 0 12px;font-size:15px;font-weight:700;color:#0f172a;">1. Set a password (optional — SSH key works too)</h2>
            <div style="padding:18px;background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:22px;">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
                <div>
                  <label style="display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">New password</label>
                  <input type="password" value="················" style="width:100%;padding:9px 12px;border:1px solid #16a34a;border-radius:6px;background:#ffffff;font-size:14px;font-family:monospace;"/>
                  <div style="margin-top:6px;display:flex;gap:6px;align-items:center;">
                    <div style="flex:1;height:5px;background:#e2e8f0;border-radius:3px;overflow:hidden;"><div style="width:100%;height:100%;background:#16a34a;"></div></div>
                    <span style="font-size:11px;font-weight:700;color:#16a34a;">STRONG</span>
                  </div>
                  <div style="font-size:10px;color:#475569;margin-top:4px;">24+ chars · 1 of each class (upper, lower, digit, symbol)</div>
                </div>
                <div>
                  <label style="display:block;font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Confirm password</label>
                  <input type="password" value="················" style="width:100%;padding:9px 12px;border:1px solid #16a34a;border-radius:6px;background:#ffffff;font-size:14px;font-family:monospace;"/>
                  <div style="font-size:10px;color:#16a34a;margin-top:6px;line-height:1.4;">✓ Matches</div>
                </div>
              </div>
            </div>

            <!-- Enable 2FA -->
            <h2 style="margin:8px 0 12px;font-size:15px;font-weight:700;color:#0f172a;">2. Enable 2FA (strongly recommended for admin accounts)</h2>
            <div style="padding:18px;background:linear-gradient(135deg,#eef2ff,#dbeafe);border:1px solid #c7d2fe;border-radius:10px;margin-bottom:18px;">
              <div style="display:flex;align-items:flex-start;gap:16px;">
                <div style="font-size:42px;">📱</div>
                <div style="flex:1;">
                  <div style="font-size:14px;font-weight:700;color:#312e81;margin-bottom:6px;">Scan with your authenticator app</div>
                  <div style="font-size:11px;color:#4338ca;line-height:1.5;margin-bottom:14px;">1Password, Bitwarden, Authy, Google Authenticator, etc. The QR code below contains your secret.</div>
                  <div style="display:flex;align-items:center;gap:18px;">
                    <div style="background:#ffffff;padding:14px;border-radius:6px;border:1px solid #c7d2fe;">
                      <!-- QR placeholder -->
                      <div style="width:120px;height:120px;background:repeating-linear-gradient(45deg,#0f172a 0,#0f172a 4px,#ffffff 4px,#ffffff 8px,#0f172a 8px,#0f172a 10px,#ffffff 10px,#ffffff 14px);background-size:12px 12px;position:relative;">
                        <div style="position:absolute;inset:8px;background:#ffffff;border:6px solid #0f172a;"></div>
                        <div style="position:absolute;inset:18px;background:#0f172a;"></div>
                      </div>
                    </div>
                    <div style="flex:1;">
                      <div style="font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;margin-bottom:6px;">OR ENTER MANUALLY</div>
                      <div style="font-family:monospace;font-size:13px;color:#0f172a;font-weight:600;background:#ffffff;padding:10px;border-radius:5px;border:1px solid #c7d2fe;word-break:break-all;">JBSWY3DPEHPK3PXP mlapointe@cloudbsd</div>
                      <div style="font-size:10px;color:#64748b;margin-top:4px;">Issuer: CloudBSD · Account: mlapointe@cloudbsd · Algorithm: SHA1</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Verification -->
            <div style="padding:14px 18px;background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;">
              <label style="display:block;font-size:12px;font-weight:700;color:#0f172a;margin-bottom:6px;">Enter 6-digit code from your app</label>
              <div style="display:flex;gap:8px;">
                <input value="4" style="width:48px;height:54px;border:1px solid #cbd5e1;border-radius:6px;text-align:center;font-family:monospace;font-size:24px;font-weight:700;"/>
                <input value="2" style="width:48px;height:54px;border:1px solid #cbd5e1;border-radius:6px;text-align:center;font-family:monospace;font-size:24px;font-weight:700;"/>
                <input value="9" style="width:48px;height:54px;border:1px solid #cbd5e1;border-radius:6px;text-align:center;font-family:monospace;font-size:24px;font-weight:700;"/>
                <input value="1" style="width:48px;height:54px;border:1px solid #cbd5e1;border-radius:6px;text-align:center;font-family:monospace;font-size:24px;font-weight:700;"/>
                <input value="8" style="width:48px;height:54px;border:1px solid #cbd5e1;border-radius:6px;text-align:center;font-family:monospace;font-size:24px;font-weight:700;"/>
                <input value="3" style="width:48px;height:54px;border:1px solid #16a34a;border-radius:6px;background:#dcfce7;text-align:center;font-family:monospace;font-size:24px;font-weight:700;color:#16a34a;"/>
                <div style="flex:1;"></div>
                <span style="display:inline-flex;align-items:center;font-size:11px;color:#16a34a;font-weight:700;padding:8px 14px;background:#dcfce7;border-radius:5px;">✓ Verified</span>
              </div>
              <div style="font-size:11px;color:#475569;margin-top:8px;line-height:1.4;">Code verified. You can now generate recovery codes in the next step.</div>
            </div>

          </div>

          <div style="width:280px;padding:28px 24px;border-left:1px solid #e2e8f0;background:#ffffff;overflow-y:auto;">
            <div style="padding:14px;background:#16a34a10;border:1px solid #bbf7d0;border-radius:8px;margin-bottom:16px;">
              <div style="font-size:11px;font-weight:700;color:#16a34a;letter-spacing:0.06em;margin-bottom:8px;">SECURITY PROGRESS</div>
              <table style="width:100%;font-size:11px;color:#166534;">
                <tr><td style="padding:3px 0;">Password</td><td style="text-align:right;font-weight:700;color:#16a34a;">✓ strong</td></tr>
                <tr><td style="padding:3px 0;">SSH key</td><td style="text-align:right;font-weight:700;color:#16a34a;">✓ set</td></tr>
                <tr><td style="padding:3px 0;">2FA</td><td style="text-align:right;font-weight:700;color:#16a34a;">✓ verified</td></tr>
                <tr><td style="padding:8px 0 0;color:#64748b;border-top:1px solid #bbf7d0;font-weight:700;">Recovery codes</td><td style="padding:8px 0 0;text-align:right;font-weight:700;border-top:1px solid #bbf7d0;color:#d97706;">→ next</td></tr>
              </table>
            </div>
            <div style="padding:14px;background:#fef3c7;border:1px solid #fde68a;border-radius:8px;">
              <div style="font-size:11px;font-weight:700;color:#92400e;letter-spacing:0.06em;margin-bottom:6px;">WHY 2FA</div>
              <div style="font-size:11px;color:#78350f;line-height:1.5;">Without 2FA, an attacker with your password gets full admin on the cluster. With 2FA, they also need physical access to your phone.</div>
            </div>
          </div>
        </div>

        <div style="padding:14px 32px;background:#ffffff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <button style="padding:9px 16px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">← Back to Verify</button>
          <button style="padding:10px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:linear-gradient(135deg,#1d4ed8,#16a34a);color:#ffffff;">Save and generate recovery codes →</button>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
