                  <tr class="hover:bg-slate-50"><td class="px-2 py-1.5 font-medium">syncthing</td><td class="px-2 py-1.5"><span class="inline-flex items-center gap-1 px-1.5 rounded-full text-[10px] font-medium bg-emerald-50 text-emerald-700"><span class="text-emerald-500">●</span>RUN</span></td><td class="px-2 py-1.5">FreeBSD 14.2</td><td class="px-2 py-1.5 font-mono text-[10px]">syncthing.lan</td><td class="px-2 py-1.5 font-mono text-[10px]">10.0.10.22</td><td class="px-2 py-1.5 text-right tabular-nums">1</td><td class="px-2 py-1.5 text-right tabular-nums">512 MB</td><td class="px-2 py-1.5 text-right tabular-nums">10 GB</td><td class="px-2 py-1.5"><div class="h-1.5 bg-slate-100 rounded-full overflow-hidden w-16"><div class="h-full bg-blue-500" style="width:28%"></div></div><span class="ml-1 text-[10px] tabular-nums">28%</span></td><td class="px-2 py-1.5 text-right tabular-nums">32d 03:11</td><td class="px-2 py-1.5 text-right tabular-nums text-slate-500">4</td></tr>
