<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Jails</title>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900">
      <g id="header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 px-2 py-0.5 text-xs rounded bg-slate-100 text-slate-600">freenas-mock.local</span>
          </div>
          <div class="ml-auto flex items-center gap-4">
            <span class="text-sm text-slate-500 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>backend OK · 18ms</span>
            <button class="text-sm text-slate-600">Refresh</button>
            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-medium">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(800px - 56px)">
        <g id="sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded text-slate-700">Dashboard</a>
              <a class="block px-3 py-2 rounded text-slate-700">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-slate-700">Containers</a>
              <a class="block px-3 py-2 rounded bg-blue-50 text-blue-700 font-medium">Jails</a>
              <a class="block px-3 py-2 rounded text-slate-700">Volumes</a>
              <a class="block px-3 py-2 rounded text-slate-700">Network Map</a>
              <a class="block px-3 py-2 rounded text-slate-700">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Admin</div>
              <a class="block px-3 py-2 rounded text-slate-700">Users</a>
              <a class="block px-3 py-2 rounded text-slate-700">Logs</a>
              <a class="block px-3 py-2 rounded text-slate-700">Notifications</a>
              <a class="block px-3 py-2 rounded text-slate-700">Settings</a>
              <a class="block px-3 py-2 rounded text-slate-700">Status</a>
              <a class="block px-3 py-2 rounded text-slate-700">About</a>
