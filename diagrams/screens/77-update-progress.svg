          <div><span style="color:#475569;">17:32:25</span> <span style="color:#64748b;font-weight:700;">INFO</span> <span style="color:#334155;">stopping cloudbsd service on node-01</span></div>
          <div><span style="color:#475569;">17:32:28</span> <span style="color:#64748b;font-weight:700;">INFO</span> <span style="color:#334155;">running migration scripts...</span></div>
          <div><span style="color:#475569;">17:32:38</span> <span style="color:#64748b;font-weight:700;">INFO</span> <span style="color:#334155;">plugin manifest v2 migration: 4 plugins</span></div>
          <div><span style="color:#475569;">17:34:02</span> <span style="color:#64748b;font-weight:700;">INFO</span> <span style="color:#334155;">starting cloudbsd service on node-01</span></div>
          <div><span style="color:#475569;">17:34:14</span> <span style="color:#64748b;font-weight:700;">INFO</span> <span style="color:#334155;">running post-upgrade validations</span></div>
          <div><span style="color:#475569;">17:35:01</span> <span style="color:#64748b;font-weight:700;">INFO</span> <span style="color:#334155;">API reconnected</span></div>
          <div><span style="color:#475569;">17:35:14</span> <span style="color:#d97706;font-weight:700;">WARN</span> <span style="color:#334155;">plugin 'smtp-notifier' deprecated, will update later</span></div>
          <div><span style="color:#475569;">17:36:02</span> <span style="color:#64748b;font-weight:700;">INFO</span> <span style="color:#334155;">node-01 ready for failover back</span></div>

        </div>
      </div>

      <div style="background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;padding:18px;">
