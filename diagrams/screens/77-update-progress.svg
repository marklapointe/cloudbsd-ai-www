          <div><span style="color:#475569;">17:31:25</span> <span style="color:#64748b;font-weight:700;">INFO</span> <span style="color:#334155;">node-02 is now master (VIP 10.0.10.50 moved)</span></div>
          <div><span style="color:#475569;">17:31:42</span> <span style="color:#64748b;font-weight:700;">INFO</span> <span style="color:#334155;">downloading v1.4.4 release tarball (4.2 GB)</span></div>
          <div><span style="color:#475569;">17:31:48</span> <span style="color:#64748b;font-weight:700;">INFO</span> <span style="color:#334155;">verifying SHA512 signature</span></div>
