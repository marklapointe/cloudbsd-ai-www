<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Virtual Machines</title>
  <desc>View-only VM listing. No start/stop/delete buttons per Angular migration scope.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900">
      <g id="header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 px-2 py-0.5 text-xs rounded bg-slate-100 text-slate-600">freenas-mock.local</span>
          </div>
          <div class="ml-auto flex items-center gap-4">
            <span class="text-sm text-slate-500">Theme: CloudBSD</span>
            <button class="text-sm text-slate-600 hover:text-slate-900">Refresh</button>
            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-medium">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Dashboard</a>
              <a class="block px-3 py-2 rounded bg-blue-50 text-blue-700 font-medium">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Containers</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Jails</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Volumes</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Network Map</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Admin</div>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Users</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Logs</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Notifications</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Settings</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Status</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">About</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 p-6 overflow-auto">
          <g id="content" class="contents">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h1 class="text-2xl font-bold">Virtual Machines</h1>
                <p class="text-sm text-slate-500">Read-only inventory · lifecycle actions disabled in this milestone</p>
              </div>
              <div class="flex items-center gap-2">
                <input type="text" placeholder="Filter by name…" class="text-sm border border-slate-300 rounded px-3 py-1.5 w-56 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <select class="text-sm border border-slate-300 rounded px-2 py-1.5">
                  <option>All states</option>
                  <option>Running</option>
                  <option>Stopped</option>
                </select>
              </div>
            </div>
            <div class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
              <table class="w-full text-sm">
                <thead class="bg-slate-50 text-slate-600">
                  <tr>
                    <th class="text-left font-medium px-4 py-2">Name</th>
                    <th class="text-left font-medium px-4 py-2">State</th>
                    <th class="text-left font-medium px-4 py-2">vCPU</th>
                    <th class="text-left font-medium px-4 py-2">Memory</th>
                    <th class="text-left font-medium px-4 py-2">Disk</th>
                    <th class="text-left font-medium px-4 py-2">Uptime</th>
                    <th class="text-left font-medium px-4 py-2">Autostart</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  <tr class="hover:bg-slate-50">
                    <td class="px-4 py-2 font-medium text-slate-900">nextcloud</td>
                    <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs bg-emerald-50 text-emerald-700">RUNNING</span></td>
                    <td class="px-4 py-2 text-slate-700">4</td>
                    <td class="px-4 py-2 text-slate-700">8.0 GB</td>
                    <td class="px-4 py-2 text-slate-700">120 GB</td>
                    <td class="px-4 py-2 text-slate-700">14d 02:11</td>
                    <td class="px-4 py-2 text-slate-700">yes</td>
                  </tr>
                  <tr class="hover:bg-slate-50">
                    <td class="px-4 py-2 font-medium text-slate-900">homeassistant</td>
                    <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs bg-emerald-50 text-emerald-700">RUNNING</span></td>
                    <td class="px-4 py-2 text-slate-700">2</td>
                    <td class="px-4 py-2 text-slate-700">4.0 GB</td>
                    <td class="px-4 py-2 text-slate-700">32 GB</td>
                    <td class="px-4 py-2 text-slate-700">8d 18:42</td>
                    <td class="px-4 py-2 text-slate-700">yes</td>
                  </tr>
                  <tr class="hover:bg-slate-50">
                    <td class="px-4 py-2 font-medium text-slate-900">jellyfin</td>
                    <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs bg-emerald-50 text-emerald-700">RUNNING</span></td>
                    <td class="px-4 py-2 text-slate-700">6</td>
                    <td class="px-4 py-2 text-slate-700">12.0 GB</td>
                    <td class="px-4 py-2 text-slate-700">500 GB</td>
                    <td class="px-4 py-2 text-slate-700">22d 06:00</td>
                    <td class="px-4 py-2 text-slate-700">yes</td>
                  </tr>
                  <tr class="hover:bg-slate-50">
                    <td class="px-4 py-2 font-medium text-slate-900">postgres-dev</td>
                    <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs bg-slate-100 text-slate-600">STOPPED</span></td>
                    <td class="px-4 py-2 text-slate-700">2</td>
                    <td class="px-4 py-2 text-slate-700">4.0 GB</td>
                    <td class="px-4 py-2 text-slate-700">80 GB</td>
                    <td class="px-4 py-2 text-slate-700">—</td>
                    <td class="px-4 py-2 text-slate-700">no</td>
                  </tr>
                  <tr class="hover:bg-slate-50">
                    <td class="px-4 py-2 font-medium text-slate-900">win11-sandbox</td>
                    <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs bg-amber-50 text-amber-700">PAUSED</span></td>
                    <td class="px-4 py-2 text-slate-700">4</td>
                    <td class="px-4 py-2 text-slate-700">8.0 GB</td>
                    <td class="px-4 py-2 text-slate-700">100 GB</td>
                    <td class="px-4 py-2 text-slate-700">0d 04:18</td>
                    <td class="px-4 py-2 text-slate-700">no</td>
                  </tr>
                </tbody>
              </table>
              <div class="flex items-center justify-between px-4 py-2 text-sm text-slate-500 border-t border-slate-100">
                <div>5 of 5 VMs shown</div>
                <div class="flex items-center gap-2">
                  <span>Read-only mode</span>
                  <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-600 text-xs">No actions</span>
                </div>
              </div>
            </div>
            <div class="mt-4 grid grid-cols-3 gap-4">
              <div class="bg-white rounded-lg p-3 border border-slate-200 text-sm">
                <div class="text-slate-500">Allocated vCPU</div>
                <div class="text-xl font-semibold mt-1">18 / 32</div>
              </div>
              <div class="bg-white rounded-lg p-3 border border-slate-200 text-sm">
                <div class="text-slate-500">Allocated Memory</div>
                <div class="text-xl font-semibold mt-1">36 / 64 GB</div>
              </div>
              <div class="bg-white rounded-lg p-3 border border-slate-200 text-sm">
                <div class="text-slate-500">Thin-provisioned disk</div>
                <div class="text-xl font-semibold mt-1">832 GB</div>
              </div>
            </div>
          </g>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>