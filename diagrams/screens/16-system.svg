            <a href="#updates" style="padding:14px 20px;font-size:13px;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;text-decoration:none;display:block;">Updates</a>
          </div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px;">
            <div style="background:#ffffff;border-radius:10px;border:1px solid #e2e8f0;padding:18px;"><div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:8px;">Last backup</div><div style="font-size:14px;font-weight:700;color:#0f172a;">daily-tank-data</div><div style="font-size:11px;color:#94a3b8;margin-top:6px;">12:42:18Z · <span style="padding:1px 6px;background:#d1fae5;color:#10b981;border-radius:3px;font-weight:600;">healthy</span></div></div>
            <div style="background:#ffffff;border-radius:10px;border:1px solid #e2e8f0;padding:18px;"><div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:8px;">Storage used</div><div style="font-size:18px;font-weight:700;color:#0f172a;">4.2 TB / 8 TB</div><div style="height:6px;background:#f1f5f9;border-radius:3px;margin-top:10px;overflow:hidden;"><div style="width:52%;height:100%;background:linear-gradient(90deg,#10b981,#0ea5e9);"></div></div><div style="font-size:11px;color:#94a3b8;margin-top:6px;">52% used</div></div>
            <div style="background:#ffffff;border-radius:10px;border:1px solid #e2e8f0;padding:18px;"><div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:8px;">Updates available</div><div style="font-size:24px;font-weight:700;color:#0f172a;">3</div><div style="font-size:11px;color:#94a3b8;margin-top:6px;">Latest: v14.3.0 stable</div></div>
          </div>
          <div style="background:#ffffff;border-radius:10px;border:1px solid #e2e8f0;padding:18px;">
            <h2 style="margin:0 0 14px;font-size:14px;font-weight:700;color:#0f172a;">Open a section</h2>
