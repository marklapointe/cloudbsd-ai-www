              <a href="#exports" style="text-decoration:none;display:block;padding:16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;cursor:pointer;"><div style="font-size:13px;font-weight:700;color:#0f172a;">Export data</div><div style="font-size:11px;color:#64748b;margin-top:6px;">Configuration, logs, activity, cluster state, themes, GPUs, network</div><div style="font-size:11px;color:#3b82f6;margin-top:8px;font-weight:600;">Open Exports →</div></a>
              <a href="#stats" style="text-decoration:none;display:block;padding:16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;cursor:pointer;"><div style="font-size:13px;font-weight:700;color:#0f172a;">System statistics</div><div style="font-size:11px;color:#64748b;margin-top:6px;">12 stat cards + 4 sparkline time-series (24h / 7d / 30d)</div><div style="font-size:11px;color:#3b82f6;margin-top:8px;font-weight:600;">Open Stats →</div></a>
              <a href="#history" style="text-decoration:none;display:block;padding:16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;cursor:pointer;"><div style="font-size:13px;font-weight:700;color:#0f172a;">Event history</div><div style="font-size:11px;color:#64748b;margin-top:6px;">50 most recent events with type/severity filters</div><div style="font-size:11px;color:#3b82f6;margin-top:8px;font-weight:600;">Open History →</div></a>
              <a href="#audit" style="text-decoration:none;display:block;padding:16px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;cursor:pointer;"><div style="font-size:13px;font-weight:700;color:#0f172a;">Audit log</div><div style="font-size:11px;color:#64748b;margin-top:6px;">10 admin actions · backups, exports, settings, user changes</div><div style="font-size:11px;color:#3b82f6;margin-top:8px;font-weight:600;">Open Audit Log →</div></a>
