  <div style="font-size:10px;color:#94a3b8;margin-top:4px;">Enter your existing password</div>
</div>

      
<div style="margin-bottom:18px;">
  <div style="font-size:12px;font-weight:600;color:#0f172a;margin-bottom:6px;">New password</div>
