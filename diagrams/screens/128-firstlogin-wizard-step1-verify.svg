<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD First-Login Setup Wizard — Step 1 of 4 — Verify identity</title>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">

      <div style="display:flex;flex-direction:column;height:100%;background:#f1f5f9;">
        <div style="padding:18px 32px;background:#ffffff;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:14px;">
            <span style="display:inline-block;padding:5px 10px;background:linear-gradient(135deg,#0ea5e9,#1e40af);border-radius:5px;color:#ffffff;font-weight:700;font-size:11px;">CloudBSD</span>
            <h2 style="margin:0;font-size:15px;font-weight:600;">First login · Verify identity</h2>
            <span style="color:#94a3b8;">/</span>
            <span style="font-size:12px;color:#475569;">Step 1 of 4</span>
          </div>
          <button style="padding:6px 12px;font-size:11px;border:none;border-radius:4px;background:transparent;color:#64748b;">Skip</button>
        </div>

        <div style="padding:0 32px 14px;background:#ffffff;border-bottom:1px solid #e2e8f0;">
          <div style="display:flex;gap:0;align-items:center;">
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid #1d4ed8;background:#1d4ed810;"><div style="width:20px;height:20px;border-radius:50%;background:#1d4ed8;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">1</div><span style="font-size:11px;font-weight:600;color:#1d4ed8;">Verify</span></div>
            <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;"><div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">2</div><span style="font-size:11px;color:#475569;">Secure</span></div>
            <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;"><div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">3</div><span style="font-size:11px;color:#475569;">Tell us</span></div><div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">&#8212;</div><div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;"><div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">4</div><span style="font-size:11px;color:#475569;">Codes</span></div>
          </div>
        </div>

        <div style="flex:1;display:flex;background:#f1f5f9;overflow:hidden;">
          <div style="flex:1;padding:32px 40px;overflow-y:auto;">

            <h1 style="margin:0 0 8px;font-size:24px;font-weight:700;color:#0f172a;">Welcome, mlapointe. Let's verify it's really you.</h1>
            <p style="margin:0 0 24px;font-size:13px;color:#475569;max-width:680px;line-height:1.55;">This is the first time you've signed in. Confirm your contact info before enabling any of the security features.</p>

            <div style="padding:20px;background:#ffffff;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:18px;">
              <div style="font-size:11px;font-weight:700;color:#64748b;letter-spacing:0.08em;margin-bottom:14px;">PROFILE</div>
              <table style="width:100%;font-size:13px;">
                <tr><td style="padding:8px 0;color:#64748b;width:35%;">Username</td><td style="font-family:monospace;font-weight:600;">mlapointe</td></tr>
                <tr><td style="padding:8px 0;color:#64748b;">UID</td><td style="font-family:monospace;color:#475569;">1014</td></tr>
                <tr><td style="padding:8px 0;color:#64748b;">Group</td><td style="font-family:monospace;">admin (0001)</td></tr>
                <tr><td style="padding:8px 0;color:#64748b;">Display name</td><td><input value="Matthew Lapointe" style="width:100%;padding:6px 10px;border:1px solid #cbd5e1;border-radius:5px;font-size:13px;"/></td></tr>
                <tr><td style="padding:8px 0;color:#64748b;">Email</td><td><input value="alex.kim@example.lan" style="width:100%;padding:6px 10px;border:1px solid #cbd5e1;border-radius:5px;font-size:13px;font-family:monospace;"/></td></tr>
                <tr><td style="padding:8px 0;color:#64748b;">Phone</td><td><input value="+1 514-555-0184" style="width:100%;padding:6px 10px;border:1px solid #cbd5e1;border-radius:5px;font-size:13px;font-family:monospace;"/></td></tr>
                <tr><td style="padding:8px 0;color:#64748b;">Timezone</td><td><select style="width:100%;padding:6px 10px;border:1px solid #cbd5e1;border-radius:5px;font-size:13px;background:#ffffff;"><option>America/Montreal</option><option>UTC</option></select></td></tr>
                <tr><td style="padding:8px 0;color:#64748b;">Preferred language</td><td><select style="width:100%;padding:6px 10px;border:1px solid #cbd5e1;border-radius:5px;font-size:13px;background:#ffffff;"><option>English (US)</option><option>Français (CA)</option></select></td></tr>
              </table>
            </div>

            <div style="padding:18px;background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;">
              <div style="font-size:11px;font-weight:700;color:#312e81;letter-spacing:0.08em;margin-bottom:12px;">SSH PUBLIC KEY</div>
              <div style="font-family:monospace;font-size:11px;color:#1e293b;background:#ffffff;padding:12px;border-radius:6px;line-height:1.55;border:1px solid #c7d2fe;word-break:break-all;">
                ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMqqnkVzAM0T2a... mlapointe@lapointe-laptop
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11px;color:#475569;">
                <span>Added 14 days ago · last used: today · fingerprint: <code style="background:#ffffff;padding:1px 5px;border-radius:3px;font-family:monospace;">SHA256:qrvM3...jk</code></span>
                <button style="padding:5px 12px;font-size:11px;border:1px solid #c7d2fe;border-radius:4px;background:#ffffff;color:#312e81;">Add another key</button>
              </div>
            </div>

          </div>

          <div style="width:280px;padding:28px 24px;border-left:1px solid #e2e8f0;background:#ffffff;overflow-y:auto;">
            <div style="padding:14px;background:#1d4ed810;border:1px solid #bfdbfe;border-radius:8px;margin-bottom:16px;">
              <div style="font-size:11px;font-weight:700;color:#1d4ed8;letter-spacing:0.06em;margin-bottom:6px;">RECOMMENDED</div>
              <div style="font-size:13px;color:#1e3a8a;font-weight:700;">Verify everything first</div>
              <div style="font-size:11px;color:#475569;margin-top:6px;line-height:1.5;">Other admins can reset your password if you lock yourself out — but they can NOT reset your recovery codes or SSH keys. Set those up first.</div>
            </div>
            <div style="padding:14px;background:#fef3c7;border:1px solid #fde68a;border-radius:8px;">
              <div style="font-size:11px;font-weight:700;color:#92400e;letter-spacing:0.06em;margin-bottom:6px;">CHECK YOUR PHONE</div>
              <div style="font-size:11px;color:#78350f;line-height:1.5;">Confirming your phone enables SMS-based 2FA as a backup for authenticator apps. Standard rates apply to inbound messages.</div>
            </div>
          </div>
        </div>

        <div style="padding:14px 32px;background:#ffffff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <button style="padding:9px 16px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;" disabled="disabled">← Back</button>
          <button style="padding:10px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:#1d4ed8;color:#ffffff;">Looks right → Secure</button>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
