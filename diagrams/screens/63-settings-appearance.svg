        <div style="font-size:11px;color:#475569;margin-bottom:8px;">~8 rows visible</div>
        <div style="font-size:11px;color:#475569;">default · most readable</div>
      </div>
      <div style="flex:1;padding:14px;border:2px solid #1d4ed8;border-radius:6px;background:#eff6ff;">
        <div style="font-weight:600;font-size:13px;color:#0f172a;margin-bottom:6px;">Compact</div>
        <div style="font-size:11px;color:#475569;margin-bottom:8px;">~20 rows visible</div>
        <div style="font-size:11px;color:#475569;">power user · 20 rows</div>
      </div>
      <div style="flex:1;padding:14px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;">
        <div style="font-weight:600;font-size:13px;color:#0f172a;margin-bottom:6px;">Extra</div>
        <div style="font-size:11px;color:#475569;margin-bottom:8px;">~30 rows visible</div>
        <div style="font-size:11px;color:#475569;">monitoring · 30 rows (monospace)</div>
      </div>
    </div>
    <div style="font-size:11px;color:#64748b;">Persisted per-user in localStorage · synced across tabs via BroadcastChannel</div>
  </div>

  <div style="background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;padding:24px;">
    <h4 style="margin:0 0 14px;font-size:13px;font-weight:700;color:#1d4ed8;text-transform:uppercase;letter-spacing:0.06em;">Typography</h4>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;">

      <div>
        <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Font family</div>
        <select style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:5px;background:#ffffff;color:#0f172a;"><option>System default</option></select>
        <div style="font-size:10px;color:#94a3b8;margin-top:3px;">-apple-system / Segoe UI / Inter</div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Font size base</div>
        <select style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:5px;background:#ffffff;color:#0f172a;"><option>14px</option></select>
        <div style="font-size:10px;color:#94a3b8;margin-top:3px;">12-16px range</div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Monospace family</div>
        <select style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:5px;background:#ffffff;color:#0f172a;"><option>ui-monospace</option></select>
        <div style="font-size:10px;color:#94a3b8;margin-top:3px;">SFMono-Regular / Menlo</div>
      </div>
    </div>
  </div>
