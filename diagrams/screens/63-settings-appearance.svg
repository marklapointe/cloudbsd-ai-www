  <div style="font-size:10px;color:#64748b;line-height:1.3;">Cluster IP, DNS, NTP servers</div>
</div>
<div style="padding:9px 12px;border-radius:5px;background:transparent;margin-bottom:4px;display:flex;flex-direction:column;gap:2px;">
