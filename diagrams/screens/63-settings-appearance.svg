  <div style="font-size:10px;color:#bfdbfe;line-height:1.3;">Theme, density, font size</div>
</div>
<div style="padding:9px 12px;border-radius:5px;background:transparent;margin-bottom:4px;display:flex;flex-direction:column;gap:2px;">
  <div style="font-size:12px;font-weight:500;color:#cbd5e1;">API Keys</div>
  <div style="font-size:10px;color:#64748b;line-height:1.3;">Personal access tokens</div>
</div>
<div style="padding:9px 12px;border-radius:5px;background:transparent;margin-bottom:4px;display:flex;flex-direction:column;gap:2px;">
  <div style="font-size:12px;font-weight:500;color:#cbd5e1;">Webhooks</div>
  <div style="font-size:10px;color:#64748b;line-height:1.3;">Outbound event notifications</div>
</div>
<div style="padding:9px 12px;border-radius:5px;background:transparent;margin-bottom:4px;display:flex;flex-direction:column;gap:2px;">
