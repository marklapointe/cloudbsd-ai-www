            <div style="width:12px;height:12px;border-radius:50%;background:#f59e0b;"></div>
            <div style="font-family:monospace;font-size:8px;color:#cbd5e1;background:rgba(255,255,255,0.1);padding:1px 4px;border-radius:2px;">ulid-2k3</div>
          </div>
          <div style="font-family:monospace;font-size:11px;color:#cbd5e1;padding:1px 4px;">VM:bhyve</div>
        </div>
        <div style="padding:10px 14px;border-top:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.2);">
          <div style="font-size:12px;font-weight:600;color:#ffffff;">revytech</div>
          <div style="font-size:10px;color:#94a3b8;">default</div>
        </div>
        <div style="position:absolute;top:8px;right:8px;background:#1d4ed8;color:#ffffff;padding:2px 7px;border-radius:9999px;font-size:9px;font-weight:700;">active</div>
      </div>
      <div style="position:relative;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden;cursor:pointer;background:#0a0f0a;">
        <div style="padding:18px;">
          <div style="width:60px;height:38px;background:#22ff8c;border-radius:6px;margin-bottom:12px;"></div>
          <div style="display:flex;gap:4px;align-items:center;margin-bottom:12px;">
            <div style="width:12px;height:12px;border-radius:50%;background:#22ff8c;"></div>
            <div style="width:12px;height:12px;border-radius:50%;background:#ffaa00;"></div>
            <div style="font-family:monospace;font-size:8px;color:#cbd5e1;background:rgba(255,255,255,0.1);padding:1px 4px;border-radius:2px;">ulid-2k3</div>
          </div>
          <div style="font-family:monospace;font-size:11px;color:#cbd5e1;padding:1px 4px;">VM:bhyve</div>
        </div>
        <div style="padding:10px 14px;border-top:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.2);">
          <div style="font-size:12px;font-weight:600;color:#ffffff;">phosphor-crt</div>
          <div style="font-size:10px;color:#94a3b8;">retro CRT</div>
        </div>
        
      </div>
      <div style="position:relative;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden;cursor:pointer;background:#f8fafc;">
        <div style="padding:18px;">
          <div style="width:60px;height:38px;background:#ffffff;border-radius:6px;margin-bottom:12px;"></div>
          <div style="display:flex;gap:4px;align-items:center;margin-bottom:12px;">
            <div style="width:12px;height:12px;border-radius:50%;background:#475569;"></div>
            <div style="width:12px;height:12px;border-radius:50%;background:#94a3b8;"></div>
            <div style="font-family:monospace;font-size:8px;color:#475569;background:#f1f5f9;padding:1px 4px;border-radius:2px;">ulid-2k3</div>
          </div>
          <div style="font-family:monospace;font-size:11px;color:#0f172a;padding:1px 4px;">VM:bhyve</div>
        </div>
        <div style="padding:10px 14px;border-top:1px solid #e2e8f0;background:#f8fafc;">
          <div style="font-size:12px;font-weight:600;color:#0f172a;">paper-light</div>
          <div style="font-size:10px;color:#64748b;">high contrast</div>
        </div>
        
      </div>
      <div style="position:relative;border:1px solid #cbd5e1;border-radius:8px;overflow:hidden;cursor:pointer;background:#1e1b4b;">
        <div style="padding:18px;">
          <div style="width:60px;height:38px;background:#fb7185;border-radius:6px;margin-bottom:12px;"></div>
          <div style="display:flex;gap:4px;align-items:center;margin-bottom:12px;">
            <div style="width:12px;height:12px;border-radius:50%;background:#a78bfa;"></div>
            <div style="width:12px;height:12px;border-radius:50%;background:#fde047;"></div>
            <div style="font-family:monospace;font-size:8px;color:#cbd5e1;background:rgba(255,255,255,0.1);padding:1px 4px;border-radius:2px;">ulid-2k3</div>
          </div>
          <div style="font-family:monospace;font-size:11px;color:#cbd5e1;padding:1px 4px;">VM:bhyve</div>
        </div>
        <div style="padding:10px 14px;border-top:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.2);">
          <div style="font-size:12px;font-weight:600;color:#ffffff;">midnight-coral</div>
          <div style="font-size:10px;color:#94a3b8;">warm dark</div>
        </div>
        
      </div>
    </div>
    <div style="margin-top:14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#475569;">
      <span>15 built-in themes · browse all →</span>
      <span>Custom themes: <strong>3</strong> · <a style="color:#1d4ed8;text-decoration:none;cursor:pointer;">import .theme.json</a></span>
    </div>
  </div>

  <div style="background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;padding:24px;margin-bottom:14px;">
    <h4 style="margin:0 0 18px;font-size:13px;font-weight:700;color:#1d4ed8;text-transform:uppercase;letter-spacing:0.06em;">List density</h4>
    <div style="display:flex;gap:10px;margin-bottom:10px;">

      <div style="flex:1;padding:14px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;">
