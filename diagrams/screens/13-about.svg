<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — About</title>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900">
      <g id="header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 px-2 py-0.5 text-xs rounded bg-slate-100 text-slate-600">freenas-mock.local</span>
          </div>
          <div class="ml-auto flex items-center gap-4">
            <span class="text-sm text-slate-500 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>backend OK · 18ms</span>
            <button class="text-sm text-slate-600">Refresh</button>
            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-medium">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(800px - 56px)">
        <g id="sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded text-slate-700">Dashboard</a>
              <a class="block px-3 py-2 rounded text-slate-700">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-slate-700">Containers</a>
              <a class="block px-3 py-2 rounded text-slate-700">Jails</a>
              <a class="block px-3 py-2 rounded text-slate-700">Volumes</a>
              <a class="block px-3 py-2 rounded text-slate-700">Network Map</a>
              <a class="block px-3 py-2 rounded text-slate-700">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Admin</div>
              <a class="block px-3 py-2 rounded text-slate-700">Users</a>
              <a class="block px-3 py-2 rounded text-slate-700">Logs</a>
              <a class="block px-3 py-2 rounded text-slate-700">Notifications</a>
              <a class="block px-3 py-2 rounded text-slate-700">Settings</a>
              <a class="block px-3 py-2 rounded text-slate-700">Status</a>
              <a class="block px-3 py-2 rounded bg-blue-50 text-blue-700 font-medium">About</a>
            </nav>
          </aside>
        </g>
        <g id="content" class="contents">
          <main class="flex-1 p-6 overflow-auto">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h1 class="text-2xl font-bold">About</h1>
                <p class="text-sm text-slate-500">Version, license, credits, system info</p>
              </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
              <div class="bg-white rounded-lg border p-4 shadow-sm">
                <div class="flex items-center gap-3 mb-3">
                  <div class="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center text-xl font-bold">C</div>
                  <div>
                    <div class="text-xl font-bold">CloudBSD Admin</div>
                    <div class="text-xs text-slate-500">Self-hosted control plane</div>
                  </div>
                </div>
                <div class="space-y-1.5 text-xs">
                  <div class="flex justify-between py-1 border-b border-slate-100"><span class="text-slate-500">Version</span><span class="font-mono">v1.0.0</span></div>
                  <div class="flex justify-between py-1 border-b border-slate-100"><span class="text-slate-500">Frontend</span><span class="font-mono">Angular 19.1.0</span></div>
                  <div class="flex justify-between py-1 border-b border-slate-100"><span class="text-slate-500">Backend</span><span class="font-mono">Node.js 24.0.2 / Express 5</span></div>
                  <div class="flex justify-between py-1 border-b border-slate-100"><span class="text-slate-500">Build commit</span><span class="font-mono">f8e2a4c1</span></div>
                  <div class="flex justify-between py-1 border-b border-slate-100"><span class="text-slate-500">Build date</span><span class="font-mono">2026-07-06 03:00:14 UTC</span></div>
                  <div class="flex justify-between py-1 border-b border-slate-100"><span class="text-slate-500">Build host</span><span class="font-mono">buildbot.cloudbsd.org</span></div>
                  <div class="flex justify-between py-1"><span class="text-slate-500">License</span><span>BSD 3-Clause</span></div>
                </div>
              </div>
              <div class="space-y-4">
                <div class="bg-white rounded-lg border p-4 shadow-sm">
                  <h3 class="text-sm font-semibold mb-2">System info</h3>
                  <div class="space-y-1 text-xs">
                    <div class="flex justify-between"><span class="text-slate-500">Host</span><span>freenas-mock</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">FreeBSD</span><span class="font-mono">14.2-RELEASE-p1</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Cores</span><span class="font-mono">8</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">RAM</span><span class="font-mono">16 GB</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Uptime</span><span class="font-mono">14d 02:11</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Locales</span><span class="font-mono">47</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">Plugins</span><span class="font-mono">5 enabled</span></div>
                  </div>
                </div>
                <div class="bg-white rounded-lg border p-4 shadow-sm">
                  <h3 class="text-sm font-semibold mb-2">Links</h3>
                  <div class="grid grid-cols-2 gap-1 text-xs">
                    <a class="text-blue-600 hover:underline">Documentation</a>
                    <a class="text-blue-600 hover:underline">Source code</a>
                    <a class="text-blue-600 hover:underline">Issues</a>
                    <a class="text-blue-600 hover:underline">Discussions</a>
                    <a class="text-blue-600 hover:underline">Security policy</a>
                    <a class="text-blue-600 hover:underline">Community chat</a>
                    <a class="text-blue-600 hover:underline">Release notes</a>
                    <a class="text-blue-600 hover:underline">Roadmap</a>
                  </div>
                </div>
              </div>
            </div>
            <div class="bg-white rounded-lg border p-4 shadow-sm mt-4">
              <h3 class="text-sm font-semibold mb-3">Third-party libraries</h3>
              <table class="w-full text-xs">
                <thead class="text-slate-500 text-[10px] uppercase"><tr class="border-b"><th class="text-left py-1 font-medium">Library</th><th class="text-left py-1 font-medium">Version</th><th class="text-left py-1 font-medium">License</th></tr></thead>
                <tbody class="divide-y divide-slate-100">
                  <tr><td class="py-1">Angular</td><td class="font-mono">19.1.0</td><td>MIT</td></tr>
                  <tr><td class="py-1">RxJS</td><td class="font-mono">7.8.1</td><td>Apache-2.0</td></tr>
                  <tr><td class="py-1">Tailwind CSS</td><td class="font-mono">3.4.19</td><td>MIT</td></tr>
                  <tr><td class="py-1">Lucide icons</td><td class="font-mono">0.469.0</td><td>ISC</td></tr>
                  <tr><td class="py-1">@xyflow/angular</td><td class="font-mono">0.0.4</td><td>MIT</td></tr>
                  <tr><td class="py-1">better-sqlite3</td><td class="font-mono">11.5.0</td><td>MIT</td></tr>
                  <tr><td class="py-1">Express</td><td class="font-mono">5.0.1</td><td>MIT</td></tr>
                  <tr><td class="py-1">jsonwebtoken</td><td class="font-mono">9.0.2</td><td>MIT</td></tr>
                  <tr><td class="py-1">bcrypt</td><td class="font-mono">5.1.1</td><td>MIT</td></tr>
                  <tr><td class="py-1">helmet</td><td class="font-mono">8.0.0</td><td>MIT</td></tr>
                  <tr><td class="py-1">winston</td><td class="font-mono">3.17.0</td><td>MIT</td></tr>
                  <tr><td class="py-1">zod</td><td class="font-mono">3.23.8</td><td>MIT</td></tr>
                </tbody>
              </table>
            </div>
          </main>
        </g>
      </div>
    </div>
  </foreignObject>
</svg>
