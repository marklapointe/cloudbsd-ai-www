<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — About</title>
  <desc>About page with version, license, contributors, and technology stack.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900">
      <g id="header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 px-2 py-0.5 text-xs rounded bg-slate-100 text-slate-600">freenas-mock.local</span>
          </div>
          <div class="ml-auto flex items-center gap-4">
            <span class="text-sm text-slate-500">Theme: CloudBSD</span>
            <button class="text-sm text-slate-600 hover:text-slate-900">Refresh</button>
            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-medium">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Dashboard</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Containers</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Jails</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Volumes</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Network Map</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Admin</div>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Users</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Logs</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Notifications</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Settings</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Status</a>
              <a class="block px-3 py-2 rounded bg-blue-50 text-blue-700 font-medium">About</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 p-6 overflow-auto">
          <g id="content" class="contents">
            <div class="max-w-4xl mx-auto">
              <div class="bg-white rounded-lg border border-slate-200 shadow-sm p-8 mb-6">
                <div class="flex items-center gap-4">
                  <div class="w-16 h-16 rounded-xl bg-blue-600 text-white flex items-center justify-center text-3xl font-bold">C</div>
                  <div>
                    <h1 class="text-2xl font-bold">CloudBSD Admin</h1>
                    <p class="text-sm text-slate-500">A FreeBSD-native management UI for VMs, containers, jails, and ZFS.</p>
                    <div class="mt-2 flex items-center gap-2 text-xs">
                      <span class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700">v0.7.2-angular-mig</span>
                      <span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">channel: stable</span>
                      <span class="text-slate-500">build 2026.07.06</span>
                    </div>
                  </div>
                </div>
              </div>
              <div class="grid grid-cols-2 gap-6">
                <div class="bg-white rounded-lg border border-slate-200 shadow-sm p-5">
                  <h2 class="font-semibold mb-3">System</h2>
                  <dl class="text-sm space-y-1.5">
                    <div class="flex justify-between"><dt class="text-slate-500">Host</dt><dd>freenas-mock.local</dd></div>
                    <div class="flex justify-between"><dt class="text-slate-500">OS</dt><dd>FreeBSD 14.2-RELEASE</dd></div>
                    <div class="flex justify-between"><dt class="text-slate-500">Kernel</dt><dd>14.2-RELEASE-p3</dd></div>
                    <div class="flex justify-between"><dt class="text-slate-500">Middleware</dt><dd>cloudbsd-mw 0.7.2</dd></div>
                    <div class="flex justify-between"><dt class="text-slate-500">Frontend</dt><dd>Angular 20.0.4</dd></div>
                    <div class="flex justify-between"><dt class="text-slate-500">License</dt><dd>MIT</dd></div>
                  </dl>
                </div>
                <div class="bg-white rounded-lg border border-slate-200 shadow-sm p-5">
                  <h2 class="font-semibold mb-3">Stack</h2>
                  <ul class="text-sm space-y-1.5 text-slate-700">
                    <li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>Angular 20 standalone components</li>
                    <li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>Signals + RxJS</li>
                    <li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>Tailwind CSS 3.4</li>
                    <li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>@xyflow/angular for topology</li>
                    <li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>WebSocket JSON-RPC bridge</li>
                    <li class="flex items-center gap-2"><span class="w-1.5 h-1.5 rounded-full bg-blue-600"></span>systemd-free init via <span class="font-mono">cloudbsd-init</span></li>
                  </ul>
                </div>
                <div class="bg-white rounded-lg border border-slate-200 shadow-sm p-5 col-span-2">
                  <h2 class="font-semibold mb-3">Credits</h2>
                  <p class="text-sm text-slate-700">CloudBSD Admin is an open-source project maintained by the REVYTECH community and contributors. Special thanks to the FreeBSD and TrueNAS communities whose documentation and tooling underpin this work.</p>
                  <div class="mt-3 flex flex-wrap gap-2 text-xs">
                    <span class="px-2 py-1 rounded bg-slate-100 text-slate-700">@mlapointe</span>
                    <span class="px-2 py-1 rounded bg-slate-100 text-slate-700">@jdoe</span>
                    <span class="px-2 py-1 rounded bg-slate-100 text-slate-700">@kfreeman</span>
                    <span class="px-2 py-1 rounded bg-slate-100 text-slate-700">+ 14 contributors</span>
                  </div>
                </div>
                <div class="bg-white rounded-lg border border-slate-200 shadow-sm p-5 col-span-2">
                  <h2 class="font-semibold mb-3">Links</h2>
                  <div class="grid grid-cols-3 gap-3 text-sm">
                    <a class="block bg-slate-50 rounded border border-slate-200 px-3 py-2 hover:bg-slate-100">
                      <div class="font-medium">Source</div>
                      <div class="text-slate-500 text-xs">git.cloudbsd.local/admin</div>
                    </a>
                    <a class="block bg-slate-50 rounded border border-slate-200 px-3 py-2 hover:bg-slate-100">
                      <div class="font-medium">Issue tracker</div>
                      <div class="text-slate-500 text-xs">bugs.cloudbsd.local</div>
                    </a>
                    <a class="block bg-slate-50 rounded border border-slate-200 px-3 py-2 hover:bg-slate-100">
                      <div class="font-medium">Releases</div>
                      <div class="text-slate-500 text-xs">releases.cloudbsd.local</div>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </g>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>