<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Error 500</title>
  <foreignObject x="0" y="0" width="1280" height="720">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:720px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">
      
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:60px;text-align:center;">
  <div style="font-family:monospace;font-size:140px;font-weight:900;color:#ef4444;letter-spacing:-0.04em;line-height:0.95;margin-bottom:18px;">500</div>
  <div style="display:inline-block;padding:5px 12px;background:#ef444415;color:#ef4444;border-radius:9999px;font-size:11px;font-weight:700;letter-spacing:0.06em;margin-bottom:14px;">INTERNAL SERVER ERROR</div>
  <h1 style="margin:0 0 14px;font-size:24px;font-weight:700;color:#0f172a;">Something broke on our side</h1>
  <p style="margin:0 0 6px;font-size:14px;color:#475569;max-width:560px;line-height:1.55;">An unhandled exception occurred. Our team has been auto-notified (incident #2841). The dashboard is still safe to use; only this page failed. Try again in a minute.</p>
  <p style="margin:6px 0 0;font-family:monospace;font-size:11px;color:#94a3b8;background:#f1f5f9;padding:6px 12px;border-radius:5px;">trace: TypeError: cannot read property 'ulid' of undefined @ plugin:vm.snapshot.handler:v2.3.1</p>
  <div style="margin-top:32px;display:flex;gap:10px;"><button style="padding:11px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:#1d4ed8;color:#ffffff;cursor:pointer;">Retry</button><button style="padding:11px 22px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;cursor:pointer;">Go to dashboard</button><button style="padding:11px 22px;font-size:13px;border:none;border-radius:6px;background:transparent;color:#64748b;cursor:pointer;text-decoration:underline;">View incident</button></div>
</div>

    </div>
  </foreignObject>
</svg>
