<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Users</title>
  <desc>Admin-only listing of PAM accounts and last login timestamps.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900">
      <g id="header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 px-2 py-0.5 text-xs rounded bg-slate-100 text-slate-600">freenas-mock.local</span>
          </div>
          <div class="ml-auto flex items-center gap-4">
            <span class="text-sm text-slate-500">Theme: CloudBSD</span>
            <button class="text-sm text-slate-600 hover:text-slate-900">Refresh</button>
            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-medium">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Dashboard</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Containers</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Jails</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Volumes</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Network Map</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Admin</div>
              <a class="block px-3 py-2 rounded bg-blue-50 text-blue-700 font-medium">Users</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Logs</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Notifications</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Settings</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Status</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">About</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 p-6 overflow-auto">
          <g id="content" class="contents">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h1 class="text-2xl font-bold">Users</h1>
                <p class="text-sm text-slate-500">Admin-only view of PAM accounts · 7 accounts · auth via <span class="font-mono">pam_unix</span> + <span class="font-mono">pam_opie</span></p>
              </div>
              <div class="flex items-center gap-2">
                <input type="text" placeholder="Filter users…" class="text-sm border border-slate-300 rounded px-3 py-1.5 w-56 focus:outline-none focus:ring-2 focus:ring-blue-500" />
              </div>
            </div>
            <div class="bg-amber-50 border border-amber-200 text-amber-900 rounded-lg p-3 mb-4 text-sm flex items-start gap-3">
              <div class="font-bold text-amber-700">!</div>
              <div>
                <div class="font-medium">Read-only role</div>
                <div class="text-amber-800">User management is disabled in this milestone. Contact an operator to add, modify, or remove accounts.</div>
              </div>
            </div>
            <div class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
              <table class="w-full text-sm">
                <thead class="bg-slate-50 text-slate-600">
                  <tr>
                    <th class="text-left font-medium px-4 py-2">Username</th>
                    <th class="text-left font-medium px-4 py-2">UID</th>
                    <th class="text-left font-medium px-4 py-2">Primary GID</th>
                    <th class="text-left font-medium px-4 py-2">Home</th>
                    <th class="text-left font-medium px-4 py-2">Shell</th>
                    <th class="text-left font-medium px-4 py-2">Last Login</th>
                    <th class="text-left font-medium px-4 py-2">2FA</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  <tr class="hover:bg-slate-50">
                    <td class="px-4 py-2 font-medium">root</td>
                    <td class="px-4 py-2 text-slate-700">0</td>
                    <td class="px-4 py-2 text-slate-700">0 (wheel)</td>
                    <td class="px-4 py-2 font-mono text-xs">/root</td>
                    <td class="px-4 py-2 font-mono text-xs">/bin/csh</td>
                    <td class="px-4 py-2 text-slate-700">2026-07-05 09:11</td>
                    <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs bg-emerald-50 text-emerald-700">OPIE</span></td>
                  </tr>
                  <tr class="hover:bg-slate-50">
                    <td class="px-4 py-2 font-medium">mlapointe</td>
                    <td class="px-4 py-2 text-slate-700">1001</td>
                    <td class="px-4 py-2 text-slate-700">1001 (wheel)</td>
                    <td class="px-4 py-2 font-mono text-xs">/home/mlapointe</td>
                    <td class="px-4 py-2 font-mono text-xs">/bin/zsh</td>
                    <td class="px-4 py-2 text-slate-700">2026-07-06 08:02</td>
                    <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs bg-emerald-50 text-emerald-700">TOTP</span></td>
                  </tr>
                  <tr class="hover:bg-slate-50">
                    <td class="px-4 py-2 font-medium">svc-backup</td>
                    <td class="px-4 py-2 text-slate-700">2002</td>
                    <td class="px-4 py-2 text-slate-700">2002 (operator)</td>
                    <td class="px-4 py-2 font-mono text-xs">/var/svc/backup</td>
                    <td class="px-4 py-2 font-mono text-xs">/usr/sbin/nologin</td>
                    <td class="px-4 py-2 text-slate-700">2026-07-06 03:00</td>
                    <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs bg-slate-100 text-slate-600">N/A</span></td>
                  </tr>
                  <tr class="hover:bg-slate-50">
                    <td class="px-4 py-2 font-medium">svc-nagios</td>
                    <td class="px-4 py-2 text-slate-700">2003</td>
                    <td class="px-4 py-2 text-slate-700">2003 (nagios)</td>
                    <td class="px-4 py-2 font-mono text-xs">/var/svc/nagios</td>
                    <td class="px-4 py-2 font-mono text-xs">/usr/sbin/nologin</td>
                    <td class="px-4 py-2 text-slate-700">2026-07-06 12:00</td>
                    <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs bg-slate-100 text-slate-600">N/A</span></td>
                  </tr>
                  <tr class="hover:bg-slate-50">
                    <td class="px-4 py-2 font-medium">jdoe</td>
                    <td class="px-4 py-2 text-slate-700">1010</td>
                    <td class="px-4 py-2 text-slate-700">1010 (users)</td>
                    <td class="px-4 py-2 font-mono text-xs">/home/jdoe</td>
                    <td class="px-4 py-2 font-mono text-xs">/bin/sh</td>
                    <td class="px-4 py-2 text-slate-700">2026-06-28 17:41</td>
                    <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs bg-amber-50 text-amber-700">disabled</span></td>
                  </tr>
                </tbody>
              </table>
              <div class="flex items-center justify-between px-4 py-2 text-sm text-slate-500 border-t border-slate-100">
                <div>5 of 7 users shown</div>
                <div class="flex items-center gap-2">
                  <span>Admin view</span>
                  <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-600 text-xs">Read-only</span>
                </div>
              </div>
            </div>
            <div class="mt-4 grid grid-cols-3 gap-4">
              <div class="bg-white rounded-lg p-3 border border-slate-200 text-sm">
                <div class="text-slate-500">Total accounts</div>
                <div class="text-xl font-semibold mt-1">7</div>
              </div>
              <div class="bg-white rounded-lg p-3 border border-slate-200 text-sm">
                <div class="text-slate-500">Service accounts</div>
                <div class="text-xl font-semibold mt-1">3</div>
              </div>
              <div class="bg-white rounded-lg p-3 border border-slate-200 text-sm">
                <div class="text-slate-500">2FA enrollment</div>
                <div class="text-xl font-semibold mt-1">2 / 4 humans</div>
              </div>
            </div>
          </g>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>