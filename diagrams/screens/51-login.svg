<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Login (PAM auth)</title>
  <foreignObject x="0" y="0" width="1280" height="720">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:720px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">
      
<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:40px;">
  <div style="width:480px;background:#ffffff;border-radius:10px;border:1px solid #e2e8f0;box-shadow:0 10px 30px rgba(15,23,42,0.08);padding:32px;box-sizing:border-box;height:580px;">
    <div style="text-align:center;margin-bottom:24px;">
      <div style="display:inline-block;padding:8px 14px;background:linear-gradient(135deg,#0ea5e9 0%,#1e40af 100%);border-radius:8px;color:#ffffff;font-weight:700;font-size:14px;letter-spacing:0.04em;">CloudBSD</div>
      <h1 style="margin:18px 0 4px;font-size:22px;font-weight:700;color:#0f172a;">Sign in to your cluster</h1>
      <p style="margin:0;font-size:13px;color:#64748b;">PAM authentication &#xB7; FreeBSD-native</p>
    </div>
    <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;letter-spacing:0.03em;">Username or email</div>
    <input type="text" value="admin" placeholder="admin" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;" />
    <div style="height:14px;"></div>
    <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;letter-spacing:0.03em;">Password</div>
    <input type="password" placeholder="&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;&#x2022;" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;" />
    <div style="height:18px;"></div>
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:18px;">
      <input type="checkbox" checked="checked" style="margin:0;" />
      <span style="font-size:12px;color:#475569;">Trust this device for 30 days</span>
    </div>
    <button style="width:100%;padding:10px 16px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:#1d4ed8;color:#ffffff;cursor:pointer;">Sign in</button>
    <div style="height:14px;"></div>
    <div style="display:flex;justify-content:space-between;">
      <a style="font-size:12px;color:#1d4ed8;text-decoration:none;cursor:pointer;">Forgot password?</a>
      <a style="font-size:12px;color:#64748b;text-decoration:none;cursor:pointer;">Use SSH key &#x2192;</a>
    </div>
    <div style="margin-top:22px;padding-top:18px;border-top:1px solid #e2e8f0;text-align:center;">
      <p style="margin:0 0 8px;font-size:11px;color:#64748b;">Or sign in with</p>
      <div style="display:flex;gap:8px;justify-content:center;">
        <button style="padding:7px 14px;font-size:12px;border:1px solid #cbd5e1;border-radius:5px;background:#ffffff;color:#475569;">LaunchShell</button>
        <button style="padding:7px 14px;font-size:12px;border:1px solid #cbd5e1;border-radius:5px;background:#ffffff;color:#475569;">LDAP/AD</button>
        <button style="padding:7px 14px;font-size:12px;border:1px solid #cbd5e1;border-radius:5px;background:#ffffff;color:#475569;">OIDC SSO</button>
      </div>
    </div>
    <div style="margin-top:14px;text-align:center;font-size:10px;color:#94a3b8;">CloudBSD v1.4.3 &#xB7; 0 suspicious sign-in attempts</div>
  </div>
</div>

    </div>
  </foreignObject>
</svg>
