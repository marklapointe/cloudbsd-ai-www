<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Restore from Backup Wizard — Step 2 of 3 — Target</title>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">

      <div style="display:flex;flex-direction:column;height:100%;background:#f1f5f9;">
        <div style="padding:18px 32px;background:#ffffff;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:14px;">
            <span style="display:inline-block;padding:5px 10px;background:linear-gradient(135deg,#0ea5e9,#1e40af);border-radius:5px;color:#ffffff;font-weight:700;font-size:11px;">CloudBSD</span>
            <h2 style="margin:0;font-size:15px;font-weight:600;">Restore from backup</h2>
            <span style="color:#94a3b8;">/</span>
            <span style="font-size:12px;color:#475569;">Step 2 — Target</span>
          </div>
          <div style="display:flex;align-items:center;gap:14px;font-size:11px;color:#64748b;">
            Step 2 of 3 · ~2 min remaining
            <button style="padding:6px 12px;font-size:11px;border:none;border-radius:4px;background:transparent;color:#64748b;">✕ Cancel</button>
          </div>
        </div>

        <div style="padding:0 32px 14px;background:#ffffff;border-bottom:1px solid #e2e8f0;">
          <div style="display:flex;gap:0;align-items:center;">
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;"><div style="width:20px;height:20px;border-radius:50%;background:#16a34a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">✓</div><span style="font-size:11px;color:#475569;">1. Pick backup <button style="font-size:10px;color:#1d4ed8;background:transparent;border:none;cursor:pointer;text-decoration:underline;margin-left:4px;">edit</button></span></div>
            <div style="display:flex;align-items:center;color:#16a34a;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid #1d4ed8;background:#1d4ed810;"><div style="width:20px;height:20px;border-radius:50%;background:#1d4ed8;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">2</div><span style="font-size:11px;font-weight:600;color:#1d4ed8;">Target</span></div>
            <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
            <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;"><div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">3</div><span style="font-size:11px;color:#475569;">Review</span></div>
            <div style="flex:1;"></div>
            <span style="font-size:10px;color:#16a34a;">1 of 3 complete</span>
          </div>
        </div>

        <div style="flex:1;display:flex;background:#f1f5f9;overflow:hidden;">
          <div style="flex:1;padding:28px 40px;overflow-y:auto;">
            <h1 style="margin:0 0 4px;font-size:22px;font-weight:700;color:#0f172a;">Where do you want to restore?</h1>
            <p style="margin:0 0 24px;font-size:13px;color:#64748b;max-width:680px;line-height:1.55;">Three options: replace the original, deploy as a new resource, or extract files without booting.</p>

            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;">
              <label style="padding:18px;background:#1d4ed810;border:2px solid #1d4ed8;border-radius:10px;cursor:pointer;position:relative;">
                <div style="position:absolute;top:10px;right:10px;padding:2px 8px;background:#1d4ed8;color:#ffffff;border-radius:9999px;font-size:9px;font-weight:700;">SELECTED</div>
                <div style="font-size:32px;margin-bottom:10px;">⟳</div>
                <div style="font-size:14px;font-weight:700;color:#1d4ed8;margin-bottom:4px;">In-place replace</div>
                <div style="font-size:11px;color:#1e3a8a;line-height:1.5;margin-bottom:10px;">Stop web-server-01, restore over it, start it back up. Downtime ~30 s.</div>
                <div style="font-size:10px;color:#1d4ed8;font-weight:700;">⚠ This overwrites current state</div>
              </label>

              <label style="padding:18px;background:#ffffff;border:1px solid #cbd5e1;border-radius:10px;cursor:pointer;">
                <div style="font-size:32px;margin-bottom:10px;">+</div>
                <div style="font-size:14px;font-weight:700;color:#0f172a;margin-bottom:4px;">New resource from backup</div>
                <div style="font-size:11px;color:#475569;line-height:1.5;margin-bottom:10px;">Spawn a sibling VM (e.g., web-server-01-restored) for safe comparison.</div>
                <div style="font-size:10px;color:#64748b;">+ 1 GB meta + IP alloc</div>
              </label>

              <label style="padding:18px;background:#ffffff;border:1px solid #cbd5e1;border-radius:10px;cursor:pointer;">
                <div style="font-size:32px;margin-bottom:10px;">📁</div>
                <div style="font-size:14px;font-weight:700;color:#0f172a;margin-bottom:4px;">File-level extraction</div>
                <div style="font-size:11px;color:#475569;line-height:1.5;margin-bottom:10px;">Pull single files out of the snapshot without booting. Browse + select.</div>
                <div style="font-size:10px;color:#64748b;">Read-only on the source</div>
              </label>
            </div>

            <!-- Source info card -->
            <div style="padding:14px 18px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:14px;">
              <div style="display:flex;align-items:center;gap:14px;">
                <div style="width:48px;height:48px;border-radius:10px;background:#dbeafe;color:#1d4ed8;display:flex;align-items:center;justify-content:center;font-size:20px;">📦</div>
                <div style="flex:1;">
                  <div style="font-size:13px;font-weight:700;color:#0f172a;">nightly-data-#148 · 12.4 GB</div>
                  <div style="font-size:11px;color:#475569;margin-top:2px;">web-server-01 (VM) · 2 h ago · from nightly-data-backup schedule · integrity ✓</div>
                </div>
                <button style="padding:7px 14px;font-size:11px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;">Verify</button>
              </div>
            </div>

            <!-- In-place replace options -->
            <div style="padding:14px 18px;background:#fef3c7;border:1px solid #fde68a;border-radius:8px;">
              <div style="font-size:13px;font-weight:700;color:#92400e;margin-bottom:10px;">In-place replace options</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px;">
                <label style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 12px;background:#ffffff;border-radius:5px;"><span style="color:#475569;">Stop resource before restore</span><input type="checkbox" checked="checked" style="accent-color:#1d4ed8;width:30px;height:18px;"/></label>
                <label style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 12px;background:#ffffff;border-radius:5px;"><span style="color:#475569;">Start resource after restore</span><input type="checkbox" checked="checked" style="accent-color:#1d4ed8;width:30px;height:18px;"/></label>
                <label style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 12px;background:#ffffff;border-radius:5px;"><span style="color:#475569;">Take pre-restore snapshot</span><input type="checkbox" checked="checked" style="accent-color:#1d4ed8;width:30px;height:18px;"/></label>
                <label style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 12px;background:#ffffff;border-radius:5px;"><span style="color:#475569;">Restore into a new boot disk + keep current data</span><input type="checkbox" style="accent-color:#1d4ed8;width:30px;height:18px;"/></label>
                <label style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 12px;background:#ffffff;border-radius:5px;"><span style="color:#475569;">Restore NIC configuration (overwrites IPs)</span><input type="checkbox" style="accent-color:#1d4ed8;width:30px;height:18px;"/></label>
                <label style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:8px 12px;background:#ffffff;border-radius:5px;"><span style="color:#475569;">Notify on completion</span><input type="checkbox" checked="checked" style="accent-color:#1d4ed8;width:30px;height:18px;"/></label>
              </div>
            </div>

          </div>

          <div style="width:280px;padding:28px 24px;border-left:1px solid #e2e8f0;background:#ffffff;overflow-y:auto;">
            <div style="padding:14px;background:#1d4ed810;border:1px solid #bfdbfe;border-radius:8px;margin-bottom:16px;">
              <div style="font-size:11px;font-weight:700;color:#1d4ed8;letter-spacing:0.06em;margin-bottom:6px;">MODE</div>
              <div style="font-size:13px;color:#1e3a8a;font-weight:700;">In-place replace</div>
              <div style="font-size:11px;color:#475569;margin-top:6px;line-height:1.5;">Overwrites web-server-01. Pre-restore snapshot will be saved as <code style="font-family:monospace;background:#fff;padding:1px 5px;border-radius:3px;">snap-prerestore-2026-07-10</code>.</div>
            </div>
            <div style="padding:14px;background:#fef3c7;border:1px solid #fde68a;border-radius:8px;">
              <div style="font-size:11px;font-weight:700;color:#92400e;letter-spacing:0.06em;margin-bottom:6px;">DOWNTIME</div>
              <div style="font-size:11px;color:#78350f;line-height:1.5;">VM stops at moment of restore. ~30 s typical for 12 GB zstd restore on NVMe. <strong>Configure LB upstream to drain first</strong> if web-server-01 is in a load balancer.</div>
            </div>
          </div>
        </div>

        <div style="padding:14px 32px;background:#ffffff;border-top:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
          <button style="padding:9px 16px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">← Back to Pick</button>
          <button style="padding:10px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:#1d4ed8;color:#ffffff;">Next → Review</button>
        </div>
      </div>

    </div>
  </foreignObject>
</svg>
