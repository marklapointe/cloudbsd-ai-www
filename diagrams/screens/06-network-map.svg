<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Network Map</title>
  <desc>Topology canvas rendered with @xyflow/angular: VM, container, jail, and service nodes connected by edges.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 relative">
      <g id="header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4 relative z-20">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 px-2 py-0.5 text-xs rounded bg-slate-100 text-slate-600">freenas-mock.local</span>
          </div>
          <div class="ml-auto flex items-center gap-4">
            <span class="text-sm text-slate-500">Theme: CloudBSD</span>
            <button class="text-sm text-slate-600 hover:text-slate-900">Refresh</button>
            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-medium">M</div>
          </div>
        </div>
      </g>
      <div class="flex relative" style="height: calc(100% - 56px);">
        <g id="sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto relative z-10">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Dashboard</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Containers</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Jails</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Volumes</a>
              <a class="block px-3 py-2 rounded bg-blue-50 text-blue-700 font-medium">Network Map</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Admin</div>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Users</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Logs</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Notifications</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Settings</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Status</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">About</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 p-6 overflow-hidden relative">
          <g id="content" class="contents">
            <div class="flex items-center justify-between mb-3">
              <div>
                <h1 class="text-2xl font-bold">Network Map</h1>
                <p class="text-sm text-slate-500">Topological view rendered with @xyflow/angular · pan and zoom enabled, edits disabled</p>
              </div>
              <div class="flex items-center gap-2">
                <div class="flex items-center gap-1 bg-white border border-slate-200 rounded p-1 text-xs">
                  <button class="px-2 py-1 rounded bg-slate-100">Fit</button>
                  <button class="px-2 py-1 rounded">+</button>
                  <button class="px-2 py-1 rounded">−</button>
                </div>
                <select class="text-sm border border-slate-300 rounded px-2 py-1.5">
                  <option>All layers</option>
                  <option>VMs only</option>
                  <option>Containers only</option>
                </select>
              </div>
            </div>
            <div class="relative bg-white rounded-lg border border-slate-200 shadow-sm" style="height: 640px;">
              <svg class="absolute inset-0 pointer-events-none" width="100%" height="100%" viewBox="0 0 1056 640" preserveAspectRatio="none">
                <defs>
                  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
                    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#f1f5f9" stroke-width="1"/>
                  </pattern>
                </defs>
                <rect width="100%" height="100%" fill="url(#grid)"/>
                <line x1="270" y1="160" x2="500" y2="220" stroke="#3b82f6" stroke-width="2"/>
                <line x1="270" y1="160" x2="500" y2="320" stroke="#3b82f6" stroke-width="2"/>
                <line x1="270" y1="160" x2="500" y2="440" stroke="#3b82f6" stroke-width="2"/>
                <line x1="540" y1="220" x2="760" y2="220" stroke="#10b981" stroke-width="2"/>
                <line x1="540" y1="320" x2="760" y2="320" stroke="#10b981" stroke-width="2"/>
                <line x1="540" y1="440" x2="760" y2="440" stroke="#10b981" stroke-width="2"/>
                <line x1="800" y1="220" x2="940" y2="320" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>
                <line x1="800" y1="320" x2="940" y2="320" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>
                <line x1="800" y1="440" x2="940" y2="320" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3"/>
              </svg>
              <div class="absolute rounded-lg border-2 border-blue-600 bg-blue-50 text-blue-900 px-3 py-2 text-xs shadow-sm" style="left: 200px; top: 130px; width: 140px;">
                <div class="font-semibold flex items-center gap-1">
                  <span class="w-2 h-2 rounded-full bg-blue-600"></span>
                  br0 (gateway)
                </div>
                <div class="font-mono text-[10px] mt-1">10.0.10.1/24</div>
              </div>
              <div class="absolute rounded-lg border-2 border-emerald-600 bg-emerald-50 text-emerald-900 px-3 py-2 text-xs shadow-sm" style="left: 430px; top: 190px; width: 120px;">
                <div class="font-semibold">VM: nextcloud</div>
                <div class="font-mono text-[10px] mt-1">10.0.10.10</div>
              </div>
              <div class="absolute rounded-lg border-2 border-emerald-600 bg-emerald-50 text-emerald-900 px-3 py-2 text-xs shadow-sm" style="left: 430px; top: 290px; width: 120px;">
                <div class="font-semibold">VM: jellyfin</div>
                <div class="font-mono text-[10px] mt-1">10.0.10.11</div>
              </div>
              <div class="absolute rounded-lg border-2 border-emerald-600 bg-emerald-50 text-emerald-900 px-3 py-2 text-xs shadow-sm" style="left: 430px; top: 410px; width: 120px;">
                <div class="font-semibold">CT: nginx-proxy</div>
                <div class="font-mono text-[10px] mt-1">10.0.10.30</div>
              </div>
              <div class="absolute rounded-lg border-2 border-emerald-600 bg-emerald-50 text-emerald-900 px-3 py-2 text-xs shadow-sm" style="left: 700px; top: 190px; width: 110px;">
                <div class="font-semibold">Jail: syncthing</div>
                <div class="font-mono text-[10px] mt-1">10.0.10.22</div>
              </div>
              <div class="absolute rounded-lg border-2 border-emerald-600 bg-emerald-50 text-emerald-900 px-3 py-2 text-xs shadow-sm" style="left: 700px; top: 290px; width: 110px;">
                <div class="font-semibold">Jail: pi-hole</div>
                <div class="font-mono text-[10px] mt-1">10.0.10.21</div>
              </div>
              <div class="absolute rounded-lg border-2 border-emerald-600 bg-emerald-50 text-emerald-900 px-3 py-2 text-xs shadow-sm" style="left: 700px; top: 410px; width: 110px;">
                <div class="font-semibold">CT: postgres-16</div>
                <div class="font-mono text-[10px] mt-1">10.0.10.31</div>
              </div>
              <div class="absolute rounded-lg border-2 border-slate-500 bg-slate-100 text-slate-900 px-3 py-2 text-xs shadow-sm" style="left: 880px; top: 290px; width: 120px;">
                <div class="font-semibold flex items-center gap-1">
                  <span class="w-2 h-2 rounded-full bg-slate-500"></span>
                  services.local
                </div>
                <div class="font-mono text-[10px] mt-1">10.0.10.250</div>
              </div>
              <div class="absolute bottom-3 right-3 bg-white border border-slate-200 rounded p-2 text-xs shadow-sm">
                <div class="font-semibold mb-1">Legend</div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-0.5 bg-blue-600"></span><span>VM link</span></div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-0.5 bg-emerald-600"></span><span>Workload link</span></div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-0.5 bg-slate-500"></span><span>Service link</span></div>
              </div>
            </div>
          </g>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>