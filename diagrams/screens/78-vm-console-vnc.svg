<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD VM noVNC Console</title>
  <foreignObject x="0" y="0" width="1280" height="720">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:720px;background:#0f172a;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">
      
<div style="display:flex;flex-direction:column;height:100%;background:#0f172a;">
  <div style="padding:10px 16px;background:#0a0f1a;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center;color:#cbd5e1;">
    <div style="display:flex;align-items:center;gap:14px;">
      <span style="display:inline-block;padding:4px 10px;background:linear-gradient(135deg,#0ea5e9,#1e40af);border-radius:4px;color:#ffffff;font-weight:700;font-size:10px;">CloudBSD</span>
      <span style="font-size:12px;font-weight:600;color:#ffffff;">VM Console: jellyfin</span>
      <span style="font-size:10px;background:#10b98115;color:#10b981;padding:2px 6px;border-radius:3px;font-weight:700;">RUNNING</span>
      <span style="font-size:10px;color:#64748b;">node-01 · ulid-HQK2 · 192.168.10.22:5900</span>
    </div>
    <div style="display:flex;gap:6px;">
      <button style="padding:4px 10px;font-size:10px;border:1px solid #334155;border-radius:4px;background:transparent;color:#cbd5e1;">Ctrl+Alt+Del</button>
      <button style="padding:4px 10px;font-size:10px;border:1px solid #334155;border-radius:4px;background:transparent;color:#cbd5e1;">Send key</button>
      <button style="padding:4px 10px;font-size:10px;border:1px solid #334155;border-radius:4px;background:transparent;color:#cbd5e1;">Screenshot</button>
      <button style="padding:4px 10px;font-size:10px;border:1px solid #334155;border-radius:4px;background:transparent;color:#cbd5e1;">Clipboard</button>
      <button style="padding:4px 10px;font-size:10px;border:1px solid #334155;border-radius:4px;background:transparent;color:#cbd5e1;">Full screen</button>
      <button style="padding:4px 10px;font-size:10px;border:1px solid #fecaca;border-radius:4px;background:#7f1d1d;color:#ffffff;">✕ Disconnect</button>
    </div>
  </div>

  <div style="flex:1;display:flex;">
    <div style="width:200px;background:#0a0f1a;border-right:1px solid #1e293b;padding:18px;box-sizing:border-box;color:#cbd5e1;">
      <div style="font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Display</div>
      <div style="margin-bottom:14px;">
        <div style="font-size:11px;margin-bottom:4px;">Resolution</div>
        <select style="width:100%;padding:4px 6px;font-size:10px;background:#1e293b;color:#cbd5e1;border:1px solid #334155;border-radius:4px;"><option>1920×1080 (native)</option><option>1280×720</option><option>1024×768</option><option>800×600</option></select>
      </div>
      <div style="margin-bottom:18px;">
        <div style="font-size:11px;margin-bottom:4px;">Scale</div>
        <select style="width:100%;padding:4px 6px;font-size:10px;background:#1e293b;color:#cbd5e1;border:1px solid #334155;border-radius:4px;"><option>Fit window</option><option>Real size</option><option>Bicubic</option><option>Off</option></select>
      </div>

      <div style="font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Input</div>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:10px;color:#94a3b8;">
        <div style="display:flex;justify-content:space-between;"><span>Keyboard:</span><span style="color:#cbd5e1;">USB</span></div>
        <div style="display:flex;justify-content:space-between;"><span>Mouse:</span><span style="color:#cbd5e1;">PS/2</span></div>
        <div style="display:flex;justify-content:space-between;"><span>Tablet:</span><span style="color:#10b981;">on (rel)</span></div>
        <div style="display:flex;justify-content:space-between;"><span>Audio:</span><span style="color:#cbd5e1;">opus</span></div>
      </div>

      <div style="margin-top:18px;font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;">Stats</div>
      <div style="display:flex;flex-direction:column;gap:6px;font-size:10px;color:#94a3b8;">
        <div style="display:flex;justify-content:space-between;"><span>RTT:</span><span style="color:#cbd5e1;">12ms</span></div>
        <div style="display:flex;justify-content:space-between;"><span>FPS:</span><span style="color:#10b981;">60</span></div>
        <div style="display:flex;justify-content:space-between;"><span>Bitrate:</span><span style="color:#cbd5e1;">8.4 Mb/s</span></div>
        <div style="display:flex;justify-content:space-between;"><span>Encoding:</span><span style="color:#cbd5e1;">Tight+Png</span></div>
        <div style="display:flex;justify-content:space-between;"><span>Uptime:</span><span style="color:#cbd5e1;">14d 02h</span></div>
      </div>
    </div>

    <div style="flex:1;background:#000;display:flex;align-items:center;justify-content:center;position:relative;">
      <!-- Simulated terminal screen -->
      <div style="width:900px;height:600px;background:#0c0c0c;color:#cccccc;font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px;padding:24px 28px;box-sizing:border-box;border-radius:4px;box-shadow:0 0 40px rgba(0,0,0,0.6);">
        <div style="color:#666;">root@jellyfin:~# uname -a</div>
        <div style="color:#a0a0a0;margin-bottom:8px;">FreeBSD jellyfin 14.2-RELEASE-p1 FreeBSD 14.2-RELEASE-p1 GENERIC amd64</div>
        <div style="color:#666;">root@jellyfin:~# uptime</div>
        <div style="color:#a0a0a0;margin-bottom:8px;">17:32:18 up 14 days, 02:14, 1 user, load average: 0.42, 0.38, 0.41</div>
        <div style="color:#666;">root@jellyfin:~# ps aux | head -8</div>
        <div style="color:#a0a0a0;">
          <div>USER    PID %CPU %MEM    VSZ   RSS TT  STAT STARTED    TIME COMMAND</div>
          <div>root     11  0.0  0.0      0    16 ?  SL   22 Jun 03   0:00.04 [kernel]</div>
          <div>root   1247  0.0  0.4  14256  8128 ?  Ss   14:24    0:00.32 /usr/sbin/sshd</div>
          <div style="color:#50fa7b;">root   1294  0.4  1.8  1426148 376544 ? SL  14:25  0:14.21 /usr/local/sbin/jellyfin</div>
          <div>root   1298  0.0  0.2  28112  3680 ?  Ss   14:25    0:00.01 /usr/sbin/cron</div>
          <div>root   1320  0.0  0.1   8424  1248 ?  Ss   14:25    0:00.02 /usr/libexec/syslogd</div>
        </div>
        <div style="margin-top:6px;color:#666;">root@jellyfin:~# <span style="background:#cccccc;color:#000;">&#x2588;</span></div>
      </div>

      <!-- Floating overlays -->
      <div style="position:absolute;top:24px;right:24px;background:rgba(0,0,0,0.7);color:#10b981;padding:4px 10px;border-radius:4px;font-family:monospace;font-size:10px;">
        &#x25CF; LIVE  60fps  12ms
      </div>
      <div style="position:absolute;bottom:24px;left:24px;background:rgba(0,0,0,0.7);padding:6px 12px;border-radius:4px;font-size:10px;color:#94a3b8;font-family:monospace;">
        Ctrl+Alt = release | F8 = menu | F11 = full
      </div>
    </div>
  </div>
</div>

    </div>
  </foreignObject>
</svg>
