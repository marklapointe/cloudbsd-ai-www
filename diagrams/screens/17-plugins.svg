            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
              <div style="display:flex;align-items:center;gap:6px;"><span style="font-size:16px;">📊</span><span style="font-weight:700;color:#0f172a;">prometheus-exporter</span></div>
