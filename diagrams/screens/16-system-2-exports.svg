            <div style="padding:10px 16px;font-size:12px;font-weight:600;color:#1d4ed8;background:#ffffff;border-bottom:2px solid #2563eb;border-radius:6px 6px 0 0;cursor:pointer;">Exports</div>
            <div style="padding:10px 16px;font-size:12px;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;">Stats</div>
            <div style="padding:10px 16px;font-size:12px;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;">History</div>
            <div style="padding:10px 16px;font-size:12px;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;">Audit Log</div>
            <div style="padding:10px 16px;font-size:12px;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;">Updates</div>
          </div>
          <div style="background:#ffffff;border-radius:10px;border:1px solid #e2e8f0;padding:16px;">
            <h2 style="margin:0 0 6px;font-size:14px;font-weight:700;color:#0f172a;">Export Data</h2>
            <p style="margin:0 0 16px;font-size:11px;color:#64748b;">Download system data for backup, audit, or migration. Each export triggers an async download via POST /api/exports/* with the indicated MIME type.</p>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;">
              <button style="display:flex;align-items:center;gap:8px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;cursor:pointer;text-align:left;"><span style="font-size:18px;">&#x2699;</span><div style="flex:1;"><div style="font-size:12px;font-weight:600;color:#0f172a;">Configuration</div><div style="font-size:10px;color:#64748b;margin-top:2px;">All settings + users + plugins</div></div><span style="padding:2px 6px;border-radius:3px;background:#dbeafe;color:#1d4ed8;font-size:9px;font-weight:600;">JSON</span></button>
              <button style="display:flex;align-items:center;gap:8px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;cursor:pointer;text-align:left;"><span style="font-size:18px;">&#x2630;</span><div style="flex:1;"><div style="font-size:12px;font-weight:600;color:#0f172a;">Logs</div><div style="font-size:10px;color:#64748b;margin-top:2px;">Last 90d, per-module filter</div></div><span style="padding:2px 6px;border-radius:3px;background:#dbeafe;color:#1d4ed8;font-size:9px;font-weight:600;">JSONL</span></button>
              <button style="display:flex;align-items:center;gap:8px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;cursor:pointer;text-align:left;"><span style="font-size:18px;">&#x26A0;</span><div style="flex:1;"><div style="font-size:12px;font-weight:600;color:#0f172a;">Notifications</div><div style="font-size:10px;color:#64748b;margin-top:2px;">All severity levels</div></div><span style="padding:2px 6px;border-radius:3px;background:#dbeafe;color:#1d4ed8;font-size:9px;font-weight:600;">CSV</span></button>
              <button style="display:flex;align-items:center;gap:8px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;cursor:pointer;text-align:left;"><span style="font-size:18px;">&#x23F0;</span><div style="flex:1;"><div style="font-size:12px;font-weight:600;color:#0f172a;">Activity Feed</div><div style="font-size:10px;color:#64748b;margin-top:2px;">Per-day aggregation</div></div><span style="padding:2px 6px;border-radius:3px;background:#dbeafe;color:#1d4ed8;font-size:9px;font-weight:600;">JSON</span></button>
              <button style="display:flex;align-items:center;gap:8px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;cursor:pointer;text-align:left;"><span style="font-size:18px;">&#x26C4;</span><div style="flex:1;"><div style="font-size:12px;font-weight:600;color:#0f172a;">Cluster State</div><div style="font-size:10px;color:#64748b;margin-top:2px;">Full topology snapshot</div></div><span style="padding:2px 6px;border-radius:3px;background:#dbeafe;color:#1d4ed8;font-size:9px;font-weight:600;">JSON</span></button>
              <button style="display:flex;align-items:center;gap:8px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;cursor:pointer;text-align:left;"><span style="font-size:18px;">&#x26BF;</span><div style="flex:1;"><div style="font-size:12px;font-weight:600;color:#0f172a;">Theme Library</div><div style="font-size:10px;color:#64748b;margin-top:2px;">All built-in + custom themes</div></div><span style="padding:2px 6px;border-radius:3px;background:#dbeafe;color:#1d4ed8;font-size:9px;font-weight:600;">JSON</span></button>
              <button style="display:flex;align-items:center;gap:8px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;cursor:pointer;text-align:left;"><span style="font-size:18px;">&#x26A1;</span><div style="flex:1;"><div style="font-size:12px;font-weight:600;color:#0f172a;">GPU Inventory</div><div style="font-size:10px;color:#64748b;margin-top:2px;">Per-node GPU + allocations</div></div><span style="padding:2px 6px;border-radius:3px;background:#dbeafe;color:#1d4ed8;font-size:9px;font-weight:600;">JSON</span></button>
              <button style="display:flex;align-items:center;gap:8px;padding:12px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;cursor:pointer;text-align:left;"><span style="font-size:18px;">&#x26F6;</span><div style="flex:1;"><div style="font-size:12px;font-weight:600;color:#0f172a;">Network Topology</div><div style="font-size:10px;color:#64748b;margin-top:2px;">Per-node interfaces + VLANs</div></div><span style="padding:2px 6px;border-radius:3px;background:#dbeafe;color:#1d4ed8;font-size:9px;font-weight:600;">JSON</span></button>
