        <main style="flex:1;overflow-y:auto;padding:16px 20px;box-sizing:border-box;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;"><div><h1 style="font-size:24px;font-weight:700;margin:0;color:#0f172a;">System Management</h1><p style="font-size:13px;color:#64748b;margin:4px 0 0;">Backups, exports, stats, history — consolidated admin actions</p></div><span style="font-size:11px;color:#64748b;">Admin only</span></div>
