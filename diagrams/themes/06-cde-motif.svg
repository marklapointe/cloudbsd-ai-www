<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Helvetica, Arial, sans-serif">
  <title>Theme Mock-Up — CDE Motif — Dashboard at 1280x800</title>
  <desc>Motif-style widget toolkit aesthetic with hard 3D beveled borders, pastel gray surfaces, and busy diagonal-stripe backgrounds. Title bars with classic dotted resize grip. WCAG AA contrast on all text.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
