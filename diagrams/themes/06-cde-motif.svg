                <li class="py-2 flex" style="border-top: 1px solid #8c8c98;"><span class="w-32" style="color: #2a2a36;">12:31:18</span><span class="ml-2" style="color: #1a1a24;">jail `transmission` entered STATE: STARTED</span></li>
                <li class="py-2 flex" style="border-top: 1px solid #8c8c98;"><span class="w-32" style="color: #2a2a36;">12:18:44</span><span class="ml-2" style="color: #1a1a24;">vm `nextcloud` reported guest-agent heartbeat (3s drift)</span></li>
