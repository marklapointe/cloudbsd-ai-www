                <a class="block px-3 py-2 rounded-xl" style="color: #cbd5e1;">Jails</a>
                <a class="block px-3 py-2 rounded-xl" style="color: #cbd5e1;">Volumes</a>
                <a class="block px-3 py-2 rounded-xl" style="color: #cbd5e1;">Network Map</a>
                <a class="block px-3 py-2 rounded-xl" style="color: #cbd5e1;">Cluster</a>
                <div class="pt-3 pb-1 text-xs uppercase tracking-wide px-3" style="color: #a5b4fc; font-weight: 700;">Admin</div>
                <a class="block px-3 py-2 rounded-xl" style="color: #cbd5e1;">Users</a>
                <a class="block px-3 py-2 rounded-xl" style="color: #cbd5e1;">Logs</a>
                <a class="block px-3 py-2 rounded-xl" style="color: #cbd5e1;">Notifications</a>
                <a class="block px-3 py-2 rounded-xl" style="color: #cbd5e1;">Settings</a>
