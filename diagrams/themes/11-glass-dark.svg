              <span class="font-bold text-base" style="color: #f1f5f9;">CloudBSD Admin</span>
              <span class="ml-2 px-2 py-0.5 text-xs font-medium rounded-full" style="background: rgba(129,140,248,0.2); color: #c7d2fe; border: 1px solid rgba(129,140,248,0.4);">glass-dark</span>
            </div>
            <div class="ml-auto flex items-center gap-4">
              <span class="text-sm" style="color: #94a3b8;">freenas-mock.local</span>
              <button class="text-sm px-4 py-1.5 rounded-full font-medium text-white" style="background: linear-gradient(135deg, #818cf8 0%, #f472b6 100%); box-shadow: 0 4px 16px rgba(129,140,248,0.5);">Refresh</button>
              <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold text-white" style="background: linear-gradient(135deg, #22d3ee 0%, #818cf8 100%); box-shadow: 0 2px 8px rgba(34,211,238,0.4);">M</div>
