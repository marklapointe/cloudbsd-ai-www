<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Inter, system-ui, sans-serif">
  <title>Theme Mock-Up — Glass Dark — Dashboard at 1280x800</title>
  <desc>Modern frosted glass aesthetic on dark slate. Translucent panels with backdrop blur, neon blue and pink accents over deep navy. WCAG AA contrast on text.</desc>
  <defs>
    <linearGradient id="bgGradientDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0c0a1f"/>
    </linearGradient>
    <radialGradient id="orbDark1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbDark2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbDark3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full relative" style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0c0a1f 100%); font-family: Inter, system-ui, sans-serif; color: #e2e8f0; overflow: hidden;">
      <svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none" viewBox="0 0 1280 800">
        <circle cx="180" cy="160" r="260" fill="url(#orbDark1)"/>
        <circle cx="1100" cy="220" r="300" fill="url(#orbDark2)"/>
        <circle cx="640" cy="720" r="340" fill="url(#orbDark3)"/>
        <circle cx="100" cy="650" r="200" fill="url(#orbDark1)" opacity="0.6"/>
        <circle cx="1200" cy="700" r="220" fill="url(#orbDark3)" opacity="0.5"/>
      </svg>
      <div class="relative z-10 h-full">
        <g id="theme-header" class="contents">
          <div class="h-14 flex items-center px-4" style="background: rgba(15,23,42,0.55); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 24px rgba(0,0,0,0.4);">
            <div class="flex items-center gap-3">
