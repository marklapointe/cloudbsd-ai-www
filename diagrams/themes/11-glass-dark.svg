                  <li class="py-2 flex" style="border-bottom: 1px solid rgba(255,255,255,0.06);"><span class="w-32" style="color: #94a3b8;">12:42:01</span><span class="ml-2" style="color: #cbd5e1;">snapshot daily@auto-2026-07-06_03-00 created on tank/data</span></li>
                  <li class="py-2 flex" style="border-bottom: 1px solid rgba(255,255,255,0.06);"><span class="w-32" style="color: #94a3b8;">12:31:18</span><span class="ml-2" style="color: #cbd5e1;">jail `transmission` entered STATE: STARTED</span></li>
                  <li class="py-2 flex" style="border-bottom: 1px solid rgba(255,255,255,0.06);"><span class="w-32" style="color: #94a3b8;">12:18:44</span><span class="ml-2" style="color: #cbd5e1;">vm `nextcloud` reported guest-agent heartbeat (3s drift)</span></li>
                  <li class="py-2 flex"><span class="w-32" style="color: #94a3b8;">11:55:09</span><span class="ml-2" style="color: #cbd5e1;">scrub of tank completed with 0 errors</span></li>
                </ul>
