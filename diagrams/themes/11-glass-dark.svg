                    <div class="px-2 py-1 rounded-full font-medium" style="background: rgba(244,114,182,0.2); color: #fbcfe8;">4 CT</div>
                    <div class="px-2 py-1 rounded-full font-medium" style="background: rgba(34,211,238,0.2); color: #a5f3fc;">3 Jails</div>
                  </div>
                  <div class="mt-2 text-xs" style="color: #94a3b8;">7 datasets · 2 snaps today</div>
                </div>
