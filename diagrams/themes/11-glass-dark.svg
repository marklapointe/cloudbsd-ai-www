              <div class="mt-6 p-4 rounded-2xl" style="background: rgba(30,41,59,0.5); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 8px 24px rgba(0,0,0,0.3);">
                <div class="flex items-center justify-between mb-3">
