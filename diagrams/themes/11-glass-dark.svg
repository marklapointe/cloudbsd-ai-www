                    <div class="text-xs px-2 py-0.5 rounded-full font-medium" style="background: rgba(148,163,184,0.2); color: #94a3b8;">R/O</div>
                  </div>
                  <div class="text-3xl font-bold mt-2" style="color: #f8fafc;">12</div>
                  <div class="mt-3 grid grid-cols-3 gap-2 text-xs text-center">
