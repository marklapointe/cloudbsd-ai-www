                    <div class="text-xs px-2 py-0.5 rounded-full font-medium" style="background: rgba(244,63,94,0.2); color: #fb7185;">3 critical</div>
                  </div>
                  <div class="text-3xl font-bold mt-2" style="color: #f8fafc;">17</div>
                  <div class="mt-3 grid grid-cols-3 gap-2 text-xs">
                    <div class="px-2 py-1 text-center rounded-full font-medium" style="background: rgba(244,63,94,0.2); color: #fb7185;">3 crit</div>
                    <div class="px-2 py-1 text-center rounded-full font-medium" style="background: rgba(234,179,8,0.2); color: #fbbf24;">6 warn</div>
                    <div class="px-2 py-1 text-center rounded-full font-medium" style="background: rgba(34,211,238,0.2); color: #67e8f9;">8 info</div>
                  </div>
