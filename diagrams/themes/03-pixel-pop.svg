<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="'Courier New', 'Lucida Console', monospace">
  <title>Theme Mock-Up — Pixel Pop — Dashboard at 1280x800</title>
  <desc>Retro 8-bit arcade aesthetic with saturated primary colors, hard 4px black borders, no border radius, and chunky monospace typography. WCAG AA contrast maintained on solid blocks.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full" style="background: #fde047; font-family: 'Courier New', monospace;">
      <g id="theme-header" class="contents">
        <div class="h-14 flex items-center px-4" style="background: #ef4444; border-bottom: 4px solid #000; box-shadow: 0 4px 0 0 #000;">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 flex items-center justify-center font-extrabold text-white" style="background: #2563eb; border: 3px solid #000;">C</div>
            <span class="font-extrabold text-lg tracking-wider text-white">CLOUDB::SD.ADM</span>
            <span class="ml-2 px-2 py-0.5 text-xs font-bold tracking-widest text-black" style="background: #fde047; border: 2px solid #000;">PIXEL-POP</span>
          </div>
          <div class="ml-auto flex items-center gap-4">
            <span class="text-sm font-bold text-yellow-200">freenas-mock.local</span>
            <button class="text-sm font-bold text-white px-3 py-1" style="background: #16a34a; border: 2px solid #000; box-shadow: 2px 2px 0 0 #000;">REFRESH</button>
            <div class="w-8 h-8 flex items-center justify-center text-sm font-extrabold text-white" style="background: #a855f7; border: 3px solid #000;">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 64px);">
        <g id="theme-sidebar" class="contents">
          <aside class="w-56 p-3 overflow-y-auto" style="background: #1d4ed8; border-right: 4px solid #000;">
            <nav class="space-y-2 text-sm font-bold">
              <a class="block px-3 py-2 text-black" style="background: #fde047; border: 3px solid #000; box-shadow: 4px 4px 0 0 #000;">DASHBOARD</a>
              <a class="block px-3 py-2 text-white" style="background: #2563eb; border: 3px solid #000;">VMS</a>
              <a class="block px-3 py-2 text-white" style="background: #2563eb; border: 3px solid #000;">CONTAINERS</a>
              <a class="block px-3 py-2 text-white" style="background: #2563eb; border: 3px solid #000;">JAILS</a>
              <a class="block px-3 py-2 text-white" style="background: #2563eb; border: 3px solid #000;">VOLUMES</a>
              <a class="block px-3 py-2 text-white" style="background: #2563eb; border: 3px solid #000;">NETWORK</a>
              <a class="block px-3 py-2 text-white" style="background: #2563eb; border: 3px solid #000;">CLUSTER</a>
              <div class="pt-3 pb-1 text-xs tracking-widest px-3 text-yellow-300">-- ADMIN --</div>
              <a class="block px-3 py-2 text-white" style="background: #2563eb; border: 3px solid #000;">USERS</a>
              <a class="block px-3 py-2 text-white" style="background: #2563eb; border: 3px solid #000;">LOGS</a>
              <a class="block px-3 py-2 text-white" style="background: #2563eb; border: 3px solid #000;">NOTIFY</a>
              <a class="block px-3 py-2 text-white" style="background: #2563eb; border: 3px solid #000;">SETTINGS</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 p-6 overflow-auto">
          <g id="theme-content" class="contents">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h1 class="text-3xl font-extrabold text-black tracking-wider">[ DASHBOARD ]</h1>
                <p class="text-sm font-bold text-black">&gt; HOST: freenas-mock.local · CONN:OK</p>
              </div>
              <div class="text-sm font-bold text-black px-3 py-1" style="background: #fff; border: 3px solid #000; box-shadow: 3px 3px 0 0 #000;">REFRESH:12s</div>
            </div>
            <div class="grid grid-cols-3 gap-4">
              <div class="p-4" style="background: #fff; border: 4px solid #000; box-shadow: 6px 6px 0 0 #000;">
                <div class="flex items-center justify-between">
