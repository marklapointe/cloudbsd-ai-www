                  <div class="text-xs font-bold px-2 py-0.5 text-white" style="background: #16a34a; border: 2px solid #000;">OK</div>
                </div>
                <div class="text-4xl font-extrabold mt-2 text-black">42%</div>
                <div class="mt-3 h-4 overflow-hidden" style="background: #fff; border: 2px solid #000;">
