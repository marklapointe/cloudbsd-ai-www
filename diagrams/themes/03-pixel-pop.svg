              </div>
              <div class="p-4" style="background: #fff; border: 4px solid #000; box-shadow: 6px 6px 0 0 #000;">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-extrabold text-black">MEMORY</div>
                  <div class="text-xs font-bold px-2 py-0.5 text-black" style="background: #fde047; border: 2px solid #000;">WATCH</div>
                </div>
                <div class="text-4xl font-extrabold mt-2 text-black">8.2/16 GB</div>
                <div class="mt-3 h-4 overflow-hidden" style="background: #fff; border: 2px solid #000;">
                  <div class="h-full" style="width: 51%; background: #f59e0b;"></div>
                </div>
                <div class="mt-2 text-xs font-bold text-black">ARC 2.4 GB · SWAP 64M</div>
              </div>
              <div class="p-4" style="background: #fff; border: 4px solid #000; box-shadow: 6px 6px 0 0 #000;">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-extrabold text-black">DISK</div>
                  <div class="text-xs font-bold px-2 py-0.5 text-white" style="background: #16a34a; border: 2px solid #000;">OK</div>
                </div>
                <div class="text-4xl font-extrabold mt-2 text-black">245/920 GB</div>
                <div class="mt-3 h-4 overflow-hidden" style="background: #fff; border: 2px solid #000;">
                  <div class="h-full" style="width: 27%; background: #2563eb;"></div>
                </div>
                <div class="mt-2 text-xs font-bold text-black">ZPOOL TANK · SUN 03:00</div>
              </div>
              <div class="p-4" style="background: #fff; border: 4px solid #000; box-shadow: 6px 6px 0 0 #000;">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-extrabold text-black">NETWORK</div>
                  <div class="text-xs font-bold px-2 py-0.5 text-white" style="background: #16a34a; border: 2px solid #000;">OK</div>
                </div>
                <div class="text-4xl font-extrabold mt-2 text-black">^ 12.4 MB/S</div>
                <div class="mt-3 h-4 overflow-hidden" style="background: #fff; border: 2px solid #000;">
                  <div class="h-full" style="width: 18%; background: #a855f7;"></div>
                </div>
                <div class="mt-2 text-xs font-bold text-black">v 86.1 MB/S · 3 IFs</div>
              </div>
              <div class="p-4" style="background: #fff; border: 4px solid #000; box-shadow: 6px 6px 0 0 #000;">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-extrabold text-black">NOTIFY</div>
                  <div class="text-xs font-bold px-2 py-0.5 text-white" style="background: #dc2626; border: 2px solid #000;">3 CRIT</div>
                </div>
                <div class="text-4xl font-extrabold mt-2 text-black">17</div>
                <div class="mt-3 grid grid-cols-3 gap-2 text-xs">
                  <div class="px-2 py-1 text-center font-bold text-white" style="background: #dc2626; border: 2px solid #000;">3 CRIT</div>
                  <div class="px-2 py-1 text-center font-bold text-black" style="background: #fde047; border: 2px solid #000;">6 WARN</div>
                  <div class="px-2 py-1 text-center font-bold text-white" style="background: #2563eb; border: 2px solid #000;">8 INFO</div>
                </div>
                <div class="mt-2 text-xs font-bold text-black">SCRUB DELAY ON TANK</div>
              </div>
              <div class="p-4" style="background: #fff; border: 4px solid #000; box-shadow: 6px 6px 0 0 #000;">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-extrabold text-black">WORKLOADS</div>
                  <div class="text-xs font-bold px-2 py-0.5 text-black" style="background: #fff; border: 2px solid #000;">R/O</div>
                </div>
                <div class="text-4xl font-extrabold mt-2 text-black">12</div>
                <div class="mt-3 grid grid-cols-3 gap-2 text-xs text-center">
                  <div class="px-2 py-1 font-bold text-white" style="background: #ef4444; border: 2px solid #000;">5 VMS</div>
                  <div class="px-2 py-1 font-bold text-white" style="background: #16a34a; border: 2px solid #000;">4 CT</div>
                  <div class="px-2 py-1 font-bold text-white" style="background: #a855f7; border: 2px solid #000;">3 JAILS</div>
                </div>
                <div class="mt-2 text-xs font-bold text-black">7 DS · 2 SNAPS TODAY</div>
              </div>
            </div>
            <div class="mt-6 p-4" style="background: #fff; border: 4px solid #000; box-shadow: 6px 6px 0 0 #000;">
              <div class="flex items-center justify-between mb-3">
                <div class="font-extrabold text-black tracking-wider">[ RECENT ACTIVITY ]</div>
                <div class="text-xs font-bold text-white px-2 py-1" style="background: #2563eb; border: 2px solid #000;">VIEW-ONLY</div>
              </div>
              <ul class="text-sm font-bold">
                <li class="py-2 flex" style="border-top: 2px solid #000;"><span class="w-32 text-red-700">12:42:01</span><span class="ml-2 text-black">&gt; SNAPSHOT DAILY@AUTO CREATED</span></li>
                <li class="py-2 flex" style="border-top: 2px solid #000;"><span class="w-32 text-red-700">12:31:18</span><span class="ml-2 text-black">&gt; JAIL TRANSMISSION = STARTED</span></li>
                <li class="py-2 flex" style="border-top: 2px solid #000;"><span class="w-32 text-red-700">12:18:44</span><span class="ml-2 text-black">&gt; VM NEXTCLOUD HEARTBEAT 3s</span></li>
                <li class="py-2 flex" style="border-top: 2px solid #000;"><span class="w-32 text-red-700">11:55:09</span><span class="ml-2 text-black">&gt; SCRUB TANK = 0 ERRORS</span></li>
              </ul>
            </div>
          </g>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>