<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="'MS Sans Serif', 'Tahoma', 'Verdana', sans-serif">
  <title>Theme Mock-Up — Beige Box — Dashboard at 1280x800</title>
  <desc>Retro late-80s early-90s beige PC aesthetic with embossed gray headers, soft warm beige background, and low-saturation accent colors. Title bar reads like a vintage system dialog. WCAG AA contrast.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
