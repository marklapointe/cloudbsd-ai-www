<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Menlo, Consolas, Courier New, monospace">
  <title>Theme Mock-Up — Phosphor CRT — Dashboard at 1280x800</title>
  <desc>Retro green-on-black phosphor terminal aesthetic. Monospace font, scanline overlay, glow text, deep black background. WCAG AAA contrast on primary text.</desc>
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#000000"/>
      <line x1="0" y1="0" x2="4" y2="0" stroke="#0a1a0a" stroke-width="1"/>
    </pattern>
    <filter id="phosphorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="crtVignette" cx="50%" cy="50%" r="75%">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full" style="background: #050805; color: #66ff66; font-family: Menlo, Consolas, Courier New, monospace;">
      <g id="theme-header" class="contents">
        <div class="h-14 flex items-center px-4 relative" style="background: #0a1a0a; border-bottom: 1px solid #1f3f1f; box-shadow: 0 0 12px rgba(102,255,102,0.15);">
          <div class="flex items-center gap-3 relative z-10">
            <div class="w-8 h-8 flex items-center justify-center font-bold" style="background: #66ff66; color: #000000; box-shadow: 0 0 8px #66ff66;">C</div>
            <span class="font-bold text-base tracking-wide" style="color: #66ff66; text-shadow: 0 0 6px #66ff66;">CloudBSD Admin</span>
            <span class="ml-2 px-2 py-0.5 text-xs" style="background: #000000; color: #66ff66; border: 1px solid #66ff66; box-shadow: inset 0 0 6px rgba(102,255,102,0.3);">[phosphor-crt]</span>
          </div>
          <div class="ml-auto flex items-center gap-4 relative z-10">
            <span class="text-sm" style="color: #66ff66;">&gt; freenas-mock.local</span>
            <button class="text-sm px-3 py-1" style="background: #000000; color: #66ff66; border: 1px solid #66ff66; box-shadow: inset 0 0 6px rgba(102,255,102,0.3);">[REFRESH]</button>
            <div class="w-8 h-8 flex items-center justify-center text-sm font-bold" style="background: #66ff66; color: #000000; box-shadow: 0 0 8px #66ff66;">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="theme-sidebar" class="contents">
          <aside class="w-56 p-3 overflow-y-auto" style="background: #050805; border-right: 1px solid #1f3f1f;">
            <nav class="space-y-1 text-sm" style="font-family: Menlo, Consolas, Courier New, monospace;">
              <a class="block px-3 py-2 font-bold" style="background: #0a3a0a; color: #aaffaa; box-shadow: inset 2px 0 0 #66ff66; text-shadow: 0 0 4px #66ff66;">&gt; DASHBOARD</a>
              <a class="block px-3 py-2" style="color: #66ff66;">&gt; virtual_machines</a>
              <a class="block px-3 py-2" style="color: #66ff66;">&gt; containers</a>
              <a class="block px-3 py-2" style="color: #66ff66;">&gt; jails</a>
              <a class="block px-3 py-2" style="color: #66ff66;">&gt; volumes</a>
              <a class="block px-3 py-2" style="color: #66ff66;">&gt; network_map</a>
              <a class="block px-3 py-2" style="color: #66ff66;">&gt; cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-widest px-3" style="color: #338833;"># admin</div>
              <a class="block px-3 py-2" style="color: #66ff66;">&gt; users</a>
              <a class="block px-3 py-2" style="color: #66ff66;">&gt; logs</a>
              <a class="block px-3 py-2" style="color: #66ff66;">&gt; notifications</a>
              <a class="block px-3 py-2" style="color: #66ff66;">&gt; settings</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 p-6 overflow-auto" style="position: relative;">
          <g id="theme-content" class="contents">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h1 class="text-2xl font-bold" style="color: #aaffaa; text-shadow: 0 0 8px #66ff66;">== DASHBOARD ==</h1>
                <p class="text-sm" style="color: #66ff66;">[host: freenas-mock.local] [middleware: connected]</p>
              </div>
              <div class="text-sm" style="color: #66ff66;">[last_refresh: 12s]</div>
            </div>
            <div class="grid grid-cols-3 gap-4">
              <div class="p-4" style="background: #050805; border: 1px solid #1f3f1f; box-shadow: 0 0 8px rgba(102,255,102,0.1), inset 0 0 12px rgba(102,255,102,0.05);">
                <div class="flex items-center justify-between">
                  <div class="text-sm" style="color: #66ff66;">cpu_usage</div>
                  <div class="text-xs px-2 py-0.5" style="background: #0a3a0a; color: #aaffaa; border: 1px solid #1f7f1f;">[HEALTHY]</div>
                </div>
                <div class="text-3xl font-bold mt-2" style="color: #aaffaa; text-shadow: 0 0 8px #66ff66;">42%</div>
                <div class="mt-3 h-3" style="background: #0a1a0a; border: 1px solid #1f3f1f;">
                  <div class="h-full" style="width: 42%; background: repeating-linear-gradient(90deg, #66ff66 0px, #66ff66 4px, #338833 4px, #338833 6px); box-shadow: 0 0 6px #66ff66;"></div>
                </div>
                <div class="mt-2 text-xs" style="color: #66ff66;">cores: 8 · load_avg: 1.42</div>
              </div>
              <div class="p-4" style="background: #050805; border: 1px solid #1f3f1f; box-shadow: 0 0 8px rgba(102,255,102,0.1), inset 0 0 12px rgba(102,255,102,0.05);">
                <div class="flex items-center justify-between">
                  <div class="text-sm" style="color: #66ff66;">memory</div>
                  <div class="text-xs px-2 py-0.5" style="background: #3a2a0a; color: #ffcc66; border: 1px solid #7f5f1f;">[WATCH]</div>
                </div>
                <div class="text-3xl font-bold mt-2" style="color: #aaffaa; text-shadow: 0 0 8px #66ff66;">8.2/16GB</div>
                <div class="mt-3 h-3" style="background: #0a1a0a; border: 1px solid #1f3f1f;">
                  <div class="h-full" style="width: 51%; background: repeating-linear-gradient(90deg, #ffcc66 0px, #ffcc66 4px, #aa7f33 4px, #aa7f33 6px); box-shadow: 0 0 6px #ffcc66;"></div>
                </div>
                <div class="mt-2 text-xs" style="color: #66ff66;">arc: 2.4GB · swap: 64MB</div>
              </div>
              <div class="p-4" style="background: #050805; border: 1px solid #1f3f1f; box-shadow: 0 0 8px rgba(102,255,102,0.1), inset 0 0 12px rgba(102,255,102,0.05);">
                <div class="flex items-center justify-between">
                  <div class="text-sm" style="color: #66ff66;">disk</div>
                  <div class="text-xs px-2 py-0.5" style="background: #0a3a0a; color: #aaffaa; border: 1px solid #1f7f1f;">[HEALTHY]</div>
                </div>
                <div class="text-3xl font-bold mt-2" style="color: #aaffaa; text-shadow: 0 0 8px #66ff66;">245/920GB</div>
                <div class="mt-3 h-3" style="background: #0a1a0a; border: 1px solid #1f3f1f;">
                  <div class="h-full" style="width: 27%; background: repeating-linear-gradient(90deg, #66ff66 0px, #66ff66 4px, #338833 4px, #338833 6px); box-shadow: 0 0 6px #66ff66;"></div>
                </div>
                <div class="mt-2 text-xs" style="color: #66ff66;">zpool: tank · scrub: Sun 03:00</div>
              </div>
              <div class="p-4" style="background: #050805; border: 1px solid #1f3f1f; box-shadow: 0 0 8px rgba(102,255,102,0.1), inset 0 0 12px rgba(102,255,102,0.05);">
                <div class="flex items-center justify-between">
                  <div class="text-sm" style="color: #66ff66;">network</div>
                  <div class="text-xs px-2 py-0.5" style="background: #0a3a0a; color: #aaffaa; border: 1px solid #1f7f1f;">[HEALTHY]</div>
                </div>
                <div class="text-3xl font-bold mt-2" style="color: #aaffaa; text-shadow: 0 0 8px #66ff66;">^ 12.4MB/s</div>
                <div class="mt-3 h-3" style="background: #0a1a0a; border: 1px solid #1f3f1f;">
                  <div class="h-full" style="width: 18%; background: repeating-linear-gradient(90deg, #66ff66 0px, #66ff66 4px, #338833 4px, #338833 6px); box-shadow: 0 0 6px #66ff66;"></div>
                </div>
                <div class="mt-2 text-xs" style="color: #66ff66;">v 86.1MB/s · 3 ifaces</div>
              </div>
              <div class="p-4" style="background: #050805; border: 1px solid #1f3f1f; box-shadow: 0 0 8px rgba(102,255,102,0.1), inset 0 0 12px rgba(102,255,102,0.05);">
                <div class="flex items-center justify-between">
                  <div class="text-sm" style="color: #66ff66;">notifications</div>
                  <div class="text-xs px-2 py-0.5" style="background: #3a0a0a; color: #ff6666; border: 1px solid #7f1f1f; text-shadow: 0 0 4px #ff6666;">[3 CRITICAL]</div>
                </div>
                <div class="text-3xl font-bold mt-2" style="color: #aaffaa; text-shadow: 0 0 8px #66ff66;">17</div>
                <div class="mt-3 grid grid-cols-3 gap-2 text-xs">
                  <div class="px-2 py-1 text-center" style="background: #3a0a0a; color: #ff6666; border: 1px solid #7f1f1f;">3 crit</div>
                  <div class="px-2 py-1 text-center" style="background: #3a2a0a; color: #ffcc66; border: 1px solid #7f5f1f;">6 warn</div>
                  <div class="px-2 py-1 text-center" style="background: #0a1a3a; color: #66aaff; border: 1px solid #1f3f7f;">8 info</div>
                </div>
                <div class="mt-2 text-xs" style="color: #66ff66;">! scrub delayed on tank/data</div>
              </div>
              <div class="p-4" style="background: #050805; border: 1px solid #1f3f1f; box-shadow: 0 0 8px rgba(102,255,102,0.1), inset 0 0 12px rgba(102,255,102,0.05);">
                <div class="flex items-center justify-between">
                  <div class="text-sm" style="color: #66ff66;">workloads</div>
                  <div class="text-xs px-2 py-0.5" style="background: #0a1a0a; color: #338833; border: 1px solid #1f3f1f;">[R/O]</div>
                </div>
                <div class="text-3xl font-bold mt-2" style="color: #aaffaa; text-shadow: 0 0 8px #66ff66;">12</div>
                <div class="mt-3 grid grid-cols-3 gap-2 text-xs text-center">
                  <div class="px-2 py-1" style="background: #0a1a0a; color: #66ff66; border: 1px solid #1f3f1f;">5 VMs</div>
                  <div class="px-2 py-1" style="background: #0a1a0a; color: #66ff66; border: 1px solid #1f3f1f;">4 CT</div>
                  <div class="px-2 py-1" style="background: #0a1a0a; color: #66ff66; border: 1px solid #1f3f1f;">3 JAIL</div>
                </div>
                <div class="mt-2 text-xs" style="color: #66ff66;">datasets: 7 · snaps_today: 2</div>
              </div>
            </div>
            <div class="mt-6 p-4" style="background: #050805; border: 1px solid #1f3f1f; box-shadow: 0 0 8px rgba(102,255,102,0.1), inset 0 0 12px rgba(102,255,102,0.05);">
              <div class="flex items-center justify-between mb-3">
                <div class="font-bold" style="color: #aaffaa; text-shadow: 0 0 6px #66ff66;">== RECENT_ACTIVITY ==</div>
                <div class="text-xs" style="color: #66ff66;">[view-only log]</div>
              </div>
              <ul class="text-sm" style="border-top: 1px dashed #1f3f1f;">
                <li class="py-1 flex" style="border-bottom: 1px dashed #1f3f1f;"><span class="w-32" style="color: #338833;">[12:42:01]</span><span class="ml-2" style="color: #66ff66;">OK snapshot daily@auto-2026-07-06_03-00 created on tank/data</span></li>
                <li class="py-1 flex" style="border-bottom: 1px dashed #1f3f1f;"><span class="w-32" style="color: #338833;">[12:31:18]</span><span class="ml-2" style="color: #66ff66;">OK jail `transmission` entered STATE: STARTED</span></li>
                <li class="py-1 flex" style="border-bottom: 1px dashed #1f3f1f;"><span class="w-32" style="color: #338833;">[12:18:44]</span><span class="ml-2" style="color: #66ff66;">OK vm `nextcloud` reported guest-agent heartbeat (3s drift)</span></li>
                <li class="py-1 flex"><span class="w-32" style="color: #338833;">[11:55:09]</span><span class="ml-2" style="color: #66ff66;">OK scrub of tank completed with 0 errors</span></li>
              </ul>
            </div>
            <svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none" viewBox="0 0 1280 800">
              <rect width="1280" height="800" fill="url(#scanlines)" opacity="0.4"/>
              <rect width="1280" height="800" fill="url(#crtVignette)"/>
            </svg>
          </g>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>
