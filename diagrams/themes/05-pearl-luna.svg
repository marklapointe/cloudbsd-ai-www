<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, -apple-system, sans-serif">
  <title>Theme Mock-Up — Pearl Luna — Dashboard at 1280x800</title>
  <desc>Pearl and luna blue rounded aesthetic with soft lavender accents and generous corner radii. Translucent cards on a soft gradient background. WCAG AA contrast.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full" style="background: linear-gradient(180deg, #e0e7ff 0%, #f5f3ff 50%, #fce7f3 100%); font-family: -apple-system, BlinkMacSystemFont, sans-serif;">
      <g id="theme-header" class="contents">
        <div class="h-14 mx-3 mt-3 flex items-center px-5" style="background: rgba(255,255,255,0.7); border-radius: 18px; box-shadow: 0 6px 24px rgba(99,102,241,0.12); backdrop-filter: blur(12px);">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-full flex items-center justify-center font-bold text-white" style="background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%); box-shadow: 0 4px 12px rgba(129,140,248,0.4);">C</div>
            <span class="font-bold text-lg" style="color: #312e81;">CloudBSD Admin</span>
            <span class="ml-2 px-3 py-0.5 text-xs font-bold rounded-full" style="background: linear-gradient(90deg, #c7d2fe, #e9d5ff); color: #4338ca;">pearl-luna</span>
          </div>
          <div class="ml-auto flex items-center gap-3">
            <span class="text-sm" style="color: #6366f1;">freenas-mock.local</span>
            <button class="text-sm font-medium px-4 py-1.5 rounded-full" style="background: rgba(255,255,255,0.8); color: #4338ca; box-shadow: 0 2px 6px rgba(99,102,241,0.15);">Refresh</button>
            <div class="w-9 h-9 rounded-full flex items-center justify-center text-sm font-bold text-white" style="background: linear-gradient(135deg, #f472b6 0%, #c084fc 100%); box-shadow: 0 4px 12px rgba(244,114,182,0.4);">M</div>
          </div>
        </div>
      </g>
      <div class="flex mx-3 mt-3 mb-3" style="height: calc(100% - 90px); gap: 12px;">
        <g id="theme-sidebar" class="contents">
          <aside class="w-60 p-3 overflow-y-auto" style="background: rgba(255,255,255,0.65); border-radius: 22px; box-shadow: 0 6px 24px rgba(99,102,241,0.1); backdrop-filter: blur(12px);">
            <nav class="space-y-1 text-sm p-2">
              <a class="block px-4 py-2.5 rounded-2xl font-semibold" style="background: linear-gradient(90deg, #c7d2fe, #e9d5ff); color: #3730a3;">Dashboard</a>
              <a class="block px-4 py-2.5 rounded-2xl" style="color: #4338ca;">Virtual Machines</a>
              <a class="block px-4 py-2.5 rounded-2xl" style="color: #4338ca;">Containers</a>
              <a class="block px-4 py-2.5 rounded-2xl" style="color: #4338ca;">Jails</a>
              <a class="block px-4 py-2.5 rounded-2xl" style="color: #4338ca;">Volumes</a>
              <a class="block px-4 py-2.5 rounded-2xl" style="color: #4338ca;">Network Map</a>
              <a class="block px-4 py-2.5 rounded-2xl" style="color: #4338ca;">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide px-4" style="color: #a5b4fc;">Admin</div>
              <a class="block px-4 py-2.5 rounded-2xl" style="color: #4338ca;">Users</a>
              <a class="block px-4 py-2.5 rounded-2xl" style="color: #4338ca;">Logs</a>
              <a class="block px-4 py-2.5 rounded-2xl" style="color: #4338ca;">Notifications</a>
              <a class="block px-4 py-2.5 rounded-2xl" style="color: #4338ca;">Settings</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 p-2 overflow-auto">
          <g id="theme-content" class="contents">
            <div class="flex items-center justify-between mb-4 px-3 pt-2">
              <div>
