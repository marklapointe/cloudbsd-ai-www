              </div>
              <div class="p-5" style="background: rgba(255,255,255,0.75); border-radius: 22px; box-shadow: 0 6px 24px rgba(99,102,241,0.1); backdrop-filter: blur(10px);">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-medium" style="color: #6366f1;">Notifications</div>
                  <div class="text-xs font-semibold px-3 py-0.5 rounded-full" style="background: #fce7f3; color: #be185d;">3 critical</div>
                </div>
                <div class="text-4xl font-bold mt-2" style="color: #312e81;">17</div>
                <div class="mt-3 grid grid-cols-3 gap-2 text-xs">
                  <div class="px-2 py-1 text-center font-semibold rounded-full" style="background: #fce7f3; color: #be185d;">3 crit</div>
                  <div class="px-2 py-1 text-center font-semibold rounded-full" style="background: #fef3c7; color: #b45309;">6 warn</div>
                  <div class="px-2 py-1 text-center font-semibold rounded-full" style="background: #e0e7ff; color: #4338ca;">8 info</div>
                </div>
                <div class="mt-2 text-xs" style="color: #8b5cf6;">scrub delayed on tank/data</div>
              </div>
              <div class="p-5" style="background: rgba(255,255,255,0.75); border-radius: 22px; box-shadow: 0 6px 24px rgba(99,102,241,0.1); backdrop-filter: blur(10px);">
