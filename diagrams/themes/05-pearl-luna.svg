                  <div class="text-sm font-medium" style="color: #6366f1;">Workloads</div>
                  <div class="text-xs font-semibold px-3 py-0.5 rounded-full" style="background: #ede9fe; color: #6d28d9;">read-only</div>
                </div>
                <div class="text-4xl font-bold mt-2" style="color: #312e81;">12</div>
                <div class="mt-3 grid grid-cols-3 gap-2 text-xs text-center">
                  <div class="px-2 py-1 font-semibold rounded-full" style="background: #fce7f3; color: #be185d;">5 VMs</div>
                  <div class="px-2 py-1 font-semibold rounded-full" style="background: #d1fae5; color: #047857;">4 CT</div>
                  <div class="px-2 py-1 font-semibold rounded-full" style="background: #ede9fe; color: #6d28d9;">3 Jails</div>
                </div>
                <div class="mt-2 text-xs" style="color: #8b5cf6;">7 datasets · 2 snaps today</div>
              </div>
            </div>
            <div class="mt-4 mx-3 p-5" style="background: rgba(255,255,255,0.75); border-radius: 22px; box-shadow: 0 6px 24px rgba(99,102,241,0.1); backdrop-filter: blur(10px);">
              <div class="flex items-center justify-between mb-3">
                <div class="font-semibold" style="color: #312e81;">Recent Activity</div>
                <div class="text-xs" style="color: #8b5cf6;">view-only log</div>
              </div>
              <ul class="text-sm">
                <li class="py-2.5 flex" style="border-top: 1px solid #ede9fe;"><span class="w-32" style="color: #a5b4fc;">12:42:01</span><span class="ml-2" style="color: #312e81;">snapshot daily@auto-2026-07-06_03-00 created on tank/data</span></li>
                <li class="py-2.5 flex" style="border-top: 1px solid #ede9fe;"><span class="w-32" style="color: #a5b4fc;">12:31:18</span><span class="ml-2" style="color: #312e81;">jail `transmission` entered STATE: STARTED</span></li>
                <li class="py-2.5 flex" style="border-top: 1px solid #ede9fe;"><span class="w-32" style="color: #a5b4fc;">12:18:44</span><span class="ml-2" style="color: #312e81;">vm `nextcloud` reported guest-agent heartbeat (3s drift)</span></li>
                <li class="py-2.5 flex" style="border-top: 1px solid #ede9fe;"><span class="w-32" style="color: #a5b4fc;">11:55:09</span><span class="ml-2" style="color: #312e81;">scrub of tank completed with 0 errors</span></li>
              </ul>
            </div>
          </g>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>