                  <div class="text-sm font-medium" style="color: #6366f1;">Disk</div>
                  <div class="text-xs font-semibold px-3 py-0.5 rounded-full" style="background: #d1fae5; color: #047857;">healthy</div>
                </div>
                <div class="text-4xl font-bold mt-2" style="color: #312e81;">245 / 920 GB</div>
                <div class="mt-3 h-2.5 rounded-full overflow-hidden" style="background: #e0e7ff;">
                  <div class="h-full rounded-full" style="width: 27%; background: linear-gradient(90deg, #818cf8, #c084fc);"></div>
                </div>
                <div class="mt-2 text-xs" style="color: #8b5cf6;">zpool tank · scrub Sun 03:00</div>
              </div>
              <div class="p-5" style="background: rgba(255,255,255,0.75); border-radius: 22px; box-shadow: 0 6px 24px rgba(99,102,241,0.1); backdrop-filter: blur(10px);">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-medium" style="color: #6366f1;">Network</div>
                  <div class="text-xs font-semibold px-3 py-0.5 rounded-full" style="background: #d1fae5; color: #047857;">healthy</div>
                </div>
                <div class="text-4xl font-bold mt-2" style="color: #312e81;">↑ 12.4 MB/s</div>
                <div class="mt-3 h-2.5 rounded-full overflow-hidden" style="background: #e0e7ff;">
                  <div class="h-full rounded-full" style="width: 18%; background: linear-gradient(90deg, #818cf8, #c084fc);"></div>
                </div>
