  <title>Theme Mock-Up — Sunburst Orange (07) — Dashboard at 1280x800</title>
  <desc>Sunset orange and yellow palette evoking classic late-80s/early-90s Unix workstation aesthetic. Topbar features a stylized sunrise burst. Warm beige content area with deep amber accents. WCAG AA contrast.</desc>
