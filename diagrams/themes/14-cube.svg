<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Menlo, Monaco, Consolas, monospace">
  <title>Theme Mock-Up — Cube Lab — Dashboard at 1280x800</title>
  <desc>Scientific workstation aesthetic with stark black background, neon green accents, monospace typography. Hard-edged boxes evoke lab instrument panels. WCAG AAA on primary text.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full" style="background: #000000; color: #d0d0d0; font-family: Menlo, Monaco, Consolas, monospace;">
      <g id="theme-header" class="contents">
        <div class="h-14 flex items-center px-4" style="background: #000000; border-bottom: 2px solid #00ff66; box-shadow: 0 0 0 1px #1a1a1a;">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 flex items-center justify-center font-bold" style="background: #00ff66; color: #000000;">C</div>
            <span class="font-bold text-base" style="color: #ffffff; letter-spacing: 0.05em;">CLOUDBSD_ADMIN</span>
            <span class="ml-2 px-2 py-0.5 text-xs font-bold" style="background: #000000; color: #00ff66; border: 1px solid #00ff66;">[cube]</span>
          </div>
          <div class="ml-auto flex items-center gap-3">
            <span class="text-sm" style="color: #888888;">@freenas-mock.local</span>
            <button class="text-sm font-bold px-3 py-1" style="background: #00ff66; color: #000000; border: 1px solid #00ff66;">REFRESH</button>
            <div class="w-7 h-7 flex items-center justify-center text-sm font-bold" style="background: #00ff66; color: #000000;">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="theme-sidebar" class="contents">
          <aside class="w-56 p-3 overflow-y-auto" style="background: #0a0a0a; border-right: 1px solid #1f1f1f;">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 font-bold" style="background: #00ff66; color: #000000;"># DASHBOARD</a>
              <a class="block px-3 py-2" style="color: #d0d0d0; border-left: 2px solid transparent;"># virtual_machines</a>
              <a class="block px-3 py-2" style="color: #d0d0d0; border-left: 2px solid transparent;"># containers</a>
              <a class="block px-3 py-2" style="color: #d0d0d0; border-left: 2px solid transparent;"># jails</a>
              <a class="block px-3 py-2" style="color: #d0d0d0; border-left: 2px solid transparent;"># volumes</a>
              <a class="block px-3 py-2" style="color: #d0d0d0; border-left: 2px solid transparent;"># network_map</a>
              <a class="block px-3 py-2" style="color: #d0d0d0; border-left: 2px solid transparent;"># cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-widest px-3" style="color: #00ff66;">## ADMIN</div>
              <a class="block px-3 py-2" style="color: #d0d0d0; border-left: 2px solid transparent;"># users</a>
              <a class="block px-3 py-2" style="color: #d0d0d0; border-left: 2px solid transparent;"># logs</a>
              <a class="block px-3 py-2" style="color: #d0d0d0; border-left: 2px solid transparent;"># notifications</a>
              <a class="block px-3 py-2" style="color: #d0d0d0; border-left: 2px solid transparent;"># settings</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 p-6 overflow-auto">
          <g id="theme-content" class="contents">
            <div class="flex items-center justify-between mb-4 pb-3" style="border-bottom: 1px solid #1f1f1f;">
              <div>
                <h1 class="text-xl font-bold" style="color: #ffffff; letter-spacing: 0.05em;">&gt; DASHBOARD</h1>
                <p class="text-sm mt-1" style="color: #888888;">host=freenas-mock.local // middleware=connected</p>
              </div>
              <div class="text-sm" style="color: #888888;">last_refresh=12s</div>
            </div>
            <div class="grid grid-cols-3 gap-3">
              <div class="p-4" style="background: #0a0a0a; border: 1px solid #1f1f1f;">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-bold" style="color: #00ff66; letter-spacing: 0.05em;">CPU_USAGE</div>
                  <div class="text-xs font-bold px-2 py-0.5" style="background: #00ff66; color: #000000;">[OK]</div>
                </div>
                <div class="text-3xl font-bold mt-2" style="color: #ffffff;">42<span style="color: #888888;">%</span></div>
                <div class="mt-3 h-2" style="background: #1a1a1a; border: 1px solid #1f1f1f;">
                  <div class="h-full" style="width: 42%; background: #00ff66;"></div>
                </div>
                <div class="mt-2 text-xs" style="color: #888888;">cores=8 // load=1.42</div>
              </div>
              <div class="p-4" style="background: #0a0a0a; border: 1px solid #1f1f1f;">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-bold" style="color: #00ff66; letter-spacing: 0.05em;">MEMORY</div>
                  <div class="text-xs font-bold px-2 py-0.5" style="background: #ffaa00; color: #000000;">[WATCH]</div>
                </div>
                <div class="text-3xl font-bold mt-2" style="color: #ffffff;">8.2<span style="color: #888888;">/16GB</span></div>
                <div class="mt-3 h-2" style="background: #1a1a1a; border: 1px solid #1f1f1f;">
                  <div class="h-full" style="width: 51%; background: #ffaa00;"></div>
                </div>
                <div class="mt-2 text-xs" style="color: #888888;">arc=2.4GB // swap=64MB</div>
              </div>
              <div class="p-4" style="background: #0a0a0a; border: 1px solid #1f1f1f;">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-bold" style="color: #00ff66; letter-spacing: 0.05em;">DISK</div>
                  <div class="text-xs font-bold px-2 py-0.5" style="background: #00ff66; color: #000000;">[OK]</div>
                </div>
                <div class="text-3xl font-bold mt-2" style="color: #ffffff;">245<span style="color: #888888;">/920GB</span></div>
                <div class="mt-3 h-2" style="background: #1a1a1a; border: 1px solid #1f1f1f;">
                  <div class="h-full" style="width: 27%; background: #00ff66;"></div>
                </div>
                <div class="mt-2 text-xs" style="color: #888888;">zpool=tank // scrub=Sun_03:00</div>
              </div>
              <div class="p-4" style="background: #0a0a0a; border: 1px solid #1f1f1f;">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-bold" style="color: #00ff66; letter-spacing: 0.05em;">NETWORK</div>
                  <div class="text-xs font-bold px-2 py-0.5" style="background: #00ff66; color: #000000;">[OK]</div>
                </div>
                <div class="text-3xl font-bold mt-2" style="color: #ffffff;">^<span style="color: #888888;"> 12.4MB/s</span></div>
                <div class="mt-3 h-2" style="background: #1a1a1a; border: 1px solid #1f1f1f;">
                  <div class="h-full" style="width: 18%; background: #00ff66;"></div>
                </div>
                <div class="mt-2 text-xs" style="color: #888888;">v 86.1MB/s // ifaces=3</div>
              </div>
              <div class="p-4" style="background: #0a0a0a; border: 1px solid #1f1f1f;">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-bold" style="color: #00ff66; letter-spacing: 0.05em;">NOTIFICATIONS</div>
                  <div class="text-xs font-bold px-2 py-0.5" style="background: #ff3344; color: #000000;">[3_CRIT]</div>
                </div>
                <div class="text-3xl font-bold mt-2" style="color: #ffffff;">17</div>
                <div class="mt-3 grid grid-cols-3 gap-2 text-xs">
                  <div class="px-2 py-1 text-center font-bold" style="background: #ff3344; color: #000000;">3_CRIT</div>
                  <div class="px-2 py-1 text-center font-bold" style="background: #ffaa00; color: #000000;">6_WARN</div>
                  <div class="px-2 py-1 text-center font-bold" style="background: #00aaff; color: #000000;">8_INFO</div>
                </div>
                <div class="mt-2 text-xs" style="color: #888888;">! scrub delayed on tank/data</div>
              </div>
              <div class="p-4" style="background: #0a0a0a; border: 1px solid #1f1f1f;">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-bold" style="color: #00ff66; letter-spacing: 0.05em;">WORKLOADS</div>
                  <div class="text-xs font-bold px-2 py-0.5" style="background: #1a1a1a; color: #888888; border: 1px solid #1f1f1f;">[R/O]</div>
                </div>
                <div class="text-3xl font-bold mt-2" style="color: #ffffff;">12</div>
                <div class="mt-3 grid grid-cols-3 gap-2 text-xs text-center">
                  <div class="px-2 py-1 font-bold" style="background: #1a1a1a; color: #d0d0d0; border: 1px solid #1f1f1f;">5_VM</div>
                  <div class="px-2 py-1 font-bold" style="background: #1a1a1a; color: #d0d0d0; border: 1px solid #1f1f1f;">4_CT</div>
                  <div class="px-2 py-1 font-bold" style="background: #1a1a1a; color: #d0d0d0; border: 1px solid #1f1f1f;">3_JL</div>
                </div>
                <div class="mt-2 text-xs" style="color: #888888;">ds=7 // snaps=2</div>
              </div>
            </div>
            <div class="mt-6 p-4" style="background: #0a0a0a; border: 1px solid #1f1f1f;">
              <div class="flex items-center justify-between mb-3 pb-2" style="border-bottom: 1px solid #1f1f1f;">
                <div class="font-bold" style="color: #00ff66; letter-spacing: 0.05em;">&gt; RECENT_ACTIVITY</div>
                <div class="text-xs" style="color: #888888;">[view-only log]</div>
              </div>
              <ul class="text-sm">
                <li class="py-1.5 flex" style="border-bottom: 1px solid #1f1f1f;"><span class="w-32" style="color: #888888;">[12:42:01]</span><span class="ml-2" style="color: #d0d0d0;">OK snapshot daily@auto-2026-07-06_03-00 created on tank/data</span></li>
                <li class="py-1.5 flex" style="border-bottom: 1px solid #1f1f1f;"><span class="w-32" style="color: #888888;">[12:31:18]</span><span class="ml-2" style="color: #d0d0d0;">OK jail `transmission` entered STATE: STARTED</span></li>
                <li class="py-1.5 flex" style="border-bottom: 1px solid #1f1f1f;"><span class="w-32" style="color: #888888;">[12:18:44]</span><span class="ml-2" style="color: #d0d0d0;">OK vm `nextcloud` reported guest-agent heartbeat (3s drift)</span></li>
                <li class="py-1.5 flex"><span class="w-32" style="color: #888888;">[11:55:09]</span><span class="ml-2" style="color: #d0d0d0;">OK scrub of tank completed with 0 errors</span></li>
              </ul>
            </div>
          </g>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>
