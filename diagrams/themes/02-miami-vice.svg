                </div>
                <div class="text-4xl font-bold mt-2" style="color: #fff; text-shadow: 0 0 10px #00f5ff;">↑ 12.4 MB/s</div>
                <div class="mt-3 h-2 bg-purple-900/40 rounded-full overflow-hidden">
                  <div class="h-full" style="width: 18%; background: linear-gradient(90deg, #3a86ff, #00f5ff);"></div>
                </div>
