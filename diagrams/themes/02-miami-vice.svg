<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>Theme Mock-Up — Miami Vice — Dashboard at 1280x800</title>
  <desc>Neon 80s aesthetic with hot pink and electric cyan over deep midnight purple. High-saturation accents, dark cards with neon glow borders. WCAG AA on body text, AAA on neon labels.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full text-slate-100" style="background: linear-gradient(135deg, #1a0b2e 0%, #2d0a3d 40%, #0a1a3d 100%);">
      <g id="theme-header" class="contents">
        <div class="h-14 flex items-center px-4" style="background: linear-gradient(90deg, #ff006e 0%, #8338ec 50%, #3a86ff 100%); box-shadow: 0 0 24px rgba(255,0,110,0.5);">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 flex items-center justify-center font-bold text-white" style="background: #ff006e; box-shadow: 0 0 12px #ff006e;">C</div>
            <span class="font-bold text-lg tracking-wider" style="color: #fff; text-shadow: 0 0 8px #ff006e;">CLOUDB<span style="color: #3a86ff; text-shadow: 0 0 8px #3a86ff;">SD</span> ADMIN</span>
            <span class="ml-2 px-2 py-0.5 text-xs font-bold tracking-widest" style="background: rgba(0,0,0,0.4); color: #00f5ff; border: 1px solid #00f5ff;">miami-vice</span>
          </div>
          <div class="ml-auto flex items-center gap-4">
            <span class="text-sm text-pink-200">freenas-mock.local</span>
            <button class="text-sm text-cyan-200 hover:text-white">Refresh</button>
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold text-black" style="background: #00f5ff; box-shadow: 0 0 10px #00f5ff;">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="theme-sidebar" class="contents">
          <aside class="w-56 p-3 overflow-y-auto" style="background: rgba(26,11,46,0.6); border-right: 2px solid #ff006e; box-shadow: inset -8px 0 18px rgba(255,0,110,0.2);">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded font-bold" style="background: rgba(255,0,110,0.25); color: #ff66b3; box-shadow: 0 0 12px rgba(255,0,110,0.4);">Dashboard</a>
              <a class="block px-3 py-2 rounded text-cyan-200 hover:bg-cyan-900/30">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-cyan-200 hover:bg-cyan-900/30">Containers</a>
              <a class="block px-3 py-2 rounded text-cyan-200 hover:bg-cyan-900/30">Jails</a>
              <a class="block px-3 py-2 rounded text-cyan-200 hover:bg-cyan-900/30">Volumes</a>
              <a class="block px-3 py-2 rounded text-cyan-200 hover:bg-cyan-900/30">Network Map</a>
              <a class="block px-3 py-2 rounded text-cyan-200 hover:bg-cyan-900/30">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-widest px-3" style="color: #ff006e;">Admin</div>
              <a class="block px-3 py-2 rounded text-cyan-200 hover:bg-cyan-900/30">Users</a>
              <a class="block px-3 py-2 rounded text-cyan-200 hover:bg-cyan-900/30">Logs</a>
              <a class="block px-3 py-2 rounded text-cyan-200 hover:bg-cyan-900/30">Notifications</a>
              <a class="block px-3 py-2 rounded text-cyan-200 hover:bg-cyan-900/30">Settings</a>
