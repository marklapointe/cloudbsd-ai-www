                <div class="font-bold tracking-wide" style="color: #ff66b3; text-shadow: 0 0 8px #ff006e;">RECENT ACTIVITY</div>
                <div class="text-xs" style="color: #00f5ff;">view-only log</div>
              </div>
              <ul class="divide-y text-sm" style="border-color: rgba(255,0,110,0.2);">
                <li class="py-2 flex" style="border-top: 1px solid rgba(255,0,110,0.2);"><span class="w-32 text-cyan-300">12:42:01</span><span class="ml-2 text-slate-100">snapshot daily@auto-2026-07-06_03-00 created on tank/data</span></li>
                <li class="py-2 flex" style="border-top: 1px solid rgba(255,0,110,0.2);"><span class="w-32 text-cyan-300">12:31:18</span><span class="ml-2 text-slate-100">jail `transmission` entered STATE: STARTED</span></li>
                <li class="py-2 flex" style="border-top: 1px solid rgba(255,0,110,0.2);"><span class="w-32 text-cyan-300">12:18:44</span><span class="ml-2 text-slate-100">vm `nextcloud` reported guest-agent heartbeat (3s drift)</span></li>
                <li class="py-2 flex" style="border-top: 1px solid rgba(255,0,110,0.2);"><span class="w-32 text-cyan-300">11:55:09</span><span class="ml-2 text-slate-100">scrub of tank completed with 0 errors</span></li>
              </ul>
            </div>
          </g>
