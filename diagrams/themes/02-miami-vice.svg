                  <div class="text-xs font-bold px-2 py-0.5 rounded" style="background: rgba(131,56,236,0.18); color: #c4b5fd; border: 1px solid #8338ec;">12 TOTAL</div>
                </div>
                <div class="text-4xl font-bold mt-2" style="color: #fff;">12</div>
                <div class="mt-3 grid grid-cols-3 gap-2 text-xs text-center">
