                <div class="text-4xl font-bold mt-2" style="color: #fff; text-shadow: 0 0 10px #ff006e;">17</div>
                <div class="mt-3 grid grid-cols-3 gap-2 text-xs">
                  <div class="rounded px-2 py-1 text-center font-bold" style="background: rgba(255,0,110,0.2); color: #ff66b3; border: 1px solid #ff006e;">3 crit</div>
                  <div class="rounded px-2 py-1 text-center font-bold" style="background: rgba(255,214,10,0.18); color: #ffd60a; border: 1px solid #ffd60a;">6 warn</div>
                  <div class="rounded px-2 py-1 text-center font-bold" style="background: rgba(58,134,255,0.2); color: #93c5fd; border: 1px solid #3a86ff;">8 info</div>
                </div>
                <div class="mt-2 text-xs text-cyan-300">scrub delayed on tank/data</div>
              </div>
