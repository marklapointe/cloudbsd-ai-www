              </div>
              <div class="rounded-lg p-4" style="background: rgba(10,26,61,0.7); border: 1px solid #ff006e; box-shadow: 0 0 18px rgba(255,0,110,0.35);">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-medium text-cyan-200">Memory</div>
                  <div class="text-xs font-bold px-2 py-0.5 rounded" style="background: rgba(255,0,110,0.15); color: #ff66b3; border: 1px solid #ff006e;">WATCH</div>
                </div>
                <div class="text-4xl font-bold mt-2" style="color: #fff; text-shadow: 0 0 10px #ff006e;">8.2 / 16 GB</div>
                <div class="mt-3 h-2 bg-purple-900/40 rounded-full overflow-hidden">
