                  <div class="rounded px-2 py-1 font-bold" style="background: rgba(0,245,255,0.15); color: #00f5ff; border: 1px solid #00f5ff;">4 CT</div>
                  <div class="rounded px-2 py-1 font-bold" style="background: rgba(131,56,236,0.18); color: #c4b5fd; border: 1px solid #8338ec;">3 Jails</div>
                </div>
                <div class="mt-2 text-xs text-cyan-300">7 datasets · 2 snaps today</div>
              </div>
            </div>
            <div class="mt-6 rounded-lg p-4" style="background: rgba(10,26,61,0.7); border: 1px solid #ff006e; box-shadow: 0 0 18px rgba(255,0,110,0.25);">
