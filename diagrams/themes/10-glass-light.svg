                  </div>
                  <div class="mt-2 text-xs" style="color: #64748b;">zpool tank · scrub Sun 03:00</div>
                </div>
                <div class="p-4 rounded-2xl" style="background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 8px 24px rgba(99,102,241,0.08);">
                  <div class="flex items-center justify-between">
