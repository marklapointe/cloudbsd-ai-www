                <a class="block px-3 py-2 rounded-xl" style="color: #334155;">Virtual Machines</a>
                <a class="block px-3 py-2 rounded-xl" style="color: #334155;">Containers</a>
                <a class="block px-3 py-2 rounded-xl" style="color: #334155;">Jails</a>
                <a class="block px-3 py-2 rounded-xl" style="color: #334155;">Volumes</a>
                <a class="block px-3 py-2 rounded-xl" style="color: #334155;">Network Map</a>
                <a class="block px-3 py-2 rounded-xl" style="color: #334155;">Cluster</a>
                <div class="pt-3 pb-1 text-xs uppercase tracking-wide px-3" style="color: #6366f1; font-weight: 700;">Admin</div>
                <a class="block px-3 py-2 rounded-xl" style="color: #334155;">Users</a>
                <a class="block px-3 py-2 rounded-xl" style="color: #334155;">Logs</a>
                <a class="block px-3 py-2 rounded-xl" style="color: #334155;">Notifications</a>
                <a class="block px-3 py-2 rounded-xl" style="color: #334155;">Settings</a>
              </nav>
            </aside>
          </g>
          <main class="flex-1 p-6 overflow-auto">
            <g id="theme-content" class="contents">
              <div class="flex items-center justify-between mb-4">
                <div>
                  <h1 class="text-3xl font-bold" style="color: #1e1b4b; letter-spacing: -0.02em;">Dashboard</h1>
                  <p class="text-sm" style="color: #64748b;">Host: freenas-mock.local · middleware connected</p>
                </div>
