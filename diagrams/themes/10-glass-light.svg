                    <div class="text-xs px-2 py-0.5 rounded-full font-medium" style="background: rgba(34,197,94,0.15); color: #15803d;">healthy</div>
                  </div>
                  <div class="text-3xl font-bold mt-2" style="color: #1e1b4b;">↑ 12.4 MB/s</div>
                  <div class="mt-3 h-2 rounded-full overflow-hidden" style="background: rgba(99,102,241,0.1);">
                    <div class="h-full rounded-full" style="width: 18%; background: linear-gradient(90deg, #818cf8 0%, #f472b6 100%);"></div>
                  </div>
                  <div class="mt-2 text-xs" style="color: #64748b;">↓ 86.1 MB/s · 3 ifaces</div>
                </div>
                <div class="p-4 rounded-2xl" style="background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 8px 24px rgba(99,102,241,0.08);">
                  <div class="flex items-center justify-between">
                    <div class="text-sm font-medium" style="color: #64748b;">Notifications</div>
                    <div class="text-xs px-2 py-0.5 rounded-full font-medium" style="background: rgba(244,63,94,0.15); color: #be123c;">3 critical</div>
                  </div>
                  <div class="text-3xl font-bold mt-2" style="color: #1e1b4b;">17</div>
                  <div class="mt-3 grid grid-cols-3 gap-2 text-xs">
                    <div class="px-2 py-1 text-center rounded-full font-medium" style="background: rgba(244,63,94,0.18); color: #be123c;">3 crit</div>
                    <div class="px-2 py-1 text-center rounded-full font-medium" style="background: rgba(234,179,8,0.18); color: #a16207;">6 warn</div>
                    <div class="px-2 py-1 text-center rounded-full font-medium" style="background: rgba(99,102,241,0.18); color: #4338ca;">8 info</div>
                  </div>
                  <div class="mt-2 text-xs" style="color: #64748b;">scrub delayed on tank/data</div>
                </div>
                <div class="p-4 rounded-2xl" style="background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 8px 24px rgba(99,102,241,0.08);">
                  <div class="flex items-center justify-between">
                    <div class="text-sm font-medium" style="color: #64748b;">Workloads</div>
                    <div class="text-xs px-2 py-0.5 rounded-full font-medium" style="background: rgba(148,163,184,0.2); color: #475569;">R/O</div>
                  </div>
                  <div class="text-3xl font-bold mt-2" style="color: #1e1b4b;">12</div>
                  <div class="mt-3 grid grid-cols-3 gap-2 text-xs text-center">
                    <div class="px-2 py-1 rounded-full font-medium" style="background: rgba(99,102,241,0.12); color: #4338ca;">5 VMs</div>
                    <div class="px-2 py-1 rounded-full font-medium" style="background: rgba(244,114,182,0.12); color: #be185d;">4 CT</div>
                    <div class="px-2 py-1 rounded-full font-medium" style="background: rgba(96,165,250,0.12); color: #1d4ed8;">3 Jails</div>
                  </div>
                  <div class="mt-2 text-xs" style="color: #64748b;">7 datasets · 2 snaps today</div>
                </div>
              </div>
              <div class="mt-6 p-4 rounded-2xl" style="background: rgba(255,255,255,0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.7); box-shadow: 0 8px 24px rgba(99,102,241,0.08);">
                <div class="flex items-center justify-between mb-3">
