                  <div class="text-xs" style="color: #64748b;">view-only log</div>
                </div>
                <ul class="text-sm" style="border-top: 1px solid rgba(99,102,241,0.1);">
                  <li class="py-2 flex" style="border-bottom: 1px solid rgba(99,102,241,0.08);"><span class="w-32" style="color: #64748b;">12:42:01</span><span class="ml-2" style="color: #334155;">snapshot daily@auto-2026-07-06_03-00 created on tank/data</span></li>
                  <li class="py-2 flex" style="border-bottom: 1px solid rgba(99,102,241,0.08);"><span class="w-32" style="color: #64748b;">12:31:18</span><span class="ml-2" style="color: #334155;">jail `transmission` entered STATE: STARTED</span></li>
                  <li class="py-2 flex" style="border-bottom: 1px solid rgba(99,102,241,0.08);"><span class="w-32" style="color: #64748b;">12:18:44</span><span class="ml-2" style="color: #334155;">vm `nextcloud` reported guest-agent heartbeat (3s drift)</span></li>
                  <li class="py-2 flex"><span class="w-32" style="color: #64748b;">11:55:09</span><span class="ml-2" style="color: #334155;">scrub of tank completed with 0 errors</span></li>
                </ul>
              </div>
            </g>
