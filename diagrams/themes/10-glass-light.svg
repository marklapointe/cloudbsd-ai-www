<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Inter, system-ui, sans-serif">
  <title>Theme Mock-Up — Glass Light — Dashboard at 1280x800</title>
  <desc>Modern frosted glass aesthetic on bright white. Translucent panels with backdrop blur, soft pastel accents, vibrant blue and pink highlights. WCAG AA contrast on text.</desc>
  <defs>
    <linearGradient id="bgGradientLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="50%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.7)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.4)"/>
    </linearGradient>
  </defs>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full relative" style="background: linear-gradient(135deg, #f0f4ff 0%, #fdf2f8 50%, #eff6ff 100%); font-family: Inter, system-ui, sans-serif; overflow: hidden;">
      <svg class="absolute inset-0 w-full h-full pointer-events-none" preserveAspectRatio="none" viewBox="0 0 1280 800">
        <circle cx="180" cy="160" r="240" fill="url(#orb1)"/>
        <circle cx="1100" cy="220" r="280" fill="url(#orb2)"/>
        <circle cx="640" cy="700" r="320" fill="url(#orb3)"/>
        <circle cx="100" cy="600" r="180" fill="url(#orb1)" opacity="0.6"/>
        <circle cx="1200" cy="650" r="200" fill="url(#orb3)" opacity="0.5"/>
      </svg>
      <div class="relative z-10 h-full">
        <g id="theme-header" class="contents">
          <div class="h-14 flex items-center px-4" style="background: rgba(255,255,255,0.55); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.6); box-shadow: 0 4px 24px rgba(99,102,241,0.08);">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-xl flex items-center justify-center font-bold text-white" style="background: linear-gradient(135deg, #818cf8 0%, #f472b6 100%); box-shadow: 0 4px 12px rgba(129,140,248,0.4);">C</div>
              <span class="font-bold text-base" style="color: #1e1b4b;">CloudBSD Admin</span>
              <span class="ml-2 px-2 py-0.5 text-xs font-medium rounded-full" style="background: rgba(99,102,241,0.12); color: #4338ca; border: 1px solid rgba(99,102,241,0.25);">glass-light</span>
            </div>
            <div class="ml-auto flex items-center gap-4">
              <span class="text-sm" style="color: #475569;">freenas-mock.local</span>
              <button class="text-sm px-4 py-1.5 rounded-full font-medium text-white" style="background: linear-gradient(135deg, #818cf8 0%, #f472b6 100%); box-shadow: 0 4px 12px rgba(129,140,248,0.35);">Refresh</button>
              <div class="w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold text-white" style="background: linear-gradient(135deg, #60a5fa 0%, #818cf8 100%); box-shadow: 0 2px 8px rgba(96,165,250,0.4);">M</div>
            </div>
          </div>
        </g>
        <div class="flex" style="height: calc(100% - 56px);">
