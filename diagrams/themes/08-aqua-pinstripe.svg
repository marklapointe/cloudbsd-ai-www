                <li class="py-2 flex" style="border-bottom: 1px solid #dceaf3;"><span class="w-32" style="color: #3a6a8f;">12:42:01</span><span class="ml-2" style="color: #1e3a5f;">snapshot daily@auto-2026-07-06_03-00 created on tank/data</span></li>
                <li class="py-2 flex" style="border-bottom: 1px solid #dceaf3;"><span class="w-32" style="color: #3a6a8f;">12:31:18</span><span class="ml-2" style="color: #1e3a5f;">jail `transmission` entered STATE: STARTED</span></li>
                <li class="py-2 flex" style="border-bottom: 1px solid #dceaf3;"><span class="w-32" style="color: #3a6a8f;">12:18:44</span><span class="ml-2" style="color: #1e3a5f;">vm `nextcloud` reported guest-agent heartbeat (3s drift)</span></li>
                <li class="py-2 flex"><span class="w-32" style="color: #3a6a8f;">11:55:09</span><span class="ml-2" style="color: #1e3a5f;">scrub of tank completed with 0 errors</span></li>
              </ul>
            </div>
