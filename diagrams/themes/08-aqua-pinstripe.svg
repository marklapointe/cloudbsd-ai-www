              <a class="block px-3 py-2 rounded" style="color: #1e3a5f;">Virtual Machines</a>
              <a class="block px-3 py-2 rounded" style="color: #1e3a5f;">Containers</a>
              <a class="block px-3 py-2 rounded" style="color: #1e3a5f;">Jails</a>
              <a class="block px-3 py-2 rounded" style="color: #1e3a5f;">Volumes</a>
              <a class="block px-3 py-2 rounded" style="color: #1e3a5f;">Network Map</a>
              <a class="block px-3 py-2 rounded" style="color: #1e3a5f;">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide px-3" style="color: #6b9bbf; font-weight: 700;">Admin</div>
              <a class="block px-3 py-2 rounded" style="color: #1e3a5f;">Users</a>
              <a class="block px-3 py-2 rounded" style="color: #1e3a5f;">Logs</a>
              <a class="block px-3 py-2 rounded" style="color: #1e3a5f;">Notifications</a>
              <a class="block px-3 py-2 rounded" style="color: #1e3a5f;">Settings</a>
            </nav>
          </aside>
