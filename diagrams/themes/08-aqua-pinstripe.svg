                <div class="mt-3 h-2 rounded-full overflow-hidden" style="background: #dceaf3; border: 1px solid #b3cce0;">
                  <div class="h-full rounded-full" style="width: 18%; background: linear-gradient(180deg, #6b9bbf 0%, #1e3a5f 100%);"></div>
                </div>
