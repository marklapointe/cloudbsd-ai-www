                  <div class="text-xs px-2 py-0.5 rounded font-medium" style="background: #b8334a; color: #ffffff;">3 critical</div>
                </div>
                <div class="text-3xl font-bold mt-2" style="color: #1e3a5f;">17</div>
                <div class="mt-3 grid grid-cols-3 gap-2 text-xs">
                  <div class="px-2 py-1 text-center rounded font-medium" style="background: #b8334a; color: #ffffff;">3 crit</div>
                  <div class="px-2 py-1 text-center rounded font-medium" style="background: #c08a1a; color: #ffffff;">6 warn</div>
                  <div class="px-2 py-1 text-center rounded font-medium" style="background: #3a6a8f; color: #ffffff;">8 info</div>
                </div>
                <div class="mt-2 text-xs" style="color: #3a6a8f;">scrub delayed on tank/data</div>
              </div>
              <div class="p-4 rounded-lg" style="background: rgba(255,255,255,0.85); border: 1px solid #b3cce0; box-shadow: 0 2px 8px rgba(30,58,95,0.15), inset 0 1px 0 rgba(255,255,255,0.8); backdrop-filter: blur(4px);">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-medium" style="color: #3a6a8f;">Workloads</div>
                  <div class="text-xs px-2 py-0.5 rounded" style="background: #dceaf3; color: #3a6a8f; border: 1px solid #b3cce0;">R/O</div>
                </div>
                <div class="text-3xl font-bold mt-2" style="color: #1e3a5f;">12</div>
                <div class="mt-3 grid grid-cols-3 gap-2 text-xs text-center">
                  <div class="px-2 py-1 rounded" style="background: #dceaf3; color: #1e3a5f;">5 VMs</div>
                  <div class="px-2 py-1 rounded" style="background: #dceaf3; color: #1e3a5f;">4 CT</div>
                  <div class="px-2 py-1 rounded" style="background: #dceaf3; color: #1e3a5f;">3 Jails</div>
                </div>
                <div class="mt-2 text-xs" style="color: #3a6a8f;">7 datasets · 2 snaps today</div>
              </div>
            </div>
            <div class="mt-6 p-4 rounded-lg" style="background: rgba(255,255,255,0.85); border: 1px solid #b3cce0; box-shadow: 0 2px 8px rgba(30,58,95,0.15), inset 0 1px 0 rgba(255,255,255,0.8); backdrop-filter: blur(4px);">
              <div class="flex items-center justify-between mb-3">
                <div class="font-medium" style="color: #1e3a5f;">Recent Activity</div>
                <div class="text-xs" style="color: #3a6a8f;">view-only log</div>
