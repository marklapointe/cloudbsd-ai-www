                <li class="py-2.5 flex" style="border-bottom: 1px solid #e8e4d8;"><span class="w-32" style="color: #6a6358;">12:31:18</span><span class="ml-2" style="color: #2a2620;">jail `transmission` entered STATE: STARTED</span></li>
                <li class="py-2.5 flex" style="border-bottom: 1px solid #e8e4d8;"><span class="w-32" style="color: #6a6358;">12:18:44</span><span class="ml-2" style="color: #2a2620;">vm `nextcloud` reported guest-agent heartbeat (3s drift)</span></li>
