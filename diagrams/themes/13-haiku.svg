<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="Noto Sans, Inter, system-ui, sans-serif">
  <title>Theme Mock-Up — Minimal Clean (13) — Dashboard at 1280x800</title>
  <desc>Clean minimal aesthetic on warm white with soft beige accents. Generous whitespace, subtle shadows, restrained color palette. Modern flat design with light beige primary tones. WCAG AA contrast.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
