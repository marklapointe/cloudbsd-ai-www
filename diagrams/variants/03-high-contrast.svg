<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Dashboard (High-Contrast theme · WCAG AAA)</title>
  <desc>Full dashboard at 1280x800 rendered in the high-contrast theme — pure black background, white text, yellow focus indicators. WCAG 2.1 AAA.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-black text-white" style="font-weight: 600;">
      <g id="header" class="contents">
        <div class="h-14 bg-black border-b-2 border-yellow-400 flex items-center px-4">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-yellow-400 text-black flex items-center justify-center font-bold" style="font-weight: 800;">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 px-2 py-0.5 text-xs border border-white text-white">freenas-mock.local</span>
          </div>
          <div class="ml-auto flex items-center gap-4 text-sm">
            <span class="text-white">Theme: <span class="font-bold text-yellow-400">HIGH-CONTRAST</span></span>
            <button class="text-white underline hover:text-yellow-400 focus:outline focus:outline-2 focus:outline-yellow-400">Refresh</button>
            <div class="w-8 h-8 bg-yellow-400 text-black flex items-center justify-center text-sm font-bold">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="sidebar" class="contents">
          <aside class="w-56 bg-black border-r-2 border-yellow-400 p-3 overflow-y-auto">
            <nav class="space-y-1 text-base" style="font-weight: 600;">
              <a class="block px-3 py-2 bg-yellow-400 text-black font-bold">Dashboard</a>
              <a class="block px-3 py-2 text-white hover:bg-yellow-400 hover:text-black focus:outline focus:outline-2 focus:outline-yellow-400">Virtual Machines</a>
              <a class="block px-3 py-2 text-white hover:bg-yellow-400 hover:text-black">Containers</a>
              <a class="block px-3 py-2 text-white hover:bg-yellow-400 hover:text-black">Jails</a>
              <a class="block px-3 py-2 text-white hover:bg-yellow-400 hover:text-black">Volumes</a>
              <a class="block px-3 py-2 text-white hover:bg-yellow-400 hover:text-black">Network Map</a>
              <a class="block px-3 py-2 text-white hover:bg-yellow-400 hover:text-black">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-yellow-400 px-3 font-bold">Admin</div>
              <a class="block px-3 py-2 text-white hover:bg-yellow-400 hover:text-black">Users</a>
              <a class="block px-3 py-2 text-white hover:bg-yellow-400 hover:text-black">Logs</a>
              <a class="block px-3 py-2 text-white hover:bg-yellow-400 hover:text-black">Notifications</a>
              <a class="block px-3 py-2 text-white hover:bg-yellow-400 hover:text-black">Settings</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 p-6 overflow-auto">
          <g id="content" class="contents">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h1 class="text-2xl font-bold text-white">Dashboard</h1>
                <p class="text-base text-yellow-400 font-bold">Host: freenas-mock.local · High-Contrast · WCAG AAA (21:1)</p>
              </div>
              <div class="text-base text-white font-bold">Last refresh: 12s ago</div>
            </div>
            <div class="grid grid-cols-3 gap-4">
              <div class="bg-black rounded-lg p-4 border-2 border-white">
                <div class="flex items-center justify-between">
                  <div class="text-base text-yellow-400 font-bold uppercase">CPU Usage</div>
                  <div class="text-sm text-black bg-yellow-400 px-2 py-0.5 font-bold">HEALTHY</div>
                </div>
                <div class="text-3xl font-bold mt-2 text-white" style="font-weight: 800;">42%</div>
                <div class="mt-3 h-3 bg-black border-2 border-white">
                  <div class="h-full bg-yellow-400" style="width: 42%;"></div>
                </div>
                <div class="mt-2 text-sm text-white font-bold">8 cores · load avg 1.42 / 1.38 / 1.21</div>
              </div>
              <div class="bg-black rounded-lg p-4 border-2 border-white">
                <div class="flex items-center justify-between">
                  <div class="text-base text-yellow-400 font-bold uppercase">Memory</div>
                  <div class="text-sm text-black bg-yellow-400 px-2 py-0.5 font-bold">WATCH</div>
                </div>
                <div class="text-3xl font-bold mt-2 text-white" style="font-weight: 800;">8.2 / 16 GB</div>
                <div class="mt-3 h-3 bg-black border-2 border-white">
                  <div class="h-full bg-yellow-400" style="width: 51%;"></div>
                </div>
                <div class="mt-2 text-sm text-white font-bold">ARC 2.4 GB · swap 64 MB used</div>
              </div>
              <div class="bg-black rounded-lg p-4 border-2 border-white">
                <div class="flex items-center justify-between">
                  <div class="text-base text-yellow-400 font-bold uppercase">Disk</div>
                  <div class="text-sm text-black bg-yellow-400 px-2 py-0.5 font-bold">HEALTHY</div>
                </div>
                <div class="text-3xl font-bold mt-2 text-white" style="font-weight: 800;">245 / 920 GB</div>
                <div class="mt-3 h-3 bg-black border-2 border-white">
                  <div class="h-full bg-yellow-400" style="width: 27%;"></div>
                </div>
                <div class="mt-2 text-sm text-white font-bold">zpool tank · scrub scheduled Sun 03:00</div>
              </div>
              <div class="bg-black rounded-lg p-4 border-2 border-white">
                <div class="flex items-center justify-between">
                  <div class="text-base text-yellow-400 font-bold uppercase">Network</div>
                  <div class="text-sm text-black bg-yellow-400 px-2 py-0.5 font-bold">HEALTHY</div>
                </div>
                <div class="text-3xl font-bold mt-2 text-white" style="font-weight: 800;">↑ 12.4 MB/s</div>
                <div class="mt-3 h-3 bg-black border-2 border-white">
                  <div class="h-full bg-yellow-400" style="width: 18%;"></div>
                </div>
                <div class="mt-2 text-sm text-white font-bold">↓ 86.1 MB/s · 3 interfaces up</div>
              </div>
              <div class="bg-black rounded-lg p-4 border-2 border-white">
                <div class="flex items-center justify-between">
                  <div class="text-base text-yellow-400 font-bold uppercase">Notifications</div>
                  <div class="text-sm text-black bg-yellow-400 px-2 py-0.5 font-bold">3 CRITICAL</div>
                </div>
                <div class="text-3xl font-bold mt-2 text-white" style="font-weight: 800;">12</div>
                <div class="mt-3 text-sm text-white font-bold">3 critical · 5 warn · 4 info</div>
              </div>
              <div class="bg-black rounded-lg p-4 border-2 border-white">
                <div class="flex items-center justify-between">
                  <div class="text-base text-yellow-400 font-bold uppercase">Services</div>
                  <div class="text-sm text-black bg-yellow-400 px-2 py-0.5 font-bold">ALL UP</div>
                </div>
                <div class="text-3xl font-bold mt-2 text-white" style="font-weight: 800;">14/14</div>
                <div class="mt-3 text-sm text-white font-bold">SMB, NFS, iSCSI, SSH, …</div>
              </div>
            </div>
          </g>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>