<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Dashboard (Dark theme · Glass Dark)</title>
  <desc>Full dashboard at 1280x800 rendered in the dark theme — slate-900 background with slate-800 cards.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-900 text-slate-100">
      <g id="header" class="contents">
        <div class="h-14 bg-slate-800 border-b border-slate-700 flex items-center px-4">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-500 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 px-2 py-0.5 text-xs rounded bg-slate-700 text-slate-300">freenas-mock.local</span>
          </div>
          <div class="ml-auto flex items-center gap-4 text-sm">
            <span class="text-slate-400">Theme: <span class="font-medium text-slate-200">Glass Dark</span></span>
            <button class="text-slate-300 hover:text-white">Refresh</button>
            <div class="w-8 h-8 rounded-full bg-blue-500 text-white flex items-center justify-center text-sm font-medium">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="sidebar" class="contents">
          <aside class="w-56 bg-slate-800 border-r border-slate-700 p-3 overflow-y-auto">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded bg-blue-900/50 text-blue-300 font-medium">Dashboard</a>
              <a class="block px-3 py-2 rounded text-slate-300 hover:bg-slate-700">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-slate-300 hover:bg-slate-700">Containers</a>
              <a class="block px-3 py-2 rounded text-slate-300 hover:bg-slate-700">Jails</a>
              <a class="block px-3 py-2 rounded text-slate-300 hover:bg-slate-700">Volumes</a>
              <a class="block px-3 py-2 rounded text-slate-300 hover:bg-slate-700">Network Map</a>
              <a class="block px-3 py-2 rounded text-slate-300 hover:bg-slate-700">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-500 px-3">Admin</div>
              <a class="block px-3 py-2 rounded text-slate-300 hover:bg-slate-700">Users</a>
              <a class="block px-3 py-2 rounded text-slate-300 hover:bg-slate-700">Logs</a>
              <a class="block px-3 py-2 rounded text-slate-300 hover:bg-slate-700">Notifications</a>
              <a class="block px-3 py-2 rounded text-slate-300 hover:bg-slate-700">Settings</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 p-6 overflow-auto">
          <g id="content" class="contents">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h1 class="text-2xl font-bold">Dashboard</h1>
                <p class="text-sm text-slate-400">Host: freenas-mock.local · Dark theme · slate-900 base</p>
              </div>
              <div class="text-sm text-slate-400">Last refresh: 12s ago</div>
            </div>
            <div class="grid grid-cols-3 gap-4">
              <div class="bg-slate-800 rounded-lg p-4 border border-slate-700">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-medium text-slate-400">CPU Usage</div>
                  <div class="text-xs text-emerald-300 bg-emerald-900/40 px-2 py-0.5 rounded">healthy</div>
                </div>
                <div class="text-3xl font-bold mt-2 text-slate-100">42%</div>
                <div class="mt-3 h-2 bg-slate-700 rounded-full overflow-hidden">
                  <div class="h-full bg-blue-400" style="width: 42%;"></div>
                </div>
                <div class="mt-2 text-xs text-slate-400">8 cores · load avg 1.42 / 1.38 / 1.21</div>
              </div>
              <div class="bg-slate-800 rounded-lg p-4 border border-slate-700">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-medium text-slate-400">Memory</div>
                  <div class="text-xs text-amber-300 bg-amber-900/40 px-2 py-0.5 rounded">watch</div>
                </div>
                <div class="text-3xl font-bold mt-2 text-slate-100">8.2 / 16 GB</div>
                <div class="mt-3 h-2 bg-slate-700 rounded-full overflow-hidden">
                  <div class="h-full bg-amber-400" style="width: 51%;"></div>
                </div>
                <div class="mt-2 text-xs text-slate-400">ARC 2.4 GB · swap 64 MB used</div>
              </div>
              <div class="bg-slate-800 rounded-lg p-4 border border-slate-700">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-medium text-slate-400">Disk</div>
                  <div class="text-xs text-emerald-300 bg-emerald-900/40 px-2 py-0.5 rounded">healthy</div>
                </div>
                <div class="text-3xl font-bold mt-2 text-slate-100">245 / 920 GB</div>
                <div class="mt-3 h-2 bg-slate-700 rounded-full overflow-hidden">
                  <div class="h-full bg-blue-400" style="width: 27%;"></div>
                </div>
                <div class="mt-2 text-xs text-slate-400">zpool tank · scrub scheduled Sun 03:00</div>
              </div>
              <div class="bg-slate-800 rounded-lg p-4 border border-slate-700">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-medium text-slate-400">Network</div>
                  <div class="text-xs text-emerald-300 bg-emerald-900/40 px-2 py-0.5 rounded">healthy</div>
                </div>
                <div class="text-3xl font-bold mt-2 text-slate-100">↑ 12.4 MB/s</div>
                <div class="mt-3 h-2 bg-slate-700 rounded-full overflow-hidden">
                  <div class="h-full bg-blue-400" style="width: 18%;"></div>
                </div>
                <div class="mt-2 text-xs text-slate-400">↓ 86.1 MB/s · 3 interfaces up</div>
              </div>
              <div class="bg-slate-800 rounded-lg p-4 border border-slate-700">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-medium text-slate-400">Notifications</div>
                  <div class="text-xs text-rose-300 bg-rose-900/40 px-2 py-0.5 rounded">3 critical</div>
                </div>
                <div class="text-3xl font-bold mt-2 text-slate-100">12</div>
                <div class="mt-3 text-xs text-slate-400">3 critical · 5 warn · 4 info</div>
              </div>
              <div class="bg-slate-800 rounded-lg p-4 border border-slate-700">
                <div class="flex items-center justify-between">
                  <div class="text-sm font-medium text-slate-400">Services</div>
                  <div class="text-xs text-emerald-300 bg-emerald-900/40 px-2 py-0.5 rounded">all up</div>
                </div>
                <div class="text-3xl font-bold mt-2 text-slate-100">14/14</div>
                <div class="mt-3 text-xs text-slate-400">SMB, NFS, iSCSI, SSH, …</div>
              </div>
            </div>
          </g>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>