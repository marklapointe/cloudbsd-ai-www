              <a class="block px-3 py-2 rounded bg-blue-50 text-blue-700 font-medium">Users</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Logs</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Notifications</a>
              <a class="block px-3 py-2 rounded text-slate-400 cursor-not-allowed flex items-center justify-between">
