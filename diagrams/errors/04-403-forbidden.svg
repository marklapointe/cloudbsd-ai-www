                      <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                      <span class="font-semibold uppercase tracking-wide text-slate-600">Minimal</span>
                    </div>
                    <div class="flex items-center gap-2">
                      <span class="w-6 h-6 rounded-full bg-rose-100 text-rose-700 flex items-center justify-center text-sm">⛔</span>
                      <span>Access denied</span>
                    </div>
                  </div>
                  <div class="border border-blue-300 bg-blue-50 rounded p-3 ring-1 ring-blue-300">
                    <div class="flex items-center gap-1.5 mb-2">
                      <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                      <span class="font-semibold uppercase tracking-wide text-blue-700">Standard</span>
                    </div>
                    <div class="font-medium mb-1">Admin permission required</div>
                    <div class="text-slate-600 mb-2">Your role is operator. Request admin to grant access.</div>
                    <button class="px-2 py-1 bg-blue-600 text-white rounded text-xs">Request access</button>
                  </div>
                  <div class="border border-slate-200 rounded p-3">
                    <div class="flex items-center gap-1.5 mb-2">
                      <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                      <span class="font-semibold uppercase tracking-wide text-slate-600">Detailed</span>
                    </div>
                    <div class="text-slate-600 mb-1">RBAC trace (admin):</div>
                    <pre class="text-[10px] font-mono text-slate-700 bg-slate-50 rounded p-1.5 overflow-hidden leading-tight">ForbiddenError: missing perm
  at PolicyGuard.check
    (src/auth/policy.guard.ts:31)
  at UsersResolver.list</pre>
                  </div>
                  <div class="border border-slate-200 rounded p-3">
                    <div class="flex items-center gap-1.5 mb-2">
                      <span class="w-2 h-2 rounded-full bg-violet-500"></span>
                      <span class="font-semibold uppercase tracking-wide text-slate-600">Debug</span>
                    </div>
                    <div class="space-y-1 text-slate-700">
                      <div>req&#160;id:&#160;<code class="text-[10px]">req_c1b4f708</code></div>
                      <div>env:&#160;<code class="text-[10px]">production</code></div>
                      <div>build:&#160;<code class="text-[10px]">v2.4.1#fb12a8</code></div>
                      <div>audit:&#160;<code class="text-[10px]">ev_55128</code></div>
                    </div>
                  </div>
                </div>
              </div>
