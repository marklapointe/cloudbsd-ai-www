<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — PAM Authentication Failed (Wrong Password)</title>
  <desc>Login form shows a PAM authentication failure: wrong password. Login attempt counter is shown so users know how many attempts remain.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-gradient-to-br from-slate-50 to-slate-100 text-slate-900 flex flex-col">
      <g id="top-bar" class="contents">
        <div class="h-12 bg-white/70 backdrop-blur border-b border-slate-200 flex items-center px-6">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded bg-blue-600 text-white flex items-center justify-center font-bold text-sm">C</div>
            <span class="font-bold">CloudBSD Admin</span>
            <span class="text-xs text-slate-500 ml-2">freenas-mock.local</span>
          </div>
          <div class="ml-auto text-xs text-slate-500">Theme: CloudBSD · en-US · v2.4.1</div>
        </div>
      </g>
      <div class="flex-1 flex items-center justify-center p-6">
        <g id="login-card" class="contents">
          <div class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-md p-8">
            <div class="flex items-center gap-3 mb-1">
              <div class="w-10 h-10 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-lg">C</div>
              <div>
                <h1 class="text-xl font-bold">Sign in to CloudBSD</h1>
                <p class="text-xs text-slate-500">PAM-authenticated · audit-logged</p>
              </div>
            </div>
            <div class="mt-5 space-y-3">
              <div role="alert" class="bg-rose-50 border border-rose-200 rounded p-3 flex items-start gap-3">
                <div class="w-7 h-7 rounded-full bg-rose-100 text-rose-700 flex items-center justify-center flex-shrink-0 text-lg">⛔</div>
                <div class="flex-1 min-w-0 text-sm text-rose-900">
                  <div class="font-semibold">Authentication failed</div>
                  <div class="text-rose-800 mt-0.5">
                    PAM rejected the credentials: <code class="px-1 py-0.5 bg-rose-100 rounded text-xs">pam_unix: authentication failure; user=admin</code>
                  </div>
                  <div class="mt-2 flex items-center justify-between text-xs">
                    <span class="text-rose-800">2 of 5 attempts remaining before temporary lock</span>
                    <div class="flex gap-0.5">
                      <span class="w-3 h-1.5 rounded-sm bg-rose-500"></span>
                      <span class="w-3 h-1.5 rounded-sm bg-rose-500"></span>
                      <span class="w-3 h-1.5 rounded-sm bg-rose-500"></span>
                      <span class="w-3 h-1.5 rounded-sm bg-slate-200"></span>
                      <span class="w-3 h-1.5 rounded-sm bg-slate-200"></span>
                    </div>
                  </div>
                </div>
              </div>
              <div>
                <label class="text-xs font-medium text-slate-700 block mb-1">Username</label>
                <input type="text" value="admin" class="w-full px-3 py-2 text-sm border border-slate-300 rounded bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
              </div>
              <div>
                <label class="text-xs font-medium text-slate-700 block mb-1">Password</label>
                <input type="password" value="•••••" class="w-full px-3 py-2 text-sm border border-rose-300 rounded bg-rose-50 text-rose-900 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-rose-500" />
                <div class="text-xs text-rose-700 mt-1">Password is incorrect — please try again.</div>
              </div>
              <div class="flex items-center justify-between text-xs">
                <label class="flex items-center gap-1.5 text-slate-600">
                  <input type="checkbox" class="rounded border-slate-300" /> Remember this device
                </label>
                <a class="text-blue-600 hover:underline">Forgot password?</a>
              </div>
              <button class="w-full py-2 bg-blue-600 text-white rounded font-medium hover:bg-blue-700">Sign in</button>
              <button class="w-full py-2 bg-white border border-slate-300 text-slate-700 rounded text-sm hover:bg-slate-50 flex items-center justify-center gap-2">
                <span class="w-4 h-4 rounded bg-slate-200"></span> Sign in with SSO
              </button>
            </div>
            <div class="mt-5 pt-4 border-t border-slate-200 text-[11px] text-slate-500 leading-snug">
              All sign-in attempts are recorded in the system audit log.
              If you've forgotten your password, contact your administrator or use the reset link.
            </div>
          </div>
        </g>
      </div>
      <g id="detail-levels" class="contents">
        <div class="absolute bottom-6 left-6 right-6">
          <div class="bg-white rounded-lg border border-slate-200 shadow-sm">
            <div class="px-4 py-2 border-b border-slate-200 flex items-center justify-between">
              <h2 class="font-medium text-sm">Error detail levels — PAM auth failure</h2>
              <span class="text-xs text-slate-500">Backing service: libpam + nsswitch</span>
            </div>
            <div class="p-4 grid grid-cols-4 gap-3 text-xs">
              <div class="border border-slate-200 rounded p-3">
                <div class="flex items-center gap-1.5 mb-2">
                  <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                  <span class="font-semibold uppercase tracking-wide text-slate-600">Minimal</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="w-6 h-6 rounded-full bg-rose-100 text-rose-700 flex items-center justify-center text-sm">⛔</span>
                  <span>Wrong password</span>
                </div>
              </div>
              <div class="border border-blue-300 bg-blue-50 rounded p-3 ring-1 ring-blue-300">
                <div class="flex items-center gap-1.5 mb-2">
                  <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                  <span class="font-semibold uppercase tracking-wide text-blue-700">Standard</span>
                </div>
                <div class="font-medium mb-1">Authentication failed</div>
                <div class="text-slate-600 mb-2">PAM rejected the credentials. 2 attempts remaining.</div>
                <button class="px-2 py-1 bg-blue-600 text-white rounded text-xs">Try again</button>
              </div>
              <div class="border border-slate-200 rounded p-3">
                <div class="flex items-center gap-1.5 mb-2">
                  <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                  <span class="font-semibold uppercase tracking-wide text-slate-600">Detailed</span>
                </div>
                <div class="text-slate-600 mb-1">PAM trace (admin):</div>
                <pre class="text-[10px] font-mono text-slate-700 bg-slate-50 rounded p-1.5 overflow-hidden leading-tight">pam_unix(cbsd:auth):
  authentication failure;
  user=admin rhost=10.0.0.4
  logname= uid=0 euid=0
  tty=pts/0</pre>
              </div>
              <div class="border border-slate-200 rounded p-3">
                <div class="flex items-center gap-1.5 mb-2">
                  <span class="w-2 h-2 rounded-full bg-violet-500"></span>
                  <span class="font-semibold uppercase tracking-wide text-slate-600">Debug</span>
                </div>
                <div class="space-y-1 text-slate-700">
                  <div>req&#160;id:&#160;<code class="text-[10px]">req_44ac718e</code></div>
                  <div>env:&#160;<code class="text-[10px]">production</code></div>
                  <div>build:&#160;<code class="text-[10px]">v2.4.1#fb12a8</code></div>
                  <div>pam&#160;rcode:&#160;<code class="text-[10px]">PAM_AUTH_ERR</code></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </g>
    </div>
  </foreignObject>
</svg>