<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — 500 Internal Server Error</title>
  <desc>Middleware returned HTTP 500 (uncaught exception). A modal shows a user-friendly explanation, a reference code for support, and detailed trace for administrators.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900">
      <g id="header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 px-2 py-0.5 text-xs rounded bg-slate-100 text-slate-600">freenas-mock.local</span>
          </div>
          <div class="ml-auto flex items-center gap-4">
            <span class="text-sm text-slate-500">Theme: CloudBSD</span>
            <button class="text-sm text-slate-600 hover:text-slate-900">Refresh</button>
            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-medium">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto opacity-60">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Dashboard</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Containers</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Jails</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Volumes</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Network Map</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Admin</div>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Users</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Logs</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Notifications</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Settings</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 relative overflow-auto">
          <div class="p-6 opacity-50 pointer-events-none select-none">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h1 class="text-2xl font-bold">Virtual Machines</h1>
                <p class="text-sm text-slate-500">12 VMs across 4 nodes</p>
              </div>
              <button class="px-3 py-1.5 text-sm bg-blue-600 text-white rounded">+ Create VM</button>
            </div>
            <div class="bg-white rounded-lg border border-slate-200 p-4 mb-4">
              <div class="grid grid-cols-4 gap-4 text-sm">
                <div class="h-10 bg-slate-50 rounded"></div>
                <div class="h-10 bg-slate-50 rounded"></div>
                <div class="h-10 bg-slate-50 rounded"></div>
                <div class="h-10 bg-slate-50 rounded"></div>
              </div>
            </div>
            <div class="bg-white rounded-lg border border-slate-200">
              <div class="px-4 py-3 border-b border-slate-200 h-12"></div>
              <div class="divide-y divide-slate-100">
                <div class="px-4 py-3 h-10"></div>
                <div class="px-4 py-3 h-10"></div>
                <div class="px-4 py-3 h-10"></div>
                <div class="px-4 py-3 h-10"></div>
                <div class="px-4 py-3 h-10"></div>
              </div>
            </div>
          </div>
          <div class="absolute inset-0 bg-slate-900/30 backdrop-blur-[1px]"></div>
          <g id="error-modal" class="contents">
            <div class="absolute inset-0 flex items-center justify-center p-6">
              <div role="alertdialog" aria-labelledby="err-title" class="bg-white rounded-xl shadow-2xl border border-rose-200 w-full max-w-2xl">
                <div class="px-6 py-5 border-b border-slate-200 flex items-start gap-4">
                  <div class="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center flex-shrink-0 text-2xl">!</div>
                  <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2">
                      <h2 id="err-title" class="text-lg font-semibold">Internal server error</h2>
                      <span class="text-xs px-1.5 py-0.5 rounded bg-rose-100 text-rose-800 font-mono">HTTP 500</span>
                    </div>
                    <p class="text-sm text-slate-600 mt-1">
                      The middleware service encountered an unexpected condition while handling your request and could not complete it.
                    </p>
                  </div>
                  <button class="text-slate-400 hover:text-slate-700 text-xl leading-none" title="Close">×</button>
                </div>
                <div class="px-6 py-4 space-y-4">
                  <div class="bg-amber-50 border border-amber-200 rounded p-3 flex items-start gap-3">
                    <div class="w-7 h-7 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center text-sm flex-shrink-0">!</div>
                    <div class="text-sm text-amber-900">
                      <div class="font-medium">Reference code</div>
                      <div class="font-mono text-xs mt-1">REF-MW-2026-07-06T14:22:08Z-7e3a9c</div>
                      <div class="text-xs mt-1 text-amber-800">Please quote this when contacting support. The full trace is in the system log.</div>
                    </div>
                  </div>
                  <details class="text-sm">
                    <summary class="cursor-pointer font-medium text-slate-700 hover:text-slate-900">Show technical details (admin)</summary>
                    <div class="mt-3 bg-slate-900 text-slate-100 rounded p-3 font-mono text-xs overflow-x-auto">
                      <div class="text-rose-300">Error: Cannot read properties of undefined (reading 'memalloc')</div>
                      <div class="text-slate-400">at BhyveVMService.applyLimits (/srv/mw/src/vm/bhyve.service.ts:218:42)</div>
                      <div class="text-slate-400">at process.processTicksAndRejections (node:internal/process/task_queues:96:5)</div>
                      <div class="text-slate-400">at async /srv/mw/src/vm/vm.controller.ts:77:14</div>
                      <div class="text-slate-500 mt-2">requestId: req_8a1f2b3c  ·  user: admin  ·  route: POST /api/v1.0/vm/1/update</div>
                    </div>
                  </details>
                  <div class="grid grid-cols-3 gap-3 text-xs">
                    <div class="border border-slate-200 rounded p-2">
                      <div class="text-slate-500">Request ID</div>
                      <code class="text-[11px]">req_8a1f2b3c</code>
                    </div>
                    <div class="border border-slate-200 rounded p-2">
                      <div class="text-slate-500">Env</div>
                      <code class="text-[11px]">production</code>
                    </div>
                    <div class="border border-slate-200 rounded p-2">
                      <div class="text-slate-500">Build</div>
                      <code class="text-[11px]">v2.4.1#fb12a8</code>
                    </div>
                  </div>
                </div>
                <div class="px-6 py-4 bg-slate-50 border-t border-slate-200 flex items-center justify-end gap-2">
                  <button class="px-3 py-2 text-sm text-slate-700 hover:bg-slate-100 rounded">Copy reference</button>
                  <button class="px-3 py-2 text-sm border border-slate-300 bg-white text-slate-700 rounded hover:bg-slate-50">View system logs</button>
                  <button class="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">Retry</button>
                </div>
              </div>
            </div>
          </g>
        </main>
      </div>
      <g id="detail-levels" class="contents">
        <div class="absolute bottom-6 left-6 right-6 z-10">
          <div class="bg-white rounded-lg border border-slate-200 shadow-sm">
            <div class="px-4 py-2 border-b border-slate-200 flex items-center justify-between">
              <h2 class="font-medium text-sm">Error detail levels — HTTP 500</h2>
              <span class="text-xs text-slate-500">Trace in /var/log/cloudbsd/mw.log</span>
            </div>
            <div class="p-4 grid grid-cols-4 gap-3 text-xs">
              <div class="border border-slate-200 rounded p-3">
                <div class="flex items-center gap-1.5 mb-2">
                  <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                  <span class="font-semibold uppercase tracking-wide text-slate-600">Minimal</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="w-6 h-6 rounded-full bg-rose-100 text-rose-700 flex items-center justify-center text-sm">!</span>
                  <span>Server error</span>
                </div>
              </div>
              <div class="border border-blue-300 bg-blue-50 rounded p-3 ring-1 ring-blue-300">
                <div class="flex items-center gap-1.5 mb-2">
                  <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                  <span class="font-semibold uppercase tracking-wide text-blue-700">Standard</span>
                </div>
                <div class="font-medium mb-1">Internal server error</div>
                <div class="text-slate-600 mb-2">The service hit an unexpected condition.</div>
                <button class="px-2 py-1 bg-blue-600 text-white rounded text-xs">Retry</button>
              </div>
              <div class="border border-slate-200 rounded p-3">
                <div class="flex items-center gap-1.5 mb-2">
                  <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                  <span class="font-semibold uppercase tracking-wide text-slate-600">Detailed</span>
                </div>
                <div class="text-slate-600 mb-1">Stack trace (admin):</div>
                <pre class="text-[10px] font-mono text-slate-700 bg-slate-50 rounded p-1.5 overflow-hidden leading-tight">TypeError: cannot read
  memalloc of undefined
  at BhyveVMService.applyLimits
    (vm/bhyve.service.ts:218)</pre>
              </div>
              <div class="border border-slate-200 rounded p-3">
                <div class="flex items-center gap-1.5 mb-2">
                  <span class="w-2 h-2 rounded-full bg-violet-500"></span>
                  <span class="font-semibold uppercase tracking-wide text-slate-600">Debug</span>
                </div>
                <div class="space-y-1 text-slate-700">
                  <div>req&#160;id:&#160;<code class="text-[10px]">req_8a1f2b3c</code></div>
                  <div>env:&#160;<code class="text-[10px]">production</code></div>
                  <div>build:&#160;<code class="text-[10px]">v2.4.1#fb12a8</code></div>
                  <div>ref:&#160;<code class="text-[10px]">REF-MW-…7e3a9c</code></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </g>
    </div>
  </foreignObject>
</svg>