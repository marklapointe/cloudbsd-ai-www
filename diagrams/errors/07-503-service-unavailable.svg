<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — 503 Service Unavailable</title>
  <desc>Middleware returned HTTP 503 (intentional outage or maintenance). Full-page retry view with auto-retry countdown and a maintenance window.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-gradient-to-b from-slate-50 to-slate-100 text-slate-900 flex flex-col">
      <g id="top-bar" class="contents">
        <div class="h-12 bg-white/70 backdrop-blur border-b border-slate-200 flex items-center px-6">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded bg-blue-600 text-white flex items-center justify-center font-bold text-sm">C</div>
            <span class="font-bold">CloudBSD Admin</span>
            <span class="text-xs text-slate-500 ml-2">freenas-mock.local</span>
            <span class="ml-2 px-2 py-0.5 text-xs rounded bg-amber-50 text-amber-800 border border-amber-200 flex items-center gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
              Maintenance window
            </span>
          </div>
          <div class="ml-auto text-xs text-slate-500">Theme: CloudBSD · en-US · v2.4.1</div>
        </div>
      </g>
      <div class="flex-1 flex items-center justify-center p-6">
        <g id="maintenance-card" class="contents">
          <div class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-2xl overflow-hidden">
            <div class="bg-gradient-to-r from-blue-600 to-violet-600 text-white px-8 py-6 flex items-center gap-5">
              <div class="w-16 h-16 rounded-full bg-white/20 flex items-center justify-center text-3xl" aria-hidden="true">🛠</div>
              <div class="flex-1">
                <div class="text-xs uppercase tracking-wider font-semibold text-blue-100">HTTP 503 · Service Unavailable</div>
                <h1 class="mt-1 text-2xl font-bold">CloudBSD is temporarily offline</h1>
                <p class="mt-1 text-sm text-blue-100">
                  Scheduled maintenance is in progress. Operations will resume automatically when the service comes back online.
                </p>
              </div>
            </div>
            <div class="p-6">
              <div class="grid grid-cols-3 gap-3 text-sm">
                <div class="border border-slate-200 rounded p-3">
                  <div class="text-xs text-slate-500">Status</div>
                  <div class="mt-1 flex items-center gap-1.5 font-medium">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span> Maintenance
                  </div>
                </div>
                <div class="border border-slate-200 rounded p-3">
                  <div class="text-xs text-slate-500">Auto-retry in</div>
                  <div class="mt-1 font-mono font-medium text-lg">00:23</div>
                </div>
                <div class="border border-slate-200 rounded p-3">
                  <div class="text-xs text-slate-500">ETA</div>
                  <div class="mt-1 font-medium">~10 min</div>
                </div>
              </div>
              <div class="mt-5">
                <div class="text-xs text-slate-500 mb-1">Maintenance progress</div>
                <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
                  <div class="h-full bg-blue-600 rounded-full" style="width: 62%"></div>
                </div>
                <div class="mt-1 text-xs text-slate-500 flex items-center justify-between">
                  <span>Step 3 of 5 · migrating datastore snapshots</span>
                  <span>62%</span>
                </div>
              </div>
              <div class="mt-6 flex flex-wrap items-center gap-2">
                <button class="px-4 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700 flex items-center gap-2">
                  <span class="w-3 h-3 rounded-full border-2 border-white border-t-transparent animate-spin"></span>
                  Retry now
                </button>
                <button class="px-4 py-2 bg-white border border-slate-300 text-slate-700 rounded text-sm hover:bg-slate-50">Status page</button>
                <button class="px-4 py-2 text-slate-600 text-sm hover:underline">Subscribe to updates</button>
              </div>
              <div class="mt-6 pt-4 border-t border-slate-200 grid grid-cols-2 gap-4 text-xs">
                <div>
                  <div class="text-slate-500 mb-1">Retry-After header</div>
                  <code class="text-[11px] bg-slate-100 px-1.5 py-0.5 rounded">30</code>
                </div>
                <div>
                  <div class="text-slate-500 mb-1">Last successful</div>
                  <span>2026-07-06 14:18:42 UTC</span>
                </div>
              </div>
            </div>
          </div>
        </g>
      </div>
      <g id="detail-levels" class="contents">
        <div class="absolute bottom-6 left-6 right-6">
          <div class="bg-white rounded-lg border border-slate-200 shadow-sm">
            <div class="px-4 py-2 border-b border-slate-200 flex items-center justify-between">
              <h2 class="font-medium text-sm">Error detail levels — HTTP 503</h2>
              <span class="text-xs text-slate-500">Retry-After: 30s</span>
            </div>
            <div class="p-4 grid grid-cols-4 gap-3 text-xs">
              <div class="border border-slate-200 rounded p-3">
                <div class="flex items-center gap-1.5 mb-2">
                  <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                  <span class="font-semibold uppercase tracking-wide text-slate-600">Minimal</span>
                </div>
                <div class="flex items-center gap-2">
                  <span class="w-6 h-6 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center text-sm">⏱</span>
                  <span>Trying again…</span>
                </div>
              </div>
              <div class="border border-blue-300 bg-blue-50 rounded p-3 ring-1 ring-blue-300">
                <div class="flex items-center gap-1.5 mb-2">
                  <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                  <span class="font-semibold uppercase tracking-wide text-blue-700">Standard</span>
                </div>
                <div class="font-medium mb-1">Temporarily offline</div>
                <div class="text-slate-600 mb-2">Maintenance in progress. Auto-retry in 23s.</div>
                <button class="px-2 py-1 bg-blue-600 text-white rounded text-xs">Retry</button>
              </div>
              <div class="border border-slate-200 rounded p-3">
                <div class="flex items-center gap-1.5 mb-2">
                  <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                  <span class="font-semibold uppercase tracking-wide text-slate-600">Detailed</span>
                </div>
                <div class="text-slate-600 mb-1">Maintenance plan:</div>
                <pre class="text-[10px] font-mono text-slate-700 bg-slate-50 rounded p-1.5 overflow-hidden leading-tight">[ok] drain connections
[ok] snapshot ZFS tank
[..] migrate snapshots
[..] update mw v2.4.1
[..] healthcheck &amp; resume</pre>
              </div>
              <div class="border border-slate-200 rounded p-3">
                <div class="flex items-center gap-1.5 mb-2">
                  <span class="w-2 h-2 rounded-full bg-violet-500"></span>
                  <span class="font-semibold uppercase tracking-wide text-slate-600">Debug</span>
                </div>
                <div class="space-y-1 text-slate-700">
                  <div>req&#160;id:&#160;<code class="text-[10px]">req_f01bb4c2</code></div>
                  <div>env:&#160;<code class="text-[10px]">production</code></div>
                  <div>build:&#160;<code class="text-[10px]">v2.4.1#fb12a8</code></div>
                  <div>pid:&#160;<code class="text-[10px]">1842</code></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </g>
    </div>
  </foreignObject>
</svg>