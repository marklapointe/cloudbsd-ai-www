<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Plugin Load Error (Manifest Invalid)</title>
  <desc>A plugin's manifest.json failed validation or could not be found. The plugin panel in the app surfaces the failure with details and an option to disable or reinstall the plugin.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900">
      <g id="header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 px-2 py-0.5 text-xs rounded bg-slate-100 text-slate-600">freenas-mock.local</span>
          </div>
          <div class="ml-auto flex items-center gap-4">
            <span class="text-sm text-slate-500">Theme: CloudBSD</span>
            <button class="text-sm text-slate-600 hover:text-slate-900">Refresh</button>
            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-medium">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Dashboard</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Containers</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Jails</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Volumes</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Network Map</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Admin</div>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Users</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Logs</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Notifications</a>
              <a class="block px-3 py-2 rounded bg-blue-50 text-blue-700 font-medium">Plugins</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Settings</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 p-6 overflow-auto">
          <div class="flex items-center justify-between mb-4">
            <div>
              <h1 class="text-2xl font-bold">Plugins</h1>
              <p class="text-sm text-slate-500">Installed &amp; available plugins · 3 errors</p>
            </div>
            <div class="flex items-center gap-2">
              <button class="px-3 py-1.5 text-sm border border-slate-300 bg-white text-slate-700 rounded hover:bg-slate-50">Refresh registry</button>
              <button class="px-3 py-1.5 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">Install from file</button>
            </div>
          </div>
          <g id="plugin-error" class="contents">
            <div role="alert" class="bg-rose-50 border border-rose-200 rounded-lg p-4 mb-4 flex items-start gap-3">
              <div class="w-10 h-10 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center flex-shrink-0 text-xl" aria-hidden="true">⊘</div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2">
                  <span class="font-semibold text-rose-900">Plugin failed to load: <code class="px-1 py-0.5 bg-rose-100 rounded text-xs">cbsd-bhyve-stats@2.1.0</code></span>
                  <span class="text-xs px-1.5 py-0.5 rounded bg-rose-100 text-rose-800 font-mono">MANIFEST_INVALID</span>
                </div>
                <div class="text-sm text-rose-800 mt-1">
                  The plugin manifest at
                  <code class="px-1 py-0.5 bg-rose-100 rounded text-xs">/usr/local/etc/cloudbsd/plugins/cbsd-bhyve-stats/manifest.json</code>
                  could not be parsed. The file is either missing, unreadable, or fails schema validation.
                </div>
                <div class="mt-3 flex items-center gap-2 flex-wrap">
                  <button class="px-3 py-1.5 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">Reinstall</button>
                  <button class="px-3 py-1.5 text-sm border border-slate-300 bg-white text-slate-700 rounded hover:bg-slate-50">Disable plugin</button>
                  <button class="px-3 py-1.5 text-sm border border-slate-300 bg-white text-slate-700 rounded hover:bg-slate-50">Open manifest path</button>
                  <button class="px-3 py-1.5 text-sm text-slate-600 hover:underline">View plugin logs</button>
                  <button class="px-3 py-1.5 text-sm text-slate-500 hover:underline ml-auto">Dismiss</button>
                </div>
              </div>
            </div>
          </g>
          <g id="plugin-list" class="contents">
            <div class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
              <table class="w-full text-sm">
                <thead class="bg-slate-50 text-slate-600 text-xs uppercase tracking-wide">
                  <tr>
                    <th class="text-left font-medium px-4 py-2">Plugin</th>
                    <th class="text-left font-medium px-4 py-2">Version</th>
                    <th class="text-left font-medium px-4 py-2">Status</th>
                    <th class="text-left font-medium px-4 py-2">Path</th>
                    <th class="text-right font-medium px-4 py-2">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  <tr>
                    <td class="px-4 py-2 font-medium">cbsd-snapshot-rotate</td>
                    <td class="px-4 py-2 text-slate-600">1.4.2</td>
                    <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs bg-emerald-50 text-emerald-700">active</span></td>
                    <td class="px-4 py-2 font-mono text-xs text-slate-500">/plugins/snapshot-rotate</td>
                    <td class="px-4 py-2 text-right text-slate-400">—</td>
                  </tr>
                  <tr class="bg-rose-50/50">
                    <td class="px-4 py-2 font-medium">cbsd-bhyve-stats</td>
                    <td class="px-4 py-2 text-slate-600">2.1.0</td>
                    <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs bg-rose-100 text-rose-800">error</span></td>
                    <td class="px-4 py-2 font-mono text-xs text-slate-500">/plugins/bhyve-stats</td>
                    <td class="px-4 py-2 text-right"><button class="text-blue-700 hover:underline text-xs">Repair</button></td>
                  </tr>
                  <tr>
                    <td class="px-4 py-2 font-medium">cbsd-net-monitor</td>
                    <td class="px-4 py-2 text-slate-600">0.9.0</td>
                    <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs bg-emerald-50 text-emerald-700">active</span></td>
                    <td class="px-4 py-2 font-mono text-xs text-slate-500">/plugins/net-monitor</td>
                    <td class="px-4 py-2 text-right text-slate-400">—</td>
                  </tr>
                  <tr class="bg-rose-50/50">
                    <td class="px-4 py-2 font-medium">cbsd-mailer</td>
                    <td class="px-4 py-2 text-slate-600">3.0.0-beta</td>
                    <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs bg-rose-100 text-rose-800">error</span></td>
                    <td class="px-4 py-2 font-mono text-xs text-slate-500">/plugins/mailer</td>
                    <td class="px-4 py-2 text-right"><button class="text-blue-700 hover:underline text-xs">Repair</button></td>
                  </tr>
                  <tr class="bg-rose-50/50">
                    <td class="px-4 py-2 font-medium">cbsd-legacy-bridge</td>
                    <td class="px-4 py-2 text-slate-600">1.0.0</td>
                    <td class="px-4 py-2"><span class="px-2 py-0.5 rounded-full text-xs bg-rose-100 text-rose-800">missing manifest</span></td>
                    <td class="px-4 py-2 font-mono text-xs text-slate-500">/plugins/legacy-bridge</td>
                    <td class="px-4 py-2 text-right"><button class="text-blue-700 hover:underline text-xs">Repair</button></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </g>
          <g id="detail-levels" class="contents">
            <div class="bg-white rounded-lg border border-slate-200 shadow-sm mt-6">
              <div class="px-4 py-2 border-b border-slate-200 flex items-center justify-between">
                <h2 class="font-medium text-sm">Error detail levels — Plugin load error</h2>
                <span class="text-xs text-slate-500">Schema: plugins/v1/manifest.schema.json</span>
              </div>
              <div class="p-4 grid grid-cols-4 gap-3 text-xs">
                <div class="border border-slate-200 rounded p-3">
                  <div class="flex items-center gap-1.5 mb-2">
                    <span class="w-2 h-2 rounded-full bg-slate-400"></span>
                    <span class="font-semibold uppercase tracking-wide text-slate-600">Minimal</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="w-6 h-6 rounded-full bg-rose-100 text-rose-700 flex items-center justify-center text-sm">⊘</span>
                    <span>Plugin failed</span>
                  </div>
                </div>
                <div class="border border-blue-300 bg-blue-50 rounded p-3 ring-1 ring-blue-300">
                  <div class="flex items-center gap-1.5 mb-2">
                    <span class="w-2 h-2 rounded-full bg-blue-500"></span>
                    <span class="font-semibold uppercase tracking-wide text-blue-700">Standard</span>
                  </div>
                  <div class="font-medium mb-1">Plugin won't load</div>
                  <div class="text-slate-600 mb-2">cbsd-bhyve-stats manifest is invalid.</div>
                  <button class="px-2 py-1 bg-blue-600 text-white rounded text-xs">Reinstall</button>
                </div>
                <div class="border border-slate-200 rounded p-3">
                  <div class="flex items-center gap-1.5 mb-2">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    <span class="font-semibold uppercase tracking-wide text-slate-600">Detailed</span>
                  </div>
                  <div class="text-slate-600 mb-1">Schema validation:</div>
                  <pre class="text-[10px] font-mono text-slate-700 bg-slate-50 rounded p-1.5 overflow-hidden leading-tight">ManifestError: missing
  required field "entry"
  at ManifestSchema.validate
    (src/plugins/manifest.ts:88)
  expected entry: string</pre>
                </div>
                <div class="border border-slate-200 rounded p-3">
                  <div class="flex items-center gap-1.5 mb-2">
                    <span class="w-2 h-2 rounded-full bg-violet-500"></span>
                    <span class="font-semibold uppercase tracking-wide text-slate-600">Debug</span>
                  </div>
                  <div class="space-y-1 text-slate-700">
                    <div>req&#160;id:&#160;<code class="text-[10px]">req_e54a3c91</code></div>
                    <div>env:&#160;<code class="text-[10px]">production</code></div>
                    <div>build:&#160;<code class="text-[10px]">v2.4.1#fb12a8</code></div>
                    <div>plugin:&#160;<code class="text-[10px]">2.1.0</code></div>
                  </div>
                </div>
              </div>
            </div>
          </g>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>