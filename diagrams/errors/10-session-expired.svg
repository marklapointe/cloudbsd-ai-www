              </div>
              <div class="bg-white rounded-lg border border-slate-200 p-4">
                <div class="text-sm text-slate-500">Storage</div>
                <div class="text-2xl font-bold mt-1">5.2 TB</div>
              </div>
              <div class="bg-white rounded-lg border border-slate-200 p-4">
                <div class="text-sm text-slate-500">VMs</div>
                <div class="text-2xl font-bold mt-1">12</div>
