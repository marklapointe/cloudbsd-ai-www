                  <span class="font-semibold uppercase tracking-wide text-blue-700">Standard</span>
                </div>
                <div class="font-medium mb-1">Sign in again</div>
                <div class="text-slate-600 mb-2">For your security, the page has been hidden.</div>
                <button class="px-2 py-1 bg-blue-600 text-white rounded text-xs">Sign in</button>
              </div>
              <div class="border border-slate-200 rounded p-3">
                <div class="flex items-center gap-1.5 mb-2">
                  <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                  <span class="font-semibold uppercase tracking-wide text-slate-600">Detailed</span>
                </div>
                <div class="text-slate-600 mb-1">Auth trace (admin):</div>
                <pre class="text-[10px] font-mono text-slate-700 bg-slate-50 rounded p-1.5 overflow-hidden leading-tight">IdleTimeoutError: token TTL
  exceeded 900s
  at SessionGuard.validate
    (src/auth/session.guard.ts:62)
  at AuthInterceptor</pre>
              </div>
              <div class="border border-slate-200 rounded p-3">
                <div class="flex items-center gap-1.5 mb-2">
                  <span class="w-2 h-2 rounded-full bg-violet-500"></span>
                  <span class="font-semibold uppercase tracking-wide text-slate-600">Debug</span>
                </div>
                <div class="space-y-1 text-slate-700">
                  <div>req&#160;id:&#160;<code class="text-[10px]">req_b72d44e3</code></div>
                  <div>env:&#160;<code class="text-[10px]">production</code></div>
                  <div>build:&#160;<code class="text-[10px]">v2.4.1#fb12a8</code></div>
                  <div>exp&#160;at:&#160;<code class="text-[10px]">14:36:08Z</code></div>
                </div>
              </div>
            </div>
          </div>
        </div>
