<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — Add Node Dialog</title>
  <desc>3-tab dialog: Manual / Auto-detect (mDNS) / Join token. Mock shows Auto-detect active with 2 nodes found.</desc>
  <foreignObject x="0" y="0" width="800" height="600">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:800px;height:600px;background:rgba(15,23,42,0.6);display:flex;align-items:center;justify-content:center;">
      <div style="background:#ffffff;border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,0.4);width:640px;display:flex;flex-direction:column;overflow:hidden;">
        <div style="padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;">
          <h2 style="margin:0;font-size:16px;font-weight:700;color:#0f172a;">Add Node</h2>
          <button style="width:28px;height:28px;border-radius:50%;background:#f1f5f9;border:0;cursor:pointer;font-size:16px;color:#64748b;">✕</button>
        </div>
        <div style="display:flex;border-bottom:1px solid #e2e8f0;background:#f8fafc;">
          <div style="flex:1;padding:10px 14px;text-align:center;font-size:12px;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;">Manual</div>
          <div style="flex:1;padding:10px 14px;text-align:center;font-size:12px;color:#1d4ed8;font-weight:600;background:#ffffff;border-bottom:2px solid #2563eb;">◎ Auto-detect</div>
          <div style="flex:1;padding:10px 14px;text-align:center;font-size:12px;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;">Join Token</div>
        </div>
        <div style="padding:18px 20px;flex:1;">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:12px;color:#475569;">
            <label>Interface to scan:</label>
            <select style="font-size:12px;border:1px solid #cbd5e1;border-radius:5px;padding:4px 8px;background:#ffffff;color:#475569;flex:1;">
              <option>br0 (10.0.10.0/24)</option>
              <option>igc0 (192.168.1.0/24)</option>
            </select>
            <label style="display:flex;align-items:center;gap:4px;font-size:11px;"><input type="checkbox" />Auto-approve</label>
          </div>
          <div style="background:#fef3c7;border:1px solid #fde68a;border-radius:6px;padding:8px 12px;font-size:11px;color:#92400e;margin-bottom:14px;display:flex;align-items:center;gap:8px;">
            <span>⏳</span>
            <span>Scanning… timeout in 1:48</span>
          </div>
          <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:8px;">Discovered nodes (2)</div>
          <div style="border:1px solid #cbd5e1;border-radius:6px;padding:12px;margin-bottom:8px;background:#f8fafc;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
              <div style="font-weight:700;color:#0f172a;font-size:13px;">cloudbsd-node-04</div>
              <button style="padding:5px 12px;font-size:11px;border:0;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#ffffff;border-radius:5px;cursor:pointer;">+ Add</button>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;font-size:10px;color:#475569;">
              <div><span style="color:#94a3b8;">IP:</span> 10.0.10.44</div>
              <div><span style="color:#94a3b8;">Agent:</span> v1.4.2</div>
              <div><span style="color:#94a3b8;">Cores:</span> 8</div>
              <div><span style="color:#94a3b8;">RAM:</span> 32 GB</div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:10px;color:#475569;margin-top:4px;">
              <div><span style="color:#94a3b8;">Free RAM:</span> 28 GB</div>
              <div><span style="color:#94a3b8;">Free disk:</span> 1.2 TB</div>
              <div><span style="color:#10b981;✓;">&#x2713; token verified</span></div>
            </div>
          </div>
          <div style="border:1px solid #cbd5e1;border-radius:6px;padding:12px;background:#f8fafc;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
              <div style="font-weight:700;color:#0f172a;font-size:13px;">cloudbsd-node-05</div>
              <button style="padding:5px 12px;font-size:11px;border:0;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#ffffff;border-radius:5px;cursor:pointer;">+ Add</button>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;font-size:10px;color:#475569;">
              <div><span style="color:#94a3b8;">IP:</span> 10.0.10.45</div>
              <div><span style="color:#94a3b8;">Agent:</span> v1.4.2</div>
              <div><span style="color:#94a3b8;">Cores:</span> 4</div>
              <div><span style="color:#94a3b8;">RAM:</span> 16 GB</div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:10px;color:#475569;margin-top:4px;">
              <div><span style="color:#94a3b8;">Free RAM:</span> 12 GB</div>
              <div><span style="color:#94a3b8;">Free disk:</span> 500 GB</div>
              <div><span style="color:#f59e0b;">&#x26A0; clock skew 0.8s</span></div>
            </div>
          </div>
        </div>
        <div style="padding:12px 20px;border-top:1px solid #e2e8f0;background:#f8fafc;display:flex;align-items:center;justify-content:space-between;">
          <div style="font-size:10px;color:#94a3b8;">mDNS service: _cloudbsd-node._tcp.local. on UDP 5353</div>
          <div style="display:flex;gap:6px;">
            <button style="padding:6px 14px;font-size:12px;border:1px solid #cbd5e1;border-radius:5px;background:#ffffff;color:#334155;">Rescan</button>
            <button style="padding:6px 14px;font-size:12px;border:1px solid #cbd5e1;border-radius:5px;background:#ffffff;color:#334155;">Cancel</button>
            <button style="padding:6px 14px;font-size:12px;border:0;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#ffffff;border-radius:5px;font-weight:600;">Add 2 nodes</button>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>