<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 700" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — Volume Performance Tab (tank/data)</title>
  <desc>Detail panel · Volume Performance tab active · throughput sparkline, P50/P99 latency, IOPS, capacity forecast. (T94o)</desc>
  <foreignObject x="0" y="0" width="1000" height="700">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1000px;height:700px;background:#f1f5f9;color:#0f172a;font-size:13px;box-sizing:border-box;overflow:hidden;">
<div style="background:#ffffff;border-bottom:1px solid #e2e8f0;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;">Volume</span>
          <span style="font-family:monospace;font-size:15px;font-weight:700;color:#0f172a;">tank/data</span>
          <span style="font-size:9px;padding:2px 7px;border-radius:3px;background:#dbeafe;color:#1d4ed8;font-weight:600;letter-spacing:0.04em;">ZFS</span>
        </div>
        <div style="display:flex;gap:6px;align-items:center;font-size:11px;">
          
          <span style="display:inline-flex;align-items:center;gap:5px;padding:3px 9px;font-size:10px;font-weight:600;letter-spacing:0.04em;background:#16a34a10;border:1px solid #bbf7d0;border-radius:9999px;color:#166534;font-family:monospace;"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#16a34a;"></span>live</span>
        </div>
      </div><div style="display:flex;background:#ffffff;border-bottom:1px solid #e2e8f0;flex-shrink:0;overflow-x:auto;"><span style="padding:10px 16px;font-size:12px;color:#64748b;border-bottom:2px solid transparent;cursor:pointer;">Overview</span><span style="padding:10px 16px;font-size:12px;color:#64748b;border-bottom:2px solid transparent;cursor:pointer;">Datasets</span><span style="padding:10px 16px;font-size:12px;color:#64748b;border-bottom:2px solid transparent;cursor:pointer;">Snapshots</span><span style="padding:10px 16px;font-size:12px;color:#64748b;border-bottom:2px solid transparent;cursor:pointer;">Scrubs</span><span style="padding:10px 16px;font-size:12px;color:#1d4ed8;border-bottom:2px solid #2563eb;font-weight:600;cursor:pointer;">Performance</span><span style="padding:10px 16px;font-size:12px;color:#64748b;border-bottom:2px solid transparent;cursor:pointer;">Settings</span></div><div style="flex:1;overflow-y:auto;padding:16px 18px;background:#f1f5f9;"><div style="margin-bottom:14px;"><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;color:#94a3b8;margin-bottom:6px;">Throughput (last 1h · 5-min buckets)</div><div style="display:flex;gap:14px;font-size:10px;color:#64748b;margin-bottom:6px;">
            <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:8px;height:8px;background:#0ea5e9;border-radius:1px;"></span>Read 487 GB</span>
            <span style="display:inline-flex;align-items:center;gap:4px;"><span style="width:8px;height:8px;background:#f59e0b;border-radius:1px;"></span>Write 142 GB</span>
            <span style="margin-left:auto;">peak R 1.2 GB/s · peak W 480 MB/s</span>
          </div>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 80" preserveAspectRatio="none" style="width:100%;height:80px;display:block;background:#ffffff;border:1px solid #e2e8f0;border-radius:4px;">
            <g fill="#0ea5e9"><rect x="0" y="30" width="9" height="50"/><rect x="11" y="22" width="9" height="58"/><rect x="22" y="40" width="9" height="40"/><rect x="33" y="48" width="9" height="32"/><rect x="44" y="36" width="9" height="44"/><rect x="55" y="20" width="9" height="60"/><rect x="66" y="14" width="9" height="66"/><rect x="77" y="28" width="9" height="52"/><rect x="88" y="35" width="9" height="45"/><rect x="99" y="42" width="9" height="38"/><rect x="110" y="32" width="9" height="48"/><rect x="121" y="18" width="9" height="62"/></g>
            <g fill="#f59e0b"><rect x="0" y="58" width="9" height="22"/><rect x="11" y="50" width="9" height="30"/><rect x="22" y="64" width="9" height="16"/><rect x="33" y="70" width="9" height="10"/><rect x="44" y="62" width="9" height="18"/><rect x="55" y="48" width="9" height="32"/><rect x="66" y="42" width="9" height="38"/><rect x="77" y="56" width="9" height="24"/><rect x="88" y="60" width="9" height="20"/><rect x="99" y="68" width="9" height="12"/><rect x="110" y="58" width="9" height="22"/><rect x="121" y="44" width="9" height="36"/></g>
          </svg></div><div style="margin-bottom:14px;"><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;color:#94a3b8;margin-bottom:6px;">Latency (P50 / P99)</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
            <div>
              <div style="font-size:11px;font-weight:600;color:#0f172a;">Read latency</div>
              <div style="display:flex;gap:14px;font-size:10px;color:#64748b;margin:4px 0;">
                <span>P50 <b style="color:#0f172a;font-family:monospace;">1.4 ms</b></span>
                <span>P99 <b style="color:#d97706;font-family:monospace;">8.2 ms</b></span>
              </div>
            </div>
            <div>
              <div style="font-size:11px;font-weight:600;color:#0f172a;">Write latency</div>
              <div style="display:flex;gap:14px;font-size:10px;color:#64748b;margin:4px 0;">
                <span>P50 <b style="color:#0f172a;font-family:monospace;">2.1 ms</b></span>
                <span>P99 <b style="color:#059669;font-family:monospace;">5.8 ms</b></span>
              </div>
            </div>
          </div></div><div style="margin-bottom:14px;"><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;color:#94a3b8;margin-bottom:6px;">IOPS</div><div style="display:grid;grid-template-columns:90px 1fr;gap:5px 10px;font-size:11px;"><span style="color:#64748b;">read IOPS</span><span style="color:#0f172a;">12,840 ops/s · 4k random mix</span><span style="color:#64748b;">write IOPS</span><span style="color:#0f172a;">8,420 ops/s · 4k random mix</span><span style="color:#64748b;">queue depth</span><span style="color:#0f172a;">avg 6 · max 24 (within NVMe saturation point)</span></div></div><div style="margin-bottom:14px;"><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;color:#94a3b8;margin-bottom:6px;">Capacity forecast</div><div style="font-size:11px;color:#475569;">at current write rate (avg 142 GB/day), dataset <code style="background:#f1f5f9;padding:1px 5px;border-radius:3px;font-family:monospace;">tank/data</code> will reach 80% in <b>148 days</b> (2026-12-04). Automated quota warning fires at 75% (2026-10-08).</div></div></div>    </div>
  </foreignObject>
</svg>