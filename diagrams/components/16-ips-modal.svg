<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — IPs Modal</title>
  <desc>Displays all IP addresses for a resource. Virtual scroll for hundreds of IPs. Filterable. 4-col layout: type | IP | interface | scope.</desc>
  <foreignObject x="0" y="0" width="800" height="600">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:800px;height:600px;background:rgba(15,23,42,0.6);display:flex;align-items:center;justify-content:center;">
      <div style="background:#ffffff;border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,0.4);width:640px;max-height:520px;display:flex;flex-direction:column;overflow:hidden;">
        <div style="padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;">
          <div>
            <h2 style="margin:0;font-size:16px;font-weight:700;color:#0f172a;">IP Addresses</h2>
            <div style="font-size:12px;color:#64748b;margin-top:2px;">gitlab-runner · 5 addresses · cloudbsd-node-01</div>
          </div>
          <button style="width:28px;height:28px;border-radius:50%;background:#f1f5f9;border:0;cursor:pointer;font-size:16px;color:#64748b;">✕</button>
        </div>
        <div style="padding:12px 20px;border-bottom:1px solid #e2e8f0;">
          <input type="text" placeholder="Filter by IP, interface, or scope..." style="width:100%;font-size:12px;border:1px solid #cbd5e1;border-radius:6px;padding:6px 10px;box-sizing:border-box;" />
        </div>
        <div style="overflow-y:auto;flex:1;padding:8px 20px;">
          <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #f8fafc;font-size:12px;">
            <span style="width:6px;height:6px;border-radius:50%;background:#10b981;flex-shrink:0;"></span>
            <span style="padding:1px 6px;border-radius:3px;background:#f1f5f9;color:#475569;font-size:10px;font-weight:600;flex-shrink:0;width:32px;text-align:center;">IPv4</span>
            <span title="10.0.10.40" style="font-family:monospace;color:#0f172a;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">10.0.10.40</span>
            <span style="color:#64748b;font-size:10px;width:80px;">vtnet0</span>
            <span style="color:#64748b;font-size:10px;width:60px;">global</span>
            <button title="Copy 10.0.10.40" style="padding:2px 6px;font-size:9px;border:1px solid #cbd5e1;border-radius:3px;background:#ffffff;color:#475569;cursor:pointer;">Copy</button>
          </div>
          <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #f8fafc;font-size:12px;">
            <span style="width:6px;height:6px;border-radius:50%;background:#10b981;flex-shrink:0;"></span>
            <span style="padding:1px 6px;border-radius:3px;background:#f1f5f9;color:#475569;font-size:10px;font-weight:600;flex-shrink:0;width:32px;text-align:center;">IPv6</span>
            <span title="2001:db8::28" style="font-family:monospace;color:#0f172a;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">2001:db8::28</span>
            <span style="color:#64748b;font-size:10px;width:80px;">vtnet0</span>
            <span style="color:#64748b;font-size:10px;width:60px;">global</span>
            <button title="Copy 2001:db8::28" style="padding:2px 6px;font-size:9px;border:1px solid #cbd5e1;border-radius:3px;background:#ffffff;color:#475569;cursor:pointer;">Copy</button>
          </div>
          <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #f8fafc;font-size:12px;">
            <span style="width:6px;height:6px;border-radius:50%;background:#10b981;flex-shrink:0;"></span>
            <span style="padding:1px 6px;border-radius:3px;background:#f1f5f9;color:#475569;font-size:10px;font-weight:600;flex-shrink:0;width:32px;text-align:center;">IPv6</span>
            <span title="fe80::ff:fe40:5678" style="font-family:monospace;color:#0f172a;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">fe80::ff:fe40:5678</span>
            <span style="color:#64748b;font-size:10px;width:80px;">vtnet0</span>
            <span style="color:#64748b;font-size:10px;width:60px;">link</span>
            <button title="Copy fe80::ff:fe40:5678" style="padding:2px 6px;font-size:9px;border:1px solid #cbd5e1;border-radius:3px;background:#ffffff;color:#475569;cursor:pointer;">Copy</button>
          </div>
          <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #f8fafc;font-size:12px;">
            <span style="width:6px;height:6px;border-radius:50%;background:#10b981;flex-shrink:0;"></span>
            <span style="padding:1px 6px;border-radius:3px;background:#f1f5f9;color:#475569;font-size:10px;font-weight:600;flex-shrink:0;width:32px;text-align:center;">IPv6</span>
            <span title="fd00:1234:5678::1" style="font-family:monospace;color:#0f172a;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">fd00:1234:5678::1</span>
            <span style="color:#64748b;font-size:10px;width:80px;">epair0a</span>
            <span style="color:#64748b;font-size:10px;width:60px;">site</span>
            <button title="Copy fd00:1234:5678::1" style="padding:2px 6px;font-size:9px;border:1px solid #cbd5e1;border-radius:3px;background:#ffffff;color:#475569;cursor:pointer;">Copy</button>
          </div>
          <div style="display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid #f8fafc;font-size:12px;">
            <span style="width:6px;height:6px;border-radius:50%;background:#10b981;flex-shrink:0;"></span>
            <span style="padding:1px 6px;border-radius:3px;background:#f1f5f9;color:#475569;font-size:10px;font-weight:600;flex-shrink:0;width:32px;text-align:center;">IPv6</span>
            <span title="fd00:1234:5678::2" style="font-family:monospace;color:#0f172a;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">fd00:1234:5678::2</span>
            <span style="color:#64748b;font-size:10px;width:80px;">epair0a</span>
            <span style="color:#64748b;font-size:10px;width:60px;">site</span>
            <button title="Copy fd00:1234:5678::2" style="padding:2px 6px;font-size:9px;border:1px solid #cbd5e1;border-radius:3px;background:#ffffff;color:#475569;cursor:pointer;">Copy</button>
          </div>
        </div>
        <div style="padding:6px 20px;border-top:1px solid #e2e8f0;background:#f8fafc;font-size:10px;color:#94a3b8;display:flex;align-items:center;justify-content:space-between;">
          <span>Showing 5 of 5</span>
          <span style="font-style:italic;">Virtual scroll active — handles 1000+ IPs</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>