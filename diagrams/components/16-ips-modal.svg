<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin &#x2014; IPs Modal</title>
  <desc>Displays all IP addresses for a resource. Virtual scroll for hundreds of IPs. Clicking a row copies the IP to the paste buffer; a tiny toast confirms. IPv4/IPv6 labels are intentionally omitted &#x2014; the address shape is self-evident, freeing space for more columns.</desc>
  <foreignObject x="0" y="0" width="800" height="600">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:800px;height:600px;background:rgba(15,23,42,0.6);display:flex;align-items:center;justify-content:center;">
      <div style="background:#ffffff;border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,0.4);width:480px;max-height:520px;display:flex;flex-direction:column;overflow:hidden;">
        <div style="padding:14px 18px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;">
          <div>
            <h2 style="margin:0;font-size:15px;font-weight:700;color:#0f172a;">IP Addresses</h2>
            <div style="font-size:11px;color:#64748b;margin-top:2px;">gitlab-runner &#xB7; 5 addresses &#xB7; click any row to copy</div>
          </div>
          <button style="width:26px;height:26px;border-radius:50%;background:#f1f5f9;border:0;cursor:pointer;font-size:14px;color:#64748b;">&#x2715;</button>
        </div>
        <div style="padding:10px 18px;border-bottom:1px solid #e2e8f0;">
          <input type="text" placeholder="Filter by IP, interface, or scope..." style="width:100%;font-size:12px;border:1px solid #cbd5e1;border-radius:6px;padding:5px 9px;box-sizing:border-box;" />
        </div>
        <div style="overflow-y:auto;flex:1;padding:6px 0;">
          <div title="Click to copy 10.0.10.40" style="display:flex;align-items:center;gap:10px;padding:7px 18px;border-bottom:1px solid #f8fafc;font-size:12px;cursor:pointer;">
            <span style="width:5px;height:5px;border-radius:50%;background:#10b981;flex-shrink:0;"></span>
            <span style="font-family:monospace;color:#0f172a;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;">10.0.10.40</span>
            <span style="color:#64748b;font-size:10px;width:64px;text-align:right;font-family:monospace;">vtnet0</span>
            <span style="color:#94a3b8;font-size:10px;width:48px;text-align:right;">global</span>
          </div>
          <div title="Click to copy 2001:db8::28" style="display:flex;align-items:center;gap:10px;padding:7px 18px;border-bottom:1px solid #f8fafc;font-size:12px;cursor:pointer;">
            <span style="width:5px;height:5px;border-radius:50%;background:#10b981;flex-shrink:0;"></span>
            <span style="font-family:monospace;color:#0f172a;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;">2001:db8::28</span>
            <span style="color:#64748b;font-size:10px;width:64px;text-align:right;font-family:monospace;">vtnet0</span>
            <span style="color:#94a3b8;font-size:10px;width:48px;text-align:right;">global</span>
          </div>
          <div title="Click to copy fe80::ff:fe40:5678" style="display:flex;align-items:center;gap:10px;padding:7px 18px;border-bottom:1px solid #f8fafc;font-size:12px;cursor:pointer;">
            <span style="width:5px;height:5px;border-radius:50%;background:#10b981;flex-shrink:0;"></span>
            <span style="font-family:monospace;color:#0f172a;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;">fe80::ff:fe40:5678</span>
            <span style="color:#64748b;font-size:10px;width:64px;text-align:right;font-family:monospace;">vtnet0</span>
            <span style="color:#94a3b8;font-size:10px;width:48px;text-align:right;">link</span>
          </div>
          <div title="Click to copy fd00:1234:5678::1" style="display:flex;align-items:center;gap:10px;padding:7px 18px;border-bottom:1px solid #f8fafc;font-size:12px;cursor:pointer;">
            <span style="width:5px;height:5px;border-radius:50%;background:#10b981;flex-shrink:0;"></span>
            <span style="font-family:monospace;color:#0f172a;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;">fd00:1234:5678::1</span>
            <span style="color:#64748b;font-size:10px;width:64px;text-align:right;font-family:monospace;">epair0a</span>
            <span style="color:#94a3b8;font-size:10px;width:48px;text-align:right;">site</span>
          </div>
          <div title="Click to copy fd00:1234:5678::2" style="display:flex;align-items:center;gap:10px;padding:7px 18px;border-bottom:1px solid #f8fafc;font-size:12px;cursor:pointer;">
            <span style="width:5px;height:5px;border-radius:50%;background:#10b981;flex-shrink:0;"></span>
            <span style="font-family:monospace;color:#0f172a;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;">fd00:1234:5678::2</span>
            <span style="color:#64748b;font-size:10px;width:64px;text-align:right;font-family:monospace;">epair0a</span>
            <span style="color:#94a3b8;font-size:10px;width:48px;text-align:right;">site</span>
          </div>
        </div>
        <div style="padding:6px 18px;border-top:1px solid #e2e8f0;background:#f8fafc;font-size:10px;color:#94a3b8;display:flex;align-items:center;justify-content:space-between;">
          <span>5 of 5 &#xB7; <span style="font-style:italic;">vscroll handles 1000+</span></span>
          <span>click row &#x2192; copy</span>
        </div>
      </div>

      <!-- Out-of-the-way toast (bottom-center, fades after 2.5s) -->
      <div style="position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#ffffff;padding:7px 14px;border-radius:6px;font-size:11px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,0.3);letter-spacing:0.02em;">
        <span style="color:#10b981;font-weight:700;">&#x2713;</span>
        <span>Copied <code style="background:#1e293b;padding:1px 6px;border-radius:3px;font-family:monospace;color:#10b981;">10.0.10.40</code> to clipboard</span>
      </div>
    </div>
  </foreignObject>
</svg>
