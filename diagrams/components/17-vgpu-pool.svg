<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 400" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — vGPU Pool (mock, feature-flag-gated)</title>
  <desc>GPU resource tracking shown only when showVgpuResources flag is on. Mock data for 3 GPUs + 4 allocations.</desc>
  <foreignObject x="0" y="0" width="1280" height="400">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:400px;background:#f1f5f9;color:#0f172a;font-size:13px;box-sizing:border-box;overflow:hidden;padding:16px 20px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div>
          <h3 style="margin:0;font-size:18px;font-weight:700;color:#0f172a;">GPU Pool</h3>
          <div style="font-size:11px;color:#64748b;margin-top:2px;">3 physical GPUs · 96 GB total VRAM · 4 allocations · <span style="background:#fef3c7;color:#92400e;padding:1px 6px;border-radius:3px;font-weight:600;">MOCK</span> feature-flag-gated</div>
        </div>
        <div style="font-size:11px;color:#94a3b8;">feature: <code style="background:#f1f5f9;padding:2px 6px;border-radius:3px;">showVgpuResources=development</code></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;">
        <div style="background:#ffffff;border-radius:10px;border:1px solid #e2e8f0;padding:14px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
            <span style="font-size:13px;font-weight:700;color:#0f172a;">NVIDIA T4</span>
            <span style="font-size:10px;padding:2px 6px;border-radius:3px;background:#ede9fe;color:#7c3aed;font-weight:600;">⚡ gpu-0</span>
          </div>
          <div style="font-size:10px;color:#94a3b8;margin-bottom:8px;">on cloudbsd-node-01</div>
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
            <span style="font-size:14px;font-weight:700;color:#0f172a;">4/16 GB</span>
            <span style="font-size:11px;color:#64748b;">(25% used)</span>
          </div>
          <div style="height:10px;background:#f1f5f9;border-radius:5px;overflow:hidden;margin-bottom:10px;">
            <div style="width:25.0%;height:100%;background:linear-gradient(90deg,#10b981,#10b981cc);border-radius:5px;"></div>
          </div>
          <div style="font-size:10px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:4px;">Allocations</div>
          <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;padding:3px 0;border-top:1px solid #f8fafc;">
            <span style="color:#475569;">jellyfin</span>
            <span style="font-family:monospace;color:#64748b;">4 GB <span style="background:#f1f5f9;padding:1px 4px;border-radius:3px;font-size:9px;margin-left:4px;">■ whole</span></span>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;padding:3px 0;border-top:1px solid #f8fafc;">
            <span style="color:#475569;">immich</span>
            <span style="font-family:monospace;color:#64748b;">2 GB <span style="background:#f1f5f9;padding:1px 4px;border-radius:3px;font-size:9px;margin-left:4px;">½ slice 1/2</span></span>
          </div>
        </div>
        <div style="background:#ffffff;border-radius:10px;border:1px solid #e2e8f0;padding:14px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
            <span style="font-size:13px;font-weight:700;color:#0f172a;">NVIDIA T4</span>
            <span style="font-size:10px;padding:2px 6px;border-radius:3px;background:#ede9fe;color:#7c3aed;font-weight:600;">⚡ gpu-1</span>
          </div>
          <div style="font-size:10px;color:#94a3b8;margin-bottom:8px;">on cloudbsd-node-01</div>
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
            <span style="font-size:14px;font-weight:700;color:#0f172a;">0/16 GB</span>
            <span style="font-size:11px;color:#64748b;">(0% used)</span>
          </div>
          <div style="height:10px;background:#f1f5f9;border-radius:5px;overflow:hidden;margin-bottom:10px;">
            <div style="width:0.0%;height:100%;background:linear-gradient(90deg,#10b981,#10b981cc);border-radius:5px;"></div>
          </div>
          <div style="font-size:11px;color:#94a3b8;font-style:italic;padding:8px 0;text-align:center;">No allocations</div>
        </div>
        <div style="background:#ffffff;border-radius:10px;border:1px solid #e2e8f0;padding:14px;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
            <span style="font-size:13px;font-weight:700;color:#0f172a;">NVIDIA RTX A5000</span>
            <span style="font-size:10px;padding:2px 6px;border-radius:3px;background:#ede9fe;color:#7c3aed;font-weight:600;">⚡ gpu-2</span>
          </div>
          <div style="font-size:10px;color:#94a3b8;margin-bottom:8px;">on cloudbsd-node-02</div>
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
            <span style="font-size:14px;font-weight:700;color:#0f172a;">12/24 GB</span>
            <span style="font-size:11px;color:#64748b;">(50% used)</span>
          </div>
          <div style="height:10px;background:#f1f5f9;border-radius:5px;overflow:hidden;margin-bottom:10px;">
            <div style="width:50.0%;height:100%;background:linear-gradient(90deg,#10b981,#10b981cc);border-radius:5px;"></div>
          </div>
          <div style="font-size:10px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:4px;">Allocations</div>
          <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;padding:3px 0;border-top:1px solid #f8fafc;">
            <span style="color:#475569;">win11-sandbox</span>
            <span style="font-family:monospace;color:#64748b;">8 GB <span style="background:#f1f5f9;padding:1px 4px;border-radius:3px;font-size:9px;margin-left:4px;">⅓ slice 1/3</span></span>
          </div>
          <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;padding:3px 0;border-top:1px solid #f8fafc;">
            <span style="color:#475569;">win11-gaming</span>
            <span style="font-family:monospace;color:#64748b;">4 GB <span style="background:#f1f5f9;padding:1px 4px;border-radius:3px;font-size:9px;margin-left:4px;">⅖ slice 1/6</span></span>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>