<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Breadcrumb</title>
  <desc>Hierarchical breadcrumb navigation showing path from root to current page.</desc>
  <foreignObject x="0" y="0" width="600" height="400">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 p-8">
      <g id="header" class="contents">
        <div class="mb-6">
          <h2 class="text-lg font-semibold">Breadcrumb</h2>
          <p class="text-sm text-slate-500">Hierarchical navigation · nav&gt;ol&gt;li pattern</p>
        </div>
      </g>
      <g id="primary" class="contents">
        <div class="bg-white p-5 rounded-lg border border-slate-200 mb-4">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-3">Default</div>
          <nav aria-label="Breadcrumb">
            <ol class="flex items-center gap-1.5 text-sm">
              <li class="flex items-center gap-1.5">
                <a class="text-blue-700 hover:underline" href="#">CloudBSD</a>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" class="text-slate-400" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
              </li>
              <li class="flex items-center gap-1.5">
                <a class="text-blue-700 hover:underline" href="#">Virtual Machines</a>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" class="text-slate-400" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
              </li>
              <li class="flex items-center gap-1.5">
                <a class="text-blue-700 hover:underline" href="#">web-server-01</a>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" class="text-slate-400" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
              </li>
              <li aria-current="page" class="text-slate-700 font-medium">Disks</li>
            </ol>
          </nav>
        </div>
      </g>
      <g id="home" class="contents">
        <div class="bg-white p-5 rounded-lg border border-slate-200 mb-4">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-3">With home icon</div>
          <nav aria-label="Breadcrumb">
            <ol class="flex items-center gap-1.5 text-sm">
              <li class="flex items-center gap-1.5">
                <a class="text-slate-500 hover:text-slate-900 flex items-center gap-1" href="#">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 7l6-5 6 5v7H2z"/><path d="M6 14V9h4v5"/></svg>
                </a>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" class="text-slate-400" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
              </li>
              <li class="flex items-center gap-1.5">
                <a class="text-blue-700 hover:underline" href="#">Volumes</a>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" class="text-slate-400" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
              </li>
              <li class="flex items-center gap-1.5">
                <a class="text-blue-700 hover:underline" href="#">tank</a>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" class="text-slate-400" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
              </li>
              <li aria-current="page" class="text-slate-700 font-medium">Snapshots</li>
            </ol>
          </nav>
        </div>
      </g>
      <g id="collapsed" class="contents">
        <div class="bg-white p-5 rounded-lg border border-slate-200">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-3">Collapsed (deep paths)</div>
          <nav aria-label="Breadcrumb">
            <ol class="flex items-center gap-1.5 text-sm">
              <li class="flex items-center gap-1.5">
                <a class="text-blue-700 hover:underline" href="#">Cluster</a>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" class="text-slate-400" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
              </li>
              <li class="flex items-center gap-1.5">
                <a class="text-blue-700 hover:underline" href="#">node-3</a>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" class="text-slate-400" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
              </li>
              <li class="flex items-center gap-1.5">
                <button class="text-slate-500 hover:text-slate-900 px-1.5 py-0.5 rounded hover:bg-slate-100">⋯</button>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" class="text-slate-400" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
              </li>
              <li class="flex items-center gap-1.5">
                <a class="text-blue-700 hover:underline" href="#">jails</a>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" class="text-slate-400" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
              </li>
              <li aria-current="page" class="text-slate-700 font-medium">postgres-15</li>
            </ol>
          </nav>
        </div>
      </g>
    </div>
  </foreignObject>
</svg>