<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Checkbox</title>
  <desc>Checkbox group with checked, unchecked, indeterminate, and disabled states.</desc>
  <foreignObject x="0" y="0" width="600" height="400">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 p-8">
      <g id="header" class="contents">
        <div class="mb-6">
          <h2 class="text-lg font-semibold">Checkbox</h2>
          <p class="text-sm text-slate-500">Boolean selection · indeterminate state for partial groups</p>
        </div>
      </g>
      <g id="group" class="contents">
        <div class="bg-white p-5 rounded-lg border border-slate-200 space-y-3">
          <div class="text-sm font-medium pb-1 border-b border-slate-200">Boot order</div>
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" checked="checked" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 focus:ring-2" />
            <span class="text-sm">CD/DVD-ROM</span>
            <span class="ml-auto text-xs text-slate-500">first</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" checked="checked" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 focus:ring-2" />
            <span class="text-sm">Hard disk</span>
            <span class="ml-auto text-xs text-slate-500">second</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 focus:ring-2" />
            <span class="text-sm">Network (PXE)</span>
            <span class="ml-auto text-xs text-slate-500">third</span>
          </label>
          <label class="flex items-center gap-3 cursor-pointer">
            <input type="checkbox" class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500 focus:ring-2" />
            <span class="text-sm">UEFI shell</span>
            <span class="ml-auto text-xs text-slate-500">last</span>
          </label>
        </div>
      </g>
      <g id="states" class="contents">
        <div class="mt-4 bg-white p-5 rounded-lg border border-slate-200">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-3">States</div>
          <div class="grid grid-cols-4 gap-3 text-sm">
            <div class="flex flex-col items-center gap-2 p-3 bg-slate-50 rounded">
              <div class="w-4 h-4 rounded bg-blue-600 text-white flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M13.3 4.3a1 1 0 010 1.4l-7 7a1 1 0 01-1.4 0l-3-3a1 1 0 011.4-1.4L5.6 10.6l6.3-6.3a1 1 0 011.4 0z"/></svg>
              </div>
              <span class="text-xs text-slate-500">checked</span>
            </div>
            <div class="flex flex-col items-center gap-2 p-3 bg-slate-50 rounded">
              <div class="w-4 h-4 rounded bg-white border border-slate-300"></div>
              <span class="text-xs text-slate-500">unchecked</span>
            </div>
            <div class="flex flex-col items-center gap-2 p-3 bg-slate-50 rounded">
              <div class="w-4 h-4 rounded bg-blue-600 text-white flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true"><rect x="3" y="7" width="10" height="2"/></svg>
              </div>
              <span class="text-xs text-slate-500">indeterminate</span>
            </div>
            <div class="flex flex-col items-center gap-2 p-3 bg-slate-50 rounded">
              <div class="w-4 h-4 rounded bg-slate-200 border border-slate-300 opacity-60"></div>
              <span class="text-xs text-slate-500">disabled</span>
            </div>
          </div>
        </div>
      </g>
    </div>
  </foreignObject>
</svg>