<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Button (loading state)</title>
  <desc>Buttons showing spinner with aria-busy while an async action is in progress.</desc>
  <foreignObject x="0" y="0" width="600" height="400">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 p-8">
      <g id="header" class="contents">
        <div class="mb-6">
          <h2 class="text-lg font-semibold">Button — Loading</h2>
          <p class="text-sm text-slate-500">Spinner replaces label · aria-busy="true" · pointer-events disabled</p>
        </div>
      </g>
      <g id="primary-loading" class="contents">
        <div class="bg-white p-5 rounded-lg border border-slate-200 mb-4">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-3">Primary · submitting form</div>
          <div class="flex items-center gap-3">
            <button class="px-4 py-2 rounded-md bg-blue-600 text-white font-medium opacity-90 cursor-wait inline-flex items-center gap-2" aria-busy="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" class="animate-spin">
                <circle cx="12" cy="12" r="9" stroke-opacity="0.25"/>
                <path d="M21 12a9 9 0 00-9-9"/>
              </svg>
              Saving…
            </button>
            <span class="text-sm text-slate-500">Spinning SVG · reduced-motion pauses animation</span>
          </div>
        </div>
      </g>
      <g id="secondary-loading" class="contents">
        <div class="bg-white p-5 rounded-lg border border-slate-200 mb-4">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-3">Secondary · provisioning VM</div>
          <button class="px-4 py-2 rounded-md bg-white text-slate-700 font-medium border border-slate-300 opacity-90 cursor-wait inline-flex items-center gap-2" aria-busy="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" class="animate-spin">
              <circle cx="12" cy="12" r="9" stroke-opacity="0.25"/>
              <path d="M21 12a9 9 0 00-9-9"/>
            </svg>
            Provisioning…
          </button>
        </div>
      </g>
      <g id="danger-loading" class="contents">
        <div class="bg-white p-5 rounded-lg border border-slate-200">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-3">Danger · terminating</div>
          <button class="px-4 py-2 rounded-md bg-rose-600 text-white font-medium opacity-90 cursor-wait inline-flex items-center gap-2" aria-busy="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true" class="animate-spin">
              <circle cx="12" cy="12" r="9" stroke-opacity="0.25"/>
              <path d="M21 12a9 9 0 00-9-9"/>
            </svg>
            Terminating VM…
          </button>
        </div>
      </g>
      <g id="progress" class="contents">
        <div class="mt-5 text-xs text-slate-500">Progress: <span class="font-mono text-slate-700">63%</span> · Estimated 4s remaining</div>
      </g>
    </div>
  </foreignObject>
</svg>