<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 700" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — VM Disks Tab (nextcloud)</title>
  <desc>VM detail panel · Disks tab active · attached disks, ZFS details, IOPS, snapshot counts. (2026-07-10)</desc>
  <foreignObject x="0" y="0" width="1000" height="700">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1000px;height:700px;background:#f1f5f9;color:#0f172a;font-size:13px;box-sizing:border-box;overflow:hidden;">
<div style="background:#ffffff;border-bottom:1px solid #e2e8f0;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
  <div style="display:flex;align-items:center;gap:10px;">
    <span style="font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:0.05em;font-weight:600;">VM</span>
    <span style="font-family:monospace;font-size:15px;font-weight:700;color:#0f172a;">nextcloud</span>
    <span style="font-size:9px;padding:2px 7px;border-radius:3px;background:#dcfce7;color:#16a34a;font-weight:600;letter-spacing:0.04em;">&#9679; up</span>
  </div>
  <span style="display:inline-flex;align-items:center;gap:5px;padding:3px 9px;font-size:10px;font-weight:600;letter-spacing:0.04em;background:#16a34a10;border:1px solid #bbf7d0;border-radius:9999px;color:#166534;font-family:monospace;"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#16a34a;"></span>live &#183; 2s ago</span>
</div>
<div style="display:flex;background:#ffffff;border-bottom:1px solid #e2e8f0;flex-shrink:0;overflow-x:auto;">
  <span style="padding:10px 16px;font-size:12px;color:#64748b;border-bottom:2px solid transparent;cursor:pointer;">Overview</span>
  <span style="padding:10px 16px;font-size:12px;color:#1d4ed8;border-bottom:2px solid #2563eb;font-weight:600;cursor:pointer;">Disks</span>
  <span style="padding:10px 16px;font-size:12px;color:#64748b;border-bottom:2px solid transparent;cursor:pointer;">Network</span>
  <span style="padding:10px 16px;font-size:12px;color:#64748b;border-bottom:2px solid transparent;cursor:pointer;">Snapshots</span>
  <span style="padding:10px 16px;font-size:12px;color:#64748b;border-bottom:2px solid transparent;cursor:pointer;">Console</span>
  <span style="padding:10px 16px;font-size:12px;color:#64748b;border-bottom:2px solid transparent;cursor:pointer;">Logs</span>
  <span style="padding:10px 16px;font-size:12px;color:#64748b;border-bottom:2px solid transparent;cursor:pointer;">Settings</span>
</div>
<div style="flex:1;overflow-y:auto;padding:16px 18px;background:#f1f5f9;">

<div style="margin-bottom:14px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;color:#94a3b8;">Attached disks (2)</div><button style="padding:3px 9px;font-size:10px;border:1px solid #cbd5e1;border-radius:4px;background:#ffffff;color:#1d4ed8;font-weight:600;cursor:pointer;">+ Attach disk</button></div>
<table style="width:100%;font-size:11px;border-collapse:collapse;border:1px solid #e2e8f0;border-radius:5px;overflow:hidden;">
<thead><tr style="background:#f8fafc;">
<th style="text-align:left;padding:6px 10px;font-size:10px;text-transform:uppercase;letter-spacing:0.04em;color:#64748b;font-weight:700;background:#f8fafc;border-bottom:1px solid #e2e8f0;width:14%;">Slot</th>
<th style="text-align:left;padding:6px 10px;font-size:10px;text-transform:uppercase;letter-spacing:0.04em;color:#64748b;font-weight:700;background:#f8fafc;border-bottom:1px solid #e2e8f0;width:32%;">Source</th>
<th style="text-align:left;padding:6px 10px;font-size:10px;text-transform:uppercase;letter-spacing:0.04em;color:#64748b;font-weight:700;background:#f8fafc;border-bottom:1px solid #e2e8f0;width:14%;">Bus</th>
<th style="text-align:left;padding:6px 10px;font-size:10px;text-transform:uppercase;letter-spacing:0.04em;color:#64748b;font-weight:700;background:#f8fafc;border-bottom:1px solid #e2e8f0;width:14%;">Size</th>
<th style="text-align:left;padding:6px 10px;font-size:10px;text-transform:uppercase;letter-spacing:0.04em;color:#64748b;font-weight:700;background:#f8fafc;border-bottom:1px solid #e2e8f0;width:14%;">IOPS r/w</th>
<th style="text-align:left;padding:6px 10px;font-size:10px;text-transform:uppercase;letter-spacing:0.04em;color:#64748b;font-weight:700;background:#f8fafc;border-bottom:1px solid #e2e8f0;width:12%;">Health</th>
</tr></thead>
<tbody>
<tr><td style="padding:6px 10px;color:#334155;font-family:monospace;">virtio-0</td><td style="padding:6px 10px;color:#0f172a;font-family:monospace;">tank/vms/nextcloud</td><td style="padding:6px 10px;color:#475569;font-family:monospace;">virtio-blk</td><td style="padding:6px 10px;color:#475569;font-family:monospace;">240 GB</td><td style="padding:6px 10px;color:#475569;font-family:monospace;">86 / 22 MB/s</td><td style="padding:6px 10px;color:#16a34a;font-weight:600;">&#9679; OK</td></tr>
<tr><td style="padding:6px 10px;color:#334155;font-family:monospace;">virtio-1</td><td style="padding:6px 10px;color:#0f172a;font-family:monospace;">tank/vms/nextcloud-data</td><td style="padding:6px 10px;color:#475569;font-family:monospace;">virtio-blk</td><td style="padding:6px 10px;color:#475569;font-family:monospace;">2 TB</td><td style="padding:6px 10px;color:#475569;font-family:monospace;">142 / 41 MB/s</td><td style="padding:6px 10px;color:#16a34a;font-weight:600;">&#9679; OK</td></tr>
</tbody></table></div>

<div style="margin-bottom:14px;"><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;color:#94a3b8;margin-bottom:6px;">Per-disk detail</div>
<div style="display:grid;grid-template-columns:90px 1fr;gap:5px 10px;font-size:11px;">
<span style="color:#64748b;">volblocksize</span><span style="color:#0f172a;font-family:monospace;">16 KB (zvol) &#8226; ashift 12 (4k)</span>
<span style="color:#64748b;">compression</span><span style="color:#0f172a;font-family:monospace;">zstd-3</span>
<span style="color:#64748b;">atime</span><span style="color:#0f172a;font-family:monospace;">off &#8226; recordsize 128K (data)</span>
<span style="color:#64748b;">reservation</span><span style="color:#0f172a;font-family:monospace;">none</span>
<span style="color:#64748b;">quotas</span><span style="color:#0f172a;font-family:monospace;">refquota 250G (zvol-0) &#8226; none (zvol-1)</span>
<span style="color:#64748b;">sched</span><span style="color:#0f172a;font-family:monospace;">none &#8226; i/o scheduler: deadline</span>
</div></div>

<div style="margin-bottom:14px;"><div style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;color:#94a3b8;margin-bottom:6px;">Snapshot retention (across both disks)</div>
<div style="display:grid;grid-template-columns:90px 1fr;gap:5px 10px;font-size:11px;">
<span style="color:#64748b;">policy</span><span style="color:#0f172a;font-family:monospace;">hourly x24 &#8226; daily x7 &#8226; weekly x4 &#8226; monthly x6</span>
<span style="color:#64748b;">kept</span><span style="color:#0f172a;font-family:monospace;">47 snapshots &#8226; last: 2026-07-08 02:00 UTC</span>
<span style="color:#64748b;">space</span><span style="color:#0f172a;font-family:monospace;">420 GB used by snapshots (referenced)</span>
<span style="color:#64748b;">prune</span><span style="color:#059669;font-weight:600;">&#9679; healthy (last pass 12 h ago)</span>
</div></div>

</div>
    </div>
  </foreignObject>
</svg>
