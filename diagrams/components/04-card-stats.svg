<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Stats card (KPI with trend)</title>
  <desc>Compact metric card showing label, value, and trend indicator (up/down with delta).</desc>
  <foreignObject x="0" y="0" width="600" height="400">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 p-8">
      <g id="header" class="contents">
        <div class="mb-6">
          <h2 class="text-lg font-semibold">Stats card</h2>
          <p class="text-sm text-slate-500">KPI display · label / value / trend · used in dashboards</p>
        </div>
      </g>
      <g id="grid" class="contents">
        <div class="grid grid-cols-2 gap-4">
          <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between">
              <div class="text-sm font-medium text-slate-500">Active VMs</div>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" class="text-slate-400" aria-hidden="true"><rect x="2" y="3" width="12" height="9" rx="1.5"/><path d="M5 14h6"/></svg>
            </div>
            <div class="text-3xl font-bold mt-2">24</div>
            <div class="mt-2 flex items-center gap-1 text-xs">
              <span class="inline-flex items-center gap-0.5 text-emerald-700">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" width="10" height="10" fill="currentColor" aria-hidden="true"><path d="M6 2l4 5H2z"/></svg>
                +3
              </span>
              <span class="text-slate-500">vs last 24h</span>
            </div>
          </div>
          <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between">
              <div class="text-sm font-medium text-slate-500">CPU avg</div>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" class="text-slate-400" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1"/><path d="M3 7h10M7 3v10"/></svg>
            </div>
            <div class="text-3xl font-bold mt-2">42<span class="text-lg text-slate-500 font-normal">%</span></div>
            <div class="mt-2 flex items-center gap-1 text-xs">
              <span class="inline-flex items-center gap-0.5 text-rose-700">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" width="10" height="10" fill="currentColor" aria-hidden="true"><path d="M6 10L2 5h8z"/></svg>
                +8%
              </span>
              <span class="text-slate-500">vs last hour</span>
            </div>
          </div>
          <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between">
              <div class="text-sm font-medium text-slate-500">Memory used</div>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" class="text-slate-400" aria-hidden="true"><rect x="2" y="4" width="12" height="8" rx="1"/><path d="M5 1v3M8 1v3M11 1v3"/></svg>
            </div>
            <div class="text-3xl font-bold mt-2">8.2<span class="text-lg text-slate-500 font-normal"> GB</span></div>
            <div class="mt-2 flex items-center gap-1 text-xs">
              <span class="inline-flex items-center gap-0.5 text-emerald-700">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" width="10" height="10" fill="currentColor" aria-hidden="true"><path d="M6 2l4 5H2z"/></svg>
                -0.4 GB
              </span>
              <span class="text-slate-500">stable</span>
            </div>
          </div>
          <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between">
              <div class="text-sm font-medium text-slate-500">Critical alerts</div>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" class="text-rose-500" aria-hidden="true"><path d="M8 1.5l6.5 11.5h-13z"/><path d="M8 6v4M8 12v.01"/></svg>
            </div>
            <div class="text-3xl font-bold mt-2 text-rose-700">3</div>
            <div class="mt-2 flex items-center gap-1 text-xs">
              <span class="text-rose-700">needs attention</span>
            </div>
          </div>
        </div>
      </g>
    </div>
  </foreignObject>
</svg>