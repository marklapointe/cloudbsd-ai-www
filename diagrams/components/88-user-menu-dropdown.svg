<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 600" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — User Menu Dropdown (avatar clicked)</title>
  <desc>Avatar bubble in top-right chrome opens a user menu dropdown. Shows current user mlapointe: header with avatar/name/role/ulid, theme picker row, options list per ui-index §15 (Profile, Preferences, Theme picker, Keyboard shortcuts, API tokens, Sign out). Dropdown anchored top-right, opens on click of avatar. T94n.</desc>
  <foreignObject x="0" y="0" width="500" height="600">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:500px;height:600px;background:#f1f5f9;color:#0f172a;font-size:13px;box-sizing:border-box;overflow:hidden;">
      <!-- Chrome header strip (snippet — anchor context) -->
      <div style="height:56px;background:#ffffff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;padding:0 16px;box-sizing:border-box;">
        <div style="width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;">C</div>
        <span style="font-weight:700;font-size:17px;margin-left:8px;color:#0f172a;">CloudBSD Admin</span>
        <span style="margin-left:10px;padding:2px 8px;font-size:11px;border-radius:4px;background:#f1f5f9;color:#475569;">cloudbsd-node-01.local</span>
        <span style="margin-left:auto;font-size:11px;color:#94a3b8;">— chrome right side: TZ · Bell · Avatar —</span>
        <!-- Active avatar (clicked state: ring + slight scale) -->
        <div style="margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:#64748b;">
          <select style="padding:4px 8px;font-size:11px;border:1px solid #cbd5e1;border-radius:5px;background:#ffffff;color:#475569;"><option>UTC</option></select>
          <button style="position:relative;width:30px;height:30px;border-radius:50%;background:#f1f5f9;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;border:0;color:#475569;">🔔<span style="position:absolute;top:0;right:0;min-width:18px;height:18px;border-radius:9px;background:#ef4444;color:#ffffff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;">17</span></button>
          <div style="position:relative;">
            <div style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;cursor:pointer;box-shadow:0 0 0 2px #2563eb;">M</div>
            <!-- caret indicating menu open -->
            <div style="position:absolute;bottom:-6px;right:50%;transform:translateX(50%);width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:6px solid #ffffff;filter:drop-shadow(0 -1px 0 #e2e8f0);"></div>
          </div>
        </div>
      </div>
      <!-- Dropdown panel -->
      <div style="position:absolute;top:62px;right:14px;width:280px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;box-shadow:0 10px 32px rgba(15,23,42,0.12);overflow:hidden;z-index:100;">
        <!-- User identity header -->
        <div style="padding:14px 14px 12px;border-bottom:1px solid #e2e8f0;background:linear-gradient(180deg,#f8fafc,#ffffff);">
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;flex-shrink:0;">M</div>
            <div style="flex:1;min-width:0;">
              <div style="font-weight:700;color:#0f172a;font-size:13px;">mlapointe</div>
              <div style="font-size:11px;color:#64748b;margin-top:1px;">Cluster Admin</div>
            </div>
            <span style="font-size:9px;padding:2px 6px;border-radius:3px;background:#ede9fe;color:#7c3aed;font-weight:700;letter-spacing:0.04em;">ADMIN</span>
          </div>
          <div style="display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:10px;color:#64748b;margin-top:8px;">
            <span>ulid</span><span style="font-family:monospace;color:#475569;cursor:pointer;" title="Click to copy">01HF9XK2R7N…T8YMQC4VE</span>
            <span>email</span><span style="color:#475569;">mark@cloudbsd.org</span>
            <span>logged in</span><span style="color:#475569;">3d 14h · via SSH key</span>
          </div>
        </div>
        <!-- Theme picker row -->
        <div style="padding:8px 14px;border-bottom:1px solid #e2e8f0;background:#f8fafc;">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;font-weight:700;color:#94a3b8;margin-bottom:5px;">Theme</div>
          <div style="display:flex;gap:5px;">
            <span style="display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:5px;background:#ffffff;border:1px solid #e2e8f0;font-size:10px;color:#475569;cursor:pointer;"><span style="width:10px;height:10px;border-radius:2px;background:#ffffff;border:1px solid #cbd5e1;"></span>Cloudbsd</span>
            <span style="display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:5px;background:#ffffff;border:1px solid #e2e8f0;font-size:10px;color:#475569;cursor:pointer;"><span style="width:10px;height:10px;border-radius:2px;background:#0f172a;"></span>Carbon</span>
            <span style="display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:5px;background:#eff6ff;border:1px solid #2563eb;font-size:10px;color:#1d4ed8;font-weight:700;cursor:pointer;"><span style="width:10px;height:10px;border-radius:2px;background:#2563eb;"></span>Ocean</span>
            <span style="display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:5px;background:#ffffff;border:1px solid #e2e8f0;font-size:10px;color:#475569;cursor:pointer;"><span style="width:10px;height:10px;border-radius:2px;background:linear-gradient(135deg,#a855f7,#ec4899);"></span>Solar</span>
            <a style="margin-left:auto;font-size:10px;color:#2563eb;text-decoration:none;align-self:center;">All 12 →</a>
          </div>
        </div>
        <!-- Menu items list -->
        <div style="padding:5px 0;">
          <a style="display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:12px;color:#0f172a;text-decoration:none;cursor:pointer;">
            <span style="font-size:14px;color:#64748b;">👤</span>
            <span style="flex:1;">Profile</span>
            <span style="font-size:10px;color:#94a3b8;">mark@cloudbsd.org</span>
          </a>
          <a style="display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:12px;color:#0f172a;text-decoration:none;cursor:pointer;">
            <span style="font-size:14px;color:#64748b;">⚙</span>
            <span style="flex:1;">Preferences</span>
            <span style="font-size:10px;color:#94a3b8;font-family:monospace;">⌘ ,</span>
          </a>
          <a style="display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:12px;color:#0f172a;text-decoration:none;cursor:pointer;">
            <span style="font-size:14px;color:#64748b;">⌨</span>
            <span style="flex:1;">Keyboard shortcuts</span>
            <span style="font-size:10px;color:#94a3b8;font-family:monospace;">?</span>
          </a>
          <a style="display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:12px;color:#0f172a;text-decoration:none;cursor:pointer;">
            <span style="font-size:14px;color:#64748b;">🔑</span>
            <span style="flex:1;">API tokens</span>
            <span style="font-size:10px;font-family:monospace;color:#475569;background:#f1f5f9;padding:1px 5px;border-radius:3px;font-weight:600;">6</span>
          </a>
          <a style="display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:12px;color:#0f172a;text-decoration:none;cursor:pointer;">
            <span style="font-size:14px;color:#64748b;">❓</span>
            <span style="flex:1;">Help &amp; docs</span>
            <span style="font-size:10px;color:#94a3b8;">F1</span>
          </a>
          <a style="display:flex;align-items:center;gap:10px;padding:7px 14px;font-size:12px;color:#0f172a;text-decoration:none;cursor:pointer;">
            <span style="font-size:14px;color:#64748b;">ⓘ</span>
            <span style="flex:1;">About CloudBSD Admin</span>
            <span style="font-size:10px;color:#94a3b8;font-family:monospace;">v0.4.2</span>
          </a>
        </div>
        <!-- Divider + Sign out -->
        <div style="border-top:1px solid #e2e8f0;background:#f8fafc;">
          <a style="display:flex;align-items:center;gap:10px;padding:9px 14px;font-size:12px;color:#b91c1c;text-decoration:none;cursor:pointer;font-weight:600;">
            <span style="font-size:14px;">⎋</span>
            <span style="flex:1;">Sign out</span>
            <span style="font-size:10px;color:#94a3b8;font-family:monospace;">⌃⇧Q</span>
          </a>
        </div>
      </div>
      <!-- Decorative ghost anchor showing where the dropdown attaches -->
      <div style="position:absolute;top:90px;left:50%;transform:translateX(-50%);opacity:0.5;font-size:11px;color:#94a3b8;font-style:italic;text-align:center;width:380px;">▼ user dropdown anchored under clicked avatar (overlays page content)</div>
    </div>
  </foreignObject>
</svg>
