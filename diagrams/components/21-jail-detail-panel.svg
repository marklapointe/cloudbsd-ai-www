              <div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">Configuration</div>
              <div style="display:grid;grid-template-columns:1fr 2fr;gap:6px 16px;font-size:12px;"><span style="color:#64748b;">type</span><span style="font-family:monospace;color:#334155;">ezjail</span><span style="color:#64748b;">base</span><span style="color:#334155;">FreeBSD 14.2-RELEASE</span><span style="color:#64748b;">template</span><span style="color:#334155;">homeautomation</span></div>
            </div>
            <div style="background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;padding:14px;margin-bottom:10px;">
              <div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">Resources</div>
              <div style="display:grid;grid-template-columns:1fr 2fr;gap:6px 16px;font-size:12px;"><span style="color:#64748b;">vCPUs</span><span style="color:#334155;">2</span><span style="color:#64748b;">RAM</span><span style="color:#334155;">1 GB</span><span style="color:#64748b;">Disk</span><span style="color:#334155;">8 GB (zfs jail dataset)</span></div>
            </div>
            <div style="background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;padding:14px;margin-bottom:10px;">
              <div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">Network</div>
              <div style="display:grid;grid-template-columns:1fr 2fr;gap:6px 16px;font-size:12px;font-family:monospace;"><span style="color:#64748b;font-family:-apple-system;">IPv4</span><span style="color:#334155;">10.0.30.42 / 24 (rfc1918)</span><span style="color:#64748b;font-family:-apple-system;">IPv6</span><span style="color:#94a3b8;">not bound</span></div>
            </div>
            <div style="background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;padding:14px;">
