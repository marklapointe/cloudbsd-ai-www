              <tbody style="color:#334155;">
                <tr><td style="padding:10px 14px;"><span style="color:#10b981;font-size:14px;">●</span></td><td style="padding:10px 14px;font-weight:600;color:#0f172a;">dns-primary</td><td style="padding:10px 14px;">ezjail</td><td style="padding:10px 14px;text-align:right;font-family:monospace;">3</td><td style="padding:10px 14px;text-align:right;">512 MB</td><td style="padding:10px 14px;font-family:monospace;">10.0.30.10</td></tr>
                <tr><td style="padding:10px 14px;"><span style="color:#10b981;font-size:14px;">●</span></td><td style="padding:10px 14px;font-weight:600;color:#0f172a;">dns-secondary</td><td style="padding:10px 14px;">ezjail</td><td style="padding:10px 14px;text-align:right;font-family:monospace;">4</td><td style="padding:10px 14px;text-align:right;">512 MB</td><td style="padding:10px 14px;font-family:monospace;">10.0.30.11</td></tr>
                <tr><td style="padding:10px 14px;"><span style="color:#10b981;font-size:14px;">●</span></td><td style="padding:10px 14px;font-weight:600;color:#0f172a;">ntp-server</td><td style="padding:10px 14px;">ezjail</td><td style="padding:10px 14px;text-align:right;font-family:monospace;">7</td><td style="padding:10px 14px;text-align:right;">256 MB</td><td style="padding:10px 14px;font-family:monospace;">10.0.30.20</td></tr>
                <tr style="background:linear-gradient(90deg,#eff6ff,#ffffff);border-left:3px solid #2563eb;"><td style="padding:10px 14px;"><span style="color:#10b981;font-size:14px;">●</span></td><td style="padding:10px 14px;font-weight:600;color:#1d4ed8;">homebridge</td><td style="padding:10px 14px;">ezjail</td><td style="padding:10px 14px;text-align:right;font-family:monospace;">12</td><td style="padding:10px 14px;text-align:right;">1 GB</td><td style="padding:10px 14px;font-family:monospace;">10.0.30.42</td></tr>
                <tr><td style="padding:10px 14px;"><span style="color:#10b981;font-size:14px;">●</span></td><td style="padding:10px 14px;font-weight:600;color:#0f172a;">mqtt-broker</td><td style="padding:10px 14px;">iocage</td><td style="padding:10px 14px;text-align:right;font-family:monospace;">8</td><td style="padding:10px 14px;text-align:right;">512 MB</td><td style="padding:10px 14px;font-family:monospace;">10.0.30.30</td></tr>
                <tr><td style="padding:10px 14px;"><span style="color:#10b981;font-size:14px;">●</span></td><td style="padding:10px 14px;font-weight:600;color:#0f172a;">unifi-controller</td><td style="padding:10px 14px;">iocage</td><td style="padding:10px 14px;text-align:right;font-family:monospace;">9</td><td style="padding:10px 14px;text-align:right;">2 GB</td><td style="padding:10px 14px;font-family:monospace;">10.0.30.31</td></tr>
                <tr><td style="padding:10px 14px;"><span style="color:#94a3b8;font-size:14px;">■</span></td><td style="padding:10px 14px;font-weight:600;color:#64748b;">grafana</td><td style="padding:10px 14px;">ezjail</td><td style="padding:10px 14px;text-align:right;font-family:monospace;color:#94a3b8;">—</td><td style="padding:10px 14px;text-align:right;">1 GB</td><td style="padding:10px 14px;font-family:monospace;">10.0.30.50</td></tr>
