              <div style="display:grid;grid-template-columns:1fr 2fr;gap:6px 16px;font-size:12px;"><span style="color:#64748b;">uptime</span><span style="color:#334155;">47d 14:08</span><span style="color:#64748b;">state</span><span style="color:#10b981;font-weight:600;">active</span></div>
            </div>
