<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Badge</title>
  <desc>Semantic badges for success, warning, error, info plus solid and outline variants.</desc>
  <foreignObject x="0" y="0" width="600" height="400">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 p-8">
      <g id="header" class="contents">
        <div class="mb-6">
          <h2 class="text-lg font-semibold">Badge</h2>
          <p class="text-sm text-slate-500">Semantic status indicators · soft and solid variants</p>
        </div>
      </g>
      <g id="semantic" class="contents">
        <div class="bg-white p-5 rounded-lg border border-slate-200">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-3">Soft (default)</div>
          <div class="flex flex-wrap items-center gap-2">
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" width="10" height="10" fill="currentColor" aria-hidden="true"><path d="M9.3 3.3a1 1 0 010 1.4l-4 4a1 1 0 01-1.4 0l-2-2a1 1 0 011.4-1.4L4.6 6.6l3.3-3.3a1 1 0 011.4 0z"/></svg>
              Success
            </span>
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-amber-50 text-amber-700">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" width="10" height="10" fill="currentColor" aria-hidden="true"><path d="M6 1l5 9H1z"/><path d="M5.5 5h1v3h-1zM6 9a.6.6 0 110-1.2.6.6 0 010 1.2z"/></svg>
              Warning
            </span>
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-rose-50 text-rose-700">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" width="10" height="10" fill="currentColor" aria-hidden="true"><path d="M6 1a5 5 0 100 10A5 5 0 006 1zm-.7 3h1.4v3.5H5.3V4zM6 8.5a.7.7 0 110-1.4.7.7 0 010 1.4z"/></svg>
              Error
            </span>
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-sky-50 text-sky-700">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" width="10" height="10" fill="currentColor" aria-hidden="true"><path d="M6 1a5 5 0 100 10A5 5 0 006 1zm-.7 2.5h1.4v.7H5.3v-.7zm0 1.5h1.4v3.5H5.3V5z"/></svg>
              Info
            </span>
            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-slate-100 text-slate-700">
              Neutral
            </span>
          </div>
        </div>
      </g>
      <g id="solid" class="contents">
        <div class="mt-4 bg-white p-5 rounded-lg border border-slate-200">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-3">Solid</div>
          <div class="flex flex-wrap items-center gap-2">
            <span class="px-2 py-0.5 rounded text-xs font-medium bg-emerald-600 text-white">Deployed</span>
            <span class="px-2 py-0.5 rounded text-xs font-medium bg-amber-600 text-white">Pending</span>
            <span class="px-2 py-0.5 rounded text-xs font-medium bg-rose-600 text-white">Failed</span>
            <span class="px-2 py-0.5 rounded text-xs font-medium bg-sky-600 text-white">Beta</span>
            <span class="px-2 py-0.5 rounded text-xs font-medium bg-slate-700 text-white">v2.4.1</span>
          </div>
        </div>
      </g>
      <g id="dot" class="contents">
        <div class="mt-4 bg-white p-5 rounded-lg border border-slate-200">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-3">Dot indicator (inline with text)</div>
          <div class="space-y-2 text-sm">
            <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-emerald-500"></span> Service healthy</div>
            <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-amber-500"></span> Service degraded</div>
            <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-rose-500"></span> Service down</div>
          </div>
        </div>
      </g>
    </div>
  </foreignObject>
</svg>