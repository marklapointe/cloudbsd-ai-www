<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Progress bar</title>
  <desc>Linear and circular progress indicators, including a 60% complete linear bar.</desc>
  <foreignObject x="0" y="0" width="600" height="400">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 p-8">
      <g id="header" class="contents">
        <div class="mb-6">
          <h2 class="text-lg font-semibold">Progress</h2>
          <p class="text-sm text-slate-500">Linear and circular indicators · role=progressbar with aria-valuenow</p>
        </div>
      </g>
      <g id="linear-60" class="contents">
        <div class="bg-white p-5 rounded-lg border border-slate-200">
          <div class="flex items-center justify-between mb-2">
            <div>
              <div class="text-sm font-medium">Migrating VM: db-postgres</div>
              <div class="text-xs text-slate-500">node-2 → node-3 · 60% complete</div>
            </div>
            <div class="text-sm font-mono font-medium text-slate-700">60%</div>
          </div>
          <div role="progressbar" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100" aria-label="VM migration progress" class="h-2.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full bg-blue-600 rounded-full transition-all" style="width: 60%;"></div>
          </div>
          <div class="mt-3 flex items-center justify-between text-xs text-slate-500">
            <span>42 GB transferred of 70 GB</span>
            <span>ETA 2m 14s</span>
          </div>
        </div>
      </g>
      <g id="variants" class="contents">
        <div class="mt-4 grid grid-cols-2 gap-4">
          <div class="bg-white p-5 rounded-lg border border-slate-200">
            <div class="text-xs uppercase tracking-wide text-slate-500 mb-2">Indeterminate (loading)</div>
            <div class="h-2 bg-slate-100 rounded-full overflow-hidden relative">
              <div class="h-full w-1/3 bg-blue-600 rounded-full absolute" style="animation: indeterminate 1.4s infinite ease-in-out;"></div>
            </div>
            <div class="mt-2 text-xs text-slate-500">Sliding bar · used when duration is unknown</div>
          </div>
          <div class="bg-white p-5 rounded-lg border border-slate-200">
            <div class="text-xs uppercase tracking-wide text-slate-500 mb-2">Striped (active task)</div>
            <div role="progressbar" aria-valuenow="84" aria-valuemin="0" aria-valuemax="100" class="h-2.5 bg-slate-100 rounded-full overflow-hidden">
              <div class="h-full bg-emerald-500" style="width: 84%; background-image: linear-gradient(45deg, rgba(255,255,255,0.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.15) 75%, transparent 75%); background-size: 1rem 1rem;"></div>
            </div>
            <div class="mt-2 text-xs text-slate-500">Scrub: 84% · reads verified</div>
          </div>
        </div>
      </g>
      <g id="circular" class="contents">
        <div class="mt-4 bg-white p-5 rounded-lg border border-slate-200">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-3">Circular</div>
          <div class="flex items-center gap-6">
            <div class="relative w-14 h-14">
              <svg viewBox="0 0 36 36" class="w-14 h-14 -rotate-90">
                <circle cx="18" cy="18" r="15" fill="none" stroke="#e2e8f0" stroke-width="3"/>
                <circle cx="18" cy="18" r="15" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="37.7"/>
              </svg>
              <span class="absolute inset-0 flex items-center justify-center text-xs font-semibold text-slate-700">60%</span>
            </div>
            <div class="text-sm text-slate-600">Snapshot creation in progress</div>
          </div>
        </div>
      </g>
    </div>
  </foreignObject>
</svg>