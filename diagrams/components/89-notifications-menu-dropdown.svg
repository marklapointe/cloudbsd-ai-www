<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 600" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — Notifications Menu Dropdown (bell clicked)</title>
  <desc>Bell icon in chrome header opens notification dropdown. Shows 3-section grouping per ui-index §15: Today (4), Yesterday (8), Earlier (5). Each item: source icon, severity dot, message excerpt, age, View action. Footer: Mark all as read + View all + Notification preferences. T94n.</desc>
