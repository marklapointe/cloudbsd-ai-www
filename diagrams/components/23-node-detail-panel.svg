                <div style="font-size:10px;color:#64748b;margin-top:3px;font-family:monospace;">10.0.10.10 · 8c/16GB · heartbeat 12s</div>
              </div>
              <span style="font-size:11px;color:#10b981;font-weight:600;">42% / 51%</span>
            </div>
            <div style="border:1px solid #e2e8f0;border-radius:6px;padding:12px;display:flex;align-items:center;justify-content:space-between;">
