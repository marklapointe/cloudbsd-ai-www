          <a style="display:flex;align-items:center;padding:7px 10px;border-radius:6px;color:#334155;margin-bottom:2px;cursor:pointer;">Status</a>
          <a style="display:flex;align-items:center;padding:7px 10px;border-radius:6px;color:#334155;margin-bottom:2px;cursor:pointer;">About</a>
