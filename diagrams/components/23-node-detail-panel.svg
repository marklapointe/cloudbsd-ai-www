            </div>
            <div style="background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;padding:14px;margin-bottom:10px;">
              <div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">Hardware</div>
              <div style="display:grid;grid-template-columns:1fr 2fr;gap:6px 16px;font-size:12px;"><span style="color:#64748b;">CPU</span><span style="color:#334155;">8 cores AMD EPYC 7232P</span><span style="color:#64748b;">RAM</span><span style="color:#334155;">16 GB DDR4 ECC</span><span style="color:#64748b;">Disk</span><span style="color:#334155;">240 GB NVMe</span><span style="color:#64748b;">GPU</span><span style="color:#334155;">1× NVIDIA RTX A4000 (per 17-vgpu-pool.svg)</span></div>
            </div>
            <div style="background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;padding:14px;margin-bottom:10px;">
              <div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">Load (live)</div>
              <div style="display:grid;grid-template-columns:1fr 2fr;gap:6px 16px;font-size:12px;"><span style="color:#64748b;">CPU %</span><span style="color:#f59e0b;font-weight:600;">42% (load avg 1.2 / 1.5 / 1.8)</span><span style="color:#64748b;">MEM</span><span style="color:#334155;">8.2 GB / 16 GB (51%)</span><span style="color:#64748b;">Disk</span><span style="color:#334155;">65 GB / 240 GB (27%)</span><span style="color:#64748b;">Net</span><span style="font-family:monospace;color:#334155;">124 Mbps in · 88 Mbps out</span></div>
            </div>
            <div style="background:#ffffff;border-radius:8px;border:1px solid #e2e8f0;padding:14px;">
              <div style="font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">Health</div>
              <div style="display:grid;grid-template-columns:1fr 2fr;gap:6px 16px;font-size:12px;"><span style="color:#64748b;">uptime</span><span style="color:#334155;">14d 02:11</span><span style="color:#64748b;">temperature</span><span style="color:#10b981;font-weight:600;">48°C</span><span style="color:#64748b;">agent</span><span style="font-family:monospace;color:#10b981;">cloudbsd-agent@1.4.2 connected</span></div>
