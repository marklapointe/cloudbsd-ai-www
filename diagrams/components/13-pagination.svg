<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Pagination</title>
  <desc>Pagination controls with numbered pages (1, 2, 3, …, 10), prev/next, and page-size selector.</desc>
  <foreignObject x="0" y="0" width="600" height="400">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 p-8">
      <g id="header" class="contents">
        <div class="mb-6">
          <h2 class="text-lg font-semibold">Pagination</h2>
          <p class="text-sm text-slate-500">Numbered pages · prev/next · optional page-size selector</p>
        </div>
      </g>
      <g id="pagination" class="contents">
        <div class="bg-white p-5 rounded-lg border border-slate-200">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-3">Default</div>
          <div class="flex items-center justify-between">
            <div class="text-sm text-slate-500">Showing <span class="font-medium text-slate-700">1–20</span> of <span class="font-medium text-slate-700">196</span></div>
            <nav aria-label="Pagination">
              <ul class="flex items-center gap-1 text-sm">
                <li>
                  <button class="px-2.5 py-1.5 rounded border border-slate-300 text-slate-400 cursor-not-allowed flex items-center gap-1" disabled="true" aria-label="Previous page">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 4l-4 4 4 4"/></svg>
                    Prev
                  </button>
                </li>
                <li><button class="px-3 py-1.5 rounded bg-blue-600 text-white font-medium" aria-current="page">1</button></li>
                <li><button class="px-3 py-1.5 rounded text-slate-700 hover:bg-slate-100">2</button></li>
                <li><button class="px-3 py-1.5 rounded text-slate-700 hover:bg-slate-100">3</button></li>
                <li class="px-2 text-slate-400">…</li>
                <li><button class="px-3 py-1.5 rounded text-slate-700 hover:bg-slate-100">10</button></li>
                <li>
                  <button class="px-2.5 py-1.5 rounded border border-slate-300 text-slate-700 hover:bg-slate-50 flex items-center gap-1" aria-label="Next page">
                    Next
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg>
                  </button>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </g>
      <g id="with-sizes" class="contents">
        <div class="mt-4 bg-white p-5 rounded-lg border border-slate-200">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-3">With page size selector</div>
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2 text-sm">
              <span class="text-slate-500">Rows per page:</span>
              <select class="px-2 py-1 rounded border border-slate-300 bg-white text-sm">
                <option>10</option>
                <option selected="selected">20</option>
                <option>50</option>
                <option>100</option>
              </select>
            </div>
            <nav aria-label="Pagination">
              <ul class="flex items-center gap-1 text-sm">
                <li><button class="w-8 h-8 rounded text-slate-500 hover:bg-slate-100 flex items-center justify-center" aria-label="Previous page"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 4l-4 4 4 4"/></svg></button></li>
                <li><button class="w-8 h-8 rounded bg-blue-600 text-white font-medium" aria-current="page">3</button></li>
                <li><button class="w-8 h-8 rounded text-slate-700 hover:bg-slate-100">4</button></li>
                <li><button class="w-8 h-8 rounded text-slate-700 hover:bg-slate-100">5</button></li>
                <li><button class="w-8 h-8 rounded text-slate-500 hover:bg-slate-100 flex items-center justify-center" aria-label="Next page"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg></button></li>
              </ul>
            </nav>
          </div>
        </div>
      </g>
      <g id="compact" class="contents">
        <div class="mt-4 bg-white p-5 rounded-lg border border-slate-200">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-3">Compact (mobile)</div>
          <div class="flex items-center justify-between">
            <button class="px-3 py-1.5 rounded border border-slate-300 text-slate-700 text-sm">‹ Prev</button>
            <span class="text-sm text-slate-500">3 / 10</span>
            <button class="px-3 py-1.5 rounded border border-slate-300 text-slate-700 text-sm">Next ›</button>
          </div>
        </div>
      </g>
    </div>
  </foreignObject>
</svg>