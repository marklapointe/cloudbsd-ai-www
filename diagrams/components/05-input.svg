<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Input (text field)</title>
  <desc>Text input with label, helper text, validation states (default, focus, error, success).</desc>
  <foreignObject x="0" y="0" width="600" height="400">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 p-8">
      <g id="header" class="contents">
        <div class="mb-6">
          <h2 class="text-lg font-semibold">Input</h2>
          <p class="text-sm text-slate-500">Text field · label / field / helper · accessible validation</p>
        </div>
      </g>
      <g id="states" class="contents">
        <div class="bg-white p-5 rounded-lg border border-slate-200 space-y-5">
          <div>
            <label for="vm-name" class="block text-sm font-medium mb-1">VM name <span class="text-rose-600">*</span></label>
            <input id="vm-name" type="text" value="web-server-01" class="w-full px-3 py-2 rounded-md border border-slate-300 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none" />
            <div class="mt-1 text-xs text-slate-500">Lowercase, hyphens only · 3–32 characters</div>
          </div>
          <div>
            <label for="vm-name-focus" class="block text-sm font-medium mb-1">Description</label>
            <input id="vm-name-focus" type="text" placeholder="e.g. public-facing web server" class="w-full px-3 py-2 rounded-md border border-blue-500 ring-2 ring-blue-200 outline-none" />
            <div class="mt-1 text-xs text-slate-500">Focus state · ring-blue-200 + border-blue-500</div>
          </div>
          <div>
            <label for="vm-name-error" class="block text-sm font-medium mb-1 text-rose-700">CPU cores</label>
            <input id="vm-name-error" type="text" value="99" aria-invalid="true" aria-describedby="err-1" class="w-full px-3 py-2 rounded-md border border-rose-500 focus:ring-2 focus:ring-rose-200 outline-none" />
            <div id="err-1" class="mt-1 text-xs text-rose-700 flex items-center gap-1">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm-.75 4a.75.75 0 011.5 0v4a.75.75 0 01-1.5 0V5zM8 12a1 1 0 100-2 1 1 0 000 2z"/></svg>
              Exceeds host capacity (max 16 cores)
            </div>
          </div>
          <div>
            <label for="vm-name-success" class="block text-sm font-medium mb-1 text-emerald-700">IPv4 address</label>
            <input id="vm-name-success" type="text" value="10.0.1.42" class="w-full px-3 py-2 rounded-md border border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none" />
            <div class="mt-1 text-xs text-emerald-700 flex items-center gap-1">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="12" height="12" fill="currentColor" aria-hidden="true"><path d="M13.3 4.3a1 1 0 010 1.4l-7 7a1 1 0 01-1.4 0l-3-3a1 1 0 011.4-1.4L5.6 10.6l6.3-6.3a1 1 0 011.4 0z"/></svg>
              Looks good · reachable on the local network
            </div>
          </div>
        </div>
      </g>
    </div>
  </foreignObject>
</svg>