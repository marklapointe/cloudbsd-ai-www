<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Fullscreen Modal (Console)</title>
  <desc>Full-screen modal hosting an interactive console/shell session with monospace output, command prompt, and connection status.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-900 text-slate-100 relative font-mono">
      <g id="header" class="contents">
        <div class="h-12 bg-slate-950 border-b border-slate-800 flex items-center px-4">
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-1.5">
              <span class="w-3 h-3 rounded-full bg-rose-500"></span>
              <span class="w-3 h-3 rounded-full bg-amber-500"></span>
              <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
            </div>
            <div class="text-sm text-slate-300">Console · jail: debian-jail-01</div>
          </div>
          <div class="ml-auto flex items-center gap-3 text-xs">
            <span class="flex items-center gap-1.5 text-emerald-400">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              connected
            </span>
            <span class="text-slate-500">tty0 · 132×40</span>
            <button class="px-2 py-1 text-slate-300 hover:text-white hover:bg-slate-800 rounded">⤢ Exit fullscreen</button>
            <button class="text-slate-300 hover:text-white text-lg leading-none">×</button>
          </div>
        </div>
      </g>
      <g id="console-body" class="contents">
        <div class="p-4 text-[13px] leading-relaxed overflow-auto" style="height: calc(100% - 48px);">
          <div class="text-slate-400">FreeBSD 14.2-RELEASE (GENERIC) #0 releng/14.2-n267679-20240624</div>
          <div class="text-slate-400">Welcome to CloudBSD Admin Console. Type 'help' for a list of commands.</div>
          <div class="text-slate-500 mt-3">Last login: Mon Jul  6 12:31:18 from 10.0.5.42</div>
          <div class="mt-4">
            <span class="text-emerald-400">root@debian-jail-01</span><span class="text-slate-400">:</span><span class="text-blue-400">~</span><span class="text-slate-400"># </span><span>free -m</span>
          </div>
          <pre class="text-slate-300 mt-1 ml-4">
                          total        used        free      shared  buff/cache   available
Mem:           2048         412        1180          24         456        1488
Swap:          1024           8        1016
          </pre>
          <div class="mt-2">
            <span class="text-emerald-400">root@debian-jail-01</span><span class="text-slate-400">:</span><span class="text-blue-400">~</span><span class="text-slate-400"># </span><span>pkg info | grep -i nginx</span>
          </div>
          <div class="text-slate-300 mt-1 ml-4">nginx-1.26.1_1,2            Robust and small HTTP server and proxy server</div>
          <div class="mt-2">
            <span class="text-emerald-400">root@debian-jail-01</span><span class="text-slate-400">:</span><span class="text-blue-400">~</span><span class="text-slate-400"># </span><span>service nginx status</span>
          </div>
          <div class="text-slate-300 mt-1 ml-4">nginx is running as pid 1842.</div>
          <div class="mt-2">
            <span class="text-emerald-400">root@debian-jail-01</span><span class="text-slate-400">:</span><span class="text-blue-400">~</span><span class="text-slate-400"># </span><span>tail -n 5 /var/log/nginx/access.log</span>
          </div>
          <pre class="text-slate-300 mt-1 ml-4">
10.0.5.42 - - [06/Jul/2026:12:41:01 +0000] "GET /healthz HTTP/1.1" 200 12
10.0.5.42 - - [06/Jul/2026:12:41:08 +0000] "GET /api/v1/jails HTTP/1.1" 200 4821
10.0.5.42 - - [06/Jul/2026:12:42:11 +0000] "POST /api/v1/jails HTTP/1.1" 201 312
10.0.5.42 - - [06/Jul/2026:12:42:18 +0000] "GET /api/v1/jails/debian-jail-02 HTTP/1.1" 404 27
10.0.5.42 - - [06/Jul/2026:12:43:02 +0000] "GET /api/v1/health HTTP/1.1" 200 8
          </pre>
          <div class="mt-2">
            <span class="text-emerald-400">root@debian-jail-01</span><span class="text-slate-400">:</span><span class="text-blue-400">~</span><span class="text-slate-400"># </span><span class="inline-block w-2 h-4 bg-slate-200 animate-pulse align-middle"></span>
          </div>
        </div>
      </g>
      <g id="console-statusbar" class="contents">
        <div class="absolute bottom-0 inset-x-0 h-7 bg-slate-950 border-t border-slate-800 px-3 flex items-center justify-between text-xs text-slate-400">
          <div class="flex items-center gap-4">
            <span>UTF-8</span>
            <span>LF</span>
            <span>python · 132×40</span>
          </div>
          <div class="flex items-center gap-4">
            <span>session-id: cons_8f2a1c4d</span>
            <span>uptime: 02:14:32</span>
            <span class="text-emerald-400">● live</span>
          </div>
        </div>
      </g>
      <g id="floating-tools" class="contents">
        <div class="absolute top-16 right-4 bg-slate-800/90 border border-slate-700 rounded-lg p-2 backdrop-blur text-xs space-y-1">
          <button class="w-full px-2 py-1 text-left text-slate-300 hover:bg-slate-700 rounded flex items-center gap-2">
            <span class="w-3 h-3 inline-block">⎘</span> Copy output
          </button>
          <button class="w-full px-2 py-1 text-left text-slate-300 hover:bg-slate-700 rounded flex items-center gap-2">
            <span class="w-3 h-3 inline-block">⤓</span> Download transcript
          </button>
          <button class="w-full px-2 py-1 text-left text-slate-300 hover:bg-slate-700 rounded flex items-center gap-2">
            <span class="w-3 h-3 inline-block">⟳</span> Reconnect
          </button>
          <button class="w-full px-2 py-1 text-left text-rose-400 hover:bg-slate-700 rounded flex items-center gap-2">
            <span class="w-3 h-3 inline-block">⌫</span> Send Ctrl-C
          </button>
        </div>
      </g>
      <g id="legend" class="contents">
        <div class="absolute bottom-12 left-4 bg-slate-800/95 border border-slate-700 rounded-lg p-3 backdrop-blur max-w-xs">
          <div class="text-xs font-semibold text-slate-200 mb-1 font-sans">Fullscreen Modal Spec</div>
          <ul class="text-xs text-slate-400 space-y-0.5 font-sans">
            <li>· viewport: 100% w/h (no margin), dark theme</li>
            <li>· xterm.js for browser-based PTY emulation</li>
            <li>· connection: WebSocket → middleware console endpoint</li>
            <li>· exit: Esc, ⤢ button, or click × (with confirmation)</li>
            <li>· safety: Ctrl-C injection requires confirmation</li>
          </ul>
        </div>
      </g>
    </div>
  </foreignObject>
</svg>