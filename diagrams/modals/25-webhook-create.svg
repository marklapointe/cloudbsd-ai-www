<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — New Webhook Modal</title>
  <desc>Outbound webhook creation. URL + events grid + auto-generated HMAC secret + custom headers. POST /api/webhooks. Sends POST with X-CloudBSD-Signature header.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:rgba(15,23,42,0.55);color:#0f172a;font-size:13px;box-sizing:border-box;overflow:hidden;display:flex;align-items:center;justify-content:center;">
      <div style="background:#ffffff;border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,0.4);width:640px;display:flex;flex-direction:column;overflow:hidden;">
        <header style="padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:10px;"><div style="width:32px;height:32px;border-radius:8px;background:#0d9488;color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;">🔔</div><h2 style="margin:0;font-size:16px;font-weight:700;color:#0f172a;">New webhook</h2></div>
          <button style="width:28px;height:28px;border-radius:50%;background:#f1f5f9;border:0;cursor:pointer;font-size:14px;color:#64748b;">✕</button>
        </header>
        <div style="padding:18px 20px;flex:1;overflow-y:auto;">

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Name</label>
            <input value="alertmanager-pager" style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;font-family:monospace;"/>
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">URL <span style="color:#dc2626;">*</span></label>
            <input value="https://alerts.example.com/cloudbsd/inbound" style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;font-family:monospace;"/>
            <div style="font-size:10px;color:#94a3b8;margin-top:3px;">HTTPS only. Verified against the cluster CA.</div>
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;">Events <span style="color:#dc2626;">*</span></label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px;background:#f8fafc;border-radius:6px;max-height:160px;overflow-y:auto;">
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" checked="checked" style="accent-color:#1d4ed8;"/> vm.created</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" checked="checked" style="accent-color:#1d4ed8;"/> vm.deleted</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> vm.migrated</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> vm.started</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> vm.stopped</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> container.created</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> container.destroyed</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> jail.created</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> node.online</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> node.offline</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> backup.completed</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> backup.failed</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> alert.fired</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> user.created</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> certificate.expiring</label>
            </div>
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">HMAC secret</label>
            <div style="display:flex;gap:6px;"><input value="whsec_AbC3…fX91" style="flex:1;padding:8px 10px;font-size:12px;border:1px solid #cbd5e1;border-radius:6px;background:#f8fafc;color:#475569;box-sizing:border-box;font-family:monospace;" readonly="readonly"/><button style="padding:8px 12px;font-size:12px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;">🔄</button><button style="padding:8px 12px;font-size:12px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;">Copy</button></div>
            <div style="font-size:10px;color:#94a3b8;margin-top:3px;">Auto-generated 256-bit secret. Used for X-CloudBSD-Signature = HMAC-SHA256(secret, body).</div>
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Custom headers (optional)</label>
            <textarea rows="2" style="width:100%;padding:8px 10px;font-size:11px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;font-family:monospace;resize:vertical;">X-Source: cloudbsd-admin
X-Pager-Token: ${vault:kv/cloudbsd/pager#token}</textarea>
          </div>

          <label style="display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:12px;color:#475569;cursor:pointer;padding:10px 12px;background:#f1f5f9;border-radius:6px;">
            <span><strong>Active</strong> · Send events immediately</span>
            <input type="checkbox" checked="checked" style="accent-color:#1d4ed8;width:30px;height:18px;"/>
          </label>

        </div>

        <footer style="padding:14px 20px;border-top:1px solid #e2e8f0;background:#f8fafc;display:flex;justify-content:space-between;align-items:center;">
          <button style="padding:8px 14px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">Cancel</button>
          <button style="padding:9px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:linear-gradient(135deg,#0d9488,#1e40af);color:#ffffff;cursor:pointer;">+ Add webhook</button>
        </footer>
      </div>
    </div>
  </foreignObject>
</svg>
