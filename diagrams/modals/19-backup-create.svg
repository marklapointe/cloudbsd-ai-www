<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — Backup Create Modal</title>
  <desc>New schedule modal centered over System Mgmt → Backups page. 6 fields per ui-index §7: Name, Type, Source, Schedule (cron builder), Description, Danger zone. POST /api/task-schedules (T77b).</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:rgba(15,23,42,0.55);color:#0f172a;font-size:13px;box-sizing:border-box;overflow:hidden;display:flex;align-items:center;justify-content:center;">
      <div style="background:#ffffff;border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,0.4);width:640px;display:flex;flex-direction:column;overflow:hidden;">
        <header style="padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;">
          <h2 style="margin:0;font-size:16px;font-weight:700;color:#0f172a;">New Backup Schedule</h2>
          <button style="width:28px;height:28px;border-radius:50%;background:#f1f5f9;border:0;cursor:pointer;font-size:14px;color:#64748b;">✕</button>
        </header>
        <div style="padding:18px 20px;flex:1;overflow-y:auto;">
          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Name *</label>
            <input type="text" value="nightly-data-backup" style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;"/>
            <div style="font-size:10px;color:#94a3b8;margin-top:3px;">slug for the schedule — used in API and TaskSchedule.id</div>
          </div>
          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Type *</label>
            <select style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;">
              <option>Backup</option>
              <option>Snapshot</option>
              <option>Replicate</option>
              <option>Scrub</option>
              <option>Exec</option>
              <option>Webhook</option>
              <option>Plugin</option>
            </select>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
            <div>
              <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Source volume *</label>
              <select style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;">
                <option>tank/data</option>
                <option>tank/home</option>
                <option>tank/photos</option>
                <option>tank/backups</option>
              </select>
            </div>
            <div>
              <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Destination *</label>
              <select style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;">
                <option>local pool snapshot</option>
                <option>offsite: rsync.net</option>
                <option>NFS: 10.0.10.5:/exports/backups</option>
              </select>
            </div>
          </div>
          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Schedule *</label>
            <div style="display:grid;grid-template-columns:1fr 2fr;gap:8px;">
              <select style="padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;">
                <option>Cron</option>
                <option>Interval</option>
                <option>Event</option>
                <option>On-demand</option>
              </select>
              <input type="text" value="0 2 * * *" style="font-family:monospace;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;"/>
            </div>
            <div style="font-size:10px;color:#10b981;margin-top:3px;font-family:monospace;">next run: 2026-07-08 02:00:00 UTC</div>
          </div>
          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Description</label>
            <textarea rows="2" style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;resize:vertical;">Nightly incremental ZFS backup of tank/data to offsite rsync.net with 14-day retention.</textarea>
          </div>
          <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:10px 12px;">
            <div style="font-size:10px;font-weight:700;color:#b91c1c;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;">Danger zone</div>
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#334155;margin-bottom:4px;"><input type="checkbox"/>Dry-run first (no writes)</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#334155;margin-bottom:4px;"><input type="checkbox" checked="checked"/>Encrypt at rest (AES-256-GCM)</label>
            <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#334155;"><input type="checkbox"/>Notify on failure (email + webhook)</label>
          </div>
        </div>
        <footer style="padding:14px 20px;border-top:1px solid #e2e8f0;background:#f8fafc;display:flex;align-items:center;justify-content:space-between;">
          <button style="padding:6px 12px;font-size:11px;border:1px solid #cbd5e1;border-radius:5px;background:#ffffff;color:#475569;">▶ Test run</button>
          <div style="display:flex;gap:6px;">
            <button style="padding:8px 16px;font-size:12px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#334155;">Cancel</button>
            <button style="padding:8px 16px;font-size:12px;border:0;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#ffffff;border-radius:6px;font-weight:600;">Create schedule</button>
          </div>
        </footer>
      </div>
    </div>
  </foreignObject>
</svg>
