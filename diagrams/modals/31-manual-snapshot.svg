<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — Take Manual Snapshot Modal</title>
  <desc>Manual snapshot of a single resource. Name + description + memory state option. POST /api/resources/{id}/snapshots.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:rgba(15,23,42,0.55);color:#0f172a;font-size:13px;box-sizing:border-box;overflow:hidden;display:flex;align-items:center;justify-content:center;">
      <div style="background:#ffffff;border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,0.4);width:520px;display:flex;flex-direction:column;overflow:hidden;">
        <header style="padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:10px;"><div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;">📸</div><h2 style="margin:0;font-size:16px;font-weight:700;color:#0f172a;">Take snapshot</h2></div>
          <button style="width:28px;height:28px;border-radius:50%;background:#f1f5f9;border:0;cursor:pointer;font-size:14px;color:#64748b;">✕</button>
        </header>
        <div style="padding:18px 20px;flex:1;overflow-y:auto;">

          <div style="padding:12px 14px;background:#1d4ed810;border:1px solid #bfdbfe;border-radius:8px;margin-bottom:14px;display:flex;align-items:center;gap:12px;">
            <div style="width:36px;height:36px;border-radius:8px;background:#1d4ed8;color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:16px;">▣</div>
            <div>
              <div style="font-size:13px;font-weight:700;color:#0f172a;">web-server-01 (VM)</div>
              <div style="font-size:11px;color:#475569;">node-3 · 4 cores · 8 GB · running · 12.4 GB used disk</div>
            </div>
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Snapshot name</label>
            <input value="manual-pre-postgres-migration" style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;font-family:monospace;"/>
            <div style="font-size:10px;color:#94a3b8;margin-top:3px;">Optional. Auto-generated name if blank: <code style="font-family:monospace;background:#f1f5f9;padding:1px 5px;border-radius:3px;">snap-&lt;timestamp&gt;</code></div>
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Description</label>
            <textarea rows="2" style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;resize:vertical;">Snapshot before postgres-15 → 16 migration. Per runbook step 4.</textarea>
          </div>

          <h3 style="margin:0 0 8px;font-size:12px;font-weight:700;color:#0f172a;text-transform:uppercase;letter-spacing:0.06em;">Snapshot type</h3>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
            <label style="display:block;padding:12px;border:2px solid #1d4ed8;border-radius:8px;background:#1d4ed810;cursor:pointer;text-align:left;">
              <div style="font-size:13px;font-weight:700;color:#1d4ed8;">SELECTED · Online</div>
              <div style="font-size:11px;color:#475569;margin-top:4px;line-height:1.4;">ZFS snapshot of the running VM. Requires guest agent for consistency.</div>
            </label>
            <label style="display:block;padding:12px;border:1px solid #cbd5e1;border-radius:8px;cursor:pointer;text-align:left;">
              <div style="font-size:13px;font-weight:700;color:#0f172a;">Quiesced</div>
              <div style="font-size:11px;color:#475569;margin-top:4px;line-height:1.4;">Freeze guest FS first, snapshot, thaw. ~5-15s service pause.</div>
            </label>
          </div>

          <div style="margin-bottom:14px;padding:12px 14px;background:#f8fafc;border-radius:8px;">
            <div style="font-size:12px;font-weight:700;color:#0f172a;margin-bottom:6px;">Include memory state</div>
            <label style="display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:12px;color:#475569;cursor:pointer;">
              <span>Capture VM RAM at snapshot time (allows instant resume after rollback)</span>
              <input type="checkbox" style="accent-color:#1d4ed8;width:30px;height:18px;"/>
            </label>
            <div style="font-size:10px;color:#94a3b8;line-height:1.4;margin-top:6px;">Adds ~8 GB to the snapshot. Slower to take (15 s), faster to roll back (instant).</div>
          </div>

          <div style="display:flex;justify-content:space-between;font-size:11px;color:#64748b;padding:10px 12px;background:#f1f5f9;border-radius:6px;">
            <span>Estimated size</span>
            <span style="font-weight:700;color:#0f172a;font-family:monospace;">~12.4 GB</span>
          </div>
        </div>

        <footer style="padding:14px 20px;border-top:1px solid #e2e8f0;background:#f8fafc;display:flex;justify-content:space-between;align-items:center;">
          <button style="padding:8px 14px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">Cancel</button>
          <button style="padding:9px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:linear-gradient(135deg,#0ea5e9,#06b6d4);color:#ffffff;cursor:pointer;">📸 Take snapshot</button>
        </footer>
      </div>
    </div>
  </foreignObject>
</svg>
