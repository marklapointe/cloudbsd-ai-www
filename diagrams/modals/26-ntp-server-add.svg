<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — Add NTP Server Modal</title>
  <desc>NTP server add modal. Hostname/IP + auth mode + reachability probe + replace-default pool toggle. POST /api/time/servers.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:rgba(15,23,42,0.55);color:#0f172a;font-size:13px;box-sizing:border-box;overflow:hidden;display:flex;align-items:center;justify-content:center;">
      <div style="background:#ffffff;border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,0.4);width:540px;display:flex;flex-direction:column;overflow:hidden;">
        <header style="padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:10px;"><div style="width:32px;height:32px;border-radius:8px;background:#06b6d4;color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;">⏰</div><h2 style="margin:0;font-size:16px;font-weight:700;color:#0f172a;">Add NTP server</h2></div>
          <button style="width:28px;height:28px;border-radius:50%;background:#f1f5f9;border:0;cursor:pointer;font-size:14px;color:#64748b;">✕</button>
        </header>
        <div style="padding:18px 20px;flex:1;overflow-y:auto;">

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Server hostname or IP <span style="color:#dc2626;">*</span></label>
            <input value="time.cloudflare.com" style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;font-family:monospace;"/>
            <div style="font-size:10px;color:#94a3b8;margin-top:3px;">FQDN preferred. IPv4 / IPv6 accepted. Port 123 default.</div>
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Authentication mode</label>
            <select style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;">
              <option selected="selected">None (open NTP)</option>
              <option>Symmetric key (RFC 5906)</option>
              <option>NTS (Network Time Security, RFC 8915)</option>
              <option>Autokey (legacy, discouraged)</option>
            </select>
          </div>

          <div style="margin-bottom:14px;padding:12px 14px;background:#f8fafc;border-radius:6px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><span style="font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;">Symmetric key (when applicable)</span></div>
            <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:#475569;">
              <span style="font-family:monospace;background:#ffffff;padding:4px 8px;border:1px solid #e2e8f0;border-radius:4px;width:60px;">Key ID</span>
              <input value="42" style="width:60px;padding:4px 8px;font-family:monospace;font-size:12px;border:1px solid #cbd5e1;border-radius:4px;"/>
              <span style="font-family:monospace;background:#ffffff;padding:4px 8px;border:1px solid #e2e8f0;border-radius:4px;">Secret</span>
              <input value="${vault:kv/myapp/ntp-key}" style="flex:1;padding:4px 8px;font-family:monospace;font-size:11px;border:1px solid #cbd5e1;border-radius:4px;color:#1d4ed8;"/>
            </div>
          </div>

          <div style="margin-bottom:14px;padding:12px 14px;background:#dcfce7;border:1px solid #86efac;border-radius:6px;display:flex;align-items:center;gap:12px;">
            <div style="font-size:20px;">✓</div>
            <div style="flex:1;">
              <div style="font-size:12px;font-weight:700;color:#166534;">Reachability probe passed</div>
              <div style="font-size:11px;color:#15803d;line-height:1.4;margin-top:2px;">Server responded in 38 ms · Stratum 3 · Offset 0.04 ms · Polled every 64 s</div>
            </div>
            <button style="padding:6px 12px;font-size:11px;border:1px solid #16a34a;border-radius:4px;background:#ffffff;color:#16a34a;font-weight:600;">Re-test</button>
          </div>

          <label style="display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:12px;color:#475569;cursor:pointer;padding:10px 12px;background:#fef3c7;border:1px solid #fde68a;border-radius:6px;">
            <span><strong>Replace default pool</strong> · Use instead of the 0.cloudbsd.pool.ntp.org fallback</span>
            <input type="checkbox" style="accent-color:#d97706;width:30px;height:18px;"/>
          </label>

        </div>

        <footer style="padding:14px 20px;border-top:1px solid #e2e8f0;background:#f8fafc;display:flex;justify-content:space-between;align-items:center;">
          <button style="padding:8px 14px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">Cancel</button>
          <button style="padding:9px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:linear-gradient(135deg,#06b6d4,#0e7490);color:#ffffff;cursor:pointer;">+ Add server</button>
        </footer>
      </div>
    </div>
  </foreignObject>
</svg>
