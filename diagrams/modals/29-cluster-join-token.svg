<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — Generate Join Token Modal</title>
  <desc>Token-gated cluster node join. TTL + role (worker/master) + allowed networks + one-time vs reusable. POST /api/cluster/join-tokens. Same token shown ONCE.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:rgba(15,23,42,0.55);color:#0f172a;font-size:13px;box-sizing:border-box;overflow:hidden;display:flex;align-items:center;justify-content:center;">
      <div style="background:#ffffff;border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,0.4);width:580px;display:flex;flex-direction:column;overflow:hidden;">
        <header style="padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:10px;"><div style="width:32px;height:32px;border-radius:8px;background:#7c2d12;color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;">🧩</div><h2 style="margin:0;font-size:16px;font-weight:700;color:#0f172a;">Generate join token</h2></div>
          <button style="width:28px;height:28px;border-radius:50%;background:#f1f5f9;border:0;cursor:pointer;font-size:14px;color:#64748b;">✕</button>
        </header>
        <div style="padding:18px 20px;flex:1;overflow-y:auto;">

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Lifetime</label>
            <select style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;">
              <option>1 hour</option>
              <option selected="selected">24 hours</option>
              <option>7 days</option>
              <option>30 days</option>
              <option>Custom…</option>
            </select>
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;">Role <span style="color:#dc2626;">*</span></label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
              <label style="display:block;padding:10px;border:2px solid #1d4ed8;border-radius:6px;background:#1d4ed810;cursor:pointer;text-align:center;">
                <div style="font-size:11px;font-weight:700;color:#1d4ed8;">SELECTED · worker</div>
                <div style="font-size:14px;font-weight:700;color:#0f172a;margin-top:4px;">Worker node</div>
                <div style="font-size:10px;color:#1d4ed8;margin-top:4px;">Runs workloads</div>
              </label>
              <label style="display:block;padding:10px;border:2px solid #cbd5e1;border-radius:6px;cursor:pointer;text-align:center;">
                <div style="font-size:14px;font-weight:700;color:#0f172a;">Master node</div>
                <div style="font-size:10px;color:#64748b;margin-top:4px;">Runs control plane</div>
              </label>
            </div>
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Allowed source networks (one CIDR per line)</label>
            <textarea rows="2" style="width:100%;padding:8px 10px;font-size:11px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;font-family:monospace;resize:vertical;">10.0.0.0/16
192.168.0.0/16</textarea>
            <div style="font-size:10px;color:#94a3b8;margin-top:3px;">Token only valid from these networks. Stricter = safer.</div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
            <label style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f1f5f9;border-radius:6px;font-size:12px;color:#475569;cursor:pointer;">
              <input type="checkbox" checked="checked" style="accent-color:#1d4ed8;"/>
              <span><strong>Single-use</strong> · invalidates after first join</span>
            </label>
            <label style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:#f1f5f9;border-radius:6px;font-size:12px;color:#475569;cursor:pointer;">
              <input type="checkbox" style="accent-color:#1d4ed8;"/>
              <span><strong>Reusable</strong> until TTL</span>
            </label>
          </div>

          <div style="padding:14px 16px;background:#f8fafc;border-radius:6px;font-size:11px;color:#475569;line-height:1.5;">
            <strong style="color:#0f172a;">Use on the new node:</strong> <code style="font-family:monospace;background:#ffffff;padding:2px 6px;border-radius:3px;">cloudbsd node join --token &lt;paste-below&gt;</code>
          </div>

        </div>

        <footer style="padding:14px 20px;border-top:1px solid #e2e8f0;background:#f8fafc;display:flex;justify-content:space-between;align-items:center;">
          <button style="padding:8px 14px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">Cancel</button>
          <button style="padding:9px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:linear-gradient(135deg,#7c2d12,#1d4ed8);color:#ffffff;cursor:pointer;">Generate token</button>
        </footer>
      </div>
    </div>
  </foreignObject>
</svg>
