<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — Edit Node IP Addresses Modal</title>
  <desc>Edit IP/CIDR + purpose + bonded-to + VLAN + enabled per row. Add new IP, duplicate, delete. PATCH /api/nodes/{id}/addresses. Brief disconnect warning.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:rgba(15,23,42,0.55);color:#0f172a;font-size:13px;box-sizing:border-box;overflow:hidden;display:flex;align-items:center;justify-content:center;">
      <div style="background:#ffffff;border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,0.4);width:880px;display:flex;flex-direction:column;overflow:hidden;max-height:780px;">
        <header style="padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:10px;"><div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#0ea5e9,#1d4ed8);color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;">&#x1F4CD;</div><h2 style="margin:0;font-size:16px;font-weight:700;color:#0f172a;">Edit IP addresses</h2><span style="font-family:monospace;font-size:11px;color:#475569;padding:3px 8px;background:#f1f5f9;border-radius:4px;">prod-node-01</span><span style="font-size:11px;color:#1d4ed8;font-weight:600;">3 active</span></div>
          <button style="width:28px;height:28px;border-radius:50%;background:#f1f5f9;border:0;cursor:pointer;font-size:14px;color:#64748b;">&#x2715;</button>
        </header>
        <div style="flex:1;overflow-y:auto;">

          <div style="padding:14px 20px;background:#fef2f2;border-bottom:1px solid #fecaca;display:flex;align-items:center;gap:12px;">
            <div style="font-size:18px;">&#x26A0;</div>
            <div style="flex:1;">
              <div style="font-size:12px;font-weight:700;color:#991b1b;margin-bottom:2px;">Changing IPs on the master will drop your admin session</div>
              <div style="font-size:11px;color:#7f1d1d;line-height:1.5;">Session tears down after Save. Keep IPMI / SSH backup reachable for rollback. CTDB pub IP change will trigger a 30-60 s failover across the cluster.</div>
            </div>
          </div>

          <table style="width:100%;font-size:12px;border-collapse:collapse;background:#ffffff;">
            <thead><tr style="background:#f8fafc;border-bottom:1px solid #e2e8f0;">
              <th style="padding:10px 12px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;width:26%;">ADDRESS</th>
              <th style="padding:10px 12px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;width:18%;">FAMILY</th>
              <th style="padding:10px 12px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;width:22%;">PURPOSE</th>
              <th style="padding:10px 12px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;width:14%;">BONDED TO</th>
              <th style="padding:10px 12px;text-align:center;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;width:8%;">VLAN</th>
              <th style="padding:10px 12px;text-align:center;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;width:6%;">ON</th>
              <th style="padding:10px 12px;text-align:right;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;width:6%;"></th>
            </tr></thead>
            <tbody>
              <tr style="border-bottom:1px solid #f1f5f9;background:#dcfce7;">
                <td style="padding:10px 12px;"><input value="10.0.10.10" style="width:90%;padding:5px 8px;font-family:monospace;font-size:12px;border:1px solid #16a34a;border-radius:4px;"/></td>
                <td style="padding:10px 12px;font-family:monospace;font-size:11px;color:#16a34a;font-weight:700;">IPv4</td>
                <td style="padding:10px 12px;font-size:11px;">cluster management</td>
                <td style="padding:10px 12px;font-family:monospace;font-size:11px;font-weight:700;">lagg0</td>
                <td style="padding:10px 12px;text-align:center;font-family:monospace;font-size:11px;color:#94a3b8;">&#x2014;</td>
                <td style="padding:10px 12px;text-align:center;"><input type="checkbox" checked="checked" style="accent-color:#16a34a;width:24px;height:18px;"/></td>
                <td style="padding:10px 12px;text-align:right;"><button style="padding:3px 8px;font-size:10px;border:1px solid #cbd5e1;border-radius:4px;background:#ffffff;color:#475569;">&#x22EE;</button></td>
              </tr>
              <tr style="border-bottom:1px solid #f1f5f9;background:#dbeafe;">
                <td style="padding:10px 12px;"><input value="fd00:10::10" style="width:90%;padding:5px 8px;font-family:monospace;font-size:12px;border:1px solid #1d4ed8;border-radius:4px;color:#1d4ed8;"/></td>
                <td style="padding:10px 12px;font-family:monospace;font-size:11px;color:#1d4ed8;font-weight:700;">IPv6</td>
                <td style="padding:10px 12px;font-size:11px;">cluster mgmt (ULA)</td>
                <td style="padding:10px 12px;font-family:monospace;font-size:11px;font-weight:700;">lagg0</td>
                <td style="padding:10px 12px;text-align:center;font-family:monospace;font-size:11px;color:#94a3b8;">&#x2014;</td>
                <td style="padding:10px 12px;text-align:center;"><input type="checkbox" checked="checked" style="accent-color:#1d4ed8;width:24px;height:18px;"/></td>
                <td style="padding:10px 12px;text-align:right;"><button style="padding:3px 8px;font-size:10px;border:1px solid #cbd5e1;border-radius:4px;background:#ffffff;color:#475569;">&#x22EE;</button></td>
              </tr>
              <tr style="border-bottom:1px solid #f1f5f9;background:#fef3c7;">
                <td style="padding:10px 12px;"><input value="10.0.20.10" style="width:90%;padding:5px 8px;font-family:monospace;font-size:12px;border:1px solid #cbd5e1;border-radius:4px;"/></td>
                <td style="padding:10px 12px;font-family:monospace;font-size:11px;color:#92400e;">IPv4</td>
                <td style="padding:10px 12px;font-size:11px;">storage replication (private)</td>
                <td style="padding:10px 12px;font-family:monospace;font-size:11px;font-weight:700;">lagg0</td>
                <td style="padding:10px 12px;text-align:center;font-family:monospace;font-size:11px;color:#475569;">20</td>
                <td style="padding:10px 12px;text-align:center;"><input type="checkbox" checked="checked" style="accent-color:#16a34a;width:24px;height:18px;"/></td>
                <td style="padding:10px 12px;text-align:right;"><button style="padding:3px 8px;font-size:10px;border:1px solid #cbd5e1;border-radius:4px;background:#ffffff;color:#dc2626;">&#x2715;</button></td>
              </tr>
              <tr style="border-bottom:1px solid #f1f5f9;background:#fef3c7;">
                <td style="padding:10px 12px;"><input value="10.0.99.10" style="width:90%;padding:5px 8px;font-family:monospace;font-size:12px;border:1px solid #cbd5e1;border-radius:4px;"/></td>
                <td style="padding:10px 12px;font-family:monospace;font-size:11px;color:#92400e;">IPv4</td>
                <td style="padding:10px 12px;font-size:11px;">CTDB pub (floating)</td>
                <td style="padding:10px 12px;font-family:monospace;font-size:11px;font-weight:700;">lagg0</td>
                <td style="padding:10px 12px;text-align:center;font-family:monospace;font-size:11px;color:#475569;">99</td>
                <td style="padding:10px 12px;text-align:center;"><input type="checkbox" checked="checked" style="accent-color:#16a34a;width:24px;height:18px;"/></td>
                <td style="padding:10px 12px;text-align:right;"><button style="padding:3px 8px;font-size:10px;border:1px solid #cbd5e1;border-radius:4px;background:#ffffff;color:#dc2626;">&#x2715;</button></td>
              </tr>
              <!-- New row pre-fill -->
              <tr style="background:#1d4ed810;border-top:2px dashed #1d4ed8;">
                <td style="padding:10px 12px;"><input value="10.0.30.10" style="width:90%;padding:5px 8px;font-family:monospace;font-size:12px;border:1px solid #1d4ed8;border-radius:4px;background:#dbeafe;" placeholder="ip/cidr"/></td>
                <td style="padding:10px 12px;"><select style="width:100%;padding:4px 6px;font-size:11px;border:1px solid #cbd5e1;border-radius:4px;background:#ffffff;"><option selected="selected">IPv4</option><option>IPv6</option></select></td>
                <td style="padding:10px 12px;"><input value="backup replication (private)" style="width:100%;padding:5px 8px;font-size:11px;border:1px solid #cbd5e1;border-radius:4px;background:#ffffff;"/></td>
                <td style="padding:10px 12px;"><select style="width:100%;padding:4px 6px;font-size:11px;border:1px solid #cbd5e1;border-radius:4px;background:#ffffff;font-family:monospace;"><option selected="selected">lagg0</option><option>lagg1</option><option>igb0</option><option>igb1</option></select></td>
                <td style="padding:10px 12px;text-align:center;"><input value="30" style="width:48px;padding:4px 6px;font-family:monospace;font-size:12px;border:1px solid #cbd5e1;border-radius:4px;text-align:center;"/></td>
                <td style="padding:10px 12px;text-align:center;"><input type="checkbox" checked="checked" style="accent-color:#16a34a;width:24px;height:18px;"/></td>
                <td style="padding:10px 12px;text-align:right;"><button style="padding:3px 8px;font-size:10px;border:1px solid #cbd5e1;border-radius:4px;background:#ffffff;color:#dc2626;">&#x2715;</button></td>
              </tr>
            </tbody>
          </table>
          <div style="padding:10px 20px;border-top:1px solid #e2e8f0;background:#f8fafc;">
            <button style="padding:6px 14px;font-size:11px;border:1px dashed #cbd5e1;border-radius:4px;background:#ffffff;color:#475569;cursor:pointer;">+ Add IP</button>
            <span style="margin-left:12px;font-size:10px;color:#94a3b8;">5 rows shown &#xB7; UNSAVED new row highlighted</span>
          </div>

          <div style="padding:14px 20px;border-top:1px solid #e2e8f0;display:grid;grid-template-columns:1fr 1fr;gap:14px;">
            <div style="padding:12px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;">
              <div style="font-size:11px;font-weight:700;color:#0f172a;margin-bottom:6px;">Default gateway</div>
              <div style="display:flex;gap:6px;align-items:center;">
                <select style="flex:0 0 auto;padding:5px 8px;font-size:11px;border:1px solid #cbd5e1;border-radius:4px;background:#ffffff;"><option selected="selected">IPv4</option><option>IPv6</option></select>
                <input value="10.0.10.1" style="flex:1;padding:5px 8px;font-family:monospace;font-size:12px;border:1px solid #cbd5e1;border-radius:4px;"/>
              </div>
            </div>
            <div style="padding:12px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;">
              <div style="font-size:11px;font-weight:700;color:#0f172a;margin-bottom:6px;">Search domains</div>
              <input value="corp.lan, prod.corp.lan" style="width:100%;padding:5px 8px;font-family:monospace;font-size:12px;border:1px solid #cbd5e1;border-radius:4px;"/>
            </div>
          </div>

        </div>

        <footer style="padding:14px 20px;border-top:1px solid #e2e8f0;background:#f8fafc;display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:#64748b;"><span>1 row added &#xB7; 0 deleted</span><span style="padding:2px 7px;background:#fef3c7;color:#92400e;border-radius:9999px;font-weight:700;font-size:10px;">UNSAVED ROW</span></div>
          <div style="display:flex;gap:10px;">
            <button style="padding:8px 14px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">Cancel</button>
            <button style="padding:8px 14px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">Save as draft</button>
            <button style="padding:9px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:linear-gradient(135deg,#0ea5e9,#1d4ed8);color:#ffffff;cursor:pointer;">Save + rebind</button>
          </div>
        </footer>
      </div>
    </div>
  </foreignObject>
</svg>
