<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Component Reference — SSH Key Login (sub-modal)</title>
  <desc>Modal opened from the login page's 'Sign in with SSH key' link. Step 1 of 2: shows the server-issued nonce, the literal ssh-keygen command, a copy-to-clipboard button, and the paste-signature-here textarea. Confirming completes the loop (server verifies, issues session cookie, redirects to /dashboard). (2026-07-10)</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:rgba(15,23,42,0.55);color:#0f172a;font-size:13px;box-sizing:border-box;overflow:hidden;display:flex;align-items:center;justify-content:center;">

<!-- Dim page below (the login screen) -->
<div style="position:absolute;inset:0;background:#f1f5f9;opacity:0.45;"></div>

<!-- Modal -->
<div style="position:relative;width:680px;background:#ffffff;border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,0.35);border:1px solid #e2e8f0;overflow:hidden;">

<!-- Header -->
<div style="padding:16px 20px;border-bottom:1px solid #e2e8f0;background:linear-gradient(180deg,#f8fafc,#ffffff);display:flex;align-items:center;justify-content:space-between;">
  <div style="display:flex;align-items:center;gap:10px;">
    <div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#0f172a,#1e293b);color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-family:monospace;">&#9099;</div>
    <div>
      <h2 style="margin:0;font-size:15px;font-weight:700;color:#0f172a;">Sign in with SSH key</h2>
      <div style="font-size:11px;color:#64748b;margin-top:1px;">Challenge-based auth &#183; your private key never leaves your machine</div>
    </div>
  </div>
  <button style="width:32px;height:32px;border-radius:6px;background:transparent;border:0;color:#64748b;font-size:16px;cursor:pointer;">&#10005;</button>
</div>

<!-- Identity row -->
<div style="padding:14px 20px;background:#f1f5f9;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:14px;font-size:12px;">
  <div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;">ML</div>
  <div style="flex:1;">
    <div style="font-weight:700;color:#0f172a;">mlapointe <span style="color:#64748b;font-weight:500;">&#183; UID 1014 &#183; admin (group 0001)</span></div>
    <div style="font-size:11px;color:#475569;font-family:monospace;">3 enrolled SSH public keys &#183; using <strong>id_ed25519</strong> &#183; fingerprint SHA256:qrvM3&#8230;jk</div>
  </div>
  <span style="display:inline-flex;align-items:center;gap:5px;padding:3px 9px;font-size:10px;font-weight:600;background:#16a34a10;border:1px solid #bbf7d0;border-radius:9999px;color:#166534;font-family:monospace;"><span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:#16a34a;"></span>live</span>
</div>

<!-- Body -->
<div style="padding:18px 20px;">

<!-- STEP 1: nonce + command -->
<div style="margin-bottom:14px;">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
    <div style="width:24px;height:24px;border-radius:50%;background:#1d4ed8;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">1</div>
    <h3 style="margin:0;font-size:13px;font-weight:700;color:#0f172a;">Run this in a terminal that has your key</h3>
    <span style="margin-left:auto;font-family:monospace;font-size:10px;color:#94a3b8;">expires in 04:38</span>
  </div>

  <div style="padding:8px 12px;background:#fef3c7;border:1px solid #fde68a;border-radius:6px;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px;font-size:11px;color:#78350f;line-height:1.5;">
    <span style="color:#b45309;font-weight:700;">&#9888;</span>
    <span>If your account has 2FA enabled, you'll be asked for the 6-digit code right after this step &#8212; the signature alone is not enough.</span>
  </div>

  <!-- Nonce row -->
  <div style="display:flex;align-items:stretch;gap:8px;margin-bottom:10px;">
    <div style="flex:0 0 88px;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.05em;display:flex;align-items:center;padding-top:6px;">nonce</div>
    <div style="flex:1;display:flex;gap:6px;">
      <code id="nonce-block" style="flex:1;display:block;padding:8px 12px;background:#0f172a;color:#a7f3d0;border-radius:6px;font-family:monospace;font-size:12px;font-weight:600;line-height:1.5;word-break:break-all;cursor:pointer;" title="click to copy">cloudbsd-eyJrZXkiOiJlZDI1NTE5Iiwibm9uY2UiOiJhYjljZGYxZS4uLiIsImV4cCI6MTcyMDYwNzM4NSwic2lkIjoic2Vzc18xMjM0NTYifQ==</code>
      <button style="padding:0 14px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;font-size:11px;font-weight:600;cursor:pointer;">copy nonce</button>
    </div>
  </div>

  <!-- Command row -->
  <div style="display:flex;align-items:stretch;gap:8px;margin-bottom:6px;">
    <div style="flex:0 0 88px;font-size:10px;font-weight:700;color:#475569;text-transform:uppercase;letter-spacing:0.05em;display:flex;align-items:flex-start;padding-top:6px;">then run</div>
    <div style="flex:1;display:flex;gap:6px;">
      <code style="flex:1;display:block;padding:8px 12px;background:#0f172a;color:#fde68a;border-radius:6px;font-family:monospace;font-size:11px;line-height:1.55;word-break:break-all;cursor:pointer;" title="click to copy">ssh-keygen -Y sign -f ~/.ssh/id_ed25519 -n cloudbsd-eyJrZXk... -s /tmp/cbsd.session</code>
      <button style="padding:0 14px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;font-size:11px;font-weight:600;cursor:pointer;">copy cmd</button>
    </div>
  </div>

  <div style="font-size:10px;color:#94a3b8;margin-top:6px;padding-left:96px;line-height:1.5;">
    Paste the resulting <code style="background:#f1f5f9;padding:1px 4px;border-radius:3px;font-family:monospace;">-----BEGIN SSH2 SIGNATURE-----</code> block into the box below.
  </div>
</div>

<!-- STEP 2: paste signature -->
<div style="margin-bottom:6px;">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
    <div style="width:24px;height:24px;border-radius:50%;background:#1d4ed8;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">2</div>
    <h3 style="margin:0;font-size:13px;font-weight:700;color:#0f172a;">Paste the signature here</h3>
  </div>
  <textarea rows="5" style="width:100%;padding:10px 12px;background:#0f172a;color:#a7f3d0;border:1px solid #1d4ed8;border-radius:6px;font-family:monospace;font-size:11px;line-height:1.5;box-sizing:border-box;resize:vertical;" placeholder="-----BEGIN SSH2 SIGNATURE-----
AAAAG3NrZXlzaWQAAAAGnM69cy1lZGlucDI1NTE5LXNza............AAAAm
mlapointe@lapointe-laptop
-----END SSH2 SIGNATURE-----"></textarea>
</div>

<!-- Inline error / waiting state -->
<div style="margin-top:10px;padding:8px 12px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;font-size:11px;color:#7f1d1d;display:flex;align-items:center;gap:8px;">
  <span style="font-weight:700;color:#dc2626;">&#9888;</span>
  <span>Verification failed: signature does not match enrolled public key. Did you use the right key, or has the nonce expired (expires in 04:38)?</span>
</div>

<!-- Browser-side alternative -->
<div style="margin-top:14px;padding:10px 14px;background:#f1f5f9;border:1px dashed #cbd5e1;border-radius:6px;font-size:11px;color:#475569;line-height:1.55;">
  <strong>Can't open a terminal?</strong> Use a key you've previously imported into this browser (Settings &#8594; My Account &#8594; SSH keys). The browser will sign locally with <code style="background:#ffffff;padding:1px 4px;border-radius:3px;font-family:monospace;">crypto.subtle.sign('Ed25519', ...)</code>. <a style="color:#1d4ed8;cursor:pointer;font-weight:600;">Sign in browser-side &#8594;</a>
</div>

</div>

<!-- Footer -->
<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-top:1px solid #e2e8f0;background:#f8fafc;">
  <span style="font-size:10px;color:#94a3b8;font-family:monospace;">session_id = uuid:123456<br/>src_ip = 10.0.5.42</span>
  <div style="display:flex;gap:8px;">
    <button style="padding:8px 14px;font-size:12px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;font-weight:600;cursor:pointer;">Cancel</button>
    <button style="padding:9px 22px;font-size:13px;font-weight:600;border:0;border-radius:6px;background:linear-gradient(135deg,#1d4ed8,#0d9488);color:#ffffff;cursor:pointer;">Verify signature &#8594;</button>
  </div>
</div>

</div>
<!-- /modal -->

    </div>
  </foreignObject>
</svg>
