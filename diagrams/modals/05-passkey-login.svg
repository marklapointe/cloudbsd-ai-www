<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Component Reference — PassKey Login (WebAuthn, native browser sheet)</title>
  <desc>PassKey (WebAuthn) login UX. Single click on the login screen triggers the browser's native authenticator sheet (Touch ID / Windows Hello / YubiKey / 1Password / iCloud Keychain). No terminal, no cut-and-paste. The SSH-key wire format is preserved server-side for headless use only. (2026-07-10)</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:#f1f5f9;color:#0f172a;font-size:13px;box-sizing:border-box;overflow:hidden;display:flex;align-items:center;justify-content:center;">

<!-- Same login card layout as 51-login, but the affordance now triggers WebAuthn. -->
<div style="width:440px;background:#ffffff;border-radius:10px;border:1px solid #e2e8f0;box-shadow:0 10px 30px rgba(15,23,42,0.08);padding:32px;box-sizing:border-box;">
  <div style="text-align:center;margin-bottom:24px;">
    <div style="display:inline-block;padding:8px 14px;background:linear-gradient(135deg,#0ea5e9,#1e40af);border-radius:8px;color:#ffffff;font-weight:700;font-size:14px;letter-spacing:0.04em;">CloudBSD</div>
    <h1 style="margin:14px 0 4px;font-size:20px;font-weight:700;color:#0f172a;">Sign in to prod-cluster</h1>
    <p style="margin:0;font-size:12px;color:#64748b;">for cluster: <strong style="font-family:monospace;color:#0f172a;">prod-cluster.cloudbsd.local</strong></p>
  </div>

  <!-- Username field (just a label and a single textbox; password is gone) -->
  <div style="margin-bottom:16px;">
    <label style="display:block;font-size:11px;font-weight:700;color:#475569;margin-bottom:5px;">Username</label>
    <input value="mlapointe" style="width:100%;padding:11px 12px;font-size:13px;font-family:monospace;border:1px solid #cbd5e1;border-radius:6px;box-sizing:border-box;background:#f8fafc;color:#475569;" />
  </div>

  <!-- The ONE BUTTON that does it all. Single click -> browser native sheet. -->
  <button style="width:100%;padding:13px;background:linear-gradient(135deg,#1d4ed8,#0d9488);color:#ffffff;border:0;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;">
    <span style="font-size:18px;">&#x1F511;</span>
    Use Touch ID / security key
  </button>

  <div style="text-align:center;font-size:11px;color:#64748b;margin-bottom:14px;">one tap on this device, or plug your YubiKey</div>

  <!-- Fallback line (collapsed by default) -->
  <details style="font-size:11px;color:#475569;">
    <summary style="cursor:pointer;color:#1d4ed8;font-weight:600;padding:6px 0;">Other ways to sign in</summary>
    <div style="padding:8px 0 4px;">
      <a style="display:block;color:#334155;padding:5px 0;text-decoration:none;cursor:pointer;">&#128274; Use password + TOTP code</a>
      <a style="display:block;color:#334155;padding:5px 0;text-decoration:none;cursor:pointer;">&#128236; Use a recovery code</a>
      <a style="display:block;color:#334155;padding:5px 0;text-decoration:none;cursor:pointer;">&#128188; Headless: ssh-keygen (CLI only)</a>
    </div>
  </details>

  <!-- "What happens next" inline hint -->
  <div style="margin-top:18px;padding:12px 14px;background:#1d4ed808;border:1px solid #1d4ed840;border-radius:8px;display:flex;align-items:center;gap:10px;">
    <div style="font-size:18px;color:#1d4ed8;">i</div>
    <div style="font-size:11px;color:#1e3a8a;line-height:1.5;">
      Your browser will show a sheet asking you to verify.
      Touch ID on Mac &#183; Windows Hello on Windows &#183; YubiKey &#183; 1Password &#183; iCloud Keychain &#8212; whichever this device is set up with.
    </div>
  </div>

</div>

<!-- Native browser sheet (drawn as overlay, simulating what WebKit/Chromium shows). -->
<div style="position:absolute;left:50%;bottom:48px;transform:translateX(-50%);width:380px;background:#ffffff;border-radius:14px;border:1px solid #e2e8f0;box-shadow:0 24px 60px rgba(0,0,0,0.32);padding:14px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
  <div style="font-size:11px;color:#64748b;margin-bottom:6px;">cloudbsd.local wants to verify</div>
  <div style="font-size:14px;font-weight:700;color:#0f172a;margin-bottom:10px;">prod-cluster.cloudbsd.local</div>
  <div style="border-top:1px solid #e2e8f0;padding-top:10px;display:flex;align-items:center;gap:10px;">
    <div style="width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;">C</div>
    <div style="flex:1;">
      <div style="font-size:12px;color:#0f172a;font-weight:600;">mlapointe's PassKey</div>
      <div style="font-size:10px;color:#64748b;font-family:monospace;">SHA256:qrvM3...jk &#183; iCloud Keychain</div>
    </div>
    <button style="font-size:11px;color:#1d4ed8;background:transparent;border:0;font-weight:600;cursor:pointer;">Cancel</button>
  </div>
</div>

    </div>
  </foreignObject>
</svg>
