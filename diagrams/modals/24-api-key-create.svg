<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — New API Key Modal</title>
  <desc>Personal Access Token creation modal. Name + scopes grid + expiry + allowed IPs + CORS origins. POST /api/auth/tokens. Token shown once after create.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:rgba(15,23,42,0.55);color:#0f172a;font-size:13px;box-sizing:border-box;overflow:hidden;display:flex;align-items:center;justify-content:center;">
      <div style="background:#ffffff;border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,0.4);width:620px;display:flex;flex-direction:column;overflow:hidden;">
        <header style="padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:10px;"><div style="width:32px;height:32px;border-radius:8px;background:#7c3aed;color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;">🔑</div><h2 style="margin:0;font-size:16px;font-weight:700;color:#0f172a;">New API key</h2></div>
          <button style="width:28px;height:28px;border-radius:50%;background:#f1f5f9;border:0;cursor:pointer;font-size:14px;color:#64748b;">✕</button>
        </header>
        <div style="padding:18px 20px;flex:1;overflow-y:auto;">

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Name *</label>
            <input value="ci-deploy-prod" style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;font-family:monospace;"/>
            <div style="font-size:10px;color:#94a3b8;margin-top:3px;">Helps identify the consumer in audit logs. Cannot change after create.</div>
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:6px;">Scopes <span style="color:#dc2626;">*</span></label>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px;background:#f8fafc;border-radius:6px;">
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> VMs · read</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> VMs · write</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> Containers · read</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> Containers · write</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> Jails · read</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> Jails · write</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> Volumes · read</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> Volumes · write</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> Networks · read</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> Networks · write</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> Backups · read</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> Backups · write</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> Logs · read</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> Users · read</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> Metrics · read</label>
              <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;"><input type="checkbox" style="accent-color:#1d4ed8;"/> admin (all)</label>
            </div>
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Expires</label>
            <select style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;">
              <option>Never</option>
              <option selected="selected">30 days</option>
              <option>90 days</option>
              <option>1 year</option>
              <option>Custom…</option>
            </select>
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">Allowed CIDR ranges (one per line, optional)</label>
            <textarea rows="2" style="width:100%;padding:8px 10px;font-size:11px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;font-family:monospace;resize:vertical;">10.0.5.0/24
192.168.1.0/24</textarea>
            <div style="font-size:10px;color:#94a3b8;margin-top:3px;">Empty = allow any source. Stricter settings reduce token leak risk.</div>
          </div>

          <div style="margin-bottom:8px;">
            <label style="display:block;font-size:11px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:0.04em;margin-bottom:4px;">CORS origins (one per line, optional)</label>
            <textarea rows="2" style="width:100%;padding:8px 10px;font-size:11px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;font-family:monospace;resize:vertical;">https://admin.example.com</textarea>
          </div>

        </div>

        <footer style="padding:14px 20px;border-top:1px solid #e2e8f0;background:#f8fafc;display:flex;justify-content:space-between;align-items:center;">
          <div style="font-size:11px;color:#94a3b8;">Token shown <strong>once</strong> after create. Save it now.</div>
          <div style="display:flex;gap:10px;">
            <button style="padding:8px 14px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">Cancel</button>
            <button style="padding:9px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:linear-gradient(135deg,#7c3aed,#1d4ed8);color:#ffffff;cursor:pointer;">Generate key</button>
          </div>
        </footer>
      </div>
    </div>
  </foreignObject>
</svg>
