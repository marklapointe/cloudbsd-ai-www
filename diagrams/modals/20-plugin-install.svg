<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — Plugin Install Modal</title>
  <desc>3-tab dialog: From Registry / Upload .tar / From URL. From Registry active showing 4 installable packages. POST /api/plugins/install.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:rgba(15,23,42,0.55);color:#0f172a;font-size:13px;box-sizing:border-box;overflow:hidden;display:flex;align-items:center;justify-content:center;">
      <div style="background:#ffffff;border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,0.4);width:640px;display:flex;flex-direction:column;overflow:hidden;">
        <header style="padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;">
          <h2 style="margin:0;font-size:16px;font-weight:700;color:#0f172a;">Install Plugin</h2>
          <button style="width:28px;height:28px;border-radius:50%;background:#f1f5f9;border:0;cursor:pointer;font-size:14px;color:#64748b;">✕</button>
        </header>
        <div style="display:flex;border-bottom:1px solid #e2e8f0;background:#f8fafc;">
          <div style="flex:1;padding:10px 14px;text-align:center;font-size:12px;color:#1d4ed8;font-weight:600;background:#ffffff;border-bottom:2px solid #2563eb;cursor:pointer;">⊞ From Registry</div>
          <div style="flex:1;padding:10px 14px;text-align:center;font-size:12px;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;">⬆ Upload .tar</div>
          <div style="flex:1;padding:10px 14px;text-align:center;font-size:12px;color:#64748b;cursor:pointer;border-bottom:2px solid transparent;">⌘ From URL</div>
        </div>
        <div style="padding:16px 20px;flex:1;overflow-y:auto;">
          <input type="text" placeholder="Search 24 plugins in registry..." style="width:100%;padding:8px 10px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#0f172a;box-sizing:border-box;margin-bottom:12px;"/>
          <div style="font-size:11px;color:#64748b;text-transform:uppercase;font-weight:600;margin-bottom:8px;">Featured</div>
          <div style="border:1px solid #cbd5e1;border-radius:6px;padding:12px;margin-bottom:8px;background:#f8fafc;display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div style="font-weight:700;color:#0f172a;font-size:13px;">★ zfs-snapshot-rotation</div>
              <div style="font-size:11px;color:#64748b;margin-top:2px;">v1.0.0 · auto-rotate hourly/daily/weekly ZFS snapshots</div>
            </div>
            <button style="padding:6px 14px;font-size:11px;border:0;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#ffffff;border-radius:5px;cursor:pointer;font-weight:600;">Install</button>
          </div>
          <div style="border:1px solid #cbd5e1;border-radius:6px;padding:12px;margin-bottom:8px;background:#f8fafc;display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div style="font-weight:700;color:#0f172a;font-size:13px;">slack-notifier</div>
              <div style="font-size:11px;color:#64748b;margin-top:2px;">v0.8.3 · send events to Slack channel with HMAC</div>
            </div>
            <button style="padding:6px 14px;font-size:11px;border:0;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#ffffff;border-radius:5px;cursor:pointer;font-weight:600;">Install</button>
          </div>
          <div style="border:1px solid #cbd5e1;border-radius:6px;padding:12px;margin-bottom:8px;background:#f8fafc;display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div style="font-weight:700;color:#0f172a;font-size:13px;">grafana-datasource</div>
              <div style="font-size:11px;color:#64748b;margin-top:2px;">v0.4.0 · expose CloudBSD as Grafana datasource</div>
            </div>
            <button style="padding:6px 14px;font-size:11px;border:0;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#ffffff;border-radius:5px;cursor:pointer;font-weight:600;">Install</button>
          </div>
          <div style="border:1px solid #cbd5e1;border-radius:6px;padding:12px;background:#f8fafc;display:flex;align-items:center;justify-content:space-between;">
            <div>
              <div style="font-weight:700;color:#0f172a;font-size:13px;">tailscale-mesh</div>
              <div style="font-size:11px;color:#64748b;margin-top:2px;">v0.2.0 · join nodes to Tailscale mesh for remote access</div>
            </div>
            <button style="padding:6px 14px;font-size:11px;border:0;background:linear-gradient(135deg,#0ea5e9,#1e40af);color:#ffffff;border-radius:5px;cursor:pointer;font-weight:600;">Install</button>
          </div>
        </div>
        <footer style="padding:12px 20px;border-top:1px solid #e2e8f0;background:#f8fafc;display:flex;align-items:center;justify-content:space-between;">
          <div style="font-size:10px;color:#94a3b8;">registry: community.cloudbsd.io · last sync 02:14 UTC</div>
          <div style="display:flex;gap:6px;">
            <button style="padding:8px 16px;font-size:12px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#334155;">Cancel</button>
          </div>
        </footer>
      </div>
    </div>
  </foreignObject>
</svg>
