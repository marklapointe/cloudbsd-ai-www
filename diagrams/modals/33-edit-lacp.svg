<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Admin — Edit LACP Bond Modal</title>
  <desc>Edit single LACP bond (lagg0). Hash policy, failover, lacp-rate, primary, member list with live before/after preview. PATCH /api/nodes/{id}/bonds/lagg0.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:rgba(15,23,42,0.55);color:#0f172a;font-size:13px;box-sizing:border-box;overflow:hidden;display:flex;align-items:center;justify-content:center;">
      <div style="background:#ffffff;border-radius:12px;box-shadow:0 25px 50px rgba(0,0,0,0.4);width:880px;display:flex;flex-direction:column;overflow:hidden;max-height:780px;">
        <header style="padding:16px 20px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:10px;"><div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#ffffff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;">&#x1F500;</div><h2 style="margin:0;font-size:16px;font-weight:700;color:#0f172a;">Edit LACP bond</h2><span style="font-family:monospace;font-size:11px;color:#475569;padding:3px 8px;background:#f1f5f9;border-radius:4px;">lagg0</span><span style="font-family:monospace;font-size:10px;color:#64748b;padding:2px 6px;background:#f1f5f9;border-radius:3px;">prod-node-01</span></div>
          <button style="width:28px;height:28px;border-radius:50%;background:#f1f5f9;border:0;cursor:pointer;font-size:14px;color:#64748b;">&#x2715;</button>
        </header>
        <div style="flex:1;display:flex;overflow:hidden;">
          <div style="flex:1;padding:18px 20px;overflow-y:auto;border-right:1px solid #e2e8f0;">

            <h3 style="margin:0 0 12px;font-size:12px;font-weight:700;color:#0f172a;text-transform:uppercase;letter-spacing:0.06em;">Protocol + hash</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;">
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Protocol</div>
                <select style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #1d4ed8;border-radius:6px;background:#ffffff;color:#1d4ed8;font-weight:600;">
                  <option selected="selected">LACP (802.3ad)</option>
                  <option>failover (active-backup)</option>
                  <option>loadbalance (static)</option>
                  <option>round-robin</option>
                  <option>none (single port)</option>
                </select>
                <div style="font-size:10px;color:#94a3b8;margin-top:4px;">LACP negotiates with the switch. Other modes may need switch reconfig.</div>
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Hash policy (LACP only)</div>
                <select style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;">
                  <option>layer2 (MAC)</option>
                  <option>layer2+3 (MAC+IP)</option>
                  <option selected="selected">layer3+4 (IP+port)</option>
                  <option>layer3 (IP only)</option>
                </select>
                <div style="font-size:10px;color:#94a3b8;margin-top:4px;">layer3+4 best for varied workloads; layer2 for switch-side trivial handling.</div>
              </div>
            </div>

            <h3 style="margin:0 0 12px;font-size:12px;font-weight:700;color:#0f172a;text-transform:uppercase;letter-spacing:0.06em;">LACP rate + behavior</h3>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px;">
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">LACPDU rate</div>
                <select style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;">
                  <option selected="selected">fast (1 s)</option>
                  <option>slow (30 s)</option>
                </select>
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">Primary member</div>
                <select style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;font-family:monospace;">
                  <option selected="selected">igb0</option>
                  <option>igb1</option>
                  <option>— none</option>
                </select>
              </div>
              <div>
                <div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:6px;">MTU</div>
                <input value="1500" style="width:100%;padding:9px 12px;font-size:13px;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;font-family:monospace;text-align:center;"/>
              </div>
            </div>

            <h3 style="margin:0 0 12px;font-size:12px;font-weight:700;color:#0f172a;text-transform:uppercase;letter-spacing:0.06em;">Members</h3>
            <table style="width:100%;font-size:12px;border-collapse:collapse;border:1px solid #e2e8f0;border-radius:6px;overflow:hidden;margin-bottom:12px;">
              <thead><tr style="background:#f8fafc;"><th style="padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;width:34%;">IFACE</th><th style="padding:8px 10px;text-align:left;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;">ROLE</th><th style="padding:8px 10px;text-align:center;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;width:14%;">IN BOND</th><th style="padding:8px 10px;text-align:right;font-size:10px;font-weight:700;color:#64748b;letter-spacing:0.06em;width:18%;"></th></tr></thead>
              <tbody>
                <tr style="background:#16a34a10;">
                  <td style="padding:8px 10px;font-family:monospace;font-weight:700;">igb0</td>
                  <td style="padding:8px 10px;font-size:11px;color:#16a34a;font-weight:700;">primary</td>
                  <td style="padding:8px 10px;text-align:center;color:#16a34a;font-weight:700;">&#x2713;</td>
                  <td style="padding:8px 10px;text-align:right;"><span style="font-size:10px;color:#94a3b8;">cannot remove</span></td>
                </tr>
                <tr style="background:#16a34a10;">
                  <td style="padding:8px 10px;font-family:monospace;font-weight:700;">igb1</td>
                  <td style="padding:8px 10px;"><select style="width:100%;padding:4px 6px;font-size:11px;border:1px solid #16a34a;border-radius:4px;background:#ffffff;font-weight:600;"><option selected="selected">backup</option><option>primary</option></select></td>
                  <td style="padding:8px 10px;text-align:center;"><input type="checkbox" checked="checked" style="accent-color:#16a34a;width:24px;height:18px;"/></td>
                  <td style="padding:8px 10px;text-align:right;"><button style="padding:3px 8px;font-size:10px;border:1px solid #cbd5e1;border-radius:4px;background:#ffffff;color:#dc2626;">Remove</button></td>
                </tr>
                <tr style="background:#f8fafc;">
                  <td style="padding:8px 10px;font-family:monospace;color:#475569;">em0 (unused)</td>
                  <td style="padding:8px 10px;font-size:11px;color:#94a3b8;font-style:italic;">available</td>
                  <td style="padding:8px 10px;text-align:center;"><input type="checkbox" style="accent-color:#16a34a;width:24px;height:18px;"/></td>
                  <td style="padding:8px 10px;text-align:right;"><button style="padding:3px 8px;font-size:10px;border:1px solid #16a34a;border-radius:4px;background:#ffffff;color:#16a34a;">+ Add</button></td>
                </tr>
              </tbody>
            </table>
            <button style="padding:5px 12px;font-size:11px;border:1px dashed #cbd5e1;border-radius:4px;background:#f8fafc;color:#475569;">+ Add member (PCI ifaces)</button>

          </div>

          <!-- Right preview column -->
          <div style="width:340px;padding:18px 16px;overflow-y:auto;background:#f8fafc;">

            <h3 style="margin:0 0 10px;font-size:12px;font-weight:700;color:#0f172a;text-transform:uppercase;letter-spacing:0.06em;">Live preview</h3>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;">
              <!-- Before -->
              <div style="padding:12px;background:#ffffff;border:1px solid #e2e8f0;border-radius:6px;">
                <div style="font-size:9px;font-weight:700;color:#94a3b8;letter-spacing:0.06em;margin-bottom:8px;">BEFORE</div>
                <div style="display:flex;flex-direction:column;gap:6px;">
                  <div style="padding:6px 8px;background:#fef3c7;border-radius:4px;font-family:monospace;font-size:10px;color:#92400e;display:flex;justify-content:space-between;">igb0 <span style="color:#16a34a;">&#x2713; active</span></div>
                  <div style="padding:6px 8px;background:#94a3b820;border-radius:4px;font-family:monospace;font-size:10px;color:#475569;display:flex;justify-content:space-between;">igb1 <span style="color:#94a3b8;">&#x26AB; stand-by</span></div>
                </div>
                <div style="font-size:9px;color:#64748b;margin-top:6px;line-height:1.4;">failover-only &#xB7; 1 Gbps max</div>
              </div>
              <!-- After -->
              <div style="padding:12px;background:#1d4ed810;border:1px solid #1d4ed8;border-radius:6px;">
                <div style="font-size:9px;font-weight:700;color:#1d4ed8;letter-spacing:0.06em;margin-bottom:8px;">AFTER</div>
                <div style="display:flex;flex-direction:column;gap:6px;">
                  <div style="padding:6px 8px;background:#16a34a20;border-radius:4px;font-family:monospace;font-size:10px;color:#166534;display:flex;justify-content:space-between;">igb0 <span style="color:#16a34a;">&#x2713; primary</span></div>
                  <div style="padding:6px 8px;background:#16a34a20;border-radius:4px;font-family:monospace;font-size:10px;color:#166534;display:flex;justify-content:space-between;">igb1 <span style="color:#16a34a;">&#x2713; active</span></div>
                </div>
                <div style="font-size:9px;color:#1d4ed8;margin-top:6px;line-height:1.4;">LACP layer3+4 &#xB7; 2 Gbps aggregate</div>
              </div>
            </div>

            <div style="padding:12px;background:#ffffff;border:1px solid #e2e8f0;border-radius:6px;font-size:11px;color:#475569;line-height:1.5;margin-bottom:12px;">
              <strong style="color:#0f172a;">Tip:</strong> For predictable failover, mark only one member as <em>primary</em>. Multiple primaries cause split-brain on primary loss.
            </div>

            <div style="padding:12px;background:#1e293b;border-radius:6px;">
              <div style="font-size:9px;font-weight:700;color:#94a3b8;letter-spacing:0.06em;margin-bottom:6px;">/etc/rc.conf delta</div>
              <code style="font-family:monospace;font-size:10px;color:#a5f3fc;line-height:1.6;display:block;white-space:pre-wrap;">ifconfig_lagg0=&quot;laggproto lacp \
  laggport igb0 \
  laggport igb1 \
  lagghash l3+l4 \
  up&quot;</code>
            </div>

          </div>
        </div>

        <footer style="padding:14px 20px;border-top:1px solid #e2e8f0;background:#f8fafc;display:flex;justify-content:space-between;align-items:center;">
          <div style="display:flex;align-items:center;gap:8px;font-size:11px;color:#64748b;"><span>1 unsaved change</span><span style="padding:2px 7px;background:#fef3c7;color:#92400e;border-radius:9999px;font-weight:700;font-size:10px;">MODIFIED</span></div>
          <div style="display:flex;gap:10px;">
            <button style="padding:8px 14px;font-size:12px;font-weight:600;border:1px solid #cbd5e1;border-radius:6px;background:#ffffff;color:#475569;">Cancel</button>
            <button style="padding:9px 22px;font-size:13px;font-weight:600;border:none;border-radius:6px;background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#ffffff;cursor:pointer;">Apply bond</button>
          </div>
        </footer>
      </div>
    </div>
  </foreignObject>
</svg>
