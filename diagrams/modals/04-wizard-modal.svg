<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Wizard Modal (Step 2 of 4)</title>
  <desc>Multi-step wizard modal showing step 2 of 4 (Network Configuration) with step indicator, back/next buttons, and step content.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 relative">
      <g id="header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 px-2 py-0.5 text-xs rounded bg-slate-100 text-slate-600">freenas-mock.local</span>
          </div>
          <div class="ml-auto flex items-center gap-4">
            <span class="text-sm text-slate-500">Theme: CloudBSD</span>
            <button class="text-sm text-slate-600 hover:text-slate-900">Refresh</button>
            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-medium">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Dashboard</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Containers</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Jails</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Volumes</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Network Map</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Admin</div>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Users</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Logs</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Notifications</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Settings</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 p-6 overflow-auto opacity-30 pointer-events-none">
          <g id="content" class="contents">
            <h1 class="text-2xl font-bold mb-4">Dashboard</h1>
            <div class="bg-white rounded-lg border border-slate-200 p-4 text-sm text-slate-700">Background: dashboard (dimmed)</div>
          </g>
        </main>
      </div>
      <g id="backdrop" class="contents">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm"></div>
      </g>
      <g id="modal-wizard" class="contents">
        <div class="absolute inset-0 flex items-center justify-center p-4">
          <div class="w-full max-w-3xl bg-white rounded-lg shadow-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between">
              <div>
                <h2 class="text-lg font-semibold text-slate-900">Create VM Wizard</h2>
                <p class="text-xs text-slate-500 mt-0.5">bhyve virtual machine setup · guided workflow</p>
              </div>
              <button class="text-slate-400 hover:text-slate-700 text-xl">×</button>
            </div>
            <g id="stepper" class="contents">
              <div class="px-6 py-4 bg-slate-50 border-b border-slate-200">
                <ol class="flex items-center justify-between">
                  <li class="flex items-center gap-2 flex-1">
                    <div class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center text-sm font-bold flex-shrink-0">✓</div>
                    <div class="hidden sm:block">
                      <div class="text-xs font-semibold text-emerald-700">Step 1</div>
                      <div class="text-xs text-slate-600">Name &amp; OS</div>
                    </div>
                  </li>
                  <li class="flex-shrink-0 mx-2">
                    <div class="h-0.5 w-12 bg-emerald-500"></div>
                  </li>
                  <li class="flex items-center gap-2 flex-1">
                    <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-bold flex-shrink-0 ring-4 ring-blue-100">2</div>
                    <div class="hidden sm:block">
                      <div class="text-xs font-semibold text-blue-700">Step 2</div>
                      <div class="text-xs text-slate-900">Network</div>
                    </div>
                  </li>
                  <li class="flex-shrink-0 mx-2">
                    <div class="h-0.5 w-12 bg-slate-200"></div>
                  </li>
                  <li class="flex items-center gap-2 flex-1">
                    <div class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center text-sm font-bold flex-shrink-0">3</div>
                    <div class="hidden sm:block">
                      <div class="text-xs font-medium text-slate-500">Step 3</div>
                      <div class="text-xs text-slate-500">Storage</div>
                    </div>
                  </li>
                  <li class="flex-shrink-0 mx-2">
                    <div class="h-0.5 w-12 bg-slate-200"></div>
                  </li>
                  <li class="flex items-center gap-2 flex-1">
                    <div class="w-8 h-8 rounded-full bg-slate-200 text-slate-500 flex items-center justify-center text-sm font-bold flex-shrink-0">4</div>
                    <div class="hidden sm:block">
                      <div class="text-xs font-medium text-slate-500">Step 4</div>
                      <div class="text-xs text-slate-500">Review</div>
                    </div>
                  </li>
                </ol>
              </div>
            </g>
            <div class="p-6 max-h-[50vh] overflow-y-auto">
              <h3 class="text-base font-semibold text-slate-900 mb-1">Network Configuration</h3>
              <p class="text-sm text-slate-600 mb-5">Attach the VM to one or more virtual switches. At least one network is required.</p>
              <div class="space-y-3">
                <div class="border border-blue-300 bg-blue-50/40 rounded-lg p-4">
                  <div class="flex items-start justify-between">
                    <div class="flex items-start gap-3">
                      <input type="checkbox" checked="checked" class="mt-1 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
                      <div>
                        <div class="font-medium text-slate-900">Primary network (vtnet0)</div>
                        <div class="text-xs text-slate-600 mt-0.5">Bridge: bridge0 · VLAN: untagged</div>
                      </div>
                    </div>
                    <button class="text-slate-400 hover:text-slate-700">⚙</button>
                  </div>
                  <div class="mt-3 grid grid-cols-3 gap-2 text-sm">
                    <div>
                      <label class="text-xs text-slate-500">Mode</label>
                      <select class="mt-1 w-full px-2 py-1.5 text-sm rounded border border-slate-300 bg-white">
                        <option>Bridged</option>
                        <option>NAT</option>
                        <option>Host-only</option>
                      </select>
                    </div>
                    <div>
                      <label class="text-xs text-slate-500">MAC address</label>
                      <input type="text" value="00:0c:29:8f:2a:1c" class="mt-1 w-full px-2 py-1.5 text-sm rounded border border-slate-300 bg-white font-mono" />
                    </div>
                    <div>
                      <label class="text-xs text-slate-500">MTU</label>
                      <input type="text" value="1500" class="mt-1 w-full px-2 py-1.5 text-sm rounded border border-slate-300 bg-white font-mono" />
                    </div>
                  </div>
                </div>
                <div class="border border-slate-200 rounded-lg p-4">
                  <div class="flex items-start justify-between">
                    <div class="flex items-start gap-3">
                      <input type="checkbox" class="mt-1 rounded border-slate-300 text-blue-600 focus:ring-blue-500" />
                      <div>
                        <div class="font-medium text-slate-900">Management network</div>
                        <div class="text-xs text-slate-600 mt-0.5">Optional — for out-of-band access</div>
                      </div>
                    </div>
                  </div>
                </div>
                <button class="w-full px-3 py-2 text-sm rounded border border-dashed border-slate-300 text-slate-600 hover:bg-slate-50">+ Add another network</button>
              </div>
            </div>
            <div class="px-6 py-3 bg-slate-50 border-t border-slate-200 flex items-center justify-between">
              <button class="px-4 py-2 text-sm rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-50 font-medium inline-flex items-center gap-1">
                <span>←</span> Back
              </button>
              <div class="flex items-center gap-2 text-xs text-slate-500">
                <span>Step 2 of 4</span>
                <span>·</span>
                <span>Auto-saving draft</span>
              </div>
              <button class="px-4 py-2 text-sm rounded bg-blue-600 text-white hover:bg-blue-700 font-medium inline-flex items-center gap-1">
                Next <span>→</span>
              </button>
            </div>
          </div>
        </div>
      </g>
      <g id="legend" class="contents">
        <div class="absolute bottom-6 left-6 bg-white/95 border border-slate-200 rounded-lg p-3 shadow-lg max-w-sm backdrop-blur">
          <div class="text-xs font-semibold text-slate-700 mb-1">Wizard Modal Spec</div>
          <ul class="text-xs text-slate-600 space-y-0.5">
            <li>· stepper: 4 numbered circles + connectors (line color reflects state)</li>
            <li>· states: ✓ emerald (done) · blue ring (current) · slate (pending)</li>
            <li>· footer: Back · progress text · Next (or Finish on last)</li>
            <li>· click on completed step allows backward navigation</li>
            <li>· a11y: aria-current="step" on active step</li>
          </ul>
        </div>
      </g>
    </div>
  </foreignObject>
</svg>