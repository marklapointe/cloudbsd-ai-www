<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Mobile VMs list (375x812, portrait)</title>
  <desc>Mobile VM list with search, filter chips, and swipe-action cards.</desc>
  <foreignObject x="0" y="0" width="375" height="812">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 flex flex-col">
      <g id="header" class="contents">
        <div class="h-12 bg-white border-b border-slate-200 flex items-center px-3 gap-2">
          <button aria-label="Back" class="w-9 h-9 rounded flex items-center justify-center text-slate-700 hover:bg-slate-100">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
          </button>
          <span class="font-semibold text-sm">Virtual Machines</span>
          <button class="ml-auto w-9 h-9 rounded flex items-center justify-center text-blue-700 hover:bg-blue-50" aria-label="Create VM">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg>
          </button>
        </div>
      </g>
      <g id="search" class="contents">
        <div class="px-3 py-2 bg-white border-b border-slate-200">
          <div class="relative">
            <input type="search" placeholder="Search VMs…" class="w-full pl-9 pr-3 py-2 text-sm rounded-md bg-slate-100 border-0 focus:ring-2 focus:ring-blue-300 focus:bg-white" />
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" class="absolute left-2.5 top-2.5 text-slate-400" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M14 14l4 4"/></svg>
          </div>
        </div>
      </g>
      <g id="chips" class="contents">
        <div class="px-3 py-2 flex gap-2 overflow-x-auto bg-white border-b border-slate-200">
          <button class="px-3 py-1 text-xs rounded-full bg-blue-600 text-white font-medium whitespace-nowrap">All (24)</button>
          <button class="px-3 py-1 text-xs rounded-full bg-slate-100 text-slate-700 whitespace-nowrap">Running (19)</button>
          <button class="px-3 py-1 text-xs rounded-full bg-slate-100 text-slate-700 whitespace-nowrap">Paused (3)</button>
          <button class="px-3 py-1 text-xs rounded-full bg-slate-100 text-slate-700 whitespace-nowrap">Stopped (2)</button>
        </div>
      </g>
      <g id="content" class="contents">
        <main class="flex-1 overflow-auto p-3 space-y-2">
          <div class="bg-white rounded-lg border border-slate-200 p-3">
            <div class="flex items-center justify-between">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2">
                  <span class="font-semibold text-sm truncate">web-server-01</span>
                  <span class="text-xs text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded">running</span>
                </div>
                <div class="text-xs text-slate-500 mt-0.5">Debian 12 · 2 vCPU · 4 GB</div>
              </div>
              <button class="text-slate-400 hover:text-slate-700 ml-2" aria-label="More">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="5" cy="10" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="15" cy="10" r="1.5"/></svg>
              </button>
            </div>
            <div class="mt-2 grid grid-cols-3 gap-2 text-xs">
              <div><span class="text-slate-500">CPU</span> <span class="font-medium">37%</span></div>
              <div><span class="text-slate-500">Mem</span> <span class="font-medium">2.1G</span></div>
              <div><span class="text-slate-500">↑</span> <span class="font-medium">12m</span></div>
            </div>
          </div>
          <div class="bg-white rounded-lg border border-slate-200 p-3">
            <div class="flex items-center justify-between">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2">
                  <span class="font-semibold text-sm truncate">db-postgres</span>
                  <span class="text-xs text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded">running</span>
                </div>
                <div class="text-xs text-slate-500 mt-0.5">FreeBSD 14 · 4 vCPU · 8 GB</div>
              </div>
              <button class="text-slate-400 hover:text-slate-700 ml-2" aria-label="More">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="5" cy="10" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="15" cy="10" r="1.5"/></svg>
              </button>
            </div>
            <div class="mt-2 grid grid-cols-3 gap-2 text-xs">
              <div><span class="text-slate-500">CPU</span> <span class="font-medium">62%</span></div>
              <div><span class="text-slate-500">Mem</span> <span class="font-medium">6.4G</span></div>
              <div><span class="text-slate-500">↑</span> <span class="font-medium">41d</span></div>
            </div>
          </div>
          <div class="bg-white rounded-lg border border-slate-200 p-3">
            <div class="flex items-center justify-between">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2">
                  <span class="font-semibold text-sm truncate">cache-redis</span>
                  <span class="text-xs text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded">paused</span>
                </div>
                <div class="text-xs text-slate-500 mt-0.5">Alpine 3.20 · 1 vCPU · 1 GB</div>
              </div>
              <button class="text-slate-400 hover:text-slate-700 ml-2" aria-label="More">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="5" cy="10" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="15" cy="10" r="1.5"/></svg>
              </button>
            </div>
            <div class="mt-2 grid grid-cols-3 gap-2 text-xs">
              <div><span class="text-slate-500">CPU</span> <span class="font-medium">2%</span></div>
              <div><span class="text-slate-500">Mem</span> <span class="font-medium">512M</span></div>
              <div><span class="text-slate-500">↑</span> <span class="font-medium">3d</span></div>
            </div>
          </div>
          <div class="bg-white rounded-lg border border-slate-200 p-3">
            <div class="flex items-center justify-between">
              <div class="min-w-0 flex-1">
                <div class="flex items-center gap-2">
                  <span class="font-semibold text-sm truncate">worker-pool</span>
                  <span class="text-xs text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded">running</span>
                </div>
                <div class="text-xs text-slate-500 mt-0.5">Ubuntu 24.04 · 4 vCPU · 8 GB</div>
              </div>
              <button class="text-slate-400 hover:text-slate-700 ml-2" aria-label="More">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="5" cy="10" r="1.5"/><circle cx="10" cy="10" r="1.5"/><circle cx="15" cy="10" r="1.5"/></svg>
              </button>
            </div>
            <div class="mt-2 grid grid-cols-3 gap-2 text-xs">
              <div><span class="text-slate-500">CPU</span> <span class="font-medium">81%</span></div>
              <div><span class="text-slate-500">Mem</span> <span class="font-medium">3.8G</span></div>
              <div><span class="text-slate-500">↑</span> <span class="font-medium">8d</span></div>
            </div>
          </div>
          <div class="text-center text-xs text-slate-500 py-2">Pull up to load more</div>
        </main>
      </g>
      <g id="tabbar" class="contents">
        <nav class="h-14 bg-white border-t border-slate-200 flex items-center justify-around">
          <a class="flex flex-col items-center gap-0.5 text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="6" height="8" rx="1"/><rect x="11" y="3" width="6" height="4" rx="1"/><rect x="11" y="9" width="6" height="8" rx="1"/><rect x="3" y="13" width="6" height="4" rx="1"/></svg>
            <span class="text-[10px]">Dashboard</span>
          </a>
          <a class="flex flex-col items-center gap-0.5 text-blue-700">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="4" width="16" height="11" rx="1"/><path d="M6 18h8"/></svg>
            <span class="text-[10px] font-medium">VMs</span>
          </a>
          <a class="flex flex-col items-center gap-0.5 text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 7l7-4 7 4v9H3z"/><path d="M8 16V11h4v5"/></svg>
            <span class="text-[10px]">Volumes</span>
          </a>
          <a class="flex flex-col items-center gap-0.5 text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3a7 7 0 100 14 7 7 0 000-14z"/><path d="M10 6v4l3 2"/></svg>
            <span class="text-[10px]">Logs</span>
          </a>
          <a class="flex flex-col items-center gap-0.5 text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="3"/><path d="M10 1v3M10 16v3M1 10h3M16 10h3"/></svg>
            <span class="text-[10px]">More</span>
          </a>
        </nav>
      </g>
    </div>
  </foreignObject>
</svg>