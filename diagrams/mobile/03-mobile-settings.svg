<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Mobile Settings (375x812, portrait)</title>
  <desc>Mobile settings screen with grouped sections, toggles, and nav rows.</desc>
  <foreignObject x="0" y="0" width="375" height="812">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 flex flex-col">
      <g id="header" class="contents">
        <div class="h-12 bg-white border-b border-slate-200 flex items-center px-3 gap-2">
          <button aria-label="Back" class="w-9 h-9 rounded flex items-center justify-center text-slate-700 hover:bg-slate-100">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 4l-6 6 6 6"/></svg>
          </button>
          <span class="font-semibold text-sm">Settings</span>
        </div>
      </g>
      <g id="content" class="contents">
        <main class="flex-1 overflow-auto p-3 space-y-3">
          <div class="bg-white rounded-lg border border-slate-200">
            <div class="px-3 py-2 text-xs uppercase tracking-wide text-slate-500 border-b border-slate-100">Appearance</div>
            <div class="flex items-center justify-between px-3 py-3 border-b border-slate-100">
              <div>
                <div class="text-sm font-medium">Theme</div>
                <div class="text-xs text-slate-500">CloudBSD · Light</div>
              </div>
              <button class="text-sm text-blue-700 font-medium">Change</button>
            </div>
            <div class="flex items-center justify-between px-3 py-3">
              <div>
                <div class="text-sm font-medium">Reduce motion</div>
                <div class="text-xs text-slate-500">Disable animations</div>
              </div>
              <button role="switch" aria-checked="false" class="relative inline-flex h-5 w-9 items-center rounded-full bg-slate-300">
                <span class="inline-block h-3.5 w-3.5 transform rounded-full bg-white translate-x-1"></span>
              </button>
            </div>
          </div>
          <div class="bg-white rounded-lg border border-slate-200">
            <div class="px-3 py-2 text-xs uppercase tracking-wide text-slate-500 border-b border-slate-100">Notifications</div>
            <div class="flex items-center justify-between px-3 py-3 border-b border-slate-100">
              <div>
                <div class="text-sm font-medium">Critical alerts</div>
                <div class="text-xs text-slate-500">Push · Email</div>
              </div>
              <button role="switch" aria-checked="true" class="relative inline-flex h-5 w-9 items-center rounded-full bg-blue-600">
                <span class="inline-block h-3.5 w-3.5 transform rounded-full bg-white translate-x-5"></span>
              </button>
            </div>
            <div class="flex items-center justify-between px-3 py-3 border-b border-slate-100">
              <div>
                <div class="text-sm font-medium">Scrub results</div>
                <div class="text-xs text-slate-500">Weekly summary</div>
              </div>
              <button role="switch" aria-checked="true" class="relative inline-flex h-5 w-9 items-center rounded-full bg-blue-600">
                <span class="inline-block h-3.5 w-3.5 transform rounded-full bg-white translate-x-5"></span>
              </button>
            </div>
            <div class="flex items-center justify-between px-3 py-3">
              <div>
                <div class="text-sm font-medium">Marketing</div>
                <div class="text-xs text-slate-500">Product news</div>
              </div>
              <button role="switch" aria-checked="false" class="relative inline-flex h-5 w-9 items-center rounded-full bg-slate-300">
                <span class="inline-block h-3.5 w-3.5 transform rounded-full bg-white translate-x-1"></span>
              </button>
            </div>
          </div>
          <div class="bg-white rounded-lg border border-slate-200">
            <div class="px-3 py-2 text-xs uppercase tracking-wide text-slate-500 border-b border-slate-100">System</div>
            <a class="flex items-center justify-between px-3 py-3 border-b border-slate-100 hover:bg-slate-50">
              <span class="text-sm">Network</span>
              <span class="flex items-center gap-1 text-xs text-slate-500">
                bridge0 · 10.0.1.1
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>
              </span>
            </a>
            <a class="flex items-center justify-between px-3 py-3 border-b border-slate-100 hover:bg-slate-50">
              <span class="text-sm">Storage pools</span>
              <span class="flex items-center gap-1 text-xs text-slate-500">
                2 pools
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>
              </span>
            </a>
            <a class="flex items-center justify-between px-3 py-3 border-b border-slate-100 hover:bg-slate-50">
              <span class="text-sm">Users &amp; permissions</span>
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" class="text-slate-400" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>
            </a>
            <a class="flex items-center justify-between px-3 py-3 hover:bg-slate-50">
              <span class="text-sm">About</span>
              <span class="flex items-center gap-1 text-xs text-slate-500">
                v2.4.1
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 4l6 6-6 6"/></svg>
              </span>
            </a>
          </div>
          <div class="bg-white rounded-lg border border-slate-200">
            <button class="block w-full px-3 py-3 text-sm text-rose-700 hover:bg-rose-50 text-center font-medium">Sign out</button>
          </div>
          <div class="text-center text-xs text-slate-400 py-2">CloudBSD Admin v2.4.1</div>
        </main>
      </g>
      <g id="tabbar" class="contents">
        <nav class="h-14 bg-white border-t border-slate-200 flex items-center justify-around">
          <a class="flex flex-col items-center gap-0.5 text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="6" height="8" rx="1"/><rect x="11" y="3" width="6" height="4" rx="1"/><rect x="11" y="9" width="6" height="8" rx="1"/><rect x="3" y="13" width="6" height="4" rx="1"/></svg>
            <span class="text-[10px]">Dashboard</span>
          </a>
          <a class="flex flex-col items-center gap-0.5 text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="4" width="16" height="11" rx="1"/><path d="M6 18h8"/></svg>
            <span class="text-[10px]">VMs</span>
          </a>
          <a class="flex flex-col items-center gap-0.5 text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 7l7-4 7 4v9H3z"/><path d="M8 16V11h4v5"/></svg>
            <span class="text-[10px]">Volumes</span>
          </a>
          <a class="flex flex-col items-center gap-0.5 text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3a7 7 0 100 14 7 7 0 000-14z"/><path d="M10 6v4l3 2"/></svg>
            <span class="text-[10px]">Logs</span>
          </a>
          <a class="flex flex-col items-center gap-0.5 text-blue-700">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="3"/><path d="M10 1v3M10 16v3M1 10h3M16 10h3"/></svg>
            <span class="text-[10px] font-medium">More</span>
          </a>
        </nav>
      </g>
    </div>
  </foreignObject>
</svg>