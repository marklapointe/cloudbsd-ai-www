<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Mobile Dashboard (375x812, portrait)</title>
  <desc>Mobile-portrait dashboard with collapsed sidebar, stacked cards, and bottom tab bar.</desc>
  <foreignObject x="0" y="0" width="375" height="812">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 flex flex-col">
      <g id="header" class="contents">
        <div class="h-12 bg-white border-b border-slate-200 flex items-center px-3 gap-2">
          <button aria-label="Open menu" class="w-9 h-9 rounded flex items-center justify-center text-slate-700 hover:bg-slate-100">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
          </button>
          <div class="w-7 h-7 rounded bg-blue-600 text-white flex items-center justify-center text-sm font-bold">C</div>
          <span class="font-semibold text-sm">CloudBSD</span>
          <div class="ml-auto w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-medium">M</div>
        </div>
      </g>
      <g id="content" class="contents">
        <main class="flex-1 overflow-auto p-3 space-y-3">
          <div>
            <h1 class="text-xl font-bold">Dashboard</h1>
            <p class="text-xs text-slate-500">freenas-mock.local · mobile</p>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div class="bg-white rounded-lg p-3 border border-slate-200">
              <div class="text-xs text-slate-500">CPU</div>
              <div class="text-2xl font-bold mt-0.5">42%</div>
              <div class="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full bg-blue-600" style="width: 42%;"></div>
              </div>
            </div>
            <div class="bg-white rounded-lg p-3 border border-slate-200">
              <div class="text-xs text-slate-500">Memory</div>
              <div class="text-2xl font-bold mt-0.5">8.2<span class="text-sm text-slate-500 font-normal">/16</span></div>
              <div class="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full bg-amber-500" style="width: 51%;"></div>
              </div>
            </div>
            <div class="bg-white rounded-lg p-3 border border-slate-200">
              <div class="text-xs text-slate-500">Disk</div>
              <div class="text-2xl font-bold mt-0.5">245<span class="text-sm text-slate-500 font-normal">G</span></div>
              <div class="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full bg-blue-600" style="width: 27%;"></div>
              </div>
            </div>
            <div class="bg-white rounded-lg p-3 border border-slate-200">
              <div class="text-xs text-slate-500">Net ↑</div>
              <div class="text-2xl font-bold mt-0.5">12.4<span class="text-sm text-slate-500 font-normal">MB/s</span></div>
              <div class="mt-2 h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full bg-blue-600" style="width: 18%;"></div>
              </div>
            </div>
          </div>
          <div class="bg-white rounded-lg border border-slate-200">
            <div class="px-3 py-2 border-b border-slate-200 flex items-center justify-between">
              <span class="text-sm font-semibold">Active VMs</span>
              <span class="text-xs text-slate-500">5 of 24</span>
            </div>
            <ul class="divide-y divide-slate-100 text-sm">
              <li class="px-3 py-2 flex items-center justify-between">
                <span>web-server-01</span>
                <span class="text-xs text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded">running</span>
              </li>
              <li class="px-3 py-2 flex items-center justify-between">
                <span>db-postgres</span>
                <span class="text-xs text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded">running</span>
              </li>
              <li class="px-3 py-2 flex items-center justify-between">
                <span>cache-redis</span>
                <span class="text-xs text-amber-700 bg-amber-50 px-1.5 py-0.5 rounded">paused</span>
              </li>
              <li class="px-3 py-2 flex items-center justify-between">
                <span>worker-pool</span>
                <span class="text-xs text-emerald-700 bg-emerald-50 px-1.5 py-0.5 rounded">running</span>
              </li>
            </ul>
          </div>
          <div class="bg-rose-50 border border-rose-200 rounded-lg p-3">
            <div class="flex items-center gap-2 text-rose-700 text-sm font-medium">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true"><path d="M8 1a7 7 0 100 14A7 7 0 008 1zm-.75 4a.75.75 0 011.5 0v4a.75.75 0 01-1.5 0V5zM8 12a1 1 0 100-2 1 1 0 000 2z"/></svg>
              3 critical alerts
            </div>
            <div class="mt-1 text-xs text-rose-700">zpool tank degraded · disk /dev/vtbd2</div>
          </div>
        </main>
      </g>
      <g id="tabbar" class="contents">
        <nav class="h-14 bg-white border-t border-slate-200 flex items-center justify-around">
          <a class="flex flex-col items-center gap-0.5 text-blue-700">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="6" height="8" rx="1"/><rect x="11" y="3" width="6" height="4" rx="1"/><rect x="11" y="9" width="6" height="8" rx="1"/><rect x="3" y="13" width="6" height="4" rx="1"/></svg>
            <span class="text-[10px] font-medium">Dashboard</span>
          </a>
          <a class="flex flex-col items-center gap-0.5 text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="2" y="4" width="16" height="11" rx="1"/><path d="M6 18h8"/></svg>
            <span class="text-[10px]">VMs</span>
          </a>
          <a class="flex flex-col items-center gap-0.5 text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 7l7-4 7 4v9H3z"/><path d="M8 16V11h4v5"/></svg>
            <span class="text-[10px]">Volumes</span>
          </a>
          <a class="flex flex-col items-center gap-0.5 text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M10 3a7 7 0 100 14 7 7 0 000-14z"/><path d="M10 6v4l3 2"/></svg>
            <span class="text-[10px]">Logs</span>
          </a>
          <a class="flex flex-col items-center gap-0.5 text-slate-500">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="3"/><path d="M10 1v3M10 16v3M1 10h3M16 10h3"/></svg>
            <span class="text-[10px]">More</span>
          </a>
        </nav>
      </g>
    </div>
  </foreignObject>
</svg>