<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Loading Spinner Overlay</title>
  <desc>Spinner overlay with semi-transparent backdrop blocking interaction during data fetch. Includes animated SVG spinner and contextual loading message.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 relative">
      <g id="header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 px-2 py-0.5 text-xs rounded bg-slate-100 text-slate-600">freenas-mock.local</span>
          </div>
          <div class="ml-auto flex items-center gap-4">
            <span class="text-sm text-slate-500">Theme: CloudBSD</span>
            <button class="text-sm text-slate-600 hover:text-slate-900">Refresh</button>
            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-medium">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Dashboard</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Containers</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Jails</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Volumes</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Network Map</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Admin</div>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Users</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Logs</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Notifications</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Settings</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 p-6 overflow-auto">
          <g id="content" class="contents">
            <div class="flex items-center justify-between mb-4">
              <div>
                <h1 class="text-2xl font-bold">Cluster Status</h1>
                <p class="text-sm text-slate-500">Loading spinner overlay — blocks interaction during RPC.</p>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-4 mb-4">
              <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm">
                <div class="text-sm font-medium text-slate-500">Nodes</div>
                <div class="text-3xl font-bold mt-2">4 / 4</div>
                <div class="mt-1 text-xs text-emerald-700">all online</div>
              </div>
              <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm">
                <div class="text-sm font-medium text-slate-500">VMs</div>
                <div class="text-3xl font-bold mt-2">12</div>
                <div class="mt-1 text-xs text-slate-500">across cluster</div>
              </div>
              <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm">
                <div class="text-sm font-medium text-slate-500">Quorum</div>
                <div class="text-3xl font-bold mt-2">OK</div>
                <div class="mt-1 text-xs text-emerald-700">3-node tolerance</div>
              </div>
            </div>
            <div class="bg-white rounded-lg border border-slate-200 overflow-hidden">
              <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
                <div class="font-semibold text-slate-900">Cluster Members</div>
                <div class="flex items-center gap-1.5 text-xs text-slate-500">
                  <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                  refreshing…
                </div>
              </div>
              <div class="p-4 space-y-2">
                <div class="flex items-center justify-between p-3 rounded border border-slate-100">
                  <div class="flex items-center gap-3">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span class="font-mono text-sm">node-01</span>
                    <span class="text-xs text-slate-500">freenas-mock.local</span>
                  </div>
                  <span class="text-xs text-slate-500">leader</span>
                </div>
                <div class="flex items-center justify-between p-3 rounded border border-slate-100">
                  <div class="flex items-center gap-3">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span class="font-mono text-sm">node-02</span>
                    <span class="text-xs text-slate-500">freenas-node02.local</span>
                  </div>
                  <span class="text-xs text-slate-500">follower</span>
                </div>
                <div class="flex items-center justify-between p-3 rounded border border-slate-100">
                  <div class="flex items-center gap-3">
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                    <span class="font-mono text-sm">node-03</span>
                    <span class="text-xs text-slate-500">freenas-node03.local</span>
                  </div>
                  <span class="text-xs text-slate-500">follower</span>
                </div>
                <div class="flex items-center justify-between p-3 rounded border border-slate-100">
                  <div class="flex items-center gap-3">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    <span class="font-mono text-sm">node-04</span>
                    <span class="text-xs text-slate-500">freenas-node04.local</span>
                  </div>
                  <span class="text-xs text-amber-700">degraded · scrub stalled</span>
                </div>
              </div>
            </div>
          </g>
        </main>
      </div>
      <g id="spinner-overlay" class="contents">
        <div class="absolute inset-0 bg-white/70 backdrop-blur-[2px] flex items-center justify-center">
          <div class="bg-white rounded-lg shadow-xl border border-slate-200 p-6 flex flex-col items-center min-w-[18rem]">
            <svg class="animate-spin h-12 w-12 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
              <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            <div class="mt-4 text-sm font-semibold text-slate-900">Loading cluster state…</div>
            <div class="mt-1 text-xs text-slate-500 text-center">Querying middleware.cluster.status</div>
            <div class="mt-3 w-48 h-1.5 bg-slate-100 rounded-full overflow-hidden">
              <div class="h-full bg-blue-600 rounded-full" style="width: 38%;"></div>
            </div>
            <div class="mt-2 text-xs text-slate-400 font-mono">~2.1s elapsed · est. 5.5s total</div>
            <button class="mt-4 text-xs text-slate-500 hover:text-slate-700 underline">Cancel request</button>
          </div>
        </div>
      </g>
      <g id="legend" class="contents">
        <div class="absolute bottom-6 right-6 bg-white border border-slate-200 rounded-lg p-3 shadow-sm max-w-sm">
          <div class="text-xs font-semibold text-slate-700 mb-1">Spinner Overlay Spec</div>
          <ul class="text-xs text-slate-600 space-y-0.5">
            <li>· backdrop: bg-white/70 + backdrop-blur (non-blocking visually)</li>
            <li>· pointer-events: auto on overlay (blocks clicks underneath)</li>
            <li>· spinner: SVG with animate-spin (not GIF)</li>
            <li>· contextual message: shows endpoint + ETA</li>
            <li>· a11y: role="status" aria-live="polite" aria-busy="true"</li>
          </ul>
        </div>
      </g>
    </div>
  </foreignObject>
</svg>