<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>CloudBSD Admin — Skeleton Screen Placeholder</title>
  <desc>Skeleton placeholder state showing gray boxes where content will load. Mimics the layout of the dashboard with shimmer animation indicators.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 relative">
      <g id="header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 px-2 py-0.5 text-xs rounded bg-slate-100 text-slate-600">freenas-mock.local</span>
          </div>
          <div class="ml-auto flex items-center gap-4">
            <span class="text-sm text-slate-500">Theme: CloudBSD</span>
            <button class="text-sm text-slate-600 hover:text-slate-900">Refresh</button>
            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-medium">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded bg-blue-50 text-blue-700 font-medium">Dashboard</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Containers</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Jails</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Volumes</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Network Map</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Admin</div>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Users</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Logs</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Notifications</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Settings</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 p-6 overflow-auto">
          <g id="skeleton-content" class="contents">
            <div class="flex items-center justify-between mb-4">
              <div class="flex-1">
                <div class="h-7 w-40 bg-slate-200 rounded animate-pulse"></div>
                <div class="h-3 w-64 bg-slate-200 rounded mt-2 animate-pulse"></div>
              </div>
              <div class="h-8 w-24 bg-slate-200 rounded animate-pulse"></div>
            </div>
            <div class="grid grid-cols-3 gap-4">
              <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm">
                <div class="flex items-center justify-between">
                  <div class="h-3 w-16 bg-slate-200 rounded animate-pulse"></div>
                  <div class="h-4 w-14 bg-slate-200 rounded animate-pulse"></div>
                </div>
                <div class="h-8 w-20 bg-slate-200 rounded mt-3 animate-pulse"></div>
                <div class="h-2 w-full bg-slate-100 rounded-full mt-3 overflow-hidden">
                  <div class="h-full w-1/3 bg-slate-200 rounded-full animate-pulse"></div>
                </div>
                <div class="h-2 w-32 bg-slate-200 rounded mt-2 animate-pulse"></div>
              </div>
              <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm">
                <div class="flex items-center justify-between">
                  <div class="h-3 w-16 bg-slate-200 rounded animate-pulse"></div>
                  <div class="h-4 w-14 bg-slate-200 rounded animate-pulse"></div>
                </div>
                <div class="h-8 w-28 bg-slate-200 rounded mt-3 animate-pulse"></div>
                <div class="h-2 w-full bg-slate-100 rounded-full mt-3 overflow-hidden">
                  <div class="h-full w-1/2 bg-slate-200 rounded-full animate-pulse"></div>
                </div>
                <div class="h-2 w-32 bg-slate-200 rounded mt-2 animate-pulse"></div>
              </div>
              <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm">
                <div class="flex items-center justify-between">
                  <div class="h-3 w-16 bg-slate-200 rounded animate-pulse"></div>
                  <div class="h-4 w-14 bg-slate-200 rounded animate-pulse"></div>
                </div>
                <div class="h-8 w-28 bg-slate-200 rounded mt-3 animate-pulse"></div>
                <div class="h-2 w-full bg-slate-100 rounded-full mt-3 overflow-hidden">
                  <div class="h-full w-1/4 bg-slate-200 rounded-full animate-pulse"></div>
                </div>
                <div class="h-2 w-32 bg-slate-200 rounded mt-2 animate-pulse"></div>
              </div>
            </div>
            <div class="mt-6 bg-white rounded-lg border border-slate-200">
              <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between">
                <div class="h-4 w-32 bg-slate-200 rounded animate-pulse"></div>
                <div class="h-3 w-24 bg-slate-200 rounded animate-pulse"></div>
              </div>
              <div class="divide-y divide-slate-100">
                <div class="flex items-center gap-4 px-4 py-3">
                  <div class="w-10 h-10 bg-slate-200 rounded animate-pulse"></div>
                  <div class="flex-1">
                    <div class="h-3 w-32 bg-slate-200 rounded animate-pulse"></div>
                    <div class="h-2 w-48 bg-slate-100 rounded mt-1.5 animate-pulse"></div>
                  </div>
                  <div class="h-5 w-16 bg-slate-200 rounded animate-pulse"></div>
                  <div class="h-5 w-20 bg-slate-200 rounded animate-pulse"></div>
                </div>
                <div class="flex items-center gap-4 px-4 py-3">
                  <div class="w-10 h-10 bg-slate-200 rounded animate-pulse"></div>
                  <div class="flex-1">
                    <div class="h-3 w-40 bg-slate-200 rounded animate-pulse"></div>
                    <div class="h-2 w-56 bg-slate-100 rounded mt-1.5 animate-pulse"></div>
                  </div>
                  <div class="h-5 w-16 bg-slate-200 rounded animate-pulse"></div>
                  <div class="h-5 w-20 bg-slate-200 rounded animate-pulse"></div>
                </div>
                <div class="flex items-center gap-4 px-4 py-3">
                  <div class="w-10 h-10 bg-slate-200 rounded animate-pulse"></div>
                  <div class="flex-1">
                    <div class="h-3 w-28 bg-slate-200 rounded animate-pulse"></div>
                    <div class="h-2 w-44 bg-slate-100 rounded mt-1.5 animate-pulse"></div>
                  </div>
                  <div class="h-5 w-16 bg-slate-200 rounded animate-pulse"></div>
                  <div class="h-5 w-20 bg-slate-200 rounded animate-pulse"></div>
                </div>
                <div class="flex items-center gap-4 px-4 py-3">
                  <div class="w-10 h-10 bg-slate-200 rounded animate-pulse"></div>
                  <div class="flex-1">
                    <div class="h-3 w-36 bg-slate-200 rounded animate-pulse"></div>
                    <div class="h-2 w-52 bg-slate-100 rounded mt-1.5 animate-pulse"></div>
                  </div>
                  <div class="h-5 w-16 bg-slate-200 rounded animate-pulse"></div>
                  <div class="h-5 w-20 bg-slate-200 rounded animate-pulse"></div>
                </div>
                <div class="flex items-center gap-4 px-4 py-3">
                  <div class="w-10 h-10 bg-slate-200 rounded animate-pulse"></div>
                  <div class="flex-1">
                    <div class="h-3 w-32 bg-slate-200 rounded animate-pulse"></div>
                    <div class="h-2 w-48 bg-slate-100 rounded mt-1.5 animate-pulse"></div>
                  </div>
                  <div class="h-5 w-16 bg-slate-200 rounded animate-pulse"></div>
                  <div class="h-5 w-20 bg-slate-200 rounded animate-pulse"></div>
                </div>
              </div>
            </div>
          </g>
        </main>
      </div>
      <g id="shimmer-overlay" class="contents">
        <div class="absolute top-20 right-6 bg-white rounded-lg shadow-lg border border-slate-200 p-4 max-w-xs">
          <div class="text-xs font-semibold text-slate-700 mb-2 flex items-center gap-2">
            <svg class="animate-spin h-3 w-3 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
              <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
            </svg>
            Loading dashboard
          </div>
          <ul class="text-xs text-slate-600 space-y-1">
            <li class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>CPU metrics</li>
            <li class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Memory</li>
            <li class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Disk I/O</li>
            <li class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span>Network throughput</li>
            <li class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-slate-300"></span>Recent activity</li>
          </ul>
        </div>
      </g>
      <g id="legend" class="contents">
        <div class="absolute bottom-6 left-6 bg-white border border-slate-200 rounded-lg p-3 shadow-sm max-w-sm">
          <div class="text-xs font-semibold text-slate-700 mb-1">Skeleton Screen Spec</div>
          <ul class="text-xs text-slate-600 space-y-0.5">
            <li>· base color: bg-slate-200, animated with animate-pulse</li>
            <li>· layout mirrors final UI shape (no layout shift)</li>
            <li>· use case: initial page load, route transitions</li>
            <li>· avoid for: short delays (&lt;300ms use spinner)</li>
            <li>· a11y: aria-busy="true" on region, content announced once loaded</li>
          </ul>
        </div>
      </g>
    </div>
  </foreignObject>
</svg>