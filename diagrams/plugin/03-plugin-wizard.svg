<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>Plugin Manifest Mock-Up — New Plugin Install Wizard (Plugin: shell.plugin-installer v2.0.0)</title>
  <desc>Multi-step wizard rendered by the plugin installer shell extension. Five steps: source, manifest review, permissions, install, complete. Uses slot shell.wizard.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 relative">
      <g id="plugin-wizard-backdrop" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4 opacity-50">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
          </div>
        </div>
        <div class="flex opacity-40" style="height: calc(100% - 56px);">
          <aside class="w-56 bg-white border-r border-slate-200 p-3">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded text-slate-700">Dashboard</a>
              <a class="block px-3 py-2 rounded text-slate-700">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-slate-700">Volumes</a>
            </nav>
          </aside>
          <main class="flex-1 p-6">
            <h1 class="text-2xl font-bold mb-4">Plugins</h1>
          </main>
        </div>
      </g>
      <g id="plugin-wizard-scrim" class="contents">
        <div class="absolute inset-0 bg-slate-900/50"></div>
      </g>
      <g id="plugin-wizard-dialog" class="contents">
        <div class="absolute bg-white rounded-lg shadow-2xl border border-slate-200 overflow-hidden flex" style="left: 50%; top: 50%; transform: translate(-50%, -50%); width: 1100px; height: 640px;">
          <aside class="w-64 bg-slate-50 border-r border-slate-200 p-5 flex flex-col">
            <div class="flex items-center gap-2 mb-1">
              <div class="w-7 h-7 rounded bg-violet-600 text-white flex items-center justify-center text-xs font-bold">+</div>
              <div class="font-semibold text-slate-900">New Plugin Install</div>
            </div>
            <div class="text-xs text-slate-500 mb-5">plugin installer · slot: <code class="px-1 bg-slate-100 rounded">shell.wizard</code></div>
            <ol class="space-y-3 text-sm flex-1">
              <li class="flex items-center gap-3">
                <div class="w-7 h-7 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs font-bold">✓</div>
                <div>
                  <div class="font-medium text-slate-900">Source</div>
                  <div class="text-xs text-slate-500">select install method</div>
                </div>
              </li>
              <li class="flex items-center gap-3">
                <div class="w-7 h-7 rounded-full bg-emerald-600 text-white flex items-center justify-center text-xs font-bold">✓</div>
                <div>
                  <div class="font-medium text-slate-900">Manifest Review</div>
                  <div class="text-xs text-slate-500">inspect manifest.json</div>
                </div>
              </li>
              <li class="flex items-center gap-3">
                <div class="w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs font-bold">3</div>
                <div>
                  <div class="font-semibold text-blue-700">Permissions</div>
                  <div class="text-xs text-slate-500">requested scopes</div>
                </div>
              </li>
              <li class="flex items-center gap-3">
                <div class="w-7 h-7 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-xs font-bold">4</div>
                <div>
                  <div class="font-medium text-slate-600">Install</div>
                  <div class="text-xs text-slate-500">download &amp; verify</div>
                </div>
              </li>
              <li class="flex items-center gap-3">
                <div class="w-7 h-7 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-xs font-bold">5</div>
                <div>
                  <div class="font-medium text-slate-600">Complete</div>
                  <div class="text-xs text-slate-500">summary</div>
                </div>
              </li>
            </ol>
            <div class="mt-4 pt-4 border-t border-slate-200 text-xs text-slate-500">
              <div class="font-medium text-slate-700 mb-1">Plugin under review</div>
              <div class="font-mono">cloudbsd-netmon@2.1.0</div>
              <div class="mt-1">signed by: <span class="text-emerald-700">revytech-signing-key</span></div>
              <div class="mt-1">sha256: 9f2c…d41e</div>
            </div>
          </aside>
          <div class="flex-1 flex flex-col">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center">
              <h2 class="text-lg font-semibold">Step 3 of 5 — Permissions</h2>
              <div class="ml-auto text-xs text-slate-500">Plugin requests the following host capabilities</div>
            </div>
            <div class="p-6 overflow-y-auto flex-1">
              <p class="text-sm text-slate-600 mb-4">
                The plugin <code class="px-1 bg-slate-100 rounded">cloudbsd-netmon@2.1.0</code> declares the following scopes in its <code class="px-1 bg-slate-100 rounded">manifest.json</code>. Permissions are read-only unless marked <span class="px-1 bg-rose-100 text-rose-700 rounded text-xs font-medium">WRITE</span>.
              </p>
              <div class="space-y-3">
                <div class="border border-slate-200 rounded-lg p-4">
                  <div class="flex items-start justify-between">
                    <div>
                      <div class="flex items-center gap-2">
                        <div class="font-medium text-slate-900">vm.read</div>
                        <span class="px-1.5 py-0.5 text-[10px] rounded bg-slate-100 text-slate-700 font-medium">READ</span>
                      </div>
                      <div class="text-sm text-slate-600 mt-1">List and read metadata for bhyve VMs and their NICs.</div>
                    </div>
                    <label class="inline-flex items-center cursor-pointer">
                      <input type="checkbox" checked="checked" class="sr-only peer"/>
                      <div class="w-9 h-5 bg-blue-600 rounded-full peer relative"><div class="absolute right-0.5 top-0.5 w-4 h-4 bg-white rounded-full"></div></div>
                    </label>
                  </div>
                </div>
                <div class="border border-slate-200 rounded-lg p-4">
                  <div class="flex items-start justify-between">
                    <div>
                      <div class="flex items-center gap-2">
                        <div class="font-medium text-slate-900">vm.metrics.subscribe</div>
                        <span class="px-1.5 py-0.5 text-[10px] rounded bg-slate-100 text-slate-700 font-medium">READ</span>
                      </div>
                      <div class="text-sm text-slate-600 mt-1">Subscribe to per-VM CPU, memory, and IOPS streams (interval ≥ 5s).</div>
                    </div>
                    <label class="inline-flex items-center cursor-pointer">
                      <input type="checkbox" checked="checked" class="sr-only peer"/>
                      <div class="w-9 h-5 bg-blue-600 rounded-full peer relative"><div class="absolute right-0.5 top-0.5 w-4 h-4 bg-white rounded-full"></div></div>
                    </label>
                  </div>
                </div>
                <div class="border border-slate-200 rounded-lg p-4">
                  <div class="flex items-start justify-between">
                    <div>
                      <div class="flex items-center gap-2">
                        <div class="font-medium text-slate-900">network.interface.read</div>
                        <span class="px-1.5 py-0.5 text-[10px] rounded bg-slate-100 text-slate-700 font-medium">READ</span>
                      </div>
                      <div class="text-sm text-slate-600 mt-1">Read interface counters, MTU, and link state.</div>
                    </div>
                    <label class="inline-flex items-center cursor-pointer">
                      <input type="checkbox" checked="checked" class="sr-only peer"/>
                      <div class="w-9 h-5 bg-blue-600 rounded-full peer relative"><div class="absolute right-0.5 top-0.5 w-4 h-4 bg-white rounded-full"></div></div>
                    </label>
                  </div>
                </div>
                <div class="border border-rose-200 rounded-lg p-4 bg-rose-50">
                  <div class="flex items-start justify-between">
                    <div>
                      <div class="flex items-center gap-2">
                        <div class="font-medium text-slate-900">notifications.dispatch</div>
                        <span class="px-1.5 py-0.5 text-[10px] rounded bg-rose-100 text-rose-700 font-medium">WRITE</span>
                      </div>
                      <div class="text-sm text-slate-700 mt-1">Send notifications to other users. Rate-limited to 10/min.</div>
                    </div>
                    <label class="inline-flex items-center cursor-pointer">
                      <input type="checkbox" checked="checked" class="sr-only peer"/>
                      <div class="w-9 h-5 bg-blue-600 rounded-full peer relative"><div class="absolute right-0.5 top-0.5 w-4 h-4 bg-white rounded-full"></div></div>
                    </label>
                  </div>
                </div>
                <div class="border border-rose-200 rounded-lg p-4 bg-rose-50">
                  <div class="flex items-start justify-between">
                    <div>
                      <div class="flex items-center gap-2">
                        <div class="font-medium text-slate-900">settings.write</div>
                        <span class="px-1.5 py-0.5 text-[10px] rounded bg-rose-100 text-rose-700 font-medium">WRITE</span>
                      </div>
                      <div class="text-sm text-slate-700 mt-1">Modify plugin-owned settings under <code class="px-1 bg-rose-100 rounded">plugins.netmon.*</code>. No global writes.</div>
                    </div>
                    <label class="inline-flex items-center cursor-pointer">
                      <input type="checkbox" class="sr-only peer"/>
                      <div class="w-9 h-5 bg-slate-300 rounded-full peer relative"><div class="absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full"></div></div>
                    </label>
                  </div>
                </div>
              </div>
              <div class="mt-5 bg-blue-50 border border-blue-200 rounded p-3 text-sm text-blue-900">
                <span class="font-semibold">Audit:</span> All permission grants are logged to <code class="px-1 bg-blue-100 rounded">/var/log/cloudbsd/plugin-audit.log</code> and reviewed weekly.
              </div>
            </div>
            <div class="px-6 py-4 border-t border-slate-200 flex items-center justify-between bg-slate-50">
              <button class="px-4 py-2 text-sm rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-100">← Back</button>
              <div class="text-xs text-slate-500">3 of 5 steps complete</div>
              <div class="flex gap-2">
                <button class="px-4 py-2 text-sm rounded border border-slate-300 bg-white text-slate-700 hover:bg-slate-100">Cancel</button>
                <button class="px-4 py-2 text-sm rounded bg-blue-600 text-white hover:bg-blue-700">Next: Install →</button>
              </div>
            </div>
          </div>
        </div>
      </g>
    </div>
  </foreignObject>
</svg>