<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 800" width="100%" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <title>CloudBSD Component Reference — Plugin-Rendered Wizard</title>
  <desc>Component reference: multi-step wizard rendered by a CloudBSD plugin (MCP-aware). Same chrome as a built-in wizard but the form fields, validation, and preview come from the plugin manifest's mcp.exposes schema. No frontend redeploy required to add new wizards. (2026-07-10)</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" style="position:relative;width:1280px;height:800px;background:#f1f5f9;color:#0f172a;font-size:12px;box-sizing:border-box;overflow:hidden;">

<div style="display:flex;flex-direction:column;height:100%;">

<!-- Top bar — same as built-in wizard chrome + plugin badge -->
<div style="padding:18px 32px;background:#ffffff;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">
  <div style="display:flex;align-items:center;gap:12px;">
    <span style="display:inline-block;padding:5px 10px;background:linear-gradient(135deg,#0ea5e9,#1e40af);border-radius:5px;color:#ffffff;font-weight:700;font-size:11px;">CloudBSD</span>
    <h2 style="margin:0;font-size:15px;font-weight:600;">Provision Tailscale exit node</h2>
    <span style="display:inline-flex;align-items:center;gap:5px;padding:3px 9px;background:#7c3aed10;border:1px solid #c4b5fd;border-radius:9999px;color:#5b21b6;font-size:10px;font-weight:700;letter-spacing:0.04em;">
      <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#7c3aed;"></span>
      plugin &#183; tailscale-exit v1.4.0
    </span>
  </div>
  <div style="display:flex;align-items:center;gap:14px;font-size:11px;color:#64748b;">
    Step 3 of 5 &#183; ~2 min remaining
    <button style="padding:6px 12px;font-size:11px;border:none;border-radius:4px;background:transparent;color:#64748b;">✕ Cancel</button>
  </div>
</div>

<!-- Plugin info strip -->
<div style="padding:9px 32px;background:#f5f3ff;border-bottom:1px solid #ddd6fe;display:flex;align-items:center;gap:14px;font-size:10px;color:#5b21b6;">
  <span style="display:inline-flex;align-items:center;gap:5px;font-weight:600;">
    <span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#7c3aed;"></span>
    plugin_id = <code style="background:#ffffff;padding:1px 5px;border-radius:3px;">tailscale-exit</code>
  </span>
  <span style="color:#7c3aed;">&#183;</span>
  <span>mcp.exposes: <code style="background:#ffffff;padding:1px 5px;border-radius:3px;">1 tool (ts.exit.provision)</code> + <code style="background:#ffffff;padding:1px 5px;border-radius:3px;">3 resources</code></span>
  <span style="color:#7c3aed;">&#183;</span>
  <span>source: <code style="background:#ffffff;padding:1px 5px;border-radius:3px;">github.com/cloudbsd-ai-plugins/tailscale-exit</code></span>
  <span style="flex:1;"></span>
  <a style="color:#7c3aed;text-decoration:underline;cursor:pointer;font-weight:600;">view plugin manifest</a>
</div>

<!-- Step indicator (built-in layout, plugin slides through its own 5 steps) -->
<div style="padding:0 32px 14px;background:#ffffff;border-bottom:1px solid #e2e8f0;">
  <div style="display:flex;gap:0;align-items:center;">
    <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;">
      <div style="width:20px;height:20px;border-radius:50%;background:#16a34a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">&#x2713;</div>
      <span style="font-size:11px;font-weight:500;color:#475569;">Select node</span>
    </div>
    <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
    <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;">
      <div style="width:20px;height:20px;border-radius:50%;background:#16a34a;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">&#x2713;</div>
      <span style="font-size:11px;font-weight:500;color:#475569;">Auth key</span>
    </div>
    <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
    <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid #1d4ed8;background:#1d4ed810;">
      <div style="width:20px;height:20px;border-radius:50%;background:#1d4ed8;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">3</div>
      <span style="font-size:11px;font-weight:600;color:#1d4ed8;">Advertise routes</span>
    </div>
    <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
    <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;">
      <div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">4</div>
      <span style="font-size:11px;font-weight:500;color:#475569;">Approve in console</span>
    </div>
    <div style="display:flex;align-items:center;color:#cbd5e1;font-size:11px;padding:0 4px;">—</div>
    <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-top:2px solid transparent;">
      <div style="width:20px;height:20px;border-radius:50%;background:#e2e8f0;color:#64748b;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;">5</div>
      <span style="font-size:11px;font-weight:500;color:#475569;">Done</span>
    </div>
    <div style="flex:1;"></div>
    <span style="font-size:10px;color:#94a3b8;">2 of 5 complete</span>
  </div>
</div>

<!-- Body: split — left = plugin-provided form, right = plugin-computed preview -->
<div style="flex:1;display:flex;background:#f1f5f9;overflow:hidden;">

<!-- LEFT: plugin-defined form -->
<div style="flex:1;padding:24px 32px;overflow-y:auto;">
  <h1 style="margin:0 0 4px;font-size:20px;font-weight:700;color:#0f172a;">Advertise subnet routes</h1>
  <p style="margin:0 0 18px;font-size:12px;color:#64748b;line-height:1.55;">Pick the IPs/CIDRs this exit node will advertise on the tailnet. Each must be present on cloudbsd-node-01. Plugin validates against <code style="background:#f1f5f9;padding:1px 5px;border-radius:3px;">tailscale exit-node list --approvers=auto</code>.</p>

  <label style="display:block;font-size:10px;text-transform:uppercase;letter-spacing:0.04em;font-weight:700;color:#475569;margin-bottom:5px;">Subnet routes (one per line)</label>
  <textarea rows="4" style="width:100%;padding:10px;font-size:12px;font-family:monospace;border:1px solid #cbd5e1;border-radius:5px;box-sizing:border-box;resize:vertical;line-height:1.5;">10.0.5.0/24
192.168.50.0/24
100.64.0.0/10
fd7a:115c:a1e0::/48</textarea>

  <div style="margin-top:8px;font-size:10px;color:#94a3b8;">Plugin will run <code style="background:#f1f5f9;padding:1px 5px;border-radius:3px;">tailscale debug</code> + <code style="background:#f1f5f9;padding:1px 5px;border-radius:3px;">ip route get</code> on the node to confirm ownership.</div>

  <div style="margin-top:18px;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;">
    <span style="font-weight:700;color:#b45309;">&#9888;</span>
    <div style="font-size:11px;color:#92400e;line-height:1.5;">
      <strong style="color:#7c2d12;">Auto-approval is on for this tailnet.</strong><br/>
      Routes will be advertised and visible to peers immediately after the click of "Next". Disable auto-approval in plugin settings if you prefer a manual step.
    </div>
  </div>

</div>

<!-- RIGHT: plugin-computed live preview (no built-in chrome — this IS the plugin preview) -->
<div style="width:340px;background:#faf5ff;border-left:1px solid #e2e8f0;padding:18px 18px;overflow-y:auto;">
  <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;color:#7c3aed;margin-bottom:8px;">plugin preview</div>
  <div style="font-size:11px;color:#5b21b6;margin-bottom:14px;">Generated by <code>ts.exit.preview()</code></div>

  <div style="padding:10px 12px;background:#ffffff;border:1px solid #ddd6fe;border-radius:6px;font-size:11px;color:#334155;font-family:monospace;line-height:1.6;margin-bottom:12px;">$ tailscale up --advertise-routes=10.0.5.0/24,192.168.50.0/24,100.64.0.0/10,fd7a:115c:a1e0::/48 --exit-node --accept-routes<br/>Success.<br/>advertised: 4 routes<br/>peer count: 12</div>

  <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;color:#475569;margin-bottom:6px;">What changes</div>
  <ul style="font-size:11px;color:#475569;line-height:1.5;margin:0;padding-left:18px;">
    <li>4 routes added to tailnet</li>
    <li>node advertises as <code style="background:#ede9fe;padding:1px 4px;border-radius:3px;">cloudbsd-node-01</code></li>
    <li>Jails using <code style="background:#ede9fe;padding:1px 4px;border-radius:3px;">100.64.0.0/10</code> get free routing</li>
  </ul>

  <div style="margin-top:14px;font-size:10px;color:#7c3aed;border-top:1px dashed #c4b5fd;padding-top:10px;">
    Plugin emits <code style="background:#ede9fe;padding:1px 4px;border-radius:3px;">plugin.bundle</code> on success — frontend re-renders affected cluster map routes.
  </div>
</div>

</div>
<!-- /body -->

<!-- Bottom bar -->
<div style="display:flex;justify-content:space-between;align-items:center;padding:14px 32px;background:#ffffff;border-top:1px solid #e2e8f0;">
  <button style="padding:8px 16px;font-size:12px;border:1px solid #cbd5e1;border-radius:5px;background:#ffffff;color:#475569;font-weight:600;cursor:pointer;">&#x2190; Back</button>
  <div style="display:flex;gap:8px;align-items:center;">
    <button style="padding:8px 14px;font-size:11px;border:1px dashed #cbd5e1;border-radius:5px;background:#ffffff;color:#64748b;cursor:pointer;">Save as draft</button>
    <span style="font-size:10px;color:#94a3b8;">plugin validates in background</span>
    <button style="padding:8px 16px;font-size:12px;border:0;border-radius:5px;background:linear-gradient(135deg,#7c3aed,#5b21b6);color:#ffffff;font-weight:600;cursor:pointer;">Next: Approve in console &#x2192;</button>
  </div>
</div>

</div>
<!-- /outer -->

<!-- Caption (component reference labelled) -->
<div style="position:absolute;left:16px;bottom:12px;font-size:10px;color:#94a3b8;background:#0f172a;padding:6px 10px;border-radius:5px;font-family:monospace;">component: plugin/03-plugin-wizard.svg (plugin wizard via mcp.exposes)</div>

    </div>
  </foreignObject>
</svg>
