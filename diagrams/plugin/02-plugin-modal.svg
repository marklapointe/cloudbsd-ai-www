<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>Plugin Manifest Mock-Up — Volume Snapshot Info Modal (Plugin: cloudbsd-voltools v0.9.1)</title>
  <desc>Plugin-rendered modal overlay contributed by the volume-snapshot plugin. Shows snapshot metadata, retention policy, restore targets, and action buttons. Modal sits on dimmed dashboard backdrop.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900 relative">
      <g id="plugin-modal-backdrop-content" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4 opacity-60">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
          </div>
        </div>
        <div class="flex opacity-40" style="height: calc(100% - 56px);">
          <aside class="w-56 bg-white border-r border-slate-200 p-3">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded text-slate-700">Dashboard</a>
              <a class="block px-3 py-2 rounded text-slate-700">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-slate-700">Volumes</a>
              <a class="block px-3 py-2 rounded text-slate-700">Network Map</a>
            </nav>
          </aside>
          <main class="flex-1 p-6">
            <h1 class="text-2xl font-bold mb-4">Volumes</h1>
            <div class="bg-white rounded-lg p-4 border border-slate-200">Loading…</div>
          </main>
        </div>
      </g>
      <g id="plugin-modal-scrim" class="contents">
        <div class="absolute inset-0 bg-slate-900/50"></div>
      </g>
      <g id="plugin-modal-dialog" class="contents">
        <div class="absolute" style="left: 50%; top: 50%; transform: translate(-50%, -50%); width: 720px;">
          <div class="bg-white rounded-lg shadow-2xl border border-slate-200 overflow-hidden">
            <div class="flex items-center justify-between px-5 py-3 border-b border-slate-200 bg-slate-50">
              <div class="flex items-center gap-2">
                <div class="w-6 h-6 rounded bg-violet-600 text-white flex items-center justify-center text-xs font-bold">V</div>
                <div>
                  <div class="font-semibold text-slate-900">Volume Snapshot Info</div>
                  <div class="text-xs text-slate-500">rendered by <code class="px-1 bg-slate-100 rounded">cloudbsd-voltools@0.9.1</code> · slot: <code class="px-1 bg-slate-100 rounded">modal.detail</code></div>
                </div>
              </div>
              <button class="text-slate-400 hover:text-slate-700 text-xl leading-none">×</button>
            </div>
            <div class="p-5 space-y-4 max-h-[480px] overflow-y-auto">
              <div class="grid grid-cols-2 gap-3 text-sm">
                <div class="bg-slate-50 rounded p-3 border border-slate-200">
                  <div class="text-xs text-slate-500 uppercase tracking-wide">Snapshot name</div>
                  <div class="font-mono mt-1 text-slate-900">tank/data@auto-2026-07-06_03-00</div>
                </div>
                <div class="bg-slate-50 rounded p-3 border border-slate-200">
                  <div class="text-xs text-slate-500 uppercase tracking-wide">Created</div>
                  <div class="mt-1 text-slate-900">2026-07-06 03:00:01 UTC</div>
                </div>
                <div class="bg-slate-50 rounded p-3 border border-slate-200">
                  <div class="text-xs text-slate-500 uppercase tracking-wide">Referenced size</div>
                  <div class="mt-1 text-slate-900">2.4 GB</div>
                </div>
                <div class="bg-slate-50 rounded p-3 border border-slate-200">
                  <div class="text-xs text-slate-500 uppercase tracking-wide">Used by clones</div>
                  <div class="mt-1 text-slate-900">0</div>
                </div>
                <div class="bg-slate-50 rounded p-3 border border-slate-200">
                  <div class="text-xs text-slate-500 uppercase tracking-wide">Compression</div>
                  <div class="mt-1 text-slate-900">zstd-3</div>
                </div>
                <div class="bg-slate-50 rounded p-3 border border-slate-200">
                  <div class="text-xs text-slate-500 uppercase tracking-wide">Retention policy</div>
                  <div class="mt-1 text-slate-900">daily-7d · weekly-4w · monthly-6m</div>
                </div>
              </div>
              <div>
                <div class="text-sm font-medium text-slate-700 mb-2">Restore targets</div>
                <div class="space-y-2 text-sm">
                  <label class="flex items-center gap-2 p-2 rounded border border-slate-200 hover:bg-slate-50">
                    <input type="radio" name="restore-target" checked="checked" class="accent-blue-600"/>
                    <span>Rollback <code class="px-1 bg-slate-100 rounded">tank/data</code> in place (will replace current data)</span>
                  </label>
                  <label class="flex items-center gap-2 p-2 rounded border border-slate-200 hover:bg-slate-50">
                    <input type="radio" name="restore-target" class="accent-blue-600"/>
                    <span>Clone to new dataset <code class="px-1 bg-slate-100 rounded">tank/data_restore_20260706</code></span>
                  </label>
                  <label class="flex items-center gap-2 p-2 rounded border border-slate-200 hover:bg-slate-50">
                    <input type="radio" name="restore-target" class="accent-blue-600"/>
                    <span>Export to file (download as .zfs stream)</span>
                  </label>
                </div>
              </div>
              <div class="bg-amber-50 border border-amber-200 rounded p-3 text-sm text-amber-900">
                <span class="font-semibold">Plugin note:</span> rollback operations are non-destructive to the snapshot itself but will discard writes since <code class="px-1 bg-amber-100 rounded">auto-2026-07-06_03-00</code>.
              </div>
              <div class="border-t border-slate-200 pt-3">
                <div class="text-sm font-medium text-slate-700 mb-2">Change history (this snapshot)</div>
                <ul class="text-sm divide-y divide-slate-100 border border-slate-200 rounded">
                  <li class="px-3 py-2 flex"><span class="w-36 text-slate-500 text-xs">2026-07-06 03:00:01</span><span>created by cron.daily-tasks</span></li>
                  <li class="px-3 py-2 flex"><span class="w-36 text-slate-500 text-xs">2026-07-06 03:00:14</span><span>metadata verified by scrub (0 errors)</span></li>
                </ul>
              </div>
            </div>
            <div class="flex items-center justify-between px-5 py-3 border-t border-slate-200 bg-slate-50">
              <div class="text-xs text-slate-500">ESC to close · Enter to confirm</div>
              <div class="flex items-center gap-2">
                <button class="px-3 py-1.5 text-sm rounded border border-slate-300 text-slate-700 bg-white hover:bg-slate-50">Cancel</button>
                <button class="px-3 py-1.5 text-sm rounded border border-slate-300 text-slate-700 bg-white hover:bg-slate-50">Clone</button>
                <button class="px-3 py-1.5 text-sm rounded bg-rose-600 text-white hover:bg-rose-700">Rollback…</button>
              </div>
            </div>
          </div>
        </div>
      </g>
    </div>
  </foreignObject>
</svg>