<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800" font-family="system-ui, sans-serif">
  <title>Plugin Manifest Mock-Up — VM Metrics Page (Plugin: cloudbsd-metrics v1.4.2)</title>
  <desc>Plugin-rendered full page contributed by the metrics plugin. Includes sidebar nav slot, time range selector, line chart for CPU usage per VM, bar chart for memory, and per-VM table. Plugin extension hooks highlighted.</desc>
  <foreignObject x="0" y="0" width="1280" height="800">
    <div xmlns="http://www.w3.org/1999/xhtml" class="h-full bg-slate-50 text-slate-900">
      <g id="plugin-page-header" class="contents">
        <div class="h-14 bg-white border-b border-slate-200 flex items-center px-4">
          <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded bg-blue-600 text-white flex items-center justify-center font-bold">C</div>
            <span class="font-bold text-lg">CloudBSD Admin</span>
            <span class="ml-2 px-2 py-0.5 text-xs rounded bg-violet-100 text-violet-700 border border-violet-200">plugin: cloudbsd-metrics</span>
          </div>
          <div class="ml-auto flex items-center gap-4">
            <span class="text-sm text-slate-500">freenas-mock.local</span>
            <button class="text-sm text-slate-600 hover:text-slate-900">Refresh</button>
            <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-sm font-medium">M</div>
          </div>
        </div>
      </g>
      <div class="flex" style="height: calc(100% - 56px);">
        <g id="plugin-page-sidebar" class="contents">
          <aside class="w-56 bg-white border-r border-slate-200 p-3 overflow-y-auto">
            <nav class="space-y-1 text-sm">
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Dashboard</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Virtual Machines</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Containers</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Jails</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Volumes</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Network Map</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Cluster</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-violet-500 px-3">Plugin Pages</div>
              <a class="block px-3 py-2 rounded bg-violet-50 text-violet-700 font-medium border-l-2 border-violet-600">VM Metrics</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Volume Snapshots</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Alert Rules</a>
              <div class="pt-3 pb-1 text-xs uppercase tracking-wide text-slate-400 px-3">Admin</div>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Users</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Logs</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Notifications</a>
              <a class="block px-3 py-2 rounded text-slate-700 hover:bg-slate-50">Settings</a>
            </nav>
          </aside>
        </g>
        <main class="flex-1 p-6 overflow-auto">
          <g id="plugin-page-content" class="contents">
            <div class="flex items-center justify-between mb-4">
              <div>
                <div class="flex items-center gap-2">
                  <h1 class="text-2xl font-bold">VM Metrics</h1>
                  <span class="px-2 py-0.5 text-xs rounded bg-violet-100 text-violet-700">plugin page</span>
                </div>
                <p class="text-sm text-slate-500">Rendered by <code class="px-1 bg-slate-100 rounded text-xs">cloudbsd-metrics@1.4.2</code> · slot: <code class="px-1 bg-slate-100 rounded text-xs">shell.page</code></p>
              </div>
              <div class="flex items-center gap-2">
                <div class="flex rounded border border-slate-200 overflow-hidden text-sm">
                  <button class="px-3 py-1.5 bg-slate-100 text-slate-700">1h</button>
                  <button class="px-3 py-1.5 bg-white text-slate-700">6h</button>
                  <button class="px-3 py-1.5 bg-blue-600 text-white">24h</button>
                  <button class="px-3 py-1.5 bg-white text-slate-700">7d</button>
                </div>
                <button class="px-3 py-1.5 text-sm rounded bg-blue-600 text-white">Export CSV</button>
              </div>
            </div>
            <div class="grid grid-cols-4 gap-4 mb-4">
              <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm">
                <div class="text-sm font-medium text-slate-500">Avg CPU (cluster)</div>
                <div class="text-3xl font-bold mt-2">38%</div>
                <div class="text-xs text-emerald-700 mt-1">▼ 4.2% vs yesterday</div>
              </div>
              <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm">
                <div class="text-sm font-medium text-slate-500">Avg Memory</div>
                <div class="text-3xl font-bold mt-2">11.4 / 32 GB</div>
                <div class="text-xs text-amber-700 mt-1">▲ 1.8 GB vs yesterday</div>
              </div>
              <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm">
                <div class="text-sm font-medium text-slate-500">Disk IOPS</div>
                <div class="text-3xl font-bold mt-2">1,820</div>
                <div class="text-xs text-emerald-700 mt-1">▼ 120 vs yesterday</div>
              </div>
              <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm">
                <div class="text-sm font-medium text-slate-500">Net Throughput</div>
                <div class="text-3xl font-bold mt-2">94 MB/s</div>
                <div class="text-xs text-emerald-700 mt-1">stable</div>
              </div>
            </div>
            <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm mb-4">
              <div class="flex items-center justify-between mb-3">
                <div class="font-medium">CPU usage per VM (last 24h)</div>
                <div class="text-xs text-slate-500">plugin chart slot · hostMetrics.chart</div>
              </div>
              <svg viewBox="0 0 760 200" width="100%" height="200" preserveAspectRatio="none">
                <line x1="0" y1="50" x2="760" y2="50" stroke="#e2e8f0" stroke-dasharray="2 4"/>
                <line x1="0" y1="100" x2="760" y2="100" stroke="#e2e8f0" stroke-dasharray="2 4"/>
                <line x1="0" y1="150" x2="760" y2="150" stroke="#e2e8f0" stroke-dasharray="2 4"/>
                <polyline points="0,120 50,110 100,90 150,95 200,70 250,80 300,60 350,55 400,75 450,50 500,45 550,60 600,40 650,55 700,35 760,30" fill="none" stroke="#2563eb" stroke-width="2"/>
                <polyline points="0,140 50,135 100,120 150,130 200,115 250,125 300,100 350,95 400,110 450,90 500,85 550,100 600,80 650,95 700,75 760,70" fill="none" stroke="#10b981" stroke-width="2"/>
                <polyline points="0,160 50,155 100,150 150,140 200,135 250,145 300,130 350,125 400,140 450,120 500,115 550,130 600,110 650,125 700,105 760,100" fill="none" stroke="#f59e0b" stroke-width="2"/>
                <g font-size="10" fill="#64748b">
                  <text x="0" y="195">00:00</text>
                  <text x="180" y="195">06:00</text>
                  <text x="360" y="195">12:00</text>
                  <text x="540" y="195">18:00</text>
                  <text x="720" y="195">24:00</text>
                </g>
                <g font-size="11" fill="#0f172a">
                  <rect x="600" y="8" width="10" height="10" fill="#2563eb"/><text x="615" y="17">nextcloud</text>
                  <rect x="670" y="8" width="10" height="10" fill="#10b981"/><text x="685" y="17">homeassistant</text>
                  <rect x="600" y="22" width="10" height="10" fill="#f59e0b"/><text x="615" y="31">postgres-01</text>
                </g>
              </svg>
            </div>
            <div class="bg-white rounded-lg p-4 border border-slate-200 shadow-sm">
              <div class="flex items-center justify-between mb-3">
                <div class="font-medium">Per-VM resource utilization</div>
                <div class="text-xs text-slate-500">plugin table slot · hostMetrics.table</div>
              </div>
              <table class="w-full text-sm">
                <thead class="text-left text-slate-500 border-b border-slate-200">
                  <tr><th class="py-2 font-medium">VM</th><th class="py-2 font-medium">CPU</th><th class="py-2 font-medium">Memory</th><th class="py-2 font-medium">Disk Read</th><th class="py-2 font-medium">Disk Write</th><th class="py-2 font-medium">Net</th><th class="py-2 font-medium">Uptime</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  <tr><td class="py-2 font-medium">nextcloud</td><td class="py-2">62%</td><td class="py-2">3.2 / 4 GB</td><td class="py-2">12 MB/s</td><td class="py-2">48 MB/s</td><td class="py-2">22 MB/s</td><td class="py-2">14d 02h</td></tr>
                  <tr><td class="py-2 font-medium">homeassistant</td><td class="py-2">18%</td><td class="py-2">1.1 / 2 GB</td><td class="py-2">2 MB/s</td><td class="py-2">1 MB/s</td><td class="py-2">3 MB/s</td><td class="py-2">28d 11h</td></tr>
                  <tr><td class="py-2 font-medium">postgres-01</td><td class="py-2">41%</td><td class="py-2">5.6 / 8 GB</td><td class="py-2">8 MB/s</td><td class="py-2">22 MB/s</td><td class="py-2">11 MB/s</td><td class="py-2">9d 04h</td></tr>
                  <tr><td class="py-2 font-medium">gitea</td><td class="py-2">9%</td><td class="py-2">0.8 / 2 GB</td><td class="py-2">1 MB/s</td><td class="py-2">3 MB/s</td><td class="py-2">2 MB/s</td><td class="py-2">42d 18h</td></tr>
                </tbody>
              </table>
            </div>
          </g>
        </main>
      </div>
    </div>
  </foreignObject>
</svg>